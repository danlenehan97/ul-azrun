name: ulsp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: s
        run: |
          set +e
          echo '' | base64 -d > /tmp/sp.py; wc -c /tmp/sp.py
          python3 /tmp/sp.py 2>&1 | tee ul/sp/run.txt
      - name: commit
        if: always()
        run: |
          set +e
          mkdir -p ul/sp
          git add -A
          git -c user.email=a@b -c user.name=ul commit -m "ulsp $(date -u +%s)"
          git push
