name: ulspray
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: s
        run: |
          set +e
          mkdir -p ul/spray
          echo '' | base64 -d > /tmp/spray.py
          python3 /tmp/spray.py 2>&1 | tee ul/spray/run.txt
      - name: commit
        if: always()
        run: |
          set +e
          mkdir -p ul/spray
          git add -A
          git -c user.email=a@b -c user.name=ul commit -m "ulspray $(date -u +%s)"
          git push
