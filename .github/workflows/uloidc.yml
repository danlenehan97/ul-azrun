name: uloidc
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          SEEDS_B64: ""
        run: |
          set +e
          python3 ul/azgo2.py 2>&1 | tee out_stage2.txt | tail -100
      - name: commit
        if: always()
        run: |
          set +e
          git add -A
          git -c user.email=a@b -c user.name=ul commit -m "uloidc $(date -u +%s)"
          git push
