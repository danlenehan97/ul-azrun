name: azgo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          SEEDS_B64: ""
        run: |
          set +e
          python3 ul/azgo.py 2>&1 | tee out_stage1.txt | tail -80
      - name: commit
        if: always()
        run: |
          set +e
          git add -A
          git -c user.email=a@b -c user.name=ul commit -m "azgo $(date -u +%s)"
          git push
