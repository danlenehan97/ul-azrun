- apiVersion: v1
  data:
    001_initial_schema.sql: |
      BEGIN;
      -- Portal cluster: the extensions and the two shared trigger functions; no billing table.
      -- A copy of services/spend-control/migrations/001_initial_schema.sql with only this cluster's statements; nothing added.

      CREATE EXTENSION IF NOT EXISTS pgcrypto;
      CREATE EXTENSION IF NOT EXISTS btree_gist;

      CREATE FUNCTION set_updated_at()
      RETURNS trigger
      LANGUAGE plpgsql
      AS $$
      BEGIN
        NEW.updated_at = now();
        RETURN NEW;
      END;
      $$;

      CREATE FUNCTION reject_immutable_change()
      RETURNS trigger
      LANGUAGE plpgsql
      AS $$
      BEGIN
        RAISE EXCEPTION '% rows are immutable', TG_TABLE_NAME
          USING ERRCODE = '55000';
      END;
      $$;
      COMMIT;
    007_control_plane.sql: |
      BEGIN;
      -- Portal cluster: without the grant on public.price_versions, customer_model_entitlements, spend_limit_policies (038 revokes it).
      -- A copy of services/spend-control/migrations/007_control_plane.sql with only this cluster's statements; nothing added.

      CREATE SCHEMA control;
      REVOKE ALL ON SCHEMA control FROM PUBLIC;

      CREATE DOMAIN control.identifier AS text
        CHECK (VALUE ~ '^[a-z0-9]+(-[a-z0-9]+)*$' AND length(VALUE) <= 64);

      CREATE TABLE control.tenants (
        customer_id control.identifier PRIMARY KEY,
        display_name text NOT NULL CHECK (btrim(display_name) <> ''),
        status text NOT NULL CHECK (status IN ('provisioning','active','suspending','suspended','resuming')),
        first_admin_issuer text,
        first_admin_subject text,
        first_admin_bound_at timestamptz,
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        CHECK (num_nonnulls(first_admin_issuer, first_admin_subject, first_admin_bound_at) IN (0,3)),
        CHECK (first_admin_issuer IS NULL OR btrim(first_admin_issuer) <> ''),
        CHECK (first_admin_subject IS NULL OR btrim(first_admin_subject) <> '')
      );

      CREATE TABLE control.projects (
        project_id control.identifier PRIMARY KEY,
        customer_id control.identifier NOT NULL REFERENCES control.tenants(customer_id),
        display_name text NOT NULL CHECK (btrim(display_name) <> ''),
        status text NOT NULL CHECK (status IN ('active','disabling','disabled')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        UNIQUE (customer_id, project_id)
      );

      CREATE TABLE control.api_keys (
        api_key_id control.identifier NOT NULL,
        customer_id control.identifier NOT NULL,
        project_id control.identifier NOT NULL,
        display_name text NOT NULL CHECK (btrim(display_name) <> ''),
        apim_subscription_id text NOT NULL UNIQUE,
        status text NOT NULL CHECK (status IN ('provisioning','active','revoking','revoked')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (project_id, api_key_id),
        FOREIGN KEY (customer_id, project_id) REFERENCES control.projects(customer_id, project_id),
        CHECK (apim_subscription_id = customer_id || '--' || project_id || '--' || api_key_id)
      );

      -- The catalogue is control-plane data. The existing public reference tables keep
      -- historical free-text model identifiers; the API checks registered SKUs on writes.
      CREATE TABLE control.models (
        sku text PRIMARY KEY CHECK (sku ~ '^[a-z0-9][a-z0-9._-]*$' AND length(sku) <= 256),
        display_name text NOT NULL CHECK (btrim(display_name) <> ''),
        api_type text NOT NULL CHECK (api_type = 'chat'),
        price_unit text NOT NULL CHECK (price_unit = 'token'),
        max_output_default bigint NOT NULL CHECK (max_output_default > 0),
        max_output_ceiling bigint NOT NULL CHECK (max_output_ceiling >= max_output_default),
        max_input_tokens bigint NOT NULL CHECK (max_input_tokens > 0),
        model_version text NOT NULL CHECK (btrim(model_version) <> ''),
        route_style text NOT NULL CHECK (route_style IN ('path_deployment','body_model')),
        provider text NOT NULL CHECK (provider IN ('azure_openai','self_hosted','simulator','openai','anthropic')),
        route_ref text NOT NULL CHECK (btrim(route_ref) <> ''),
        backend_ref text NOT NULL CHECK (backend_ref ~ '^[A-Za-z0-9][A-Za-z0-9._-]*$'),
        status text NOT NULL CHECK (status IN ('active','deprecated','retired')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      CREATE TABLE control.traffic_limit_policies (
        traffic_policy_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        customer_id control.identifier NOT NULL REFERENCES control.tenants(customer_id),
        requests_per_minute bigint NOT NULL CHECK (requests_per_minute > 0),
        tokens_per_minute bigint NOT NULL CHECK (tokens_per_minute > 0),
        model_sku text REFERENCES control.models(sku),
        apim_product_id text NOT NULL CHECK (btrim(apim_product_id) <> ''),
        effective_from timestamptz NOT NULL,
        effective_to timestamptz,
        status text NOT NULL CHECK (status IN ('active','retired')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        CHECK (effective_to IS NULL OR effective_to > effective_from),
        EXCLUDE USING gist (
          customer_id WITH =,
          (coalesce(model_sku, '')) WITH =,
          tstzrange(effective_from, coalesce(effective_to, 'infinity'::timestamptz), '[)') WITH &&
        ) WHERE (status = 'active'),
        -- Even non-overlapping model policies cannot give a tenant two active products.
        EXCLUDE USING gist (customer_id WITH =, apim_product_id WITH <>) WHERE (status = 'active')
      );

      CREATE TABLE control.config_operations (
        operation_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        operation_type text NOT NULL CHECK (btrim(operation_type) <> ''),
        idempotency_key text NOT NULL CHECK (btrim(idempotency_key) <> ''),
        request_hash bytea NOT NULL CHECK (octet_length(request_hash) = 32),
        state text NOT NULL DEFAULT 'in_progress' CHECK (state IN ('in_progress','completed')),
        actor text NOT NULL CHECK (btrim(actor) <> ''),
        request_id text NOT NULL,
        request_body jsonb NOT NULL,
        scope jsonb NOT NULL,
        progress jsonb NOT NULL DEFAULT '{}',
        response_status integer,
        response_body jsonb,
        created_at timestamptz NOT NULL DEFAULT now(),
        completed_at timestamptz,
        UNIQUE (operation_type, idempotency_key),
        CHECK ((state = 'in_progress' AND response_status IS NULL AND response_body IS NULL AND completed_at IS NULL)
          OR (state = 'completed' AND response_status BETWEEN 200 AND 599 AND response_body IS NOT NULL AND completed_at IS NOT NULL))
      );

      CREATE TABLE control.control_audit (
        audit_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        operation_id uuid NOT NULL REFERENCES control.config_operations(operation_id),
        surface text NOT NULL CHECK (surface IN ('operator','config')),
        actor text NOT NULL CHECK (btrim(actor) <> ''),
        action text NOT NULL,
        target_type text NOT NULL,
        target_id text NOT NULL,
        before jsonb,
        after jsonb NOT NULL,
        request_id text NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now()
      );

      CREATE TRIGGER control_audit_immutable
      BEFORE UPDATE OR DELETE ON control.control_audit
      FOR EACH ROW EXECUTE FUNCTION public.reject_immutable_change();

      CREATE FUNCTION control.guard_first_admin() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF OLD.first_admin_bound_at IS NOT NULL AND
           ROW(OLD.first_admin_issuer, OLD.first_admin_subject, OLD.first_admin_bound_at)
             IS DISTINCT FROM ROW(NEW.first_admin_issuer, NEW.first_admin_subject, NEW.first_admin_bound_at) THEN
          RAISE EXCEPTION 'first admin binding is permanent' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER first_admin_permanent BEFORE UPDATE ON control.tenants
      FOR EACH ROW EXECUTE FUNCTION control.guard_first_admin();

      CREATE TRIGGER tenants_updated BEFORE UPDATE ON control.tenants
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
      CREATE TRIGGER projects_updated BEFORE UPDATE ON control.projects
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
      CREATE TRIGGER api_keys_updated BEFORE UPDATE ON control.api_keys
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
      CREATE TRIGGER models_updated BEFORE UPDATE ON control.models
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
      CREATE TRIGGER traffic_updated BEFORE UPDATE ON control.traffic_limit_policies
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();

      CREATE INDEX projects_tenant_created ON control.projects(customer_id, created_at DESC, project_id);
      CREATE INDEX keys_project_created ON control.api_keys(project_id, created_at DESC, api_key_id);
      CREATE INDEX operations_in_progress ON control.config_operations(created_at) WHERE state = 'in_progress';
      CREATE INDEX audit_target_created ON control.control_audit(target_type, target_id, created_at DESC);

      DO $$ BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'control_writer') THEN
          CREATE ROLE control_writer NOLOGIN;
        END IF;
      END $$;
      GRANT USAGE ON SCHEMA control, public TO control_writer;
      GRANT SELECT, INSERT, UPDATE ON control.tenants, control.projects, control.api_keys,
        control.models, control.traffic_limit_policies, control.config_operations TO control_writer;
      GRANT SELECT, INSERT ON control.control_audit TO control_writer;

      COMMIT;
    008_canonical_key_identity.sql: |
      BEGIN;

      -- Preserve the original name and APIM identity of every existing key. Migration
      -- 007 remains unchanged; its hierarchy CHECK follows the column rename.
      ALTER TABLE control.api_keys RENAME COLUMN api_key_id TO key_name;
      ALTER TABLE control.api_keys ADD COLUMN api_key_id text;
      ALTER TABLE control.api_keys DISABLE TRIGGER api_keys_updated;
      UPDATE control.api_keys SET api_key_id = apim_subscription_id;
      ALTER TABLE control.api_keys ENABLE TRIGGER api_keys_updated;
      ALTER TABLE control.api_keys ALTER COLUMN api_key_id SET NOT NULL;
      ALTER TABLE control.api_keys
        ADD CONSTRAINT api_keys_canonical_identity CHECK (api_key_id = apim_subscription_id);
      ALTER TABLE control.api_keys DROP CONSTRAINT api_keys_pkey;
      ALTER TABLE control.api_keys ADD PRIMARY KEY (api_key_id);
      ALTER TABLE control.api_keys ADD CONSTRAINT api_keys_project_name_key UNIQUE (project_id, key_name);

      DROP INDEX control.keys_project_created;
      CREATE INDEX keys_project_created ON control.api_keys(project_id, created_at DESC, api_key_id);

      -- Display names and lifecycle status may change; the identity used in financial
      -- records must survive secret rotation, suspension and revocation unchanged.
      CREATE FUNCTION control.guard_key_identity() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(OLD.customer_id, OLD.project_id, OLD.key_name, OLD.api_key_id, OLD.apim_subscription_id)
           IS DISTINCT FROM
           ROW(NEW.customer_id, NEW.project_id, NEW.key_name, NEW.api_key_id, NEW.apim_subscription_id) THEN
          RAISE EXCEPTION 'key identity is immutable' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER key_identity_immutable BEFORE UPDATE ON control.api_keys
      FOR EACH ROW EXECUTE FUNCTION control.guard_key_identity();

      -- Historical audit and idempotency payloads retain their original vocabulary.
      -- No financial records or APIM resources are rewritten by this migration.
      COMMIT;
    011_plans.sql: |
      BEGIN;

      -- Plans: what a customer actually buys (demo 1, story steps 2-5).
      --
      -- Why this table exists
      -- --------------------
      -- The demo has one customer buying SuperFast (RPM 10) and Economy (RPM 2) and
      -- running both at once. That was not merely unbuilt -- it was forbidden. Traffic
      -- limits hung off the *customer* (control.traffic_limit_policies.customer_id),
      -- and migration 007 carries a deliberate rule:
      --
      --   EXCLUDE USING gist (customer_id WITH =, apim_product_id WITH <>)
      --   -- Even non-overlapping model policies cannot give a tenant two active products.
      --
      -- One customer could therefore only ever have one speed. Moving the limit onto
      -- the plan is what lets a customer hold two plans at two speeds, and it is what
      -- an APIM product models in the first place: a tier you subscribe to.
      --
      -- Consequences recorded as L53-L55 in the discovery worktree's
      -- limitations-and-choices.md, which supersede L39 (one product per tenant) and
      -- dissolve L40 (the 2,000-tenant ceiling, since products are now O(plans)).
      --
      -- What this migration does NOT do
      -- -------------------------------
      -- control.traffic_limit_policies is left in place and untouched. Twenty-three
      -- files reference it, and dropping it here would put an unrelated refactor in
      -- the same change as the demo path. It stops being *applied* instead: a key's
      -- subscription is scoped to its plan's product, so no per-tenant product is
      -- created and no second ceiling can take effect. That satisfies L54 in
      -- behaviour now; removing the table is separate work, and until it happens the
      -- table is inert rather than authoritative.
      CREATE TABLE control.plans (
        plan_id control.identifier PRIMARY KEY,
        display_name text NOT NULL CHECK (btrim(display_name) <> ''),
        requests_per_minute bigint NOT NULL CHECK (requests_per_minute > 0),
        tokens_per_minute bigint NOT NULL CHECK (tokens_per_minute > 0),
        -- Money is integer nano-units, as everywhere else. $100 is 100000000000.
        -- Bounded by 2^53-1 because Redis decides on the hot path in Lua, whose
        -- numbers are doubles; a larger value would lose precision silently.
        minimum_purchase_nano bigint NOT NULL
          CHECK (minimum_purchase_nano > 0 AND minimum_purchase_nano <= 9007199254740991),
        currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
        -- One plan is one APIM product. UNIQUE because two plans sharing a product
        -- would share its rate-limit policy, which is the bug this table exists to fix.
        apim_product_id text NOT NULL UNIQUE CHECK (btrim(apim_product_id) <> ''),
        status text NOT NULL CHECK (status IN ('active','retired')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      -- Which models a plan grants. The story lists the same three for every plan, but
      -- that is a property of the demo catalogue, not a rule, so it is a table rather
      -- than an assumption baked into the plan row.
      CREATE TABLE control.plan_models (
        plan_id control.identifier NOT NULL REFERENCES control.plans(plan_id),
        sku text NOT NULL REFERENCES control.models(sku),
        created_at timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (plan_id, sku)
      );

      -- A key belongs to the plan it was bought under, and inherits that plan's speed.
      --
      -- Nullable, because every key issued before this migration was created under the
      -- per-tenant model and has no plan. Those keys keep working exactly as they did.
      -- It is NOT backfilled with a default plan: inventing a purchase that never
      -- happened would put a fictional tier -- and later, a fictional price -- on a
      -- real customer's key.
      ALTER TABLE control.api_keys
        ADD COLUMN plan_id control.identifier REFERENCES control.plans(plan_id);

      CREATE INDEX api_keys_plan ON control.api_keys(plan_id) WHERE plan_id IS NOT NULL;

      CREATE TRIGGER plans_updated BEFORE UPDATE ON control.plans
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();

      GRANT SELECT, INSERT, UPDATE ON control.plans, control.plan_models TO control_writer;

      COMMIT;
    014_users_resources_plan_versions.sql: |
      BEGIN;

      -- Users, Resources and versioned plans (Demo 1 aligned with the User Portal
      -- proposal: DD1, DD4 and PP1 in the discovery worktree's
      -- docs/demo1/demo1-decisions.md; ER in docs/demo1/portal-alignment-design.md).
      --
      -- Schema only. Nothing reads these tables yet: the purchase path keeps using
      -- control.plans, control.plan_models and control.api_keys until goal P4, so
      -- this migration changes no behaviour.
      --
      -- UserAccount -> Resource (DD1)
      -- -----------------------------
      -- A user buys a plan and gets a Resource: one purchase, one resource_id, one
      -- APIM subscription whose sid *is* the resource_id, and one wallet. There is no
      -- tenant and no project on this path. The tenant, project and key tables stay
      -- in place and untouched (OD3).
      --
      -- Credentials in the control schema (DD4)
      -- ---------------------------------------
      -- The login secret lives in its own table beside user_accounts, so that moving
      -- to an identity provider later removes one table and touches nothing else. It
      -- holds a hash only. There is no password column of any kind, and the CHECK on
      -- password_hash admits only an Argon2id PHC string (DD2), so a plaintext
      -- password cannot be stored by mistake.
      --
      -- control_writer, control-api's role, can read these hashes. That is a
      -- demo-only deviation from "ai-tollgate never owns customer identity",
      -- recorded as an L-entry in limitations-and-choices.md. billing_app has no
      -- USAGE on the control schema and is granted nothing here.
      --
      -- Versioned plans (PP1)
      -- ---------------------
      -- A plan version's terms are immutable: a change is a new version with its own
      -- APIM product. A Resource points to the version it bought, so a later change
      -- to the plan never alters an existing Resource's limits or models.
      -- control.plans keeps the plan's identity and display name; the terms it still
      -- carries are those of version 1 and are no longer the source of truth once
      -- the purchase reads versions (P4).
      --
      -- Every existing plan becomes version 1 with its current apim_product_id and
      -- plan_models, so every existing APIM product, subscription and purchase is
      -- unaffected.

      CREATE TABLE control.user_accounts (
        user_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        status text NOT NULL CHECK (status IN ('active','locked','disabled')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      CREATE TABLE control.user_credentials (
        user_id uuid PRIMARY KEY REFERENCES control.user_accounts(user_id),
        -- The lookup key. Lower-cased and trimmed by the application; the CHECK only
        -- refuses a value that plainly was not normalised, so two spellings of one
        -- name cannot become two accounts.
        username_normalized text NOT NULL UNIQUE
          CHECK (username_normalized <> '' AND username_normalized = lower(btrim(username_normalized))),
        username_display text NOT NULL CHECK (btrim(username_display) <> ''),
        password_hash text NOT NULL CHECK (password_hash ~ '^\$argon2id\$v=[0-9]+\$[^$]+\$[^$]+\$[^$]+$'),
        failed_attempts integer NOT NULL DEFAULT 0 CHECK (failed_attempts >= 0),
        locked_until timestamptz,
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      CREATE TABLE control.plan_versions (
        plan_version_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        plan_id control.identifier NOT NULL REFERENCES control.plans(plan_id),
        version integer NOT NULL CHECK (version > 0),
        requests_per_minute bigint NOT NULL CHECK (requests_per_minute > 0),
        tokens_per_minute bigint NOT NULL CHECK (tokens_per_minute > 0),
        -- Integer nano-units, bounded by 2^53-1 as in control.plans.
        minimum_purchase_nano bigint NOT NULL
          CHECK (minimum_purchase_nano > 0 AND minimum_purchase_nano <= 9007199254740991),
        currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
        -- One version is one APIM product (PP1): two versions sharing a product would
        -- share its rate-limit and model policy, so a new version needs a new product.
        apim_product_id text NOT NULL UNIQUE CHECK (btrim(apim_product_id) <> ''),
        status text NOT NULL CHECK (status IN ('draft','active','retired')),
        effective_from timestamptz NOT NULL DEFAULT now(),
        effective_to timestamptz,
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        UNIQUE (plan_id, version),
        CHECK (effective_to IS NULL OR effective_to > effective_from)
      );

      -- A purchase takes the plan's active version, so there must never be two.
      CREATE UNIQUE INDEX plan_versions_one_active ON control.plan_versions(plan_id) WHERE status = 'active';

      -- The models a version grants. Part of its terms: rows can be added only while
      -- the version is a draft, and never changed or removed (triggers below).
      CREATE TABLE control.plan_version_models (
        plan_version_id uuid NOT NULL REFERENCES control.plan_versions(plan_version_id),
        sku text NOT NULL REFERENCES control.models(sku),
        created_at timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (plan_version_id, sku)
      );

      CREATE TABLE control.resources (
        resource_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),
        plan_version_id uuid NOT NULL REFERENCES control.plan_versions(plan_version_id),
        region text NOT NULL CHECK (btrim(region) <> ''),
        region_user_specified boolean NOT NULL DEFAULT false,
        -- The APIM sid is the resource_id (DP1). spend-control sees it as
        -- credential_id and finds the wallet by it, so the two cannot differ.
        apim_subscription_id text NOT NULL UNIQUE CHECK (apim_subscription_id = resource_id::text),
        status text NOT NULL CHECK (status IN ('provisioning','active','suspended','closed')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      CREATE INDEX resources_user_created ON control.resources(user_id, created_at DESC, resource_id);
      CREATE INDEX plan_versions_plan ON control.plan_versions(plan_id, version DESC);

      -- Only status and effective_to may change on a plan version; its terms cannot.
      CREATE FUNCTION control.guard_plan_version_terms() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.plan_version_id, NEW.plan_id, NEW.version, NEW.requests_per_minute, NEW.tokens_per_minute,
               NEW.minimum_purchase_nano, NEW.currency, NEW.apim_product_id, NEW.effective_from, NEW.created_at)
           IS DISTINCT FROM
           ROW(OLD.plan_version_id, OLD.plan_id, OLD.version, OLD.requests_per_minute, OLD.tokens_per_minute,
               OLD.minimum_purchase_nano, OLD.currency, OLD.apim_product_id, OLD.effective_from, OLD.created_at) THEN
          RAISE EXCEPTION 'plan version terms are immutable; create a new version' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER plan_version_terms_immutable BEFORE UPDATE ON control.plan_versions
      FOR EACH ROW EXECUTE FUNCTION control.guard_plan_version_terms();

      -- A version's models are fixed once it leaves draft. FOR SHARE makes a
      -- concurrent activation wait for this insert, or this insert see it.
      CREATE FUNCTION control.guard_plan_version_models() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF (SELECT status FROM control.plan_versions WHERE plan_version_id = NEW.plan_version_id FOR SHARE)
           IS DISTINCT FROM 'draft' THEN
          RAISE EXCEPTION 'models can be added only to a draft plan version' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER plan_version_models_draft_only BEFORE INSERT ON control.plan_version_models
      FOR EACH ROW EXECUTE FUNCTION control.guard_plan_version_models();
      CREATE TRIGGER plan_version_models_immutable BEFORE UPDATE OR DELETE ON control.plan_version_models
      FOR EACH ROW EXECUTE FUNCTION public.reject_immutable_change();

      -- Who owns a Resource, what it bought and which subscription it is never change.
      CREATE FUNCTION control.guard_resource_identity() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.resource_id, NEW.user_id, NEW.plan_version_id, NEW.apim_subscription_id, NEW.created_at)
           IS DISTINCT FROM
           ROW(OLD.resource_id, OLD.user_id, OLD.plan_version_id, OLD.apim_subscription_id, OLD.created_at) THEN
          RAISE EXCEPTION 'resource identity is immutable' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER resource_identity_immutable BEFORE UPDATE ON control.resources
      FOR EACH ROW EXECUTE FUNCTION control.guard_resource_identity();

      CREATE TRIGGER user_accounts_updated BEFORE UPDATE ON control.user_accounts
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
      CREATE TRIGGER user_credentials_updated BEFORE UPDATE ON control.user_credentials
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
      CREATE TRIGGER plan_versions_updated BEFORE UPDATE ON control.plan_versions
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();
      CREATE TRIGGER resources_updated BEFORE UPDATE ON control.resources
      FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();

      -- Backfill: every plan becomes version 1, from its current row. Inserted as a
      -- draft so its models can be attached, then given the plan's own status.
      -- effective_from is the plan's creation time: that is when these terms began.
      INSERT INTO control.plan_versions
        (plan_id, version, requests_per_minute, tokens_per_minute, minimum_purchase_nano, currency,
         apim_product_id, status, effective_from)
      SELECT plan_id, 1, requests_per_minute, tokens_per_minute, minimum_purchase_nano, currency,
             apim_product_id, 'draft', created_at
      FROM control.plans;

      INSERT INTO control.plan_version_models (plan_version_id, sku)
      SELECT v.plan_version_id, m.sku
      FROM control.plan_models m JOIN control.plan_versions v ON v.plan_id = m.plan_id AND v.version = 1;

      UPDATE control.plan_versions v SET status = p.status
      FROM control.plans p WHERE p.plan_id = v.plan_id AND v.version = 1;

      -- control-api creates users, credentials, versions and Resources, updates
      -- status and lockout fields, and never deletes. A version's models are insert
      -- only. billing_app is granted nothing: it has no USAGE on this schema.
      GRANT SELECT, INSERT, UPDATE ON control.user_accounts, control.user_credentials,
        control.plan_versions, control.resources TO control_writer;
      GRANT SELECT, INSERT ON control.plan_version_models TO control_writer;

      COMMIT;
    015_user_sessions.sql: |
      BEGIN;

      -- Portal sessions (Demo 1 aligned with the User Portal proposal, goal P2:
      -- DD2, DD4 and OD10 in the discovery worktree's docs/demo1/demo1-decisions.md).
      --
      -- A user logs in on /portal/v1 and receives a random token in an HttpOnly,
      -- SameSite=Strict cookie. Only the token's SHA-256 is stored here, so this
      -- table alone cannot be replayed as a cookie. The token has 256 bits of
      -- entropy, which is why a fast unsalted digest is enough for it, unlike a
      -- password.
      --
      -- Every login writes a new row with a new session_id and token (rotation at
      -- login). A session ends by expiry or by revocation (logout); it is never
      -- extended, never re-pointed at another user and never deleted.

      CREATE TABLE control.user_sessions (
        session_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),
        token_sha256 bytea NOT NULL UNIQUE CHECK (octet_length(token_sha256) = 32),
        created_at timestamptz NOT NULL DEFAULT now(),
        expires_at timestamptz NOT NULL,
        revoked_at timestamptz,
        CHECK (expires_at > created_at),
        CHECK (revoked_at IS NULL OR revoked_at >= created_at)
      );

      CREATE INDEX user_sessions_user ON control.user_sessions(user_id, created_at DESC);

      -- Only revoked_at may change, and only once: a revoked session stays revoked.
      CREATE FUNCTION control.guard_user_session() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.session_id, NEW.user_id, NEW.token_sha256, NEW.created_at, NEW.expires_at)
           IS DISTINCT FROM
           ROW(OLD.session_id, OLD.user_id, OLD.token_sha256, OLD.created_at, OLD.expires_at)
           OR (OLD.revoked_at IS NOT NULL AND NEW.revoked_at IS DISTINCT FROM OLD.revoked_at) THEN
          RAISE EXCEPTION 'a session can only be revoked, once' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER user_session_revoke_only BEFORE UPDATE ON control.user_sessions
      FOR EACH ROW EXECUTE FUNCTION control.guard_user_session();

      -- control-api creates sessions and revokes them; nothing deletes them.
      -- billing_app has no USAGE on this schema and is granted nothing.
      GRANT SELECT, INSERT, UPDATE ON control.user_sessions TO control_writer;

      COMMIT;
    016_portal_audit_surface.sql: |
      BEGIN;

      -- A user's purchase on /portal/v1 (goal P4) is audited like an operator's, but
      -- it is neither an operator action nor a configuration change. Recording it
      -- under either surface would misstate who acted, so the audit gains a third.
      -- Existing rows are unaffected: the set only grows.

      ALTER TABLE control.control_audit DROP CONSTRAINT control_audit_surface_check;
      ALTER TABLE control.control_audit ADD CONSTRAINT control_audit_surface_check
        CHECK (surface IN ('operator','config','portal'));

      COMMIT;
    017_case_sensitive_skus.sql: |
      BEGIN;

      -- A SKU may hold upper-case letters, so a catalogue model can be named exactly as
      -- its backend serves it (a vLLM server serves Qwen3-8B; the gateway forwards the
      -- body's model unchanged). SKUs stay case-sensitive identifiers, but the APIM
      -- Backend entity id derived from one is lower-cased and APIM ids ignore case, so
      -- two SKUs that differ only by case are refused. Existing rows are unaffected:
      -- every SKU the old pattern admitted is lower-case, and the new pattern admits it.

      ALTER TABLE control.models DROP CONSTRAINT models_sku_check;
      ALTER TABLE control.models ADD CONSTRAINT models_sku_check
        CHECK (sku ~ '^[A-Za-z0-9][A-Za-z0-9._-]*$' AND length(sku) <= 256);
      CREATE UNIQUE INDEX models_sku_case_insensitive ON control.models (lower(sku));

      COMMIT;
    018_embedding_models.sql: |
      BEGIN;

      -- A catalogue model is a chat model or an embedding model (goal G22, EM-5). The
      -- gateway serves each on its own operation (POST /chat/completions or POST
      -- /embeddings) and refuses a model on the other one. Only the allowed values
      -- widen: every existing row is 'chat' and stays as it is.

      ALTER TABLE control.models DROP CONSTRAINT models_api_type_check;
      ALTER TABLE control.models ADD CONSTRAINT models_api_type_check
        CHECK (api_type IN ('chat','embedding'));

      COMMIT;
    035_server_tools.sql: |
      BEGIN;
      -- Portal cluster: the control half (plans and plan_versions server tools).
      -- A copy of services/spend-control/migrations/035_server_tools.sql with only this cluster's statements; nothing added.

      -- ST-D: which server tools a plan allows, and the bound on tool calls a call may make (ST-C).
      -- Plan terms, like the rate limits: on the plan and on each of its versions, and a change is a new
      -- plan. No tools and no bound, the default, for every plan before this one.
      ALTER TABLE control.plans
        ADD COLUMN server_tools text[] NOT NULL DEFAULT '{}'
          CHECK (server_tools <@ ARRAY['web_search','mcp']::text[]),
        ADD COLUMN max_tool_calls integer NOT NULL DEFAULT 0 CHECK (max_tool_calls >= 0 AND max_tool_calls <= 100),
        ADD CONSTRAINT plans_tools_need_a_bound CHECK ((cardinality(server_tools) = 0) = (max_tool_calls = 0));
      ALTER TABLE control.plan_versions
        ADD COLUMN server_tools text[] NOT NULL DEFAULT '{}'
          CHECK (server_tools <@ ARRAY['web_search','mcp']::text[]),
        ADD COLUMN max_tool_calls integer NOT NULL DEFAULT 0 CHECK (max_tool_calls >= 0 AND max_tool_calls <= 100),
        ADD CONSTRAINT plan_versions_tools_need_a_bound CHECK ((cardinality(server_tools) = 0) = (max_tool_calls = 0));

      -- A plan version's terms are immutable (migration 014): the tools and the bound are terms too.
      CREATE OR REPLACE FUNCTION control.guard_plan_version_terms() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.plan_version_id, NEW.plan_id, NEW.version, NEW.requests_per_minute, NEW.tokens_per_minute,
               NEW.minimum_purchase_nano, NEW.currency, NEW.apim_product_id, NEW.effective_from, NEW.created_at,
               NEW.server_tools, NEW.max_tool_calls)
           IS DISTINCT FROM
           ROW(OLD.plan_version_id, OLD.plan_id, OLD.version, OLD.requests_per_minute, OLD.tokens_per_minute,
               OLD.minimum_purchase_nano, OLD.currency, OLD.apim_product_id, OLD.effective_from, OLD.created_at,
               OLD.server_tools, OLD.max_tool_calls) THEN
          RAISE EXCEPTION 'plan version terms are immutable; create a new version' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;

      COMMIT;
    036_user_contacts_email_verification.sql: |
      BEGIN;

      -- A user's email address and billing address, and the codes that verify the email (sign-up).
      --
      -- Personal data stays in the control schema, beside the credentials, and is read by control-api only:
      -- billing_app has no USAGE on this schema, and nothing here reaches billing-mgmt, OpenMeter or APIM.
      -- An account made before this migration has no contact row; control-api lets it in as it always did.
      --
      -- user_contacts
      -- -------------
      -- One row per user. The email is lower-cased and trimmed by the application; the CHECK refuses a value
      -- that plainly was not. Two accounts may hold the same unverified email, so nobody can park an address
      -- they do not own: the unique index covers verified emails only, and the first account to verify an
      -- address keeps it. The email can change later, so nothing else is keyed on it.
      --
      -- email_verifications
      -- -------------------
      -- One row per code sent, so the rows are also the send history that the resend cooldown and the hourly
      -- caps count. Only a hash of the code is stored: a 6-digit code is guessable, so it is an Argon2id hash
      -- with its own salt (as a password's is), and the attempt limit and the short expiry do the rest.
      -- A newer code closes the older ones (closed_at). A row whose email never left (send_failed_at) is not
      -- counted as a send.

      CREATE TABLE control.user_contacts (
        user_id uuid PRIMARY KEY REFERENCES control.user_accounts(user_id),
        email text NOT NULL CHECK (btrim(email) <> '' AND length(email) <= 254),
        email_normalized text NOT NULL
          CHECK (email_normalized ~ '^[^@[:space:]]+@[^@[:space:]]+$' AND length(email_normalized) <= 254
                 AND email_normalized = lower(btrim(email_normalized))),
        email_verified_at timestamptz,
        billing_name text NOT NULL CHECK (btrim(billing_name) <> '' AND length(billing_name) <= 200),
        billing_line1 text NOT NULL CHECK (btrim(billing_line1) <> '' AND length(billing_line1) <= 200),
        billing_line2 text CHECK (billing_line2 IS NULL OR (btrim(billing_line2) <> '' AND length(billing_line2) <= 200)),
        billing_city text NOT NULL CHECK (btrim(billing_city) <> '' AND length(billing_city) <= 100),
        billing_state text CHECK (billing_state IS NULL OR (btrim(billing_state) <> '' AND length(billing_state) <= 100)),
        billing_postal_code text NOT NULL CHECK (btrim(billing_postal_code) <> '' AND length(billing_postal_code) <= 20),
        -- ISO 3166-1 alpha-2, upper case.
        billing_country text NOT NULL CHECK (billing_country ~ '^[A-Z]{2}$'),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      CREATE UNIQUE INDEX user_contacts_verified_email ON control.user_contacts(email_normalized)
        WHERE email_verified_at IS NOT NULL;
      CREATE INDEX user_contacts_email ON control.user_contacts(email_normalized);

      CREATE TABLE control.email_verifications (
        verification_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),
        -- The address this code was sent to.
        email_normalized text NOT NULL CHECK (email_normalized = lower(btrim(email_normalized))),
        code_hash text NOT NULL CHECK (code_hash ~ '^\$argon2id\$v=[0-9]+\$[^$]+\$[^$]+\$[^$]+$'),
        created_at timestamptz NOT NULL DEFAULT now(),
        expires_at timestamptz NOT NULL,
        failed_attempts integer NOT NULL DEFAULT 0 CHECK (failed_attempts >= 0),
        -- Set when the code is used or a newer one replaces it.
        closed_at timestamptz,
        send_failed_at timestamptz,
        CHECK (expires_at > created_at)
      );

      CREATE INDEX email_verifications_user ON control.email_verifications(user_id, created_at DESC);
      CREATE INDEX email_verifications_email ON control.email_verifications(email_normalized, created_at DESC);

      -- A code's hash, address and times never change; its attempts only grow, and it is closed or marked
      -- unsent once.
      CREATE FUNCTION control.guard_email_verification() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.verification_id, NEW.user_id, NEW.email_normalized, NEW.code_hash, NEW.created_at, NEW.expires_at)
           IS DISTINCT FROM
           ROW(OLD.verification_id, OLD.user_id, OLD.email_normalized, OLD.code_hash, OLD.created_at, OLD.expires_at)
           OR NEW.failed_attempts < OLD.failed_attempts
           OR (OLD.closed_at IS NOT NULL AND NEW.closed_at IS DISTINCT FROM OLD.closed_at)
           OR (OLD.send_failed_at IS NOT NULL AND NEW.send_failed_at IS DISTINCT FROM OLD.send_failed_at) THEN
          RAISE EXCEPTION 'a verification code can only gain attempts, and be closed or marked unsent once'
            USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER email_verification_guard BEFORE UPDATE ON control.email_verifications
      FOR EACH ROW EXECUTE FUNCTION control.guard_email_verification();

      -- control-api reads and writes both; nothing deletes them. billing_app is granted nothing.
      GRANT SELECT, INSERT, UPDATE ON control.user_contacts TO control_writer;
      GRANT SELECT, INSERT, UPDATE ON control.email_verifications TO control_writer;

      COMMIT;
    037_balance_alerts.sql: |
      BEGIN;

      -- Low-balance email alerts: when a Resource's wallet has used a set share of everything credited to it,
      -- its owner is emailed once. control-api reads the wallet from billing-mgmt and decides; nothing here
      -- touches money. billing_app is granted nothing.
      --
      -- alert_thresholds
      -- ----------------
      -- The shares of the credited balance (in whole percent, 1 to 99) at which an alert is sent, by scope: a
      -- plan (every version of it), later a user or one Resource. The most specific scope that has a row wins,
      -- then the deployment's default. An empty list is a row too: it means "no alerts" for that scope. Plans'
      -- rows come from the catalogue (python -m control_api.catalogue); nothing writes the other scopes yet.
      -- Not a term of a plan version: tuning an alert must not need a new plan.
      --
      -- balance_alerts
      -- --------------
      -- One row per alert that fired. A row is "live" until its share is no longer reached (a top-up raised
      -- the balance), when rearmed_at is set; the unique index allows one live row per Resource and share, so
      -- an alert is sent once however often the wallet is read and however many replicas read it. Crossing
      -- two shares in one step sends one email, for the higher: the lower is recorded as superseded.
      -- pending -> sent, or abandoned (it stopped being true, or could not be sent in time). The balance and
      -- the amount settled are those the alert was decided on.

      CREATE FUNCTION control.valid_alert_percents(percents smallint[]) RETURNS boolean
      LANGUAGE sql IMMUTABLE AS $$
        SELECT cardinality(percents) <= 5
           AND NOT EXISTS (SELECT 1 FROM unnest(percents) AS p WHERE p IS NULL OR p NOT BETWEEN 1 AND 99)
           AND NOT EXISTS (SELECT 1 FROM generate_subscripts(percents, 1) AS i
                           WHERE i > 1 AND percents[i] <= percents[i - 1])
      $$;

      CREATE TABLE control.alert_thresholds (
        scope_type text NOT NULL CHECK (scope_type IN ('plan', 'user', 'resource')),
        scope_id text NOT NULL CHECK (btrim(scope_id) <> '' AND length(scope_id) <= 100),
        -- Ascending, no repeats, at most five.
        percents smallint[] NOT NULL CHECK (control.valid_alert_percents(percents)),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (scope_type, scope_id)
      );

      CREATE TABLE control.balance_alerts (
        alert_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        resource_id uuid NOT NULL REFERENCES control.resources(resource_id),
        percent smallint NOT NULL CHECK (percent BETWEEN 1 AND 99),
        state text NOT NULL CHECK (state IN ('pending', 'sent', 'abandoned', 'superseded')),
        currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
        balance_nano bigint NOT NULL CHECK (balance_nano > 0 AND balance_nano <= 9007199254740991),
        settled_nano bigint NOT NULL CHECK (settled_nano >= 0 AND settled_nano <= 9007199254740991),
        attempts integer NOT NULL DEFAULT 0 CHECK (attempts >= 0),
        next_attempt_at timestamptz NOT NULL DEFAULT now(),
        -- The reason an alert was not sent, as a code; never an address or a message.
        last_error text CHECK (last_error IS NULL OR last_error ~ '^[a-z_]{1,64}$'),
        created_at timestamptz NOT NULL DEFAULT now(),
        sent_at timestamptz,
        abandoned_at timestamptz,
        rearmed_at timestamptz,
        CHECK ((state = 'sent') = (sent_at IS NOT NULL)),
        CHECK ((state = 'abandoned') = (abandoned_at IS NOT NULL))
      );

      CREATE UNIQUE INDEX balance_alerts_live ON control.balance_alerts(resource_id, percent) WHERE rearmed_at IS NULL;
      CREATE INDEX balance_alerts_pending ON control.balance_alerts(next_attempt_at) WHERE state = 'pending';
      CREATE INDEX balance_alerts_resource ON control.balance_alerts(resource_id, created_at DESC);

      -- What an alert was decided on never changes. It leaves pending once, for sent or abandoned; attempts only
      -- grow; it is re-armed once.
      CREATE FUNCTION control.guard_balance_alert() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.alert_id, NEW.resource_id, NEW.percent, NEW.currency, NEW.balance_nano, NEW.settled_nano,
               NEW.created_at)
           IS DISTINCT FROM
           ROW(OLD.alert_id, OLD.resource_id, OLD.percent, OLD.currency, OLD.balance_nano, OLD.settled_nano,
               OLD.created_at)
           OR NEW.attempts < OLD.attempts
           OR (OLD.state <> 'pending' AND NEW.state IS DISTINCT FROM OLD.state)
           OR (OLD.state = 'pending' AND NEW.state = 'superseded')
           OR (OLD.sent_at IS NOT NULL AND NEW.sent_at IS DISTINCT FROM OLD.sent_at)
           OR (OLD.abandoned_at IS NOT NULL AND NEW.abandoned_at IS DISTINCT FROM OLD.abandoned_at)
           OR (OLD.rearmed_at IS NOT NULL AND NEW.rearmed_at IS DISTINCT FROM OLD.rearmed_at) THEN
          RAISE EXCEPTION 'a balance alert is decided once; it can only be sent, abandoned or re-armed'
            USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER balance_alert_guard BEFORE UPDATE ON control.balance_alerts
      FOR EACH ROW EXECUTE FUNCTION control.guard_balance_alert();

      -- control-api reads and writes both; nothing deletes them. billing_app is granted nothing.
      GRANT SELECT, INSERT, UPDATE ON control.alert_thresholds TO control_writer;
      GRANT SELECT, INSERT, UPDATE ON control.balance_alerts TO control_writer;

      COMMIT;
    039_drop_legacy_control_tables.sql: |
      BEGIN;
      -- Portal cluster: without lab_verifier (009 does not run here).
      -- A copy of services/spend-control/migrations/039_drop_legacy_control_tables.sql with only this cluster's statements; nothing added.

      -- The old operator model's tables go, with plan_models (the purchase through billing-mgmt,
      -- claim D). A buyer is a control.user_accounts row and a credential is a control.resources
      -- row; the operator's tenant, project, key, traffic-limit and purchase routes, onboarding,
      -- registration and the lab, the only writers and readers of these tables, went before
      -- this migration. plan_models duplicated version 1 of control.plan_version_models (014):
      -- the plan reads and the catalogue read the version's models now. No kept table has a
      -- foreign key to any of them; the wallet's api_key_id is text with no foreign key (010), so
      -- a wallet an old key funded keeps its money and still works.
      --
      -- Each DROP takes the table's indexes, constraints, triggers and grants with it: 007's,
      -- 011's and 009's (lab_verifier). No CASCADE: anything else that still depended on a table
      -- would make this migration fail rather than be dropped with it. Foreign-key order: keys
      -- before their projects; projects and traffic limits before their tenants.
      DROP TABLE control.api_keys;
      DROP TABLE control.traffic_limit_policies;
      DROP TABLE control.projects;
      DROP TABLE control.tenants;
      DROP TABLE control.plan_models;

      -- Only those tables' triggers called these (007, 008). set_updated_at() stays: other tables use it.
      DROP FUNCTION control.guard_first_admin();
      DROP FUNCTION control.guard_key_identity();

      COMMIT;
    041_control_sync_outbox.sql: |
      BEGIN;

      -- The portal's side of the control sync (architecture: the 8 shared control tables, copied from the portal's
      -- database to every region's data-path database over that region's Service Bus). Every change to one of the 8
      -- tables is written, in the writer's own transaction, to control_sync.outbox by a trigger; the relay
      -- (control_api.sync.relay, login control_sync_relay) sends it to every registered region in order. The portal
      -- cluster's set runs this file; a data-path cluster's set skips it (it runs 042 instead). A single-database
      -- deployment runs both, and collects nothing until a region is registered.
      --
      -- seq_counter
      -- -----------
      -- One row. Every captured change first takes n + 1 from it; the row lock is held to commit, so writers of the 8
      -- tables run one at a time, numbers follow commit order, a rollback gives its numbers back, and one
      -- transaction's numbers are consecutive. A gap downstream therefore always means a lost message. (A bigserial
      -- would hand out numbers in start order, not commit order, so a reader could pass a number that commits later.)
      --
      -- outbox
      -- ------
      -- One row per changed row, written only while control_sync.regions has a row. key is the primary key (named by
      -- the trigger's arguments), row the row as stored (after the BEFORE triggers), NULL for a delete.
      --
      -- regions
      -- -------
      -- One row per region the relay sends to. sent_seq is the last number sent to it; NULL means "send a snapshot
      -- next". snapshot_upto is the counter when the relay began that region's snapshot: the snapshot covers at least
      -- that far, so the prune never removes a row such a snapshot still has to stream after it.

      CREATE SCHEMA IF NOT EXISTS control_sync;
      REVOKE ALL ON SCHEMA control_sync FROM PUBLIC;

      CREATE TABLE control_sync.seq_counter (
        id boolean PRIMARY KEY DEFAULT true CHECK (id),
        n bigint NOT NULL DEFAULT 0 CHECK (n >= 0)
      );
      INSERT INTO control_sync.seq_counter (id, n) VALUES (true, 0);

      CREATE TABLE control_sync.outbox (
        seq bigint PRIMARY KEY,
        txid xid8 NOT NULL,
        table_name text NOT NULL,
        op text NOT NULL CHECK (op IN ('insert', 'update', 'delete')),
        key jsonb NOT NULL,
        row jsonb,
        created_at timestamptz NOT NULL DEFAULT now(),
        CHECK ((op = 'delete') = (row IS NULL))
      );

      CREATE TABLE control_sync.regions (
        region text PRIMARY KEY CHECK (region ~ '^[a-z0-9][a-z0-9-]{0,49}$'),
        namespace_fqdn text NOT NULL,
        topic text NOT NULL DEFAULT 'control-sync',
        sent_seq bigint,
        snapshot_id text,
        snapshot_upto bigint,
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      -- The capture. SECURITY DEFINER: control_writer (and anything else that writes the 8 tables) is granted
      -- nothing in control_sync, yet its change is numbered and recorded.
      CREATE FUNCTION control_sync.capture() RETURNS trigger
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        next_seq bigint;
        stored jsonb;
        pk jsonb := '{}'::jsonb;
        col text;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n + 1 RETURNING n INTO next_seq;
        -- Off until a region exists. Registering one updates the counter row too, so a writer either committed
        -- before the registration (and is in the region's snapshot) or waited for it (and sees the region here).
        IF NOT EXISTS (SELECT 1 FROM control_sync.regions) THEN
          RETURN NULL;
        END IF;
        stored := CASE WHEN TG_OP = 'DELETE' THEN to_jsonb(OLD) ELSE to_jsonb(NEW) END;
        FOREACH col IN ARRAY TG_ARGV LOOP
          pk := pk || jsonb_build_object(col, stored -> col);
        END LOOP;
        INSERT INTO control_sync.outbox (seq, txid, table_name, op, key, row)
        VALUES (next_seq, pg_current_xact_id(), TG_TABLE_NAME, lower(TG_OP), pk,
                CASE WHEN TG_OP = 'DELETE' THEN NULL ELSE stored END);
        RETURN NULL;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.capture() FROM PUBLIC;

      -- The trigger's arguments are the table's primary key columns.
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.models
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('sku');
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.plans
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('plan_id');
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.plan_versions
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('plan_version_id');
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.plan_version_models
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('plan_version_id', 'sku');
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.user_accounts
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('user_id');
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.resources
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('resource_id');
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.alert_thresholds
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('scope_type', 'scope_id');
      CREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.balance_alerts
      FOR EACH ROW EXECUTE FUNCTION control_sync.capture('alert_id');

      -- Registering a region: inserts it with sent_seq NULL (its first send is a snapshot) and updates the counter row
      -- in the same transaction (see capture()). A definer function, so the relay's login needs no UPDATE on the
      -- counter and cannot change the numbering. Registering a region again changes nothing and returns false.
      CREATE FUNCTION control_sync.register_region(p_region text, p_namespace_fqdn text, p_topic text)
      RETURNS boolean
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        added integer;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n;
        INSERT INTO control_sync.regions (region, namespace_fqdn, topic)
        VALUES (p_region, p_namespace_fqdn, p_topic)
        ON CONFLICT (region) DO NOTHING;
        GET DIAGNOSTICS added = ROW_COUNT;
        RETURN added = 1;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.register_region(text, text, text) FROM PUBLIC;

      -- The relay's login (the password, if any, is given by control_api.provision: CONTROL_SYNC_RELAY_DB_PASSWORD).
      -- It reads the 8 tables (snapshots, verify), reads and prunes the outbox and keeps the regions; it writes none of
      -- the 8 tables.
      DO $$ BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'control_sync_relay') THEN
          CREATE ROLE control_sync_relay NOLOGIN;
        END IF;
      END $$;
      GRANT USAGE ON SCHEMA control, control_sync TO control_sync_relay;
      GRANT SELECT ON control.models, control.plans, control.plan_versions, control.plan_version_models,
        control.user_accounts, control.resources, control.alert_thresholds, control.balance_alerts
        TO control_sync_relay;
      GRANT SELECT ON control_sync.seq_counter TO control_sync_relay;
      GRANT SELECT, DELETE ON control_sync.outbox TO control_sync_relay;
      GRANT SELECT, INSERT, UPDATE ON control_sync.regions TO control_sync_relay;
      GRANT EXECUTE ON FUNCTION control_sync.register_region(text, text, text) TO control_sync_relay;

      COMMIT;
    041_stripe_customers.sql: |
      BEGIN;

      -- The Stripe Customer of a user, made at the user's first card payment (control_api/payments.py).
      --
      -- Stripe is the only place a card is kept: this table holds the Customer's id and nothing about a card, so
      -- saved cards are read back from Stripe by this id. Like user_contacts it stays in the control schema and is
      -- read by control-api only: billing_app is granted nothing, and the id reaches billing-mgmt, OpenMeter and
      -- APIM never.
      --
      -- One Customer per user, and one user per Customer. The id is never changed: a payment, a saved card and a
      -- Radar history are all attached to it, so control_writer is granted no UPDATE and no DELETE.

      CREATE TABLE control.stripe_customers (
        user_id uuid PRIMARY KEY REFERENCES control.user_accounts(user_id),
        stripe_customer_id text NOT NULL UNIQUE CHECK (stripe_customer_id ~ '^cus_[A-Za-z0-9]{1,250}$'),
        created_at timestamptz NOT NULL DEFAULT now()
      );

      GRANT SELECT, INSERT ON control.stripe_customers TO control_writer;

      COMMIT;
    044_control_bus_portal.sql: |
      BEGIN;

      -- The portal's side of the control bus (command-design.md, sections 1 and 3.1). The portal makes no call into a
      -- data-path cluster: everything it asks of one is a command in control_sync.outbox, sent by the supervisor (in
      -- control-api) over the one shared Service Bus to the target's portal agent, which answers with an ACK. This
      -- reshapes 041's outbox and region registry for that. The portal cluster's set runs this file; a data-path
      -- cluster's set skips it (it runs 045). A single-database deployment runs both.
      --
      -- outbox
      -- ------
      -- One row per command, numbered from the same seq_counter as before (gap-free, in commit order, a transaction's
      -- numbers consecutive). The 8 tables' triggers write <table>.upsert (body: the row as stored) and <table>.delete
      -- (body: its key), version 1; control_sync.enqueue() writes any other command. Every target gets every command, in
      -- order (no per-target routing yet). wants_answer marks a command whose ACK someone waits for (control_sync.acks).
      --
      -- targets (041's regions, renamed)
      -- -------
      -- One row per data-path database the supervisor sends to. A cursor, not a row per command: sent_seq is the last
      -- seq sent, acked_seq the last the target has ACKed as applied (it applies strictly in order). state is up, behind,
      -- down or resync; a target added, or one that reports needs_resync, is resynced (resync.begin/rows/end) from
      -- resync_upto. The bus endpoint is per target, so a later bus per region is a change of these columns.
      --
      -- clusters
      -- --------
      -- The second address: cluster-local work, delivered on the cluster's own subscription.
      --
      -- acks
      -- ----
      -- Only for commands with wants_answer: the target's answer (applied, refused or unsupported, with its result).
      --
      -- wallet_balances, usage_rollups
      -- ------------------------------
      -- The portal's copies of what the agents report (wallet.balances and usage.rollup events, credit ACKs), read by
      -- the resource and usage pages and the alert worker instead of asking billing-mgmt. Money in integer nano-units.

      -- The outbox: commands, not copied rows. Rows of the old shape cannot be sent as commands; every existing region
      -- is set to resync below, which sends their state again, so they are dropped.
      DELETE FROM control_sync.outbox;
      ALTER TABLE control_sync.outbox
        DROP COLUMN table_name,
        DROP COLUMN op,
        DROP COLUMN key,
        DROP COLUMN row,
        ADD COLUMN command text NOT NULL CHECK (command ~ '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'),
        ADD COLUMN version integer NOT NULL CHECK (version >= 1),
        ADD COLUMN body jsonb NOT NULL CHECK (jsonb_typeof(body) = 'object'),
        ADD COLUMN correlation_id text,
        ADD COLUMN wants_answer boolean NOT NULL DEFAULT false;

      -- The registry of targets.
      ALTER TABLE control_sync.regions RENAME TO targets;
      ALTER INDEX control_sync.regions_pkey RENAME TO targets_pkey;
      ALTER TABLE control_sync.targets RENAME COLUMN region TO target;
      ALTER TABLE control_sync.targets RENAME COLUMN namespace_fqdn TO bus_namespace_fqdn;
      ALTER TABLE control_sync.targets RENAME COLUMN snapshot_id TO resync_id;
      ALTER TABLE control_sync.targets RENAME COLUMN snapshot_upto TO resync_upto;
      ALTER TABLE control_sync.targets
        ADD COLUMN command_subscription text,
        ADD COLUMN request_subscription text,
        ADD COLUMN acked_seq bigint CHECK (acked_seq >= 0),
        ADD COLUMN misses integer NOT NULL DEFAULT 0 CHECK (misses >= 0),
        ADD COLUMN last_sent_at timestamptz,
        ADD COLUMN last_ack_at timestamptz,
        ADD COLUMN state text NOT NULL DEFAULT 'resync' CHECK (state IN ('up', 'behind', 'down', 'resync')),
        ADD COLUMN supported jsonb NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(supported) = 'object'),
        ADD COLUMN heartbeat jsonb,
        ADD COLUMN heartbeat_at timestamptz,
        ADD CONSTRAINT targets_sent_seq_check CHECK (sent_seq >= 0);
      UPDATE control_sync.targets SET command_subscription = 't-' || target, request_subscription = 'r-' || target,
        sent_seq = NULL, acked_seq = NULL, resync_id = NULL, resync_upto = NULL, state = 'resync', updated_at = now();
      ALTER TABLE control_sync.targets
        ALTER COLUMN command_subscription SET NOT NULL,
        ALTER COLUMN request_subscription SET NOT NULL;

      CREATE TABLE control_sync.clusters (
        cluster text PRIMARY KEY CHECK (cluster ~ '^[a-z0-9][a-z0-9-]{0,49}$'),
        target text NOT NULL REFERENCES control_sync.targets (target) ON DELETE CASCADE,
        cluster_subscription text NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now()
      );

      CREATE TABLE control_sync.acks (
        target text NOT NULL REFERENCES control_sync.targets (target) ON DELETE CASCADE,
        seq bigint NOT NULL CHECK (seq >= 1),
        status text NOT NULL CHECK (status IN ('applied', 'refused', 'unsupported')),
        result jsonb NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(result) = 'object'),
        agent text NOT NULL,
        received_at timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (target, seq)
      );

      CREATE TABLE control_sync.wallet_balances (
        resource_id text PRIMARY KEY CHECK (btrim(resource_id) <> ''),
        target text NOT NULL,
        currency text NOT NULL,
        balance_nano bigint NOT NULL,
        settled_nano bigint NOT NULL,
        as_of timestamptz NOT NULL
      );

      CREATE TABLE control_sync.usage_rollups (
        target text NOT NULL,
        customer_id text NOT NULL CHECK (btrim(customer_id) <> ''),
        resource_id text NOT NULL,  -- '' for usage not tied to a Resource
        model text NOT NULL,
        meter text NOT NULL,
        minute timestamptz NOT NULL CHECK (date_trunc('minute', minute) = minute),
        value bigint NOT NULL CHECK (value >= 0),
        received_at timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (target, customer_id, resource_id, model, meter, minute)
      );

      -- The capture writes commands now. Same numbering and the same "off until a target exists" rule as 041's: a writer
      -- either committed before a target was added (and is in its resync) or waited on the counter row for it.
      CREATE OR REPLACE FUNCTION control_sync.capture() RETURNS trigger
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        next_seq bigint;
        stored jsonb;
        pk jsonb := '{}'::jsonb;
        col text;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n + 1 RETURNING n INTO next_seq;
        IF NOT EXISTS (SELECT 1 FROM control_sync.targets) THEN
          RETURN NULL;
        END IF;
        stored := CASE WHEN TG_OP = 'DELETE' THEN to_jsonb(OLD) ELSE to_jsonb(NEW) END;
        FOREACH col IN ARRAY TG_ARGV LOOP
          pk := pk || jsonb_build_object(col, stored -> col);
        END LOOP;
        INSERT INTO control_sync.outbox (seq, txid, command, version, body)
        VALUES (next_seq, pg_current_xact_id(),
                TG_TABLE_NAME || CASE WHEN TG_OP = 'DELETE' THEN '.delete' ELSE '.upsert' END, 1,
                CASE WHEN TG_OP = 'DELETE' THEN pk ELSE stored END);
        RETURN NULL;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.capture() FROM PUBLIC;

      -- Any other command: takes the next number from the same counter, so explicit and trigger commands share one order
      -- and one transaction's commands stay consecutive. Returns the seq, the one a caller waiting for the answer waits
      -- on; NULL, writing nothing, while no target exists (as the capture). A body past 200 KB is refused here: the bus
      -- takes 256 KB a message (the claim-check that would carry more is not built).
      CREATE FUNCTION control_sync.enqueue(p_command text, p_version integer, p_body jsonb,
                                           p_correlation_id text DEFAULT NULL, p_wants_answer boolean DEFAULT false)
      RETURNS bigint
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        next_seq bigint;
      BEGIN
        IF octet_length(p_body::text) > 200 * 1024 THEN
          RAISE EXCEPTION 'control_sync.enqueue: % body is larger than 200 KB', p_command
            USING ERRCODE = 'program_limit_exceeded';
        END IF;
        UPDATE control_sync.seq_counter SET n = n + 1 RETURNING n INTO next_seq;
        IF NOT EXISTS (SELECT 1 FROM control_sync.targets) THEN
          RETURN NULL;
        END IF;
        INSERT INTO control_sync.outbox (seq, txid, command, version, body, correlation_id, wants_answer)
        VALUES (next_seq, pg_current_xact_id(), p_command, p_version, p_body, p_correlation_id, p_wants_answer);
        RETURN next_seq;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.enqueue(text, integer, jsonb, text, boolean) FROM PUBLIC;

      -- Adding a target: as 041's register_region, it updates the counter row in the same transaction (see capture()),
      -- and the new target's first send is a resync. Adding it again changes nothing and returns false.
      DROP FUNCTION control_sync.register_region(text, text, text);
      CREATE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text)
      RETURNS boolean
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        added integer;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n;
        INSERT INTO control_sync.targets (target, bus_namespace_fqdn, topic, command_subscription, request_subscription)
        VALUES (p_target, p_bus_namespace_fqdn, p_topic, 't-' || p_target, 'r-' || p_target)
        ON CONFLICT (target) DO NOTHING;
        GET DIAGNOSTICS added = ROW_COUNT;
        RETURN added = 1;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.add_target(text, text, text) FROM PUBLIC;

      -- The portal's bus role (041's control_sync_relay, the supervisor and the ACK consumer in control-api): keeps the
      -- targets' cursors (adds them only through add_target), sends and prunes the outbox and blanks a generated key in
      -- an ACKed command's body (UPDATE of body only), records ACK answers and the two copies. It still reads the 8
      -- tables (resync, verify) and writes none of them.
      REVOKE INSERT ON control_sync.targets FROM control_sync_relay;
      GRANT UPDATE (body) ON control_sync.outbox TO control_sync_relay;
      GRANT SELECT, INSERT, UPDATE ON control_sync.clusters TO control_sync_relay;
      GRANT SELECT, INSERT, DELETE ON control_sync.acks TO control_sync_relay;
      GRANT SELECT, INSERT, UPDATE ON control_sync.wallet_balances TO control_sync_relay;
      GRANT SELECT, INSERT, UPDATE, DELETE ON control_sync.usage_rollups TO control_sync_relay;  -- DELETE: 31-day keep
      GRANT EXECUTE ON FUNCTION control_sync.add_target(text, text, text) TO control_sync_relay;

      -- control-api's own login: enqueues commands and reads answers and the copies; nothing else in the schema.
      GRANT USAGE ON SCHEMA control_sync TO control_writer;
      GRANT EXECUTE ON FUNCTION control_sync.enqueue(text, integer, jsonb, text, boolean) TO control_writer;
      GRANT SELECT ON control_sync.acks, control_sync.wallet_balances, control_sync.usage_rollups TO control_writer;

      COMMIT;
    046_control_bus_usage_coverage.sql: |
      BEGIN;

      -- The portal's usage copy keeps the producer's order and what its events cover (command-design.md section 5; review
      -- 23 of work item kashif-two-cluster, findings dev F2 and arch F3). The portal cluster's set runs this file; a
      -- data-path cluster's set skips it, as 044. A single-database deployment runs it.
      --
      -- usage_rollups.produced_upto
      -- ---------------------------
      -- The end ("to") of the producer's window that last wrote the row. A minute is replaced only by an event whose window
      -- ends at or after the stored one, so an older event delivered late (the portal's subscription has no sessions: any
      -- pod, any order) never replaces a newer total. Rows from before this file are older than any event.
      --
      -- usage_coverage
      -- --------------
      -- One row per target: the windows ([from, to)) of every usage.rollup event received from it, merged, and only the
      -- last 32 days (the copy's KEEP). The usage reader answers a window only when every target's coverage holds its
      -- start, and reports as_of as the end of that covered span: never a missing copy as zero usage now.

      ALTER TABLE control_sync.usage_rollups
        ADD COLUMN produced_upto timestamptz NOT NULL DEFAULT '-infinity';

      CREATE TABLE control_sync.usage_coverage (
        target text PRIMARY KEY,
        covered tstzmultirange NOT NULL,
        updated_at timestamptz NOT NULL DEFAULT now()
      );

      GRANT SELECT, INSERT, UPDATE ON control_sync.usage_coverage TO control_sync_relay;
      -- control-api's login reads the coverage, and which targets there are (their names only).
      GRANT SELECT ON control_sync.usage_coverage TO control_writer;
      GRANT SELECT (target) ON control_sync.targets TO control_writer;

      COMMIT;
    047_control_bus_one_target.sql: |
      BEGIN;

      -- One target until commands are routed (PR 91 review, Khaled items 1 and 23). Every command in the outbox goes to every
      -- target (044: no per-target routing yet), so a second target would apply resource.fund, wallet.credit and
      -- apim.key.provision in both regions: money credited twice, a wallet per region. Adding a target other than the one
      -- already there is refused; adding the same one again still changes nothing and returns false. The portal cluster's
      -- set runs this file; a data-path cluster's set skips it, as 044. Routing by Resource and region, in its own pull
      -- request, replaces this function and lifts the refusal.
      --
      -- The check comes after the counter row's lock (UPDATE ... SET n = n), which every add_target takes first: two
      -- adds of different targets at once run one after the other, and the second sees the first's row.
      CREATE OR REPLACE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text)
      RETURNS boolean
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        added integer;
        other text;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n;
        SELECT target INTO other FROM control_sync.targets WHERE target <> p_target LIMIT 1;
        IF other IS NOT NULL THEN
          RAISE EXCEPTION 'control_sync.add_target: % is already a target; a second (%) is refused until commands are '
            'routed by region (every command goes to every target)', other, p_target
            USING ERRCODE = 'feature_not_supported';
        END IF;
        INSERT INTO control_sync.targets (target, bus_namespace_fqdn, topic, command_subscription, request_subscription)
        VALUES (p_target, p_bus_namespace_fqdn, p_topic, 't-' || p_target, 'r-' || p_target)
        ON CONFLICT (target) DO NOTHING;
        GET DIAGNOSTICS added = ROW_COUNT;
        RETURN added = 1;
      END;
      $$;

      COMMIT;
    048_control_bus_operator_only.sql: |
      BEGIN;

      -- The control bus's credential only in operator-control-api (PR 91 review, Khaled items 5 and 12). The portal cluster's
      -- set runs this file; a data-path cluster's set skips it, as 044. A single-database deployment runs it.
      --
      -- price_lists
      -- -----------
      -- user-control-api, the public pod, holds no bus login and no bus credential: its commands go into the outbox as
      -- control_writer (044's enqueue) and operator-control-api's supervisor sends them. Its one read of billing-mgmt, the
      -- active price list, is this copy: one row per target, written by operator-control-api as control_sync_relay from
      -- its agent's answer (control_api/sync/prices.py), read by control_writer. It decides nothing about money: a grant
      -- asks billing-mgmt for its price again on the data path.
      --
      -- remove_target
      -- -------------
      -- Takes a target away, with its acks, clusters and price_lists rows (ON DELETE CASCADE), as add_target adds one:
      -- under the counter row's lock, so an add and a remove never interleave. control_sync_relay may run it and still may
      -- not delete from the table itself (044); since this file that login is operator-control-api's alone, and the target
      -- admin is a Job like that pod (tools/stack/lib/control-sync.sh), never an exec as postgres.
      CREATE TABLE control_sync.price_lists (
        target text PRIMARY KEY REFERENCES control_sync.targets (target) ON DELETE CASCADE,
        items jsonb NOT NULL,
        read_at timestamptz NOT NULL
      );
      GRANT SELECT, INSERT, UPDATE ON control_sync.price_lists TO control_sync_relay;
      GRANT SELECT ON control_sync.price_lists TO control_writer;

      CREATE FUNCTION control_sync.remove_target(p_target text)
      RETURNS boolean
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        removed integer;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n;
        DELETE FROM control_sync.targets WHERE target = p_target;
        GET DIAGNOSTICS removed = ROW_COUNT;
        RETURN removed = 1;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.remove_target(text) FROM PUBLIC;
      GRANT EXECUTE ON FUNCTION control_sync.remove_target(text) TO control_sync_relay;

      COMMIT;
    049_control_bus_regions.sql: |
      BEGIN;

      -- Two regions on the one control bus (milestone 2): each target numbers its own stream,
      -- a command goes to one target or to every target, and a target names the region it serves. The portal cluster's set
      -- runs this file; a data-path cluster's set skips it, as 044. A single-database deployment runs it.
      --
      -- After 047 and 048: commands are routed by region here, so add_target no longer refuses a second target (047's
      -- refusal, replaced below), and 048's remove_target, which deletes the targets row, takes the target's target_seq
      -- and outbox rows with it (both reference targets ON DELETE CASCADE, as its acks, clusters and price_lists do).
      --
      -- target_seq
      -- ----------
      -- One counter per target: the last seq given to that target's stream. A command for two targets is two outbox rows,
      -- each under its own target's next number, so a target never sees a hole where a command for another one went (the
      -- agent reads a hole as a lost message). A target added later starts from seq_counter's value, and its first send is
      -- a resync, as before; the numbers it is given are its own from there.
      --
      -- seq_counter (041) stays, and every writer still takes its row lock first: it serializes the writers in commit
      -- order exactly as before, and a writer then locks only target_seq rows, so two writers never deadlock on them. Its n
      -- counts the commands written (one per command, however many targets it went to).
      --
      -- outbox.target
      -- -------------
      -- The target the row is for; the key becomes (target, seq). A transaction's rows for one target stay consecutive in
      -- that target's numbers (its txid is kept). Rows written before this file were for every target, numbered in the one
      -- shared stream every target's numbers continue from: they become one row per target, under the same seq.
      --
      -- targets.region
      -- --------------
      -- The region the target serves (one target per region), the lookup from a Resource's region to the target its
      -- commands go to. A target named datapath-<region> is given its region; another name (a plan-01 region carried
      -- over by 044) has none until it is set.

      -- The region of each target.
      ALTER TABLE control_sync.targets
        ADD COLUMN region text CHECK (region ~ '^[a-z0-9]+(-[a-z0-9]+)*$'),
        ADD CONSTRAINT targets_region_key UNIQUE (region);
      UPDATE control_sync.targets SET region = substr(target, 10) WHERE target ~ '^datapath-[a-z0-9]+(-[a-z0-9]+)*$';

      -- One counter per target, from the shared counter's value: every existing target was sent every command so far.
      CREATE TABLE control_sync.target_seq (
        target text PRIMARY KEY REFERENCES control_sync.targets (target) ON DELETE CASCADE,
        n bigint NOT NULL CHECK (n >= 0)
      );
      INSERT INTO control_sync.target_seq (target, n)
        SELECT t.target, c.n FROM control_sync.targets t CROSS JOIN control_sync.seq_counter c;

      -- Each outbox row is for one target.
      ALTER TABLE control_sync.outbox DROP CONSTRAINT outbox_pkey, ADD COLUMN target text;
      INSERT INTO control_sync.outbox (target, seq, txid, command, version, body, correlation_id, wants_answer, created_at)
        SELECT t.target, o.seq, o.txid, o.command, o.version, o.body, o.correlation_id, o.wants_answer, o.created_at
        FROM control_sync.outbox o CROSS JOIN control_sync.targets t WHERE o.target IS NULL;
      DELETE FROM control_sync.outbox WHERE target IS NULL;
      ALTER TABLE control_sync.outbox
        ALTER COLUMN target SET NOT NULL,
        ADD CONSTRAINT outbox_target_fkey FOREIGN KEY (target) REFERENCES control_sync.targets (target) ON DELETE CASCADE,
        ADD PRIMARY KEY (target, seq);

      -- The capture: one row per target, each under that target's next number. Off while no target exists, as before.
      CREATE OR REPLACE FUNCTION control_sync.capture() RETURNS trigger
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        stored jsonb;
        pk jsonb := '{}'::jsonb;
        col text;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n + 1;
        stored := CASE WHEN TG_OP = 'DELETE' THEN to_jsonb(OLD) ELSE to_jsonb(NEW) END;
        FOREACH col IN ARRAY TG_ARGV LOOP
          pk := pk || jsonb_build_object(col, stored -> col);
        END LOOP;
        WITH numbered AS (
          UPDATE control_sync.target_seq SET n = n + 1 RETURNING target, n
        )
        INSERT INTO control_sync.outbox (target, seq, txid, command, version, body)
        SELECT numbered.target, numbered.n, pg_current_xact_id(),
               TG_TABLE_NAME || CASE WHEN TG_OP = 'DELETE' THEN '.delete' ELSE '.upsert' END, 1,
               CASE WHEN TG_OP = 'DELETE' THEN pk ELSE stored END
        FROM numbered;
        RETURN NULL;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.capture() FROM PUBLIC;

      -- Any other command, to one target (p_target) or to every target (p_every). A command for one target that names
      -- none goes to the only target, and is refused while there are several: the caller must say which. Returns one row
      -- (target, seq) per row written: none while no target exists, or when the named one does not.
      CREATE FUNCTION control_sync.enqueue_to(p_command text, p_version integer, p_body jsonb, p_correlation_id text,
                                              p_wants_answer boolean, p_target text, p_every boolean)
      RETURNS TABLE (target text, seq bigint)
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      #variable_conflict use_column
      BEGIN
        IF octet_length(p_body::text) > 200 * 1024 THEN
          RAISE EXCEPTION 'control_sync.enqueue: % body is larger than 200 KB', p_command
            USING ERRCODE = 'program_limit_exceeded';
        END IF;
        IF p_every AND p_target IS NOT NULL THEN
          RAISE EXCEPTION 'control_sync.enqueue_to: % goes to every target, so it names none', p_command
            USING ERRCODE = 'invalid_parameter_value';
        END IF;
        UPDATE control_sync.seq_counter SET n = n + 1;
        IF NOT p_every AND p_target IS NULL AND (SELECT count(*) FROM control_sync.target_seq) > 1 THEN
          RAISE EXCEPTION 'control_sync.enqueue_to: % is for one target and there are several: name it', p_command
            USING ERRCODE = 'invalid_parameter_value';
        END IF;
        RETURN QUERY
          WITH numbered AS (
            UPDATE control_sync.target_seq s SET n = s.n + 1 WHERE p_target IS NULL OR s.target = p_target
            RETURNING s.target, s.n
          )
          INSERT INTO control_sync.outbox AS o (target, seq, txid, command, version, body, correlation_id, wants_answer)
          SELECT numbered.target, numbered.n, pg_current_xact_id(), p_command, p_version, p_body, p_correlation_id,
                 p_wants_answer
          FROM numbered
          RETURNING o.target, o.seq;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.enqueue_to(text, integer, jsonb, text, boolean, text, boolean) FROM PUBLIC;

      -- 044's signature, kept for its callers: a command for the only target (NULL while none exists); refused while there
      -- are several (enqueue_to says which).
      CREATE OR REPLACE FUNCTION control_sync.enqueue(p_command text, p_version integer, p_body jsonb,
                                                      p_correlation_id text DEFAULT NULL, p_wants_answer boolean DEFAULT false)
      RETURNS bigint
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        written bigint;
      BEGIN
        SELECT e.seq INTO written
        FROM control_sync.enqueue_to(p_command, p_version, p_body, p_correlation_id, p_wants_answer, NULL, false) e;
        RETURN written;
      END;
      $$;

      -- Adding a target, with its region: its counter starts at the shared counter's value, in the transaction that holds
      -- that counter's row (as 044's add_target), and its first send is a resync. Adding it again changes nothing.
      CREATE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text, p_region text)
      RETURNS boolean
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        added integer;
      BEGIN
        UPDATE control_sync.seq_counter SET n = n;
        INSERT INTO control_sync.targets (target, bus_namespace_fqdn, topic, command_subscription, request_subscription,
                                          region)
        VALUES (p_target, p_bus_namespace_fqdn, p_topic, 't-' || p_target, 'r-' || p_target, p_region)
        ON CONFLICT (target) DO NOTHING;
        GET DIAGNOSTICS added = ROW_COUNT;
        IF added = 1 THEN
          INSERT INTO control_sync.target_seq (target, n) SELECT p_target, n FROM control_sync.seq_counter;
        END IF;
        RETURN added = 1;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.add_target(text, text, text, text) FROM PUBLIC;

      -- 044's signature, which 047 made refuse a second target: the region from a datapath-<region> name, none for
      -- another, and no refusal.
      CREATE OR REPLACE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text)
      RETURNS boolean
      LANGUAGE sql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
        SELECT control_sync.add_target(p_target, p_bus_namespace_fqdn, p_topic,
                                       CASE WHEN p_target ~ '^datapath-[a-z0-9]+(-[a-z0-9]+)*$' THEN substr(p_target, 10) END);
      $$;

      -- The target that serves a region, or NULL: what control-api's login may know of the registry beyond the names.
      CREATE FUNCTION control_sync.region_target(p_region text) RETURNS text
      LANGUAGE sql STABLE SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
        SELECT target FROM control_sync.targets WHERE region = p_region;
      $$;
      REVOKE ALL ON FUNCTION control_sync.region_target(text) FROM PUBLIC;

      GRANT SELECT ON control_sync.target_seq TO control_sync_relay;
      GRANT EXECUTE ON FUNCTION control_sync.add_target(text, text, text, text) TO control_sync_relay;
      GRANT EXECUTE ON FUNCTION control_sync.region_target(text) TO control_sync_relay, control_writer;
      GRANT EXECUTE ON FUNCTION control_sync.enqueue_to(text, integer, jsonb, text, boolean, text, boolean)
        TO control_writer;

      COMMIT;
    050_credited_nano.sql: |
      BEGIN;
      -- Portal cluster: without public.wallet_accounts (no billing table here); only the balance alert's rename and guard.
      -- A copy of services/spend-control/migrations/050_credited_nano.sql with only this cluster's statements; nothing added.

      -- wallet_accounts.balance_nano was never what is left: it is the total ever credited, the sum
      -- of the wallet's wallet_credits rows (010, 012), and only grows. What is left is
      -- credited_nano - settled_nano, minus what Redis holds. The name said "what is left", so the
      -- column is renamed to what it holds. No customers yet, so no compatibility period: this
      -- migration and the images that read the new name are deployed together.
      --
      -- A rename keeps the column's data, its CHECK, and every column grant (012, 013, 019, 021, 038
      -- grant or revoke by column; PostgreSQL ties a grant to the column, not its name). The CHECK
      -- constraints keep the names 010 and 037 gave them; they are renamed too, so no name says
      -- balance. A plpgsql body is text and does not follow a rename: 037's guard names the alert's
      -- column, so it is replaced below with the new name and otherwise unchanged.

      -- A balance alert records the wallet's credited total it was decided on (037).
      ALTER TABLE control.balance_alerts RENAME COLUMN balance_nano TO credited_nano;
      ALTER TABLE control.balance_alerts
        RENAME CONSTRAINT balance_alerts_balance_nano_check TO balance_alerts_credited_nano_check;

      CREATE OR REPLACE FUNCTION control.guard_balance_alert() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.alert_id, NEW.resource_id, NEW.percent, NEW.currency, NEW.credited_nano, NEW.settled_nano,
               NEW.created_at)
           IS DISTINCT FROM
           ROW(OLD.alert_id, OLD.resource_id, OLD.percent, OLD.currency, OLD.credited_nano, OLD.settled_nano,
               OLD.created_at)
           OR NEW.attempts < OLD.attempts
           OR (OLD.state <> 'pending' AND NEW.state IS DISTINCT FROM OLD.state)
           OR (OLD.state = 'pending' AND NEW.state = 'superseded')
           OR (OLD.sent_at IS NOT NULL AND NEW.sent_at IS DISTINCT FROM OLD.sent_at)
           OR (OLD.abandoned_at IS NOT NULL AND NEW.abandoned_at IS DISTINCT FROM OLD.abandoned_at)
           OR (OLD.rearmed_at IS NOT NULL AND NEW.rearmed_at IS DISTINCT FROM OLD.rearmed_at) THEN
          RAISE EXCEPTION 'a balance alert is decided once; it can only be sent, abandoned or re-armed'
            USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;

      COMMIT;
    050_resource_key_endings.sql: |
      BEGIN;

      -- A Resource's two key endings (BL-4), stored when the portal writes a key: both at purchase, one after a regenerate
      -- that APIM applied, none on a timeout. Each is the key masked but for its last 4 characters, never the key; NULL
      -- until the portal has written one (a Resource bought before this file, or a v1 purchase's secondary). The portal's
      -- GET /resources/{id}/key-endings reads them here, never from APIM; a key changed outside the portal leaves them
      -- stale.
      --
      -- Both cluster sets run this file: control.resources is one of the 8 tables copied to each data-path database (042),
      -- and the applier refuses a row whose columns differ from its copy's (schema_mismatch), so the copy needs the same
      -- columns. The masked endings ride that copy. The table grants (014, 041, 042) cover the new columns.

      ALTER TABLE control.resources
        ADD COLUMN primary_key_masked text,
        ADD COLUMN secondary_key_masked text;

      COMMIT;
    053_switch_controls.sql: |
      BEGIN;
      -- Portal cluster: without public.switch_outcomes (the switch's tables are on the data-path cluster); only control.purchases_paused.
      -- A copy of services/spend-control/migrations/053_switch_controls.sql with only this cluster's statements; nothing added.

      -- Switching clusters by copying the wallets (prototype): the switch's two controls.
      --
      -- switch_outcomes, on B: abort and opening B each insert the switch's one outcome; the first
      -- insert wins, so only one of them can happen. A retry whose answer was lost reads the same row.
      -- control.purchases_paused, on A: while paused, control-api starts no new purchase or top-up;
      -- those already started finish. One row.


      CREATE TABLE control.purchases_paused (
        one        boolean     PRIMARY KEY DEFAULT true CHECK (one),
        paused     boolean     NOT NULL,
        switch_id  text        CHECK (switch_id IS NULL OR btrim(switch_id) <> ''),
        updated_at timestamptz NOT NULL DEFAULT now(),
        CHECK (paused = (switch_id IS NOT NULL))
      );
      INSERT INTO control.purchases_paused (paused) VALUES (false);
      GRANT SELECT, UPDATE (paused, switch_id, updated_at) ON control.purchases_paused TO control_writer;

      COMMIT;
    057_control_bus_credited_nano.sql: |
      BEGIN;

      -- The control bus's copy of each wallet names its credited total as the wallet does (migration 050):
      -- credited_nano, everything ever credited, not a balance.

      ALTER TABLE control_sync.wallet_balances RENAME COLUMN balance_nano TO credited_nano;

      COMMIT;
    060_switch_portal.sql: |
      BEGIN;

      -- Switching clusters on split clusters: the portal's side (the portal cluster's set runs this file; a data-path
      -- cluster's set skips it). The portal's operator-control-api drives the switch over the control bus, so what it keeps
      -- of one is here:
      --
      -- control.switches
      -- ----------------
      -- One row per switch, from the operator's prepare to its end:
      --   prepared  price writes are frozen (operator-control-api refuses them); B's target may now be added, with no region
      --   started   the portal's purchases were paused and every purchase command already sent to A was answered, then
      --             switch.start was sent to B's target and applied
      --   moved     B said open and the region moved from A's target to B's (control_sync.move_region): purchases resume,
      --             now sent to B
      --   aborted   B's switch was aborted before it opened: purchases resume, still sent to A
      -- At most one switch is prepared or started at a time. A row is never deleted; its state only moves forward.
      -- Written as control_sync_relay, the login only operator-control-api holds (048): user-control-api, which holds
      -- control_writer, reads it and cannot start, move or end a switch.
      --
      -- control_sync.move_region
      -- ------------------------
      -- The region moves from A's target to B's in one transaction, and only from a started switch: A's target must hold
      -- the region and B's must hold none (targets.region is unique, 049). The caller asks B first and calls this only when
      -- B says open.
      CREATE TABLE control.switches (
        switch_id text PRIMARY KEY CHECK (switch_id ~ '^[A-Za-z0-9._-]{1,128}$'),
        region text NOT NULL CHECK (region ~ '^[a-z0-9]+(-[a-z0-9]+)*$'),
        source_target text NOT NULL,
        target text NOT NULL,
        source_cluster text NOT NULL CHECK (source_cluster ~ '^[A-Za-z0-9._-]{1,128}$'),
        state text NOT NULL DEFAULT 'prepared' CHECK (state IN ('prepared', 'started', 'moved', 'aborted')),
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now(),
        CHECK (target <> source_target)
      );
      CREATE UNIQUE INDEX switches_one_running ON control.switches ((true)) WHERE state IN ('prepared', 'started');

      -- A state only moves forward: prepared -> started | aborted, started -> moved | aborted; nothing else changes. Only
      -- control_sync.move_region sets moved (it runs as its owner, so a caller's own UPDATE to moved is refused): a switch
      -- is never marked moved without its region moving in the same transaction.
      CREATE FUNCTION control.guard_switches() RETURNS trigger
      LANGUAGE plpgsql SET search_path = pg_catalog, pg_temp AS $$
      BEGIN
        IF TG_OP = 'DELETE' THEN
          RAISE EXCEPTION 'control.switches: a switch is never deleted' USING ERRCODE = 'check_violation';
        END IF;
        IF (NEW.switch_id, NEW.region, NEW.source_target, NEW.target, NEW.source_cluster, NEW.created_at)
           IS DISTINCT FROM (OLD.switch_id, OLD.region, OLD.source_target, OLD.target, OLD.source_cluster, OLD.created_at) THEN
          RAISE EXCEPTION 'control.switches: only a switch''s state changes' USING ERRCODE = 'check_violation';
        END IF;
        IF NEW.state IS DISTINCT FROM OLD.state AND NOT (
             (OLD.state = 'prepared' AND NEW.state IN ('started', 'aborted'))
          OR (OLD.state = 'started' AND NEW.state IN ('moved', 'aborted'))) THEN
          RAISE EXCEPTION 'control.switches: % cannot become %', OLD.state, NEW.state USING ERRCODE = 'check_violation';
        END IF;
        IF NEW.state = 'moved' AND OLD.state <> 'moved' AND current_user IN ('control_sync_relay', 'control_writer') THEN
          RAISE EXCEPTION 'control.switches: only control_sync.move_region moves a switch' USING ERRCODE = 'check_violation';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER switches_forward_only BEFORE UPDATE OR DELETE ON control.switches
        FOR EACH ROW EXECUTE FUNCTION control.guard_switches();

      GRANT SELECT, INSERT, UPDATE (state, updated_at) ON control.switches TO control_sync_relay;
      GRANT SELECT ON control.switches TO control_writer;

      CREATE FUNCTION control_sync.move_region(p_switch_id text) RETURNS void
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
      DECLARE
        s control.switches%ROWTYPE;
      BEGIN
        SELECT * INTO s FROM control.switches WHERE switch_id = p_switch_id FOR UPDATE;
        IF NOT FOUND THEN
          RAISE EXCEPTION 'switch_unknown: no switch %', p_switch_id USING ERRCODE = 'no_data_found';
        END IF;
        IF s.state <> 'started' THEN
          RAISE EXCEPTION 'switch_not_started: switch % is %', p_switch_id, s.state USING ERRCODE = 'check_violation';
        END IF;
        UPDATE control_sync.targets SET region = NULL WHERE target = s.source_target AND region = s.region;
        IF NOT FOUND THEN
          RAISE EXCEPTION 'region_not_on_source: % does not hold region %', s.source_target, s.region
            USING ERRCODE = 'check_violation';
        END IF;
        UPDATE control_sync.targets SET region = s.region WHERE target = s.target AND region IS NULL;
        IF NOT FOUND THEN
          RAISE EXCEPTION 'target_not_ready: % is not a target without a region', s.target USING ERRCODE = 'check_violation';
        END IF;
        UPDATE control.switches SET state = 'moved', updated_at = now() WHERE switch_id = p_switch_id;
      END;
      $$;
      REVOKE ALL ON FUNCTION control_sync.move_region(text) FROM PUBLIC;
      GRANT EXECUTE ON FUNCTION control_sync.move_region(text) TO control_sync_relay;

      COMMIT;
    064_wallet_copy_from_region_holder.sql: |
      BEGIN;

      -- The portal's wallet copy (control_sync.wallet_balances) takes a reading only from the target that holds the
      -- Resource's region (PR 114 review, Kashif's item 4). The copy kept the newest reading from any target, so after a
      -- switch moved the region from A's target to B's, a late reading of A could replace B's row and hide B's spend.
      -- The portal cluster's set runs this file; a data-path cluster's set skips it.
      --
      -- control_sync.holds_wallet(target, resource_id): true when `target` serves the region of the Resource, or when that
      -- cannot be told: no such Resource, or no target serves its region by name (a Resource from before regions). The
      -- writer, control_sync_relay, reads no control table, so the function reads them as its owner.
      CREATE FUNCTION control_sync.holds_wallet(p_target text, p_resource_id text) RETURNS boolean
      LANGUAGE sql STABLE SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$
        SELECT coalesce((SELECT t.target = p_target FROM control.resources r
                         JOIN control_sync.targets t ON t.region = r.region
                         WHERE r.resource_id::text = p_resource_id), true);
      $$;
      REVOKE ALL ON FUNCTION control_sync.holds_wallet(text, text) FROM PUBLIC;
      GRANT EXECUTE ON FUNCTION control_sync.holds_wallet(text, text) TO control_sync_relay;

      COMMIT;
    066_resource_key_hashes.sql: |
      BEGIN;

      -- A Resource's two key hashes: each slot's key as the SHA-256 of its UTF-8 bytes, lowercase hex, after a trim
      -- (control_api/key_region_map.py entry_name) -- the name of the key's entry in the key -> region map the buyer
      -- entry's Worker reads. Stored when the portal writes a key, as the endings are (050): both at purchase, one after a
      -- regenerate that APIM applied. A regenerate deletes the old key's entry by the hash stored here. Never the key.
      -- NULL for a key written before this file, or a v1 purchase's secondary; nothing fills them in later (the holder of
      -- such a key buys a new one).
      --
      -- Both cluster sets run this file, as 050: control.resources is copied to each data-path database (042) and the
      -- applier refuses a row whose columns differ from its copy's (schema_mismatch). The table grants (014, 041, 042)
      -- cover the new columns.

      ALTER TABLE control.resources
        ADD COLUMN primary_key_hash text CHECK (primary_key_hash ~ '^[0-9a-f]{64}$'),
        ADD COLUMN secondary_key_hash text CHECK (secondary_key_hash ~ '^[0-9a-f]{64}$');

      COMMIT;
    067_password_resets.sql: |
      BEGIN;

      -- A forgotten password, reset by a link emailed to the account's verified address (control_api/password_reset.py).
      --
      -- One row per link sent. The link carries 256 random bits; only their SHA-256 is kept, as a session's is (015), so
      -- the table cannot be turned back into a link. A link works once, until it expires (10 minutes by default), and only
      -- while it is the account's newest: a newer link, a reset with it, a signed-in password change or an operator's reset
      -- closes it. The rows are also the send history the cooldown and the hourly cap count; a row whose email never left
      -- (send_failed_at) is not counted.
      --
      -- Personal data, beside the contacts (036): read by control-api only. billing_app is granted nothing; nothing here
      -- reaches billing-mgmt, OpenMeter or APIM, and the cluster switch copies none of it (061).

      CREATE TABLE control.password_resets (
        reset_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),
        -- The address this link was sent to.
        email_normalized text NOT NULL CHECK (email_normalized = lower(btrim(email_normalized))),
        token_sha256 bytea NOT NULL UNIQUE CHECK (octet_length(token_sha256) = 32),
        created_at timestamptz NOT NULL DEFAULT now(),
        expires_at timestamptz NOT NULL,
        -- Set when the password is reset with it.
        used_at timestamptz,
        -- Set when something else ends it: a newer link, a password change, an operator's reset, another link's reset.
        closed_at timestamptz,
        send_failed_at timestamptz,
        CHECK (expires_at > created_at),
        CHECK (used_at IS NULL OR closed_at IS NULL)
      );

      CREATE INDEX password_resets_user ON control.password_resets(user_id, created_at DESC);

      -- A link's hash, address and times never change; it is used, closed or marked unsent once.
      CREATE FUNCTION control.guard_password_reset() RETURNS trigger LANGUAGE plpgsql AS $$
      BEGIN
        IF ROW(NEW.reset_id, NEW.user_id, NEW.email_normalized, NEW.token_sha256, NEW.created_at, NEW.expires_at)
           IS DISTINCT FROM
           ROW(OLD.reset_id, OLD.user_id, OLD.email_normalized, OLD.token_sha256, OLD.created_at, OLD.expires_at)
           OR (OLD.used_at IS NOT NULL AND NEW.used_at IS DISTINCT FROM OLD.used_at)
           OR (OLD.closed_at IS NOT NULL AND NEW.closed_at IS DISTINCT FROM OLD.closed_at)
           OR (OLD.send_failed_at IS NOT NULL AND NEW.send_failed_at IS DISTINCT FROM OLD.send_failed_at) THEN
          RAISE EXCEPTION 'a password reset link can only be used, closed or marked unsent once'
            USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;
      CREATE TRIGGER password_reset_guard BEFORE UPDATE ON control.password_resets
      FOR EACH ROW EXECUTE FUNCTION control.guard_password_reset();

      -- control-api reads and writes them; nothing deletes them.
      GRANT SELECT, INSERT, UPDATE ON control.password_resets TO control_writer;

      COMMIT;
    068_purchase_limits.sql: |
      BEGIN;

      -- The private preview's purchase limits: one row, read on each purchase and top-up, set by the operator
      -- (PUT /internal/v1/purchase-limits); SQL only in development and debugging (deploy/RUNBOOK-purchase-limits.md).
      --   max_resources_per_plan_region: N, the Resources a user may hold of one plan in one region; -1 is no limit.
      --   max_funding_nano:              M, the money a user may pay in within the window, in nano (1 USD = 10^9);
      --                                  0 stops all funding. Whole cents only, and at most 2^53 - 1 like every
      --                                  amount the API takes (models.PurchaseLimits): a larger row could not be shown.
      --   funding_window_days:           D, that window, in whole days; -1 is no limit on funding at all. At most
      --                                  3650, so `now() - D days` cannot overflow.
      -- Code reads a missing row as this seed (control_api.purchase_limits.DEFAULTS). Portal only: no data path
      -- reads it.

      CREATE TABLE control.purchase_limits (
        one                           boolean     PRIMARY KEY DEFAULT true CHECK (one),
        max_resources_per_plan_region integer     NOT NULL CHECK (max_resources_per_plan_region = -1
                                                                  OR max_resources_per_plan_region >= 1),
        max_funding_nano              bigint      NOT NULL CHECK (max_funding_nano >= 0)
                                                           CHECK (max_funding_nano <= 9007199254740991)
                                                           CHECK (max_funding_nano % 10000000 = 0),
        funding_window_days           integer     NOT NULL CHECK (funding_window_days = -1
                                                                  OR funding_window_days BETWEEN 1 AND 3650),
        updated_at                    timestamptz NOT NULL DEFAULT now()
      );
      INSERT INTO control.purchase_limits (max_resources_per_plan_region, max_funding_nano, funding_window_days)
        VALUES (1, 50000000000, 1);
      -- INSERT too: a PUT writes the row back when it was deleted.
      GRANT SELECT, INSERT, UPDATE ON control.purchase_limits TO control_writer;

      COMMIT;
    069_plan_version_models_add_only.sql: |
      BEGIN;

      -- Goal GA pricing, Ask 1 (owner's decision, 2026-11-18, Option A): a plan version may gain
      -- models while it is a draft or active, so a new model reaches plans already bought. It never
      -- loses one: plan_version_models_immutable still refuses every update and delete. A retired
      -- version gains none. FOR SHARE makes a concurrent status change wait for this insert, or this
      -- insert see it. Replaces 061's draft-only function (014's trigger name stays); the data-path
      -- cluster runs this file as it is, so the control bus can copy an added model there too.
      CREATE OR REPLACE FUNCTION control.guard_plan_version_models() RETURNS trigger LANGUAGE plpgsql AS $$
      DECLARE
        version_status text;
      BEGIN
        SELECT status INTO version_status FROM control.plan_versions
          WHERE plan_version_id = NEW.plan_version_id FOR SHARE;
        IF version_status IS NULL OR version_status NOT IN ('draft', 'active') THEN
          RAISE EXCEPTION 'models can be added only to a draft or active plan version' USING ERRCODE = '23514';
        END IF;
        RETURN NEW;
      END;
      $$;

      COMMIT;
    070_user_contacts_billing_address_optional.sql: |
      BEGIN;

      -- Sign-up may leave the billing address out (CONTROL_SIGNUP_BILLING_ADDRESS, off by default): the contact row then
      -- holds the email alone. The address is whole or absent: its mandatory parts are all set or all null, and the
      -- optional lines (line 2, state) only beside them. Each column keeps its own CHECK from 036, which passes a null.
      -- A card payment from an email-only row makes the Stripe Customer from the email alone (control_api/payments.py).

      ALTER TABLE control.user_contacts
        ALTER COLUMN billing_name DROP NOT NULL,
        ALTER COLUMN billing_line1 DROP NOT NULL,
        ALTER COLUMN billing_city DROP NOT NULL,
        ALTER COLUMN billing_postal_code DROP NOT NULL,
        ALTER COLUMN billing_country DROP NOT NULL,
        ADD CONSTRAINT user_contacts_billing_address_whole CHECK (
          (billing_name IS NOT NULL AND billing_line1 IS NOT NULL AND billing_city IS NOT NULL
           AND billing_postal_code IS NOT NULL AND billing_country IS NOT NULL)
          OR (billing_name IS NULL AND billing_line1 IS NULL AND billing_line2 IS NULL AND billing_city IS NULL
              AND billing_state IS NULL AND billing_postal_code IS NULL AND billing_country IS NULL));

      COMMIT;
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"001_initial_schema.sql":"BEGIN;\n-- Portal cluster: the extensions and the two shared trigger functions; no billing table.\n-- A copy of services/spend-control/migrations/001_initial_schema.sql with only this cluster's statements; nothing added.\n\nCREATE EXTENSION IF NOT EXISTS pgcrypto;\nCREATE EXTENSION IF NOT EXISTS btree_gist;\n\nCREATE FUNCTION set_updated_at()\nRETURNS trigger\nLANGUAGE plpgsql\nAS $$\nBEGIN\n  NEW.updated_at = now();\n  RETURN NEW;\nEND;\n$$;\n\nCREATE FUNCTION reject_immutable_change()\nRETURNS trigger\nLANGUAGE plpgsql\nAS $$\nBEGIN\n  RAISE EXCEPTION '% rows are immutable', TG_TABLE_NAME\n    USING ERRCODE = '55000';\nEND;\n$$;\nCOMMIT;\n","007_control_plane.sql":"BEGIN;\n-- Portal cluster: without the grant on public.price_versions, customer_model_entitlements, spend_limit_policies (038 revokes it).\n-- A copy of services/spend-control/migrations/007_control_plane.sql with only this cluster's statements; nothing added.\n\nCREATE SCHEMA control;\nREVOKE ALL ON SCHEMA control FROM PUBLIC;\n\nCREATE DOMAIN control.identifier AS text\n  CHECK (VALUE ~ '^[a-z0-9]+(-[a-z0-9]+)*$' AND length(VALUE) \u003c= 64);\n\nCREATE TABLE control.tenants (\n  customer_id control.identifier PRIMARY KEY,\n  display_name text NOT NULL CHECK (btrim(display_name) \u003c\u003e ''),\n  status text NOT NULL CHECK (status IN ('provisioning','active','suspending','suspended','resuming')),\n  first_admin_issuer text,\n  first_admin_subject text,\n  first_admin_bound_at timestamptz,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CHECK (num_nonnulls(first_admin_issuer, first_admin_subject, first_admin_bound_at) IN (0,3)),\n  CHECK (first_admin_issuer IS NULL OR btrim(first_admin_issuer) \u003c\u003e ''),\n  CHECK (first_admin_subject IS NULL OR btrim(first_admin_subject) \u003c\u003e '')\n);\n\nCREATE TABLE control.projects (\n  project_id control.identifier PRIMARY KEY,\n  customer_id control.identifier NOT NULL REFERENCES control.tenants(customer_id),\n  display_name text NOT NULL CHECK (btrim(display_name) \u003c\u003e ''),\n  status text NOT NULL CHECK (status IN ('active','disabling','disabled')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  UNIQUE (customer_id, project_id)\n);\n\nCREATE TABLE control.api_keys (\n  api_key_id control.identifier NOT NULL,\n  customer_id control.identifier NOT NULL,\n  project_id control.identifier NOT NULL,\n  display_name text NOT NULL CHECK (btrim(display_name) \u003c\u003e ''),\n  apim_subscription_id text NOT NULL UNIQUE,\n  status text NOT NULL CHECK (status IN ('provisioning','active','revoking','revoked')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  PRIMARY KEY (project_id, api_key_id),\n  FOREIGN KEY (customer_id, project_id) REFERENCES control.projects(customer_id, project_id),\n  CHECK (apim_subscription_id = customer_id || '--' || project_id || '--' || api_key_id)\n);\n\n-- The catalogue is control-plane data. The existing public reference tables keep\n-- historical free-text model identifiers; the API checks registered SKUs on writes.\nCREATE TABLE control.models (\n  sku text PRIMARY KEY CHECK (sku ~ '^[a-z0-9][a-z0-9._-]*$' AND length(sku) \u003c= 256),\n  display_name text NOT NULL CHECK (btrim(display_name) \u003c\u003e ''),\n  api_type text NOT NULL CHECK (api_type = 'chat'),\n  price_unit text NOT NULL CHECK (price_unit = 'token'),\n  max_output_default bigint NOT NULL CHECK (max_output_default \u003e 0),\n  max_output_ceiling bigint NOT NULL CHECK (max_output_ceiling \u003e= max_output_default),\n  max_input_tokens bigint NOT NULL CHECK (max_input_tokens \u003e 0),\n  model_version text NOT NULL CHECK (btrim(model_version) \u003c\u003e ''),\n  route_style text NOT NULL CHECK (route_style IN ('path_deployment','body_model')),\n  provider text NOT NULL CHECK (provider IN ('azure_openai','self_hosted','simulator','openai','anthropic')),\n  route_ref text NOT NULL CHECK (btrim(route_ref) \u003c\u003e ''),\n  backend_ref text NOT NULL CHECK (backend_ref ~ '^[A-Za-z0-9][A-Za-z0-9._-]*$'),\n  status text NOT NULL CHECK (status IN ('active','deprecated','retired')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE control.traffic_limit_policies (\n  traffic_policy_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  customer_id control.identifier NOT NULL REFERENCES control.tenants(customer_id),\n  requests_per_minute bigint NOT NULL CHECK (requests_per_minute \u003e 0),\n  tokens_per_minute bigint NOT NULL CHECK (tokens_per_minute \u003e 0),\n  model_sku text REFERENCES control.models(sku),\n  apim_product_id text NOT NULL CHECK (btrim(apim_product_id) \u003c\u003e ''),\n  effective_from timestamptz NOT NULL,\n  effective_to timestamptz,\n  status text NOT NULL CHECK (status IN ('active','retired')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CHECK (effective_to IS NULL OR effective_to \u003e effective_from),\n  EXCLUDE USING gist (\n    customer_id WITH =,\n    (coalesce(model_sku, '')) WITH =,\n    tstzrange(effective_from, coalesce(effective_to, 'infinity'::timestamptz), '[)') WITH \u0026\u0026\n  ) WHERE (status = 'active'),\n  -- Even non-overlapping model policies cannot give a tenant two active products.\n  EXCLUDE USING gist (customer_id WITH =, apim_product_id WITH \u003c\u003e) WHERE (status = 'active')\n);\n\nCREATE TABLE control.config_operations (\n  operation_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  operation_type text NOT NULL CHECK (btrim(operation_type) \u003c\u003e ''),\n  idempotency_key text NOT NULL CHECK (btrim(idempotency_key) \u003c\u003e ''),\n  request_hash bytea NOT NULL CHECK (octet_length(request_hash) = 32),\n  state text NOT NULL DEFAULT 'in_progress' CHECK (state IN ('in_progress','completed')),\n  actor text NOT NULL CHECK (btrim(actor) \u003c\u003e ''),\n  request_id text NOT NULL,\n  request_body jsonb NOT NULL,\n  scope jsonb NOT NULL,\n  progress jsonb NOT NULL DEFAULT '{}',\n  response_status integer,\n  response_body jsonb,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  completed_at timestamptz,\n  UNIQUE (operation_type, idempotency_key),\n  CHECK ((state = 'in_progress' AND response_status IS NULL AND response_body IS NULL AND completed_at IS NULL)\n    OR (state = 'completed' AND response_status BETWEEN 200 AND 599 AND response_body IS NOT NULL AND completed_at IS NOT NULL))\n);\n\nCREATE TABLE control.control_audit (\n  audit_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  operation_id uuid NOT NULL REFERENCES control.config_operations(operation_id),\n  surface text NOT NULL CHECK (surface IN ('operator','config')),\n  actor text NOT NULL CHECK (btrim(actor) \u003c\u003e ''),\n  action text NOT NULL,\n  target_type text NOT NULL,\n  target_id text NOT NULL,\n  before jsonb,\n  after jsonb NOT NULL,\n  request_id text NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TRIGGER control_audit_immutable\nBEFORE UPDATE OR DELETE ON control.control_audit\nFOR EACH ROW EXECUTE FUNCTION public.reject_immutable_change();\n\nCREATE FUNCTION control.guard_first_admin() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF OLD.first_admin_bound_at IS NOT NULL AND\n     ROW(OLD.first_admin_issuer, OLD.first_admin_subject, OLD.first_admin_bound_at)\n       IS DISTINCT FROM ROW(NEW.first_admin_issuer, NEW.first_admin_subject, NEW.first_admin_bound_at) THEN\n    RAISE EXCEPTION 'first admin binding is permanent' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER first_admin_permanent BEFORE UPDATE ON control.tenants\nFOR EACH ROW EXECUTE FUNCTION control.guard_first_admin();\n\nCREATE TRIGGER tenants_updated BEFORE UPDATE ON control.tenants\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\nCREATE TRIGGER projects_updated BEFORE UPDATE ON control.projects\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\nCREATE TRIGGER api_keys_updated BEFORE UPDATE ON control.api_keys\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\nCREATE TRIGGER models_updated BEFORE UPDATE ON control.models\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\nCREATE TRIGGER traffic_updated BEFORE UPDATE ON control.traffic_limit_policies\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\n\nCREATE INDEX projects_tenant_created ON control.projects(customer_id, created_at DESC, project_id);\nCREATE INDEX keys_project_created ON control.api_keys(project_id, created_at DESC, api_key_id);\nCREATE INDEX operations_in_progress ON control.config_operations(created_at) WHERE state = 'in_progress';\nCREATE INDEX audit_target_created ON control.control_audit(target_type, target_id, created_at DESC);\n\nDO $$ BEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'control_writer') THEN\n    CREATE ROLE control_writer NOLOGIN;\n  END IF;\nEND $$;\nGRANT USAGE ON SCHEMA control, public TO control_writer;\nGRANT SELECT, INSERT, UPDATE ON control.tenants, control.projects, control.api_keys,\n  control.models, control.traffic_limit_policies, control.config_operations TO control_writer;\nGRANT SELECT, INSERT ON control.control_audit TO control_writer;\n\nCOMMIT;\n","008_canonical_key_identity.sql":"BEGIN;\n\n-- Preserve the original name and APIM identity of every existing key. Migration\n-- 007 remains unchanged; its hierarchy CHECK follows the column rename.\nALTER TABLE control.api_keys RENAME COLUMN api_key_id TO key_name;\nALTER TABLE control.api_keys ADD COLUMN api_key_id text;\nALTER TABLE control.api_keys DISABLE TRIGGER api_keys_updated;\nUPDATE control.api_keys SET api_key_id = apim_subscription_id;\nALTER TABLE control.api_keys ENABLE TRIGGER api_keys_updated;\nALTER TABLE control.api_keys ALTER COLUMN api_key_id SET NOT NULL;\nALTER TABLE control.api_keys\n  ADD CONSTRAINT api_keys_canonical_identity CHECK (api_key_id = apim_subscription_id);\nALTER TABLE control.api_keys DROP CONSTRAINT api_keys_pkey;\nALTER TABLE control.api_keys ADD PRIMARY KEY (api_key_id);\nALTER TABLE control.api_keys ADD CONSTRAINT api_keys_project_name_key UNIQUE (project_id, key_name);\n\nDROP INDEX control.keys_project_created;\nCREATE INDEX keys_project_created ON control.api_keys(project_id, created_at DESC, api_key_id);\n\n-- Display names and lifecycle status may change; the identity used in financial\n-- records must survive secret rotation, suspension and revocation unchanged.\nCREATE FUNCTION control.guard_key_identity() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(OLD.customer_id, OLD.project_id, OLD.key_name, OLD.api_key_id, OLD.apim_subscription_id)\n     IS DISTINCT FROM\n     ROW(NEW.customer_id, NEW.project_id, NEW.key_name, NEW.api_key_id, NEW.apim_subscription_id) THEN\n    RAISE EXCEPTION 'key identity is immutable' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER key_identity_immutable BEFORE UPDATE ON control.api_keys\nFOR EACH ROW EXECUTE FUNCTION control.guard_key_identity();\n\n-- Historical audit and idempotency payloads retain their original vocabulary.\n-- No financial records or APIM resources are rewritten by this migration.\nCOMMIT;\n","011_plans.sql":"BEGIN;\n\n-- Plans: what a customer actually buys (demo 1, story steps 2-5).\n--\n-- Why this table exists\n-- --------------------\n-- The demo has one customer buying SuperFast (RPM 10) and Economy (RPM 2) and\n-- running both at once. That was not merely unbuilt -- it was forbidden. Traffic\n-- limits hung off the *customer* (control.traffic_limit_policies.customer_id),\n-- and migration 007 carries a deliberate rule:\n--\n--   EXCLUDE USING gist (customer_id WITH =, apim_product_id WITH \u003c\u003e)\n--   -- Even non-overlapping model policies cannot give a tenant two active products.\n--\n-- One customer could therefore only ever have one speed. Moving the limit onto\n-- the plan is what lets a customer hold two plans at two speeds, and it is what\n-- an APIM product models in the first place: a tier you subscribe to.\n--\n-- Consequences recorded as L53-L55 in the discovery worktree's\n-- limitations-and-choices.md, which supersede L39 (one product per tenant) and\n-- dissolve L40 (the 2,000-tenant ceiling, since products are now O(plans)).\n--\n-- What this migration does NOT do\n-- -------------------------------\n-- control.traffic_limit_policies is left in place and untouched. Twenty-three\n-- files reference it, and dropping it here would put an unrelated refactor in\n-- the same change as the demo path. It stops being *applied* instead: a key's\n-- subscription is scoped to its plan's product, so no per-tenant product is\n-- created and no second ceiling can take effect. That satisfies L54 in\n-- behaviour now; removing the table is separate work, and until it happens the\n-- table is inert rather than authoritative.\nCREATE TABLE control.plans (\n  plan_id control.identifier PRIMARY KEY,\n  display_name text NOT NULL CHECK (btrim(display_name) \u003c\u003e ''),\n  requests_per_minute bigint NOT NULL CHECK (requests_per_minute \u003e 0),\n  tokens_per_minute bigint NOT NULL CHECK (tokens_per_minute \u003e 0),\n  -- Money is integer nano-units, as everywhere else. $100 is 100000000000.\n  -- Bounded by 2^53-1 because Redis decides on the hot path in Lua, whose\n  -- numbers are doubles; a larger value would lose precision silently.\n  minimum_purchase_nano bigint NOT NULL\n    CHECK (minimum_purchase_nano \u003e 0 AND minimum_purchase_nano \u003c= 9007199254740991),\n  currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),\n  -- One plan is one APIM product. UNIQUE because two plans sharing a product\n  -- would share its rate-limit policy, which is the bug this table exists to fix.\n  apim_product_id text NOT NULL UNIQUE CHECK (btrim(apim_product_id) \u003c\u003e ''),\n  status text NOT NULL CHECK (status IN ('active','retired')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\n-- Which models a plan grants. The story lists the same three for every plan, but\n-- that is a property of the demo catalogue, not a rule, so it is a table rather\n-- than an assumption baked into the plan row.\nCREATE TABLE control.plan_models (\n  plan_id control.identifier NOT NULL REFERENCES control.plans(plan_id),\n  sku text NOT NULL REFERENCES control.models(sku),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  PRIMARY KEY (plan_id, sku)\n);\n\n-- A key belongs to the plan it was bought under, and inherits that plan's speed.\n--\n-- Nullable, because every key issued before this migration was created under the\n-- per-tenant model and has no plan. Those keys keep working exactly as they did.\n-- It is NOT backfilled with a default plan: inventing a purchase that never\n-- happened would put a fictional tier -- and later, a fictional price -- on a\n-- real customer's key.\nALTER TABLE control.api_keys\n  ADD COLUMN plan_id control.identifier REFERENCES control.plans(plan_id);\n\nCREATE INDEX api_keys_plan ON control.api_keys(plan_id) WHERE plan_id IS NOT NULL;\n\nCREATE TRIGGER plans_updated BEFORE UPDATE ON control.plans\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\n\nGRANT SELECT, INSERT, UPDATE ON control.plans, control.plan_models TO control_writer;\n\nCOMMIT;\n","014_users_resources_plan_versions.sql":"BEGIN;\n\n-- Users, Resources and versioned plans (Demo 1 aligned with the User Portal\n-- proposal: DD1, DD4 and PP1 in the discovery worktree's\n-- docs/demo1/demo1-decisions.md; ER in docs/demo1/portal-alignment-design.md).\n--\n-- Schema only. Nothing reads these tables yet: the purchase path keeps using\n-- control.plans, control.plan_models and control.api_keys until goal P4, so\n-- this migration changes no behaviour.\n--\n-- UserAccount -\u003e Resource (DD1)\n-- -----------------------------\n-- A user buys a plan and gets a Resource: one purchase, one resource_id, one\n-- APIM subscription whose sid *is* the resource_id, and one wallet. There is no\n-- tenant and no project on this path. The tenant, project and key tables stay\n-- in place and untouched (OD3).\n--\n-- Credentials in the control schema (DD4)\n-- ---------------------------------------\n-- The login secret lives in its own table beside user_accounts, so that moving\n-- to an identity provider later removes one table and touches nothing else. It\n-- holds a hash only. There is no password column of any kind, and the CHECK on\n-- password_hash admits only an Argon2id PHC string (DD2), so a plaintext\n-- password cannot be stored by mistake.\n--\n-- control_writer, control-api's role, can read these hashes. That is a\n-- demo-only deviation from \"ai-tollgate never owns customer identity\",\n-- recorded as an L-entry in limitations-and-choices.md. billing_app has no\n-- USAGE on the control schema and is granted nothing here.\n--\n-- Versioned plans (PP1)\n-- ---------------------\n-- A plan version's terms are immutable: a change is a new version with its own\n-- APIM product. A Resource points to the version it bought, so a later change\n-- to the plan never alters an existing Resource's limits or models.\n-- control.plans keeps the plan's identity and display name; the terms it still\n-- carries are those of version 1 and are no longer the source of truth once\n-- the purchase reads versions (P4).\n--\n-- Every existing plan becomes version 1 with its current apim_product_id and\n-- plan_models, so every existing APIM product, subscription and purchase is\n-- unaffected.\n\nCREATE TABLE control.user_accounts (\n  user_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  status text NOT NULL CHECK (status IN ('active','locked','disabled')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE control.user_credentials (\n  user_id uuid PRIMARY KEY REFERENCES control.user_accounts(user_id),\n  -- The lookup key. Lower-cased and trimmed by the application; the CHECK only\n  -- refuses a value that plainly was not normalised, so two spellings of one\n  -- name cannot become two accounts.\n  username_normalized text NOT NULL UNIQUE\n    CHECK (username_normalized \u003c\u003e '' AND username_normalized = lower(btrim(username_normalized))),\n  username_display text NOT NULL CHECK (btrim(username_display) \u003c\u003e ''),\n  password_hash text NOT NULL CHECK (password_hash ~ '^\\$argon2id\\$v=[0-9]+\\$[^$]+\\$[^$]+\\$[^$]+$'),\n  failed_attempts integer NOT NULL DEFAULT 0 CHECK (failed_attempts \u003e= 0),\n  locked_until timestamptz,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE control.plan_versions (\n  plan_version_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  plan_id control.identifier NOT NULL REFERENCES control.plans(plan_id),\n  version integer NOT NULL CHECK (version \u003e 0),\n  requests_per_minute bigint NOT NULL CHECK (requests_per_minute \u003e 0),\n  tokens_per_minute bigint NOT NULL CHECK (tokens_per_minute \u003e 0),\n  -- Integer nano-units, bounded by 2^53-1 as in control.plans.\n  minimum_purchase_nano bigint NOT NULL\n    CHECK (minimum_purchase_nano \u003e 0 AND minimum_purchase_nano \u003c= 9007199254740991),\n  currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),\n  -- One version is one APIM product (PP1): two versions sharing a product would\n  -- share its rate-limit and model policy, so a new version needs a new product.\n  apim_product_id text NOT NULL UNIQUE CHECK (btrim(apim_product_id) \u003c\u003e ''),\n  status text NOT NULL CHECK (status IN ('draft','active','retired')),\n  effective_from timestamptz NOT NULL DEFAULT now(),\n  effective_to timestamptz,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  UNIQUE (plan_id, version),\n  CHECK (effective_to IS NULL OR effective_to \u003e effective_from)\n);\n\n-- A purchase takes the plan's active version, so there must never be two.\nCREATE UNIQUE INDEX plan_versions_one_active ON control.plan_versions(plan_id) WHERE status = 'active';\n\n-- The models a version grants. Part of its terms: rows can be added only while\n-- the version is a draft, and never changed or removed (triggers below).\nCREATE TABLE control.plan_version_models (\n  plan_version_id uuid NOT NULL REFERENCES control.plan_versions(plan_version_id),\n  sku text NOT NULL REFERENCES control.models(sku),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  PRIMARY KEY (plan_version_id, sku)\n);\n\nCREATE TABLE control.resources (\n  resource_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),\n  plan_version_id uuid NOT NULL REFERENCES control.plan_versions(plan_version_id),\n  region text NOT NULL CHECK (btrim(region) \u003c\u003e ''),\n  region_user_specified boolean NOT NULL DEFAULT false,\n  -- The APIM sid is the resource_id (DP1). spend-control sees it as\n  -- credential_id and finds the wallet by it, so the two cannot differ.\n  apim_subscription_id text NOT NULL UNIQUE CHECK (apim_subscription_id = resource_id::text),\n  status text NOT NULL CHECK (status IN ('provisioning','active','suspended','closed')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX resources_user_created ON control.resources(user_id, created_at DESC, resource_id);\nCREATE INDEX plan_versions_plan ON control.plan_versions(plan_id, version DESC);\n\n-- Only status and effective_to may change on a plan version; its terms cannot.\nCREATE FUNCTION control.guard_plan_version_terms() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.plan_version_id, NEW.plan_id, NEW.version, NEW.requests_per_minute, NEW.tokens_per_minute,\n         NEW.minimum_purchase_nano, NEW.currency, NEW.apim_product_id, NEW.effective_from, NEW.created_at)\n     IS DISTINCT FROM\n     ROW(OLD.plan_version_id, OLD.plan_id, OLD.version, OLD.requests_per_minute, OLD.tokens_per_minute,\n         OLD.minimum_purchase_nano, OLD.currency, OLD.apim_product_id, OLD.effective_from, OLD.created_at) THEN\n    RAISE EXCEPTION 'plan version terms are immutable; create a new version' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER plan_version_terms_immutable BEFORE UPDATE ON control.plan_versions\nFOR EACH ROW EXECUTE FUNCTION control.guard_plan_version_terms();\n\n-- A version's models are fixed once it leaves draft. FOR SHARE makes a\n-- concurrent activation wait for this insert, or this insert see it.\nCREATE FUNCTION control.guard_plan_version_models() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF (SELECT status FROM control.plan_versions WHERE plan_version_id = NEW.plan_version_id FOR SHARE)\n     IS DISTINCT FROM 'draft' THEN\n    RAISE EXCEPTION 'models can be added only to a draft plan version' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER plan_version_models_draft_only BEFORE INSERT ON control.plan_version_models\nFOR EACH ROW EXECUTE FUNCTION control.guard_plan_version_models();\nCREATE TRIGGER plan_version_models_immutable BEFORE UPDATE OR DELETE ON control.plan_version_models\nFOR EACH ROW EXECUTE FUNCTION public.reject_immutable_change();\n\n-- Who owns a Resource, what it bought and which subscription it is never change.\nCREATE FUNCTION control.guard_resource_identity() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.resource_id, NEW.user_id, NEW.plan_version_id, NEW.apim_subscription_id, NEW.created_at)\n     IS DISTINCT FROM\n     ROW(OLD.resource_id, OLD.user_id, OLD.plan_version_id, OLD.apim_subscription_id, OLD.created_at) THEN\n    RAISE EXCEPTION 'resource identity is immutable' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER resource_identity_immutable BEFORE UPDATE ON control.resources\nFOR EACH ROW EXECUTE FUNCTION control.guard_resource_identity();\n\nCREATE TRIGGER user_accounts_updated BEFORE UPDATE ON control.user_accounts\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\nCREATE TRIGGER user_credentials_updated BEFORE UPDATE ON control.user_credentials\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\nCREATE TRIGGER plan_versions_updated BEFORE UPDATE ON control.plan_versions\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\nCREATE TRIGGER resources_updated BEFORE UPDATE ON control.resources\nFOR EACH ROW EXECUTE FUNCTION public.set_updated_at();\n\n-- Backfill: every plan becomes version 1, from its current row. Inserted as a\n-- draft so its models can be attached, then given the plan's own status.\n-- effective_from is the plan's creation time: that is when these terms began.\nINSERT INTO control.plan_versions\n  (plan_id, version, requests_per_minute, tokens_per_minute, minimum_purchase_nano, currency,\n   apim_product_id, status, effective_from)\nSELECT plan_id, 1, requests_per_minute, tokens_per_minute, minimum_purchase_nano, currency,\n       apim_product_id, 'draft', created_at\nFROM control.plans;\n\nINSERT INTO control.plan_version_models (plan_version_id, sku)\nSELECT v.plan_version_id, m.sku\nFROM control.plan_models m JOIN control.plan_versions v ON v.plan_id = m.plan_id AND v.version = 1;\n\nUPDATE control.plan_versions v SET status = p.status\nFROM control.plans p WHERE p.plan_id = v.plan_id AND v.version = 1;\n\n-- control-api creates users, credentials, versions and Resources, updates\n-- status and lockout fields, and never deletes. A version's models are insert\n-- only. billing_app is granted nothing: it has no USAGE on this schema.\nGRANT SELECT, INSERT, UPDATE ON control.user_accounts, control.user_credentials,\n  control.plan_versions, control.resources TO control_writer;\nGRANT SELECT, INSERT ON control.plan_version_models TO control_writer;\n\nCOMMIT;\n","015_user_sessions.sql":"BEGIN;\n\n-- Portal sessions (Demo 1 aligned with the User Portal proposal, goal P2:\n-- DD2, DD4 and OD10 in the discovery worktree's docs/demo1/demo1-decisions.md).\n--\n-- A user logs in on /portal/v1 and receives a random token in an HttpOnly,\n-- SameSite=Strict cookie. Only the token's SHA-256 is stored here, so this\n-- table alone cannot be replayed as a cookie. The token has 256 bits of\n-- entropy, which is why a fast unsalted digest is enough for it, unlike a\n-- password.\n--\n-- Every login writes a new row with a new session_id and token (rotation at\n-- login). A session ends by expiry or by revocation (logout); it is never\n-- extended, never re-pointed at another user and never deleted.\n\nCREATE TABLE control.user_sessions (\n  session_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),\n  token_sha256 bytea NOT NULL UNIQUE CHECK (octet_length(token_sha256) = 32),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  expires_at timestamptz NOT NULL,\n  revoked_at timestamptz,\n  CHECK (expires_at \u003e created_at),\n  CHECK (revoked_at IS NULL OR revoked_at \u003e= created_at)\n);\n\nCREATE INDEX user_sessions_user ON control.user_sessions(user_id, created_at DESC);\n\n-- Only revoked_at may change, and only once: a revoked session stays revoked.\nCREATE FUNCTION control.guard_user_session() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.session_id, NEW.user_id, NEW.token_sha256, NEW.created_at, NEW.expires_at)\n     IS DISTINCT FROM\n     ROW(OLD.session_id, OLD.user_id, OLD.token_sha256, OLD.created_at, OLD.expires_at)\n     OR (OLD.revoked_at IS NOT NULL AND NEW.revoked_at IS DISTINCT FROM OLD.revoked_at) THEN\n    RAISE EXCEPTION 'a session can only be revoked, once' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER user_session_revoke_only BEFORE UPDATE ON control.user_sessions\nFOR EACH ROW EXECUTE FUNCTION control.guard_user_session();\n\n-- control-api creates sessions and revokes them; nothing deletes them.\n-- billing_app has no USAGE on this schema and is granted nothing.\nGRANT SELECT, INSERT, UPDATE ON control.user_sessions TO control_writer;\n\nCOMMIT;\n","016_portal_audit_surface.sql":"BEGIN;\n\n-- A user's purchase on /portal/v1 (goal P4) is audited like an operator's, but\n-- it is neither an operator action nor a configuration change. Recording it\n-- under either surface would misstate who acted, so the audit gains a third.\n-- Existing rows are unaffected: the set only grows.\n\nALTER TABLE control.control_audit DROP CONSTRAINT control_audit_surface_check;\nALTER TABLE control.control_audit ADD CONSTRAINT control_audit_surface_check\n  CHECK (surface IN ('operator','config','portal'));\n\nCOMMIT;\n","017_case_sensitive_skus.sql":"BEGIN;\n\n-- A SKU may hold upper-case letters, so a catalogue model can be named exactly as\n-- its backend serves it (a vLLM server serves Qwen3-8B; the gateway forwards the\n-- body's model unchanged). SKUs stay case-sensitive identifiers, but the APIM\n-- Backend entity id derived from one is lower-cased and APIM ids ignore case, so\n-- two SKUs that differ only by case are refused. Existing rows are unaffected:\n-- every SKU the old pattern admitted is lower-case, and the new pattern admits it.\n\nALTER TABLE control.models DROP CONSTRAINT models_sku_check;\nALTER TABLE control.models ADD CONSTRAINT models_sku_check\n  CHECK (sku ~ '^[A-Za-z0-9][A-Za-z0-9._-]*$' AND length(sku) \u003c= 256);\nCREATE UNIQUE INDEX models_sku_case_insensitive ON control.models (lower(sku));\n\nCOMMIT;\n","018_embedding_models.sql":"BEGIN;\n\n-- A catalogue model is a chat model or an embedding model (goal G22, EM-5). The\n-- gateway serves each on its own operation (POST /chat/completions or POST\n-- /embeddings) and refuses a model on the other one. Only the allowed values\n-- widen: every existing row is 'chat' and stays as it is.\n\nALTER TABLE control.models DROP CONSTRAINT models_api_type_check;\nALTER TABLE control.models ADD CONSTRAINT models_api_type_check\n  CHECK (api_type IN ('chat','embedding'));\n\nCOMMIT;\n","035_server_tools.sql":"BEGIN;\n-- Portal cluster: the control half (plans and plan_versions server tools).\n-- A copy of services/spend-control/migrations/035_server_tools.sql with only this cluster's statements; nothing added.\n\n-- ST-D: which server tools a plan allows, and the bound on tool calls a call may make (ST-C).\n-- Plan terms, like the rate limits: on the plan and on each of its versions, and a change is a new\n-- plan. No tools and no bound, the default, for every plan before this one.\nALTER TABLE control.plans\n  ADD COLUMN server_tools text[] NOT NULL DEFAULT '{}'\n    CHECK (server_tools \u003c@ ARRAY['web_search','mcp']::text[]),\n  ADD COLUMN max_tool_calls integer NOT NULL DEFAULT 0 CHECK (max_tool_calls \u003e= 0 AND max_tool_calls \u003c= 100),\n  ADD CONSTRAINT plans_tools_need_a_bound CHECK ((cardinality(server_tools) = 0) = (max_tool_calls = 0));\nALTER TABLE control.plan_versions\n  ADD COLUMN server_tools text[] NOT NULL DEFAULT '{}'\n    CHECK (server_tools \u003c@ ARRAY['web_search','mcp']::text[]),\n  ADD COLUMN max_tool_calls integer NOT NULL DEFAULT 0 CHECK (max_tool_calls \u003e= 0 AND max_tool_calls \u003c= 100),\n  ADD CONSTRAINT plan_versions_tools_need_a_bound CHECK ((cardinality(server_tools) = 0) = (max_tool_calls = 0));\n\n-- A plan version's terms are immutable (migration 014): the tools and the bound are terms too.\nCREATE OR REPLACE FUNCTION control.guard_plan_version_terms() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.plan_version_id, NEW.plan_id, NEW.version, NEW.requests_per_minute, NEW.tokens_per_minute,\n         NEW.minimum_purchase_nano, NEW.currency, NEW.apim_product_id, NEW.effective_from, NEW.created_at,\n         NEW.server_tools, NEW.max_tool_calls)\n     IS DISTINCT FROM\n     ROW(OLD.plan_version_id, OLD.plan_id, OLD.version, OLD.requests_per_minute, OLD.tokens_per_minute,\n         OLD.minimum_purchase_nano, OLD.currency, OLD.apim_product_id, OLD.effective_from, OLD.created_at,\n         OLD.server_tools, OLD.max_tool_calls) THEN\n    RAISE EXCEPTION 'plan version terms are immutable; create a new version' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\n\nCOMMIT;\n","036_user_contacts_email_verification.sql":"BEGIN;\n\n-- A user's email address and billing address, and the codes that verify the email (sign-up).\n--\n-- Personal data stays in the control schema, beside the credentials, and is read by control-api only:\n-- billing_app has no USAGE on this schema, and nothing here reaches billing-mgmt, OpenMeter or APIM.\n-- An account made before this migration has no contact row; control-api lets it in as it always did.\n--\n-- user_contacts\n-- -------------\n-- One row per user. The email is lower-cased and trimmed by the application; the CHECK refuses a value\n-- that plainly was not. Two accounts may hold the same unverified email, so nobody can park an address\n-- they do not own: the unique index covers verified emails only, and the first account to verify an\n-- address keeps it. The email can change later, so nothing else is keyed on it.\n--\n-- email_verifications\n-- -------------------\n-- One row per code sent, so the rows are also the send history that the resend cooldown and the hourly\n-- caps count. Only a hash of the code is stored: a 6-digit code is guessable, so it is an Argon2id hash\n-- with its own salt (as a password's is), and the attempt limit and the short expiry do the rest.\n-- A newer code closes the older ones (closed_at). A row whose email never left (send_failed_at) is not\n-- counted as a send.\n\nCREATE TABLE control.user_contacts (\n  user_id uuid PRIMARY KEY REFERENCES control.user_accounts(user_id),\n  email text NOT NULL CHECK (btrim(email) \u003c\u003e '' AND length(email) \u003c= 254),\n  email_normalized text NOT NULL\n    CHECK (email_normalized ~ '^[^@[:space:]]+@[^@[:space:]]+$' AND length(email_normalized) \u003c= 254\n           AND email_normalized = lower(btrim(email_normalized))),\n  email_verified_at timestamptz,\n  billing_name text NOT NULL CHECK (btrim(billing_name) \u003c\u003e '' AND length(billing_name) \u003c= 200),\n  billing_line1 text NOT NULL CHECK (btrim(billing_line1) \u003c\u003e '' AND length(billing_line1) \u003c= 200),\n  billing_line2 text CHECK (billing_line2 IS NULL OR (btrim(billing_line2) \u003c\u003e '' AND length(billing_line2) \u003c= 200)),\n  billing_city text NOT NULL CHECK (btrim(billing_city) \u003c\u003e '' AND length(billing_city) \u003c= 100),\n  billing_state text CHECK (billing_state IS NULL OR (btrim(billing_state) \u003c\u003e '' AND length(billing_state) \u003c= 100)),\n  billing_postal_code text NOT NULL CHECK (btrim(billing_postal_code) \u003c\u003e '' AND length(billing_postal_code) \u003c= 20),\n  -- ISO 3166-1 alpha-2, upper case.\n  billing_country text NOT NULL CHECK (billing_country ~ '^[A-Z]{2}$'),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE UNIQUE INDEX user_contacts_verified_email ON control.user_contacts(email_normalized)\n  WHERE email_verified_at IS NOT NULL;\nCREATE INDEX user_contacts_email ON control.user_contacts(email_normalized);\n\nCREATE TABLE control.email_verifications (\n  verification_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),\n  -- The address this code was sent to.\n  email_normalized text NOT NULL CHECK (email_normalized = lower(btrim(email_normalized))),\n  code_hash text NOT NULL CHECK (code_hash ~ '^\\$argon2id\\$v=[0-9]+\\$[^$]+\\$[^$]+\\$[^$]+$'),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  expires_at timestamptz NOT NULL,\n  failed_attempts integer NOT NULL DEFAULT 0 CHECK (failed_attempts \u003e= 0),\n  -- Set when the code is used or a newer one replaces it.\n  closed_at timestamptz,\n  send_failed_at timestamptz,\n  CHECK (expires_at \u003e created_at)\n);\n\nCREATE INDEX email_verifications_user ON control.email_verifications(user_id, created_at DESC);\nCREATE INDEX email_verifications_email ON control.email_verifications(email_normalized, created_at DESC);\n\n-- A code's hash, address and times never change; its attempts only grow, and it is closed or marked\n-- unsent once.\nCREATE FUNCTION control.guard_email_verification() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.verification_id, NEW.user_id, NEW.email_normalized, NEW.code_hash, NEW.created_at, NEW.expires_at)\n     IS DISTINCT FROM\n     ROW(OLD.verification_id, OLD.user_id, OLD.email_normalized, OLD.code_hash, OLD.created_at, OLD.expires_at)\n     OR NEW.failed_attempts \u003c OLD.failed_attempts\n     OR (OLD.closed_at IS NOT NULL AND NEW.closed_at IS DISTINCT FROM OLD.closed_at)\n     OR (OLD.send_failed_at IS NOT NULL AND NEW.send_failed_at IS DISTINCT FROM OLD.send_failed_at) THEN\n    RAISE EXCEPTION 'a verification code can only gain attempts, and be closed or marked unsent once'\n      USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER email_verification_guard BEFORE UPDATE ON control.email_verifications\nFOR EACH ROW EXECUTE FUNCTION control.guard_email_verification();\n\n-- control-api reads and writes both; nothing deletes them. billing_app is granted nothing.\nGRANT SELECT, INSERT, UPDATE ON control.user_contacts TO control_writer;\nGRANT SELECT, INSERT, UPDATE ON control.email_verifications TO control_writer;\n\nCOMMIT;\n","037_balance_alerts.sql":"BEGIN;\n\n-- Low-balance email alerts: when a Resource's wallet has used a set share of everything credited to it,\n-- its owner is emailed once. control-api reads the wallet from billing-mgmt and decides; nothing here\n-- touches money. billing_app is granted nothing.\n--\n-- alert_thresholds\n-- ----------------\n-- The shares of the credited balance (in whole percent, 1 to 99) at which an alert is sent, by scope: a\n-- plan (every version of it), later a user or one Resource. The most specific scope that has a row wins,\n-- then the deployment's default. An empty list is a row too: it means \"no alerts\" for that scope. Plans'\n-- rows come from the catalogue (python -m control_api.catalogue); nothing writes the other scopes yet.\n-- Not a term of a plan version: tuning an alert must not need a new plan.\n--\n-- balance_alerts\n-- --------------\n-- One row per alert that fired. A row is \"live\" until its share is no longer reached (a top-up raised\n-- the balance), when rearmed_at is set; the unique index allows one live row per Resource and share, so\n-- an alert is sent once however often the wallet is read and however many replicas read it. Crossing\n-- two shares in one step sends one email, for the higher: the lower is recorded as superseded.\n-- pending -\u003e sent, or abandoned (it stopped being true, or could not be sent in time). The balance and\n-- the amount settled are those the alert was decided on.\n\nCREATE FUNCTION control.valid_alert_percents(percents smallint[]) RETURNS boolean\nLANGUAGE sql IMMUTABLE AS $$\n  SELECT cardinality(percents) \u003c= 5\n     AND NOT EXISTS (SELECT 1 FROM unnest(percents) AS p WHERE p IS NULL OR p NOT BETWEEN 1 AND 99)\n     AND NOT EXISTS (SELECT 1 FROM generate_subscripts(percents, 1) AS i\n                     WHERE i \u003e 1 AND percents[i] \u003c= percents[i - 1])\n$$;\n\nCREATE TABLE control.alert_thresholds (\n  scope_type text NOT NULL CHECK (scope_type IN ('plan', 'user', 'resource')),\n  scope_id text NOT NULL CHECK (btrim(scope_id) \u003c\u003e '' AND length(scope_id) \u003c= 100),\n  -- Ascending, no repeats, at most five.\n  percents smallint[] NOT NULL CHECK (control.valid_alert_percents(percents)),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  PRIMARY KEY (scope_type, scope_id)\n);\n\nCREATE TABLE control.balance_alerts (\n  alert_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  resource_id uuid NOT NULL REFERENCES control.resources(resource_id),\n  percent smallint NOT NULL CHECK (percent BETWEEN 1 AND 99),\n  state text NOT NULL CHECK (state IN ('pending', 'sent', 'abandoned', 'superseded')),\n  currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),\n  balance_nano bigint NOT NULL CHECK (balance_nano \u003e 0 AND balance_nano \u003c= 9007199254740991),\n  settled_nano bigint NOT NULL CHECK (settled_nano \u003e= 0 AND settled_nano \u003c= 9007199254740991),\n  attempts integer NOT NULL DEFAULT 0 CHECK (attempts \u003e= 0),\n  next_attempt_at timestamptz NOT NULL DEFAULT now(),\n  -- The reason an alert was not sent, as a code; never an address or a message.\n  last_error text CHECK (last_error IS NULL OR last_error ~ '^[a-z_]{1,64}$'),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  sent_at timestamptz,\n  abandoned_at timestamptz,\n  rearmed_at timestamptz,\n  CHECK ((state = 'sent') = (sent_at IS NOT NULL)),\n  CHECK ((state = 'abandoned') = (abandoned_at IS NOT NULL))\n);\n\nCREATE UNIQUE INDEX balance_alerts_live ON control.balance_alerts(resource_id, percent) WHERE rearmed_at IS NULL;\nCREATE INDEX balance_alerts_pending ON control.balance_alerts(next_attempt_at) WHERE state = 'pending';\nCREATE INDEX balance_alerts_resource ON control.balance_alerts(resource_id, created_at DESC);\n\n-- What an alert was decided on never changes. It leaves pending once, for sent or abandoned; attempts only\n-- grow; it is re-armed once.\nCREATE FUNCTION control.guard_balance_alert() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.alert_id, NEW.resource_id, NEW.percent, NEW.currency, NEW.balance_nano, NEW.settled_nano,\n         NEW.created_at)\n     IS DISTINCT FROM\n     ROW(OLD.alert_id, OLD.resource_id, OLD.percent, OLD.currency, OLD.balance_nano, OLD.settled_nano,\n         OLD.created_at)\n     OR NEW.attempts \u003c OLD.attempts\n     OR (OLD.state \u003c\u003e 'pending' AND NEW.state IS DISTINCT FROM OLD.state)\n     OR (OLD.state = 'pending' AND NEW.state = 'superseded')\n     OR (OLD.sent_at IS NOT NULL AND NEW.sent_at IS DISTINCT FROM OLD.sent_at)\n     OR (OLD.abandoned_at IS NOT NULL AND NEW.abandoned_at IS DISTINCT FROM OLD.abandoned_at)\n     OR (OLD.rearmed_at IS NOT NULL AND NEW.rearmed_at IS DISTINCT FROM OLD.rearmed_at) THEN\n    RAISE EXCEPTION 'a balance alert is decided once; it can only be sent, abandoned or re-armed'\n      USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER balance_alert_guard BEFORE UPDATE ON control.balance_alerts\nFOR EACH ROW EXECUTE FUNCTION control.guard_balance_alert();\n\n-- control-api reads and writes both; nothing deletes them. billing_app is granted nothing.\nGRANT SELECT, INSERT, UPDATE ON control.alert_thresholds TO control_writer;\nGRANT SELECT, INSERT, UPDATE ON control.balance_alerts TO control_writer;\n\nCOMMIT;\n","039_drop_legacy_control_tables.sql":"BEGIN;\n-- Portal cluster: without lab_verifier (009 does not run here).\n-- A copy of services/spend-control/migrations/039_drop_legacy_control_tables.sql with only this cluster's statements; nothing added.\n\n-- The old operator model's tables go, with plan_models (the purchase through billing-mgmt,\n-- claim D). A buyer is a control.user_accounts row and a credential is a control.resources\n-- row; the operator's tenant, project, key, traffic-limit and purchase routes, onboarding,\n-- registration and the lab, the only writers and readers of these tables, went before\n-- this migration. plan_models duplicated version 1 of control.plan_version_models (014):\n-- the plan reads and the catalogue read the version's models now. No kept table has a\n-- foreign key to any of them; the wallet's api_key_id is text with no foreign key (010), so\n-- a wallet an old key funded keeps its money and still works.\n--\n-- Each DROP takes the table's indexes, constraints, triggers and grants with it: 007's,\n-- 011's and 009's (lab_verifier). No CASCADE: anything else that still depended on a table\n-- would make this migration fail rather than be dropped with it. Foreign-key order: keys\n-- before their projects; projects and traffic limits before their tenants.\nDROP TABLE control.api_keys;\nDROP TABLE control.traffic_limit_policies;\nDROP TABLE control.projects;\nDROP TABLE control.tenants;\nDROP TABLE control.plan_models;\n\n-- Only those tables' triggers called these (007, 008). set_updated_at() stays: other tables use it.\nDROP FUNCTION control.guard_first_admin();\nDROP FUNCTION control.guard_key_identity();\n\nCOMMIT;\n","041_control_sync_outbox.sql":"BEGIN;\n\n-- The portal's side of the control sync (architecture: the 8 shared control tables, copied from the portal's\n-- database to every region's data-path database over that region's Service Bus). Every change to one of the 8\n-- tables is written, in the writer's own transaction, to control_sync.outbox by a trigger; the relay\n-- (control_api.sync.relay, login control_sync_relay) sends it to every registered region in order. The portal\n-- cluster's set runs this file; a data-path cluster's set skips it (it runs 042 instead). A single-database\n-- deployment runs both, and collects nothing until a region is registered.\n--\n-- seq_counter\n-- -----------\n-- One row. Every captured change first takes n + 1 from it; the row lock is held to commit, so writers of the 8\n-- tables run one at a time, numbers follow commit order, a rollback gives its numbers back, and one\n-- transaction's numbers are consecutive. A gap downstream therefore always means a lost message. (A bigserial\n-- would hand out numbers in start order, not commit order, so a reader could pass a number that commits later.)\n--\n-- outbox\n-- ------\n-- One row per changed row, written only while control_sync.regions has a row. key is the primary key (named by\n-- the trigger's arguments), row the row as stored (after the BEFORE triggers), NULL for a delete.\n--\n-- regions\n-- -------\n-- One row per region the relay sends to. sent_seq is the last number sent to it; NULL means \"send a snapshot\n-- next\". snapshot_upto is the counter when the relay began that region's snapshot: the snapshot covers at least\n-- that far, so the prune never removes a row such a snapshot still has to stream after it.\n\nCREATE SCHEMA IF NOT EXISTS control_sync;\nREVOKE ALL ON SCHEMA control_sync FROM PUBLIC;\n\nCREATE TABLE control_sync.seq_counter (\n  id boolean PRIMARY KEY DEFAULT true CHECK (id),\n  n bigint NOT NULL DEFAULT 0 CHECK (n \u003e= 0)\n);\nINSERT INTO control_sync.seq_counter (id, n) VALUES (true, 0);\n\nCREATE TABLE control_sync.outbox (\n  seq bigint PRIMARY KEY,\n  txid xid8 NOT NULL,\n  table_name text NOT NULL,\n  op text NOT NULL CHECK (op IN ('insert', 'update', 'delete')),\n  key jsonb NOT NULL,\n  row jsonb,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  CHECK ((op = 'delete') = (row IS NULL))\n);\n\nCREATE TABLE control_sync.regions (\n  region text PRIMARY KEY CHECK (region ~ '^[a-z0-9][a-z0-9-]{0,49}$'),\n  namespace_fqdn text NOT NULL,\n  topic text NOT NULL DEFAULT 'control-sync',\n  sent_seq bigint,\n  snapshot_id text,\n  snapshot_upto bigint,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\n-- The capture. SECURITY DEFINER: control_writer (and anything else that writes the 8 tables) is granted\n-- nothing in control_sync, yet its change is numbered and recorded.\nCREATE FUNCTION control_sync.capture() RETURNS trigger\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  next_seq bigint;\n  stored jsonb;\n  pk jsonb := '{}'::jsonb;\n  col text;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n + 1 RETURNING n INTO next_seq;\n  -- Off until a region exists. Registering one updates the counter row too, so a writer either committed\n  -- before the registration (and is in the region's snapshot) or waited for it (and sees the region here).\n  IF NOT EXISTS (SELECT 1 FROM control_sync.regions) THEN\n    RETURN NULL;\n  END IF;\n  stored := CASE WHEN TG_OP = 'DELETE' THEN to_jsonb(OLD) ELSE to_jsonb(NEW) END;\n  FOREACH col IN ARRAY TG_ARGV LOOP\n    pk := pk || jsonb_build_object(col, stored -\u003e col);\n  END LOOP;\n  INSERT INTO control_sync.outbox (seq, txid, table_name, op, key, row)\n  VALUES (next_seq, pg_current_xact_id(), TG_TABLE_NAME, lower(TG_OP), pk,\n          CASE WHEN TG_OP = 'DELETE' THEN NULL ELSE stored END);\n  RETURN NULL;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.capture() FROM PUBLIC;\n\n-- The trigger's arguments are the table's primary key columns.\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.models\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('sku');\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.plans\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('plan_id');\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.plan_versions\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('plan_version_id');\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.plan_version_models\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('plan_version_id', 'sku');\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.user_accounts\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('user_id');\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.resources\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('resource_id');\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.alert_thresholds\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('scope_type', 'scope_id');\nCREATE TRIGGER control_sync_capture AFTER INSERT OR UPDATE OR DELETE ON control.balance_alerts\nFOR EACH ROW EXECUTE FUNCTION control_sync.capture('alert_id');\n\n-- Registering a region: inserts it with sent_seq NULL (its first send is a snapshot) and updates the counter row\n-- in the same transaction (see capture()). A definer function, so the relay's login needs no UPDATE on the\n-- counter and cannot change the numbering. Registering a region again changes nothing and returns false.\nCREATE FUNCTION control_sync.register_region(p_region text, p_namespace_fqdn text, p_topic text)\nRETURNS boolean\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  added integer;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n;\n  INSERT INTO control_sync.regions (region, namespace_fqdn, topic)\n  VALUES (p_region, p_namespace_fqdn, p_topic)\n  ON CONFLICT (region) DO NOTHING;\n  GET DIAGNOSTICS added = ROW_COUNT;\n  RETURN added = 1;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.register_region(text, text, text) FROM PUBLIC;\n\n-- The relay's login (the password, if any, is given by control_api.provision: CONTROL_SYNC_RELAY_DB_PASSWORD).\n-- It reads the 8 tables (snapshots, verify), reads and prunes the outbox and keeps the regions; it writes none of\n-- the 8 tables.\nDO $$ BEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'control_sync_relay') THEN\n    CREATE ROLE control_sync_relay NOLOGIN;\n  END IF;\nEND $$;\nGRANT USAGE ON SCHEMA control, control_sync TO control_sync_relay;\nGRANT SELECT ON control.models, control.plans, control.plan_versions, control.plan_version_models,\n  control.user_accounts, control.resources, control.alert_thresholds, control.balance_alerts\n  TO control_sync_relay;\nGRANT SELECT ON control_sync.seq_counter TO control_sync_relay;\nGRANT SELECT, DELETE ON control_sync.outbox TO control_sync_relay;\nGRANT SELECT, INSERT, UPDATE ON control_sync.regions TO control_sync_relay;\nGRANT EXECUTE ON FUNCTION control_sync.register_region(text, text, text) TO control_sync_relay;\n\nCOMMIT;\n","041_stripe_customers.sql":"BEGIN;\n\n-- The Stripe Customer of a user, made at the user's first card payment (control_api/payments.py).\n--\n-- Stripe is the only place a card is kept: this table holds the Customer's id and nothing about a card, so\n-- saved cards are read back from Stripe by this id. Like user_contacts it stays in the control schema and is\n-- read by control-api only: billing_app is granted nothing, and the id reaches billing-mgmt, OpenMeter and\n-- APIM never.\n--\n-- One Customer per user, and one user per Customer. The id is never changed: a payment, a saved card and a\n-- Radar history are all attached to it, so control_writer is granted no UPDATE and no DELETE.\n\nCREATE TABLE control.stripe_customers (\n  user_id uuid PRIMARY KEY REFERENCES control.user_accounts(user_id),\n  stripe_customer_id text NOT NULL UNIQUE CHECK (stripe_customer_id ~ '^cus_[A-Za-z0-9]{1,250}$'),\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nGRANT SELECT, INSERT ON control.stripe_customers TO control_writer;\n\nCOMMIT;\n","044_control_bus_portal.sql":"BEGIN;\n\n-- The portal's side of the control bus (command-design.md, sections 1 and 3.1). The portal makes no call into a\n-- data-path cluster: everything it asks of one is a command in control_sync.outbox, sent by the supervisor (in\n-- control-api) over the one shared Service Bus to the target's portal agent, which answers with an ACK. This\n-- reshapes 041's outbox and region registry for that. The portal cluster's set runs this file; a data-path\n-- cluster's set skips it (it runs 045). A single-database deployment runs both.\n--\n-- outbox\n-- ------\n-- One row per command, numbered from the same seq_counter as before (gap-free, in commit order, a transaction's\n-- numbers consecutive). The 8 tables' triggers write \u003ctable\u003e.upsert (body: the row as stored) and \u003ctable\u003e.delete\n-- (body: its key), version 1; control_sync.enqueue() writes any other command. Every target gets every command, in\n-- order (no per-target routing yet). wants_answer marks a command whose ACK someone waits for (control_sync.acks).\n--\n-- targets (041's regions, renamed)\n-- -------\n-- One row per data-path database the supervisor sends to. A cursor, not a row per command: sent_seq is the last\n-- seq sent, acked_seq the last the target has ACKed as applied (it applies strictly in order). state is up, behind,\n-- down or resync; a target added, or one that reports needs_resync, is resynced (resync.begin/rows/end) from\n-- resync_upto. The bus endpoint is per target, so a later bus per region is a change of these columns.\n--\n-- clusters\n-- --------\n-- The second address: cluster-local work, delivered on the cluster's own subscription.\n--\n-- acks\n-- ----\n-- Only for commands with wants_answer: the target's answer (applied, refused or unsupported, with its result).\n--\n-- wallet_balances, usage_rollups\n-- ------------------------------\n-- The portal's copies of what the agents report (wallet.balances and usage.rollup events, credit ACKs), read by\n-- the resource and usage pages and the alert worker instead of asking billing-mgmt. Money in integer nano-units.\n\n-- The outbox: commands, not copied rows. Rows of the old shape cannot be sent as commands; every existing region\n-- is set to resync below, which sends their state again, so they are dropped.\nDELETE FROM control_sync.outbox;\nALTER TABLE control_sync.outbox\n  DROP COLUMN table_name,\n  DROP COLUMN op,\n  DROP COLUMN key,\n  DROP COLUMN row,\n  ADD COLUMN command text NOT NULL CHECK (command ~ '^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$'),\n  ADD COLUMN version integer NOT NULL CHECK (version \u003e= 1),\n  ADD COLUMN body jsonb NOT NULL CHECK (jsonb_typeof(body) = 'object'),\n  ADD COLUMN correlation_id text,\n  ADD COLUMN wants_answer boolean NOT NULL DEFAULT false;\n\n-- The registry of targets.\nALTER TABLE control_sync.regions RENAME TO targets;\nALTER INDEX control_sync.regions_pkey RENAME TO targets_pkey;\nALTER TABLE control_sync.targets RENAME COLUMN region TO target;\nALTER TABLE control_sync.targets RENAME COLUMN namespace_fqdn TO bus_namespace_fqdn;\nALTER TABLE control_sync.targets RENAME COLUMN snapshot_id TO resync_id;\nALTER TABLE control_sync.targets RENAME COLUMN snapshot_upto TO resync_upto;\nALTER TABLE control_sync.targets\n  ADD COLUMN command_subscription text,\n  ADD COLUMN request_subscription text,\n  ADD COLUMN acked_seq bigint CHECK (acked_seq \u003e= 0),\n  ADD COLUMN misses integer NOT NULL DEFAULT 0 CHECK (misses \u003e= 0),\n  ADD COLUMN last_sent_at timestamptz,\n  ADD COLUMN last_ack_at timestamptz,\n  ADD COLUMN state text NOT NULL DEFAULT 'resync' CHECK (state IN ('up', 'behind', 'down', 'resync')),\n  ADD COLUMN supported jsonb NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(supported) = 'object'),\n  ADD COLUMN heartbeat jsonb,\n  ADD COLUMN heartbeat_at timestamptz,\n  ADD CONSTRAINT targets_sent_seq_check CHECK (sent_seq \u003e= 0);\nUPDATE control_sync.targets SET command_subscription = 't-' || target, request_subscription = 'r-' || target,\n  sent_seq = NULL, acked_seq = NULL, resync_id = NULL, resync_upto = NULL, state = 'resync', updated_at = now();\nALTER TABLE control_sync.targets\n  ALTER COLUMN command_subscription SET NOT NULL,\n  ALTER COLUMN request_subscription SET NOT NULL;\n\nCREATE TABLE control_sync.clusters (\n  cluster text PRIMARY KEY CHECK (cluster ~ '^[a-z0-9][a-z0-9-]{0,49}$'),\n  target text NOT NULL REFERENCES control_sync.targets (target) ON DELETE CASCADE,\n  cluster_subscription text NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE control_sync.acks (\n  target text NOT NULL REFERENCES control_sync.targets (target) ON DELETE CASCADE,\n  seq bigint NOT NULL CHECK (seq \u003e= 1),\n  status text NOT NULL CHECK (status IN ('applied', 'refused', 'unsupported')),\n  result jsonb NOT NULL DEFAULT '{}'::jsonb CHECK (jsonb_typeof(result) = 'object'),\n  agent text NOT NULL,\n  received_at timestamptz NOT NULL DEFAULT now(),\n  PRIMARY KEY (target, seq)\n);\n\nCREATE TABLE control_sync.wallet_balances (\n  resource_id text PRIMARY KEY CHECK (btrim(resource_id) \u003c\u003e ''),\n  target text NOT NULL,\n  currency text NOT NULL,\n  balance_nano bigint NOT NULL,\n  settled_nano bigint NOT NULL,\n  as_of timestamptz NOT NULL\n);\n\nCREATE TABLE control_sync.usage_rollups (\n  target text NOT NULL,\n  customer_id text NOT NULL CHECK (btrim(customer_id) \u003c\u003e ''),\n  resource_id text NOT NULL,  -- '' for usage not tied to a Resource\n  model text NOT NULL,\n  meter text NOT NULL,\n  minute timestamptz NOT NULL CHECK (date_trunc('minute', minute) = minute),\n  value bigint NOT NULL CHECK (value \u003e= 0),\n  received_at timestamptz NOT NULL DEFAULT now(),\n  PRIMARY KEY (target, customer_id, resource_id, model, meter, minute)\n);\n\n-- The capture writes commands now. Same numbering and the same \"off until a target exists\" rule as 041's: a writer\n-- either committed before a target was added (and is in its resync) or waited on the counter row for it.\nCREATE OR REPLACE FUNCTION control_sync.capture() RETURNS trigger\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  next_seq bigint;\n  stored jsonb;\n  pk jsonb := '{}'::jsonb;\n  col text;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n + 1 RETURNING n INTO next_seq;\n  IF NOT EXISTS (SELECT 1 FROM control_sync.targets) THEN\n    RETURN NULL;\n  END IF;\n  stored := CASE WHEN TG_OP = 'DELETE' THEN to_jsonb(OLD) ELSE to_jsonb(NEW) END;\n  FOREACH col IN ARRAY TG_ARGV LOOP\n    pk := pk || jsonb_build_object(col, stored -\u003e col);\n  END LOOP;\n  INSERT INTO control_sync.outbox (seq, txid, command, version, body)\n  VALUES (next_seq, pg_current_xact_id(),\n          TG_TABLE_NAME || CASE WHEN TG_OP = 'DELETE' THEN '.delete' ELSE '.upsert' END, 1,\n          CASE WHEN TG_OP = 'DELETE' THEN pk ELSE stored END);\n  RETURN NULL;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.capture() FROM PUBLIC;\n\n-- Any other command: takes the next number from the same counter, so explicit and trigger commands share one order\n-- and one transaction's commands stay consecutive. Returns the seq, the one a caller waiting for the answer waits\n-- on; NULL, writing nothing, while no target exists (as the capture). A body past 200 KB is refused here: the bus\n-- takes 256 KB a message (the claim-check that would carry more is not built).\nCREATE FUNCTION control_sync.enqueue(p_command text, p_version integer, p_body jsonb,\n                                     p_correlation_id text DEFAULT NULL, p_wants_answer boolean DEFAULT false)\nRETURNS bigint\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  next_seq bigint;\nBEGIN\n  IF octet_length(p_body::text) \u003e 200 * 1024 THEN\n    RAISE EXCEPTION 'control_sync.enqueue: % body is larger than 200 KB', p_command\n      USING ERRCODE = 'program_limit_exceeded';\n  END IF;\n  UPDATE control_sync.seq_counter SET n = n + 1 RETURNING n INTO next_seq;\n  IF NOT EXISTS (SELECT 1 FROM control_sync.targets) THEN\n    RETURN NULL;\n  END IF;\n  INSERT INTO control_sync.outbox (seq, txid, command, version, body, correlation_id, wants_answer)\n  VALUES (next_seq, pg_current_xact_id(), p_command, p_version, p_body, p_correlation_id, p_wants_answer);\n  RETURN next_seq;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.enqueue(text, integer, jsonb, text, boolean) FROM PUBLIC;\n\n-- Adding a target: as 041's register_region, it updates the counter row in the same transaction (see capture()),\n-- and the new target's first send is a resync. Adding it again changes nothing and returns false.\nDROP FUNCTION control_sync.register_region(text, text, text);\nCREATE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text)\nRETURNS boolean\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  added integer;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n;\n  INSERT INTO control_sync.targets (target, bus_namespace_fqdn, topic, command_subscription, request_subscription)\n  VALUES (p_target, p_bus_namespace_fqdn, p_topic, 't-' || p_target, 'r-' || p_target)\n  ON CONFLICT (target) DO NOTHING;\n  GET DIAGNOSTICS added = ROW_COUNT;\n  RETURN added = 1;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.add_target(text, text, text) FROM PUBLIC;\n\n-- The portal's bus role (041's control_sync_relay, the supervisor and the ACK consumer in control-api): keeps the\n-- targets' cursors (adds them only through add_target), sends and prunes the outbox and blanks a generated key in\n-- an ACKed command's body (UPDATE of body only), records ACK answers and the two copies. It still reads the 8\n-- tables (resync, verify) and writes none of them.\nREVOKE INSERT ON control_sync.targets FROM control_sync_relay;\nGRANT UPDATE (body) ON control_sync.outbox TO control_sync_relay;\nGRANT SELECT, INSERT, UPDATE ON control_sync.clusters TO control_sync_relay;\nGRANT SELECT, INSERT, DELETE ON control_sync.acks TO control_sync_relay;\nGRANT SELECT, INSERT, UPDATE ON control_sync.wallet_balances TO control_sync_relay;\nGRANT SELECT, INSERT, UPDATE, DELETE ON control_sync.usage_rollups TO control_sync_relay;  -- DELETE: 31-day keep\nGRANT EXECUTE ON FUNCTION control_sync.add_target(text, text, text) TO control_sync_relay;\n\n-- control-api's own login: enqueues commands and reads answers and the copies; nothing else in the schema.\nGRANT USAGE ON SCHEMA control_sync TO control_writer;\nGRANT EXECUTE ON FUNCTION control_sync.enqueue(text, integer, jsonb, text, boolean) TO control_writer;\nGRANT SELECT ON control_sync.acks, control_sync.wallet_balances, control_sync.usage_rollups TO control_writer;\n\nCOMMIT;\n","046_control_bus_usage_coverage.sql":"BEGIN;\n\n-- The portal's usage copy keeps the producer's order and what its events cover (command-design.md section 5; review\n-- 23 of work item kashif-two-cluster, findings dev F2 and arch F3). The portal cluster's set runs this file; a\n-- data-path cluster's set skips it, as 044. A single-database deployment runs it.\n--\n-- usage_rollups.produced_upto\n-- ---------------------------\n-- The end (\"to\") of the producer's window that last wrote the row. A minute is replaced only by an event whose window\n-- ends at or after the stored one, so an older event delivered late (the portal's subscription has no sessions: any\n-- pod, any order) never replaces a newer total. Rows from before this file are older than any event.\n--\n-- usage_coverage\n-- --------------\n-- One row per target: the windows ([from, to)) of every usage.rollup event received from it, merged, and only the\n-- last 32 days (the copy's KEEP). The usage reader answers a window only when every target's coverage holds its\n-- start, and reports as_of as the end of that covered span: never a missing copy as zero usage now.\n\nALTER TABLE control_sync.usage_rollups\n  ADD COLUMN produced_upto timestamptz NOT NULL DEFAULT '-infinity';\n\nCREATE TABLE control_sync.usage_coverage (\n  target text PRIMARY KEY,\n  covered tstzmultirange NOT NULL,\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nGRANT SELECT, INSERT, UPDATE ON control_sync.usage_coverage TO control_sync_relay;\n-- control-api's login reads the coverage, and which targets there are (their names only).\nGRANT SELECT ON control_sync.usage_coverage TO control_writer;\nGRANT SELECT (target) ON control_sync.targets TO control_writer;\n\nCOMMIT;\n","047_control_bus_one_target.sql":"BEGIN;\n\n-- One target until commands are routed (PR 91 review, Khaled items 1 and 23). Every command in the outbox goes to every\n-- target (044: no per-target routing yet), so a second target would apply resource.fund, wallet.credit and\n-- apim.key.provision in both regions: money credited twice, a wallet per region. Adding a target other than the one\n-- already there is refused; adding the same one again still changes nothing and returns false. The portal cluster's\n-- set runs this file; a data-path cluster's set skips it, as 044. Routing by Resource and region, in its own pull\n-- request, replaces this function and lifts the refusal.\n--\n-- The check comes after the counter row's lock (UPDATE ... SET n = n), which every add_target takes first: two\n-- adds of different targets at once run one after the other, and the second sees the first's row.\nCREATE OR REPLACE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text)\nRETURNS boolean\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  added integer;\n  other text;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n;\n  SELECT target INTO other FROM control_sync.targets WHERE target \u003c\u003e p_target LIMIT 1;\n  IF other IS NOT NULL THEN\n    RAISE EXCEPTION 'control_sync.add_target: % is already a target; a second (%) is refused until commands are '\n      'routed by region (every command goes to every target)', other, p_target\n      USING ERRCODE = 'feature_not_supported';\n  END IF;\n  INSERT INTO control_sync.targets (target, bus_namespace_fqdn, topic, command_subscription, request_subscription)\n  VALUES (p_target, p_bus_namespace_fqdn, p_topic, 't-' || p_target, 'r-' || p_target)\n  ON CONFLICT (target) DO NOTHING;\n  GET DIAGNOSTICS added = ROW_COUNT;\n  RETURN added = 1;\nEND;\n$$;\n\nCOMMIT;\n","048_control_bus_operator_only.sql":"BEGIN;\n\n-- The control bus's credential only in operator-control-api (PR 91 review, Khaled items 5 and 12). The portal cluster's\n-- set runs this file; a data-path cluster's set skips it, as 044. A single-database deployment runs it.\n--\n-- price_lists\n-- -----------\n-- user-control-api, the public pod, holds no bus login and no bus credential: its commands go into the outbox as\n-- control_writer (044's enqueue) and operator-control-api's supervisor sends them. Its one read of billing-mgmt, the\n-- active price list, is this copy: one row per target, written by operator-control-api as control_sync_relay from\n-- its agent's answer (control_api/sync/prices.py), read by control_writer. It decides nothing about money: a grant\n-- asks billing-mgmt for its price again on the data path.\n--\n-- remove_target\n-- -------------\n-- Takes a target away, with its acks, clusters and price_lists rows (ON DELETE CASCADE), as add_target adds one:\n-- under the counter row's lock, so an add and a remove never interleave. control_sync_relay may run it and still may\n-- not delete from the table itself (044); since this file that login is operator-control-api's alone, and the target\n-- admin is a Job like that pod (tools/stack/lib/control-sync.sh), never an exec as postgres.\nCREATE TABLE control_sync.price_lists (\n  target text PRIMARY KEY REFERENCES control_sync.targets (target) ON DELETE CASCADE,\n  items jsonb NOT NULL,\n  read_at timestamptz NOT NULL\n);\nGRANT SELECT, INSERT, UPDATE ON control_sync.price_lists TO control_sync_relay;\nGRANT SELECT ON control_sync.price_lists TO control_writer;\n\nCREATE FUNCTION control_sync.remove_target(p_target text)\nRETURNS boolean\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  removed integer;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n;\n  DELETE FROM control_sync.targets WHERE target = p_target;\n  GET DIAGNOSTICS removed = ROW_COUNT;\n  RETURN removed = 1;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.remove_target(text) FROM PUBLIC;\nGRANT EXECUTE ON FUNCTION control_sync.remove_target(text) TO control_sync_relay;\n\nCOMMIT;\n","049_control_bus_regions.sql":"BEGIN;\n\n-- Two regions on the one control bus (milestone 2): each target numbers its own stream,\n-- a command goes to one target or to every target, and a target names the region it serves. The portal cluster's set\n-- runs this file; a data-path cluster's set skips it, as 044. A single-database deployment runs it.\n--\n-- After 047 and 048: commands are routed by region here, so add_target no longer refuses a second target (047's\n-- refusal, replaced below), and 048's remove_target, which deletes the targets row, takes the target's target_seq\n-- and outbox rows with it (both reference targets ON DELETE CASCADE, as its acks, clusters and price_lists do).\n--\n-- target_seq\n-- ----------\n-- One counter per target: the last seq given to that target's stream. A command for two targets is two outbox rows,\n-- each under its own target's next number, so a target never sees a hole where a command for another one went (the\n-- agent reads a hole as a lost message). A target added later starts from seq_counter's value, and its first send is\n-- a resync, as before; the numbers it is given are its own from there.\n--\n-- seq_counter (041) stays, and every writer still takes its row lock first: it serializes the writers in commit\n-- order exactly as before, and a writer then locks only target_seq rows, so two writers never deadlock on them. Its n\n-- counts the commands written (one per command, however many targets it went to).\n--\n-- outbox.target\n-- -------------\n-- The target the row is for; the key becomes (target, seq). A transaction's rows for one target stay consecutive in\n-- that target's numbers (its txid is kept). Rows written before this file were for every target, numbered in the one\n-- shared stream every target's numbers continue from: they become one row per target, under the same seq.\n--\n-- targets.region\n-- --------------\n-- The region the target serves (one target per region), the lookup from a Resource's region to the target its\n-- commands go to. A target named datapath-\u003cregion\u003e is given its region; another name (a plan-01 region carried\n-- over by 044) has none until it is set.\n\n-- The region of each target.\nALTER TABLE control_sync.targets\n  ADD COLUMN region text CHECK (region ~ '^[a-z0-9]+(-[a-z0-9]+)*$'),\n  ADD CONSTRAINT targets_region_key UNIQUE (region);\nUPDATE control_sync.targets SET region = substr(target, 10) WHERE target ~ '^datapath-[a-z0-9]+(-[a-z0-9]+)*$';\n\n-- One counter per target, from the shared counter's value: every existing target was sent every command so far.\nCREATE TABLE control_sync.target_seq (\n  target text PRIMARY KEY REFERENCES control_sync.targets (target) ON DELETE CASCADE,\n  n bigint NOT NULL CHECK (n \u003e= 0)\n);\nINSERT INTO control_sync.target_seq (target, n)\n  SELECT t.target, c.n FROM control_sync.targets t CROSS JOIN control_sync.seq_counter c;\n\n-- Each outbox row is for one target.\nALTER TABLE control_sync.outbox DROP CONSTRAINT outbox_pkey, ADD COLUMN target text;\nINSERT INTO control_sync.outbox (target, seq, txid, command, version, body, correlation_id, wants_answer, created_at)\n  SELECT t.target, o.seq, o.txid, o.command, o.version, o.body, o.correlation_id, o.wants_answer, o.created_at\n  FROM control_sync.outbox o CROSS JOIN control_sync.targets t WHERE o.target IS NULL;\nDELETE FROM control_sync.outbox WHERE target IS NULL;\nALTER TABLE control_sync.outbox\n  ALTER COLUMN target SET NOT NULL,\n  ADD CONSTRAINT outbox_target_fkey FOREIGN KEY (target) REFERENCES control_sync.targets (target) ON DELETE CASCADE,\n  ADD PRIMARY KEY (target, seq);\n\n-- The capture: one row per target, each under that target's next number. Off while no target exists, as before.\nCREATE OR REPLACE FUNCTION control_sync.capture() RETURNS trigger\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  stored jsonb;\n  pk jsonb := '{}'::jsonb;\n  col text;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n + 1;\n  stored := CASE WHEN TG_OP = 'DELETE' THEN to_jsonb(OLD) ELSE to_jsonb(NEW) END;\n  FOREACH col IN ARRAY TG_ARGV LOOP\n    pk := pk || jsonb_build_object(col, stored -\u003e col);\n  END LOOP;\n  WITH numbered AS (\n    UPDATE control_sync.target_seq SET n = n + 1 RETURNING target, n\n  )\n  INSERT INTO control_sync.outbox (target, seq, txid, command, version, body)\n  SELECT numbered.target, numbered.n, pg_current_xact_id(),\n         TG_TABLE_NAME || CASE WHEN TG_OP = 'DELETE' THEN '.delete' ELSE '.upsert' END, 1,\n         CASE WHEN TG_OP = 'DELETE' THEN pk ELSE stored END\n  FROM numbered;\n  RETURN NULL;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.capture() FROM PUBLIC;\n\n-- Any other command, to one target (p_target) or to every target (p_every). A command for one target that names\n-- none goes to the only target, and is refused while there are several: the caller must say which. Returns one row\n-- (target, seq) per row written: none while no target exists, or when the named one does not.\nCREATE FUNCTION control_sync.enqueue_to(p_command text, p_version integer, p_body jsonb, p_correlation_id text,\n                                        p_wants_answer boolean, p_target text, p_every boolean)\nRETURNS TABLE (target text, seq bigint)\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\n#variable_conflict use_column\nBEGIN\n  IF octet_length(p_body::text) \u003e 200 * 1024 THEN\n    RAISE EXCEPTION 'control_sync.enqueue: % body is larger than 200 KB', p_command\n      USING ERRCODE = 'program_limit_exceeded';\n  END IF;\n  IF p_every AND p_target IS NOT NULL THEN\n    RAISE EXCEPTION 'control_sync.enqueue_to: % goes to every target, so it names none', p_command\n      USING ERRCODE = 'invalid_parameter_value';\n  END IF;\n  UPDATE control_sync.seq_counter SET n = n + 1;\n  IF NOT p_every AND p_target IS NULL AND (SELECT count(*) FROM control_sync.target_seq) \u003e 1 THEN\n    RAISE EXCEPTION 'control_sync.enqueue_to: % is for one target and there are several: name it', p_command\n      USING ERRCODE = 'invalid_parameter_value';\n  END IF;\n  RETURN QUERY\n    WITH numbered AS (\n      UPDATE control_sync.target_seq s SET n = s.n + 1 WHERE p_target IS NULL OR s.target = p_target\n      RETURNING s.target, s.n\n    )\n    INSERT INTO control_sync.outbox AS o (target, seq, txid, command, version, body, correlation_id, wants_answer)\n    SELECT numbered.target, numbered.n, pg_current_xact_id(), p_command, p_version, p_body, p_correlation_id,\n           p_wants_answer\n    FROM numbered\n    RETURNING o.target, o.seq;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.enqueue_to(text, integer, jsonb, text, boolean, text, boolean) FROM PUBLIC;\n\n-- 044's signature, kept for its callers: a command for the only target (NULL while none exists); refused while there\n-- are several (enqueue_to says which).\nCREATE OR REPLACE FUNCTION control_sync.enqueue(p_command text, p_version integer, p_body jsonb,\n                                                p_correlation_id text DEFAULT NULL, p_wants_answer boolean DEFAULT false)\nRETURNS bigint\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  written bigint;\nBEGIN\n  SELECT e.seq INTO written\n  FROM control_sync.enqueue_to(p_command, p_version, p_body, p_correlation_id, p_wants_answer, NULL, false) e;\n  RETURN written;\nEND;\n$$;\n\n-- Adding a target, with its region: its counter starts at the shared counter's value, in the transaction that holds\n-- that counter's row (as 044's add_target), and its first send is a resync. Adding it again changes nothing.\nCREATE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text, p_region text)\nRETURNS boolean\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  added integer;\nBEGIN\n  UPDATE control_sync.seq_counter SET n = n;\n  INSERT INTO control_sync.targets (target, bus_namespace_fqdn, topic, command_subscription, request_subscription,\n                                    region)\n  VALUES (p_target, p_bus_namespace_fqdn, p_topic, 't-' || p_target, 'r-' || p_target, p_region)\n  ON CONFLICT (target) DO NOTHING;\n  GET DIAGNOSTICS added = ROW_COUNT;\n  IF added = 1 THEN\n    INSERT INTO control_sync.target_seq (target, n) SELECT p_target, n FROM control_sync.seq_counter;\n  END IF;\n  RETURN added = 1;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.add_target(text, text, text, text) FROM PUBLIC;\n\n-- 044's signature, which 047 made refuse a second target: the region from a datapath-\u003cregion\u003e name, none for\n-- another, and no refusal.\nCREATE OR REPLACE FUNCTION control_sync.add_target(p_target text, p_bus_namespace_fqdn text, p_topic text)\nRETURNS boolean\nLANGUAGE sql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\n  SELECT control_sync.add_target(p_target, p_bus_namespace_fqdn, p_topic,\n                                 CASE WHEN p_target ~ '^datapath-[a-z0-9]+(-[a-z0-9]+)*$' THEN substr(p_target, 10) END);\n$$;\n\n-- The target that serves a region, or NULL: what control-api's login may know of the registry beyond the names.\nCREATE FUNCTION control_sync.region_target(p_region text) RETURNS text\nLANGUAGE sql STABLE SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\n  SELECT target FROM control_sync.targets WHERE region = p_region;\n$$;\nREVOKE ALL ON FUNCTION control_sync.region_target(text) FROM PUBLIC;\n\nGRANT SELECT ON control_sync.target_seq TO control_sync_relay;\nGRANT EXECUTE ON FUNCTION control_sync.add_target(text, text, text, text) TO control_sync_relay;\nGRANT EXECUTE ON FUNCTION control_sync.region_target(text) TO control_sync_relay, control_writer;\nGRANT EXECUTE ON FUNCTION control_sync.enqueue_to(text, integer, jsonb, text, boolean, text, boolean)\n  TO control_writer;\n\nCOMMIT;\n","050_credited_nano.sql":"BEGIN;\n-- Portal cluster: without public.wallet_accounts (no billing table here); only the balance alert's rename and guard.\n-- A copy of services/spend-control/migrations/050_credited_nano.sql with only this cluster's statements; nothing added.\n\n-- wallet_accounts.balance_nano was never what is left: it is the total ever credited, the sum\n-- of the wallet's wallet_credits rows (010, 012), and only grows. What is left is\n-- credited_nano - settled_nano, minus what Redis holds. The name said \"what is left\", so the\n-- column is renamed to what it holds. No customers yet, so no compatibility period: this\n-- migration and the images that read the new name are deployed together.\n--\n-- A rename keeps the column's data, its CHECK, and every column grant (012, 013, 019, 021, 038\n-- grant or revoke by column; PostgreSQL ties a grant to the column, not its name). The CHECK\n-- constraints keep the names 010 and 037 gave them; they are renamed too, so no name says\n-- balance. A plpgsql body is text and does not follow a rename: 037's guard names the alert's\n-- column, so it is replaced below with the new name and otherwise unchanged.\n\n-- A balance alert records the wallet's credited total it was decided on (037).\nALTER TABLE control.balance_alerts RENAME COLUMN balance_nano TO credited_nano;\nALTER TABLE control.balance_alerts\n  RENAME CONSTRAINT balance_alerts_balance_nano_check TO balance_alerts_credited_nano_check;\n\nCREATE OR REPLACE FUNCTION control.guard_balance_alert() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.alert_id, NEW.resource_id, NEW.percent, NEW.currency, NEW.credited_nano, NEW.settled_nano,\n         NEW.created_at)\n     IS DISTINCT FROM\n     ROW(OLD.alert_id, OLD.resource_id, OLD.percent, OLD.currency, OLD.credited_nano, OLD.settled_nano,\n         OLD.created_at)\n     OR NEW.attempts \u003c OLD.attempts\n     OR (OLD.state \u003c\u003e 'pending' AND NEW.state IS DISTINCT FROM OLD.state)\n     OR (OLD.state = 'pending' AND NEW.state = 'superseded')\n     OR (OLD.sent_at IS NOT NULL AND NEW.sent_at IS DISTINCT FROM OLD.sent_at)\n     OR (OLD.abandoned_at IS NOT NULL AND NEW.abandoned_at IS DISTINCT FROM OLD.abandoned_at)\n     OR (OLD.rearmed_at IS NOT NULL AND NEW.rearmed_at IS DISTINCT FROM OLD.rearmed_at) THEN\n    RAISE EXCEPTION 'a balance alert is decided once; it can only be sent, abandoned or re-armed'\n      USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\n\nCOMMIT;\n","050_resource_key_endings.sql":"BEGIN;\n\n-- A Resource's two key endings (BL-4), stored when the portal writes a key: both at purchase, one after a regenerate\n-- that APIM applied, none on a timeout. Each is the key masked but for its last 4 characters, never the key; NULL\n-- until the portal has written one (a Resource bought before this file, or a v1 purchase's secondary). The portal's\n-- GET /resources/{id}/key-endings reads them here, never from APIM; a key changed outside the portal leaves them\n-- stale.\n--\n-- Both cluster sets run this file: control.resources is one of the 8 tables copied to each data-path database (042),\n-- and the applier refuses a row whose columns differ from its copy's (schema_mismatch), so the copy needs the same\n-- columns. The masked endings ride that copy. The table grants (014, 041, 042) cover the new columns.\n\nALTER TABLE control.resources\n  ADD COLUMN primary_key_masked text,\n  ADD COLUMN secondary_key_masked text;\n\nCOMMIT;\n","053_switch_controls.sql":"BEGIN;\n-- Portal cluster: without public.switch_outcomes (the switch's tables are on the data-path cluster); only control.purchases_paused.\n-- A copy of services/spend-control/migrations/053_switch_controls.sql with only this cluster's statements; nothing added.\n\n-- Switching clusters by copying the wallets (prototype): the switch's two controls.\n--\n-- switch_outcomes, on B: abort and opening B each insert the switch's one outcome; the first\n-- insert wins, so only one of them can happen. A retry whose answer was lost reads the same row.\n-- control.purchases_paused, on A: while paused, control-api starts no new purchase or top-up;\n-- those already started finish. One row.\n\n\nCREATE TABLE control.purchases_paused (\n  one        boolean     PRIMARY KEY DEFAULT true CHECK (one),\n  paused     boolean     NOT NULL,\n  switch_id  text        CHECK (switch_id IS NULL OR btrim(switch_id) \u003c\u003e ''),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CHECK (paused = (switch_id IS NOT NULL))\n);\nINSERT INTO control.purchases_paused (paused) VALUES (false);\nGRANT SELECT, UPDATE (paused, switch_id, updated_at) ON control.purchases_paused TO control_writer;\n\nCOMMIT;\n","057_control_bus_credited_nano.sql":"BEGIN;\n\n-- The control bus's copy of each wallet names its credited total as the wallet does (migration 050):\n-- credited_nano, everything ever credited, not a balance.\n\nALTER TABLE control_sync.wallet_balances RENAME COLUMN balance_nano TO credited_nano;\n\nCOMMIT;\n","060_switch_portal.sql":"BEGIN;\n\n-- Switching clusters on split clusters: the portal's side (the portal cluster's set runs this file; a data-path\n-- cluster's set skips it). The portal's operator-control-api drives the switch over the control bus, so what it keeps\n-- of one is here:\n--\n-- control.switches\n-- ----------------\n-- One row per switch, from the operator's prepare to its end:\n--   prepared  price writes are frozen (operator-control-api refuses them); B's target may now be added, with no region\n--   started   the portal's purchases were paused and every purchase command already sent to A was answered, then\n--             switch.start was sent to B's target and applied\n--   moved     B said open and the region moved from A's target to B's (control_sync.move_region): purchases resume,\n--             now sent to B\n--   aborted   B's switch was aborted before it opened: purchases resume, still sent to A\n-- At most one switch is prepared or started at a time. A row is never deleted; its state only moves forward.\n-- Written as control_sync_relay, the login only operator-control-api holds (048): user-control-api, which holds\n-- control_writer, reads it and cannot start, move or end a switch.\n--\n-- control_sync.move_region\n-- ------------------------\n-- The region moves from A's target to B's in one transaction, and only from a started switch: A's target must hold\n-- the region and B's must hold none (targets.region is unique, 049). The caller asks B first and calls this only when\n-- B says open.\nCREATE TABLE control.switches (\n  switch_id text PRIMARY KEY CHECK (switch_id ~ '^[A-Za-z0-9._-]{1,128}$'),\n  region text NOT NULL CHECK (region ~ '^[a-z0-9]+(-[a-z0-9]+)*$'),\n  source_target text NOT NULL,\n  target text NOT NULL,\n  source_cluster text NOT NULL CHECK (source_cluster ~ '^[A-Za-z0-9._-]{1,128}$'),\n  state text NOT NULL DEFAULT 'prepared' CHECK (state IN ('prepared', 'started', 'moved', 'aborted')),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now(),\n  CHECK (target \u003c\u003e source_target)\n);\nCREATE UNIQUE INDEX switches_one_running ON control.switches ((true)) WHERE state IN ('prepared', 'started');\n\n-- A state only moves forward: prepared -\u003e started | aborted, started -\u003e moved | aborted; nothing else changes. Only\n-- control_sync.move_region sets moved (it runs as its owner, so a caller's own UPDATE to moved is refused): a switch\n-- is never marked moved without its region moving in the same transaction.\nCREATE FUNCTION control.guard_switches() RETURNS trigger\nLANGUAGE plpgsql SET search_path = pg_catalog, pg_temp AS $$\nBEGIN\n  IF TG_OP = 'DELETE' THEN\n    RAISE EXCEPTION 'control.switches: a switch is never deleted' USING ERRCODE = 'check_violation';\n  END IF;\n  IF (NEW.switch_id, NEW.region, NEW.source_target, NEW.target, NEW.source_cluster, NEW.created_at)\n     IS DISTINCT FROM (OLD.switch_id, OLD.region, OLD.source_target, OLD.target, OLD.source_cluster, OLD.created_at) THEN\n    RAISE EXCEPTION 'control.switches: only a switch''s state changes' USING ERRCODE = 'check_violation';\n  END IF;\n  IF NEW.state IS DISTINCT FROM OLD.state AND NOT (\n       (OLD.state = 'prepared' AND NEW.state IN ('started', 'aborted'))\n    OR (OLD.state = 'started' AND NEW.state IN ('moved', 'aborted'))) THEN\n    RAISE EXCEPTION 'control.switches: % cannot become %', OLD.state, NEW.state USING ERRCODE = 'check_violation';\n  END IF;\n  IF NEW.state = 'moved' AND OLD.state \u003c\u003e 'moved' AND current_user IN ('control_sync_relay', 'control_writer') THEN\n    RAISE EXCEPTION 'control.switches: only control_sync.move_region moves a switch' USING ERRCODE = 'check_violation';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER switches_forward_only BEFORE UPDATE OR DELETE ON control.switches\n  FOR EACH ROW EXECUTE FUNCTION control.guard_switches();\n\nGRANT SELECT, INSERT, UPDATE (state, updated_at) ON control.switches TO control_sync_relay;\nGRANT SELECT ON control.switches TO control_writer;\n\nCREATE FUNCTION control_sync.move_region(p_switch_id text) RETURNS void\nLANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\nDECLARE\n  s control.switches%ROWTYPE;\nBEGIN\n  SELECT * INTO s FROM control.switches WHERE switch_id = p_switch_id FOR UPDATE;\n  IF NOT FOUND THEN\n    RAISE EXCEPTION 'switch_unknown: no switch %', p_switch_id USING ERRCODE = 'no_data_found';\n  END IF;\n  IF s.state \u003c\u003e 'started' THEN\n    RAISE EXCEPTION 'switch_not_started: switch % is %', p_switch_id, s.state USING ERRCODE = 'check_violation';\n  END IF;\n  UPDATE control_sync.targets SET region = NULL WHERE target = s.source_target AND region = s.region;\n  IF NOT FOUND THEN\n    RAISE EXCEPTION 'region_not_on_source: % does not hold region %', s.source_target, s.region\n      USING ERRCODE = 'check_violation';\n  END IF;\n  UPDATE control_sync.targets SET region = s.region WHERE target = s.target AND region IS NULL;\n  IF NOT FOUND THEN\n    RAISE EXCEPTION 'target_not_ready: % is not a target without a region', s.target USING ERRCODE = 'check_violation';\n  END IF;\n  UPDATE control.switches SET state = 'moved', updated_at = now() WHERE switch_id = p_switch_id;\nEND;\n$$;\nREVOKE ALL ON FUNCTION control_sync.move_region(text) FROM PUBLIC;\nGRANT EXECUTE ON FUNCTION control_sync.move_region(text) TO control_sync_relay;\n\nCOMMIT;\n","064_wallet_copy_from_region_holder.sql":"BEGIN;\n\n-- The portal's wallet copy (control_sync.wallet_balances) takes a reading only from the target that holds the\n-- Resource's region (PR 114 review, Kashif's item 4). The copy kept the newest reading from any target, so after a\n-- switch moved the region from A's target to B's, a late reading of A could replace B's row and hide B's spend.\n-- The portal cluster's set runs this file; a data-path cluster's set skips it.\n--\n-- control_sync.holds_wallet(target, resource_id): true when `target` serves the region of the Resource, or when that\n-- cannot be told: no such Resource, or no target serves its region by name (a Resource from before regions). The\n-- writer, control_sync_relay, reads no control table, so the function reads them as its owner.\nCREATE FUNCTION control_sync.holds_wallet(p_target text, p_resource_id text) RETURNS boolean\nLANGUAGE sql STABLE SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $$\n  SELECT coalesce((SELECT t.target = p_target FROM control.resources r\n                   JOIN control_sync.targets t ON t.region = r.region\n                   WHERE r.resource_id::text = p_resource_id), true);\n$$;\nREVOKE ALL ON FUNCTION control_sync.holds_wallet(text, text) FROM PUBLIC;\nGRANT EXECUTE ON FUNCTION control_sync.holds_wallet(text, text) TO control_sync_relay;\n\nCOMMIT;\n","066_resource_key_hashes.sql":"BEGIN;\n\n-- A Resource's two key hashes: each slot's key as the SHA-256 of its UTF-8 bytes, lowercase hex, after a trim\n-- (control_api/key_region_map.py entry_name) -- the name of the key's entry in the key -\u003e region map the buyer\n-- entry's Worker reads. Stored when the portal writes a key, as the endings are (050): both at purchase, one after a\n-- regenerate that APIM applied. A regenerate deletes the old key's entry by the hash stored here. Never the key.\n-- NULL for a key written before this file, or a v1 purchase's secondary; nothing fills them in later (the holder of\n-- such a key buys a new one).\n--\n-- Both cluster sets run this file, as 050: control.resources is copied to each data-path database (042) and the\n-- applier refuses a row whose columns differ from its copy's (schema_mismatch). The table grants (014, 041, 042)\n-- cover the new columns.\n\nALTER TABLE control.resources\n  ADD COLUMN primary_key_hash text CHECK (primary_key_hash ~ '^[0-9a-f]{64}$'),\n  ADD COLUMN secondary_key_hash text CHECK (secondary_key_hash ~ '^[0-9a-f]{64}$');\n\nCOMMIT;\n","067_password_resets.sql":"BEGIN;\n\n-- A forgotten password, reset by a link emailed to the account's verified address (control_api/password_reset.py).\n--\n-- One row per link sent. The link carries 256 random bits; only their SHA-256 is kept, as a session's is (015), so\n-- the table cannot be turned back into a link. A link works once, until it expires (10 minutes by default), and only\n-- while it is the account's newest: a newer link, a reset with it, a signed-in password change or an operator's reset\n-- closes it. The rows are also the send history the cooldown and the hourly cap count; a row whose email never left\n-- (send_failed_at) is not counted.\n--\n-- Personal data, beside the contacts (036): read by control-api only. billing_app is granted nothing; nothing here\n-- reaches billing-mgmt, OpenMeter or APIM, and the cluster switch copies none of it (061).\n\nCREATE TABLE control.password_resets (\n  reset_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid NOT NULL REFERENCES control.user_accounts(user_id),\n  -- The address this link was sent to.\n  email_normalized text NOT NULL CHECK (email_normalized = lower(btrim(email_normalized))),\n  token_sha256 bytea NOT NULL UNIQUE CHECK (octet_length(token_sha256) = 32),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  expires_at timestamptz NOT NULL,\n  -- Set when the password is reset with it.\n  used_at timestamptz,\n  -- Set when something else ends it: a newer link, a password change, an operator's reset, another link's reset.\n  closed_at timestamptz,\n  send_failed_at timestamptz,\n  CHECK (expires_at \u003e created_at),\n  CHECK (used_at IS NULL OR closed_at IS NULL)\n);\n\nCREATE INDEX password_resets_user ON control.password_resets(user_id, created_at DESC);\n\n-- A link's hash, address and times never change; it is used, closed or marked unsent once.\nCREATE FUNCTION control.guard_password_reset() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF ROW(NEW.reset_id, NEW.user_id, NEW.email_normalized, NEW.token_sha256, NEW.created_at, NEW.expires_at)\n     IS DISTINCT FROM\n     ROW(OLD.reset_id, OLD.user_id, OLD.email_normalized, OLD.token_sha256, OLD.created_at, OLD.expires_at)\n     OR (OLD.used_at IS NOT NULL AND NEW.used_at IS DISTINCT FROM OLD.used_at)\n     OR (OLD.closed_at IS NOT NULL AND NEW.closed_at IS DISTINCT FROM OLD.closed_at)\n     OR (OLD.send_failed_at IS NOT NULL AND NEW.send_failed_at IS DISTINCT FROM OLD.send_failed_at) THEN\n    RAISE EXCEPTION 'a password reset link can only be used, closed or marked unsent once'\n      USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\nCREATE TRIGGER password_reset_guard BEFORE UPDATE ON control.password_resets\nFOR EACH ROW EXECUTE FUNCTION control.guard_password_reset();\n\n-- control-api reads and writes them; nothing deletes them.\nGRANT SELECT, INSERT, UPDATE ON control.password_resets TO control_writer;\n\nCOMMIT;\n","068_purchase_limits.sql":"BEGIN;\n\n-- The private preview's purchase limits: one row, read on each purchase and top-up, set by the operator\n-- (PUT /internal/v1/purchase-limits); SQL only in development and debugging (deploy/RUNBOOK-purchase-limits.md).\n--   max_resources_per_plan_region: N, the Resources a user may hold of one plan in one region; -1 is no limit.\n--   max_funding_nano:              M, the money a user may pay in within the window, in nano (1 USD = 10^9);\n--                                  0 stops all funding. Whole cents only, and at most 2^53 - 1 like every\n--                                  amount the API takes (models.PurchaseLimits): a larger row could not be shown.\n--   funding_window_days:           D, that window, in whole days; -1 is no limit on funding at all. At most\n--                                  3650, so `now() - D days` cannot overflow.\n-- Code reads a missing row as this seed (control_api.purchase_limits.DEFAULTS). Portal only: no data path\n-- reads it.\n\nCREATE TABLE control.purchase_limits (\n  one                           boolean     PRIMARY KEY DEFAULT true CHECK (one),\n  max_resources_per_plan_region integer     NOT NULL CHECK (max_resources_per_plan_region = -1\n                                                            OR max_resources_per_plan_region \u003e= 1),\n  max_funding_nano              bigint      NOT NULL CHECK (max_funding_nano \u003e= 0)\n                                                     CHECK (max_funding_nano \u003c= 9007199254740991)\n                                                     CHECK (max_funding_nano % 10000000 = 0),\n  funding_window_days           integer     NOT NULL CHECK (funding_window_days = -1\n                                                            OR funding_window_days BETWEEN 1 AND 3650),\n  updated_at                    timestamptz NOT NULL DEFAULT now()\n);\nINSERT INTO control.purchase_limits (max_resources_per_plan_region, max_funding_nano, funding_window_days)\n  VALUES (1, 50000000000, 1);\n-- INSERT too: a PUT writes the row back when it was deleted.\nGRANT SELECT, INSERT, UPDATE ON control.purchase_limits TO control_writer;\n\nCOMMIT;\n","069_plan_version_models_add_only.sql":"BEGIN;\n\n-- Goal GA pricing, Ask 1 (owner's decision, 2026-11-18, Option A): a plan version may gain\n-- models while it is a draft or active, so a new model reaches plans already bought. It never\n-- loses one: plan_version_models_immutable still refuses every update and delete. A retired\n-- version gains none. FOR SHARE makes a concurrent status change wait for this insert, or this\n-- insert see it. Replaces 061's draft-only function (014's trigger name stays); the data-path\n-- cluster runs this file as it is, so the control bus can copy an added model there too.\nCREATE OR REPLACE FUNCTION control.guard_plan_version_models() RETURNS trigger LANGUAGE plpgsql AS $$\nDECLARE\n  version_status text;\nBEGIN\n  SELECT status INTO version_status FROM control.plan_versions\n    WHERE plan_version_id = NEW.plan_version_id FOR SHARE;\n  IF version_status IS NULL OR version_status NOT IN ('draft', 'active') THEN\n    RAISE EXCEPTION 'models can be added only to a draft or active plan version' USING ERRCODE = '23514';\n  END IF;\n  RETURN NEW;\nEND;\n$$;\n\nCOMMIT;\n","070_user_contacts_billing_address_optional.sql":"BEGIN;\n\n-- Sign-up may leave the billing address out (CONTROL_SIGNUP_BILLING_ADDRESS, off by default): the contact row then\n-- holds the email alone. The address is whole or absent: its mandatory parts are all set or all null, and the\n-- optional lines (line 2, state) only beside them. Each column keeps its own CHECK from 036, which passes a null.\n-- A card payment from an email-only row makes the Stripe Customer from the email alone (control_api/payments.py).\n\nALTER TABLE control.user_contacts\n  ALTER COLUMN billing_name DROP NOT NULL,\n  ALTER COLUMN billing_line1 DROP NOT NULL,\n  ALTER COLUMN billing_city DROP NOT NULL,\n  ALTER COLUMN billing_postal_code DROP NOT NULL,\n  ALTER COLUMN billing_country DROP NOT NULL,\n  ADD CONSTRAINT user_contacts_billing_address_whole CHECK (\n    (billing_name IS NOT NULL AND billing_line1 IS NOT NULL AND billing_city IS NOT NULL\n     AND billing_postal_code IS NOT NULL AND billing_country IS NOT NULL)\n    OR (billing_name IS NULL AND billing_line1 IS NULL AND billing_line2 IS NULL AND billing_city IS NULL\n        AND billing_state IS NULL AND billing_postal_code IS NULL AND billing_country IS NULL));\n\nCOMMIT;\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"billing-migrations","namespace":"wallet-billing"}}
