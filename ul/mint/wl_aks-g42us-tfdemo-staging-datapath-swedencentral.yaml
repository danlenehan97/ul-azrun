    creationTimestamp: "2026-11-10T04:21:52Z"
    generation: 3
    name: redis-spend
    namespace: wallet-billing
    resourceVersion: "4458032"
    uid: 83b5b5d6-c3b4-489a-8a75-ec91cc4bc03b
  spec:
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    podManagementPolicy: Parallel
    replicas: 9
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: redis-spend
    serviceName: redis-spend
    template:
      metadata:
        labels:
          app: redis-spend
      spec:
        automountServiceAccountToken: false
        containers:
        - args:
          - redis-server
          - --port
          - "6379"
          - --cluster-enabled
          - "yes"
          - --cluster-config-file
          - /data/nodes.conf
          - --cluster-node-timeout
          - "5000"
          - --cluster-allow-replica-migration
          - "no"
          - --cluster-announce-ip
          - $(POD_NAME).redis-spend
          - --cluster-announce-hostname
          - $(POD_NAME).redis-spend
          - --cluster-preferred-endpoint-type
          - hostname
          - --cluster-announce-human-nodename
          - $(POD_NAME).$(NODE_NAME)
          - --maxmemory
          - 256mb
          - --maxmemory-policy
          - noeviction
          - --appendonly
          - "yes"
          - --appendfsync
          - everysec
          - --save
          - ""
          command:
          - sh
          - /etc/redis-acl/acl.sh
          - start
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: spec.nodeName
          image: redis:8.6-alpine
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - |
                  read -r REDISCLI_AUTH < /etc/redis-auth/REDIS_PASSWORD || :
                  export REDISCLI_AUTH
                  at() { h=$1; shift; redis-cli -h "$h" -p 6379 "$@" | tr -d '\r'; }
                  at 127.0.0.1 role | head -1 | grep -qx master || exit 0
                  myid=$(at 127.0.0.1 cluster myid)
                  synced=$(for host in $(at 127.0.0.1 cluster replicas "$myid" | awk '$3 !~ /fail|noaddr|handshake/ &&
                      $8 == "connected" { split($2, a, ","); h = a[2]; if (h == "") { split(a[1], b, ":"); h = b[1] }; print h }'); do
                    info=$(at "$host" info replication) || continue
                    echo "$info" | grep -qx 'master_link_status:up' || continue
                    offset=$(echo "$info" | sed -n 's/^slave_repl_offset://p')
                    echo "${offset:-0} $host"
                  done | sort -rn | awk '{ print $2 }')
                  [ -n "$synced" ] || { echo "handover: no replica in sync"; exit 1; }
                  # Writes stop here (20 s at most), so this node's offset is the last write any replica can
                  # hold: the new primary is marked only if it had all of it when promoted. An election (this
                  # node cut off from the bus) can promote a replica behind it, which is not marked.
                  start=$(date +%s)
                  at 127.0.0.1 client pause 20000 write >/dev/null
                  fail() { at 127.0.0.1 client unpause >/dev/null; echo "handover: $1"; exit 1; }
                  mine=$(at 127.0.0.1 info replication)
                  history=$(echo "$mine" | sed -n 's/^master_replid://p')
                  last=$(echo "$mine" | sed -n 's/^master_repl_offset://p')
                  best=""
                  for host in $synced; do
                    reply=$(at "$host" cluster failover)
                    [ "$reply" = OK ] && { best=$host; break; }
                    echo "handover: $host refused: $reply"
                  done
                  [ -n "$best" ] || fail "no replica took the shard"
                  id=$(at "$best" cluster myid)
                  tries=0
                  until at "$best" role | head -1 | grep -qx master; do
                    tries=$((tries + 1))
                    [ "$tries" -lt 20 ] || fail "$best not primary after 10 s"
                    sleep 0.5
                  done
                  info=$(at "$best" info replication)
                  replid=$(echo "$info" | sed -n 's/^master_replid://p')
                  second=$(echo "$info" | sed -n 's/^second_repl_offset://p')
                  [ "$(echo "$info" | sed -n 's/^master_replid2://p')" = "$history" ] \
                    || fail "$best's history is not this node's: not marked"
                  [ "$((second - 1))" -ge "$last" ] \
                    || fail "$best promoted at offset $((second - 1)), behind this node's last write $last: not marked"
                  [ "$(($(date +%s) - start))" -lt 18 ] || fail "the write pause ran out before $best was primary: not marked"
                  ranges=$(at "$best" cluster nodes | awk '$3 ~ /myself/ { for (i = 9; i <= NF; i++) if ($i !~ /^\[/) print $i }')
                  bucket=0
                  while [ "$bucket" -lt 1024 ]; do
                    tag=$(printf '{b%04d}' "$bucket")
                    slot=$(at "$best" cluster keyslot "$tag")
                    for range in $ranges; do
                      if [ "$slot" -ge "${range%-*}" ] && [ "$slot" -le "${range#*-}" ]; then
                        at "$best" set "p:$tag" "$id $replid" >/dev/null
                        at 127.0.0.1 client unpause >/dev/null  # paused writes now go to $best (MOVED)
                        exit 0
                      fi
                    done
                    bucket=$((bucket + 1))
                  done
                  fail "no bucket in $best's slots, not marked"
          name: redis
          ports:
          - containerPort: 6379
            name: redis
            protocol: TCP
          - containerPort: 16379
            name: bus
            protocol: TCP
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - |
                read -r REDISCLI_AUTH < /etc/redis-auth/REDIS_PASSWORD || :
                export REDISCLI_AUTH
                at() { redis-cli -h 127.0.0.1 -p 6379 "$@" | tr -d '\r'; }
                at ping | grep -qx PONG || exit 1
                at role | head -1 | grep -qx slave || exit 0
                at info replication | grep -qx 'master_link_status:up' && exit 0
                at cluster info | grep -qx 'cluster_state:fail'
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /data
            name: data
          - mountPath: /run/redis
            name: run
          - mountPath: /etc/redis-acl
            name: acl
            readOnly: true
          - mountPath: /etc/redis-auth
            name: redis-auth
            readOnly: true
          - mountPath: /etc/redis-monitor-auth
            name: redis-monitor-auth
            readOnly: true
          - mountPath: /etc/redis-check-auth
            name: redis-check-auth
            readOnly: true
        dnsConfig:
          options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "4"
        dnsPolicy: ClusterFirst
        priorityClassName: tollgate-money-path
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext:
          fsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        terminationGracePeriodSeconds: 30
        topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: redis-spend
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
        volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: run
        - configMap:
            defaultMode: 420
            name: redis-acl-bm77mgc8h5
          name: acl
        - name: redis-auth
          secret:
            defaultMode: 288
            secretName: redis-auth
        - name: redis-monitor-auth
          secret:
            defaultMode: 288
            optional: true
            secretName: redis-monitor-auth
        - name: redis-check-auth
          secret:
            defaultMode: 288
            optional: true
            secretName: redis-check-auth
    updateStrategy:
      rollingUpdate:
        partition: 0
      type: RollingUpdate
    volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
        storageClassName: managed-csi
        volumeMode: Filesystem
      status:
        phase: Pending
