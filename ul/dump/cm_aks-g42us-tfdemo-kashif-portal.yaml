A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (ResponseCode, LastErrorReason) (rate(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\", ResponseCode!~\\\"2..\\\"}[5m]))\",\n          \"legendFormat\": \"{{ResponseCode}} {{LastErrorReason}}\",\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"normal\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 9,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"id\": 9\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Backend responses / s by code\",\n      \"description\": \"What the model backends answered, for the requests that reached them.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (BackendResponseCode) (rate(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\", BackendResponseCode!=\\\"0\\\"}[5m]))\",\n          \"legendFormat\": \"{{BackendResponseCode}}\",\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"normal\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 9,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"id\": 10\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Latency\",\n      \"collapsed\": false,\n      \"panels\": [],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 17,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"id\": 11\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Request p50 / p95 / p99\",\n      \"description\": \"The whole request, from the gateway receiving it to the last byte sent.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(DurationInMs_Milliseconds_bucket{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[5m])))\",\n          \"legendFormat\": \"p50\",\n          \"range\": true\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(DurationInMs_Milliseconds_bucket{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[5m])))\",\n          \"legendFormat\": \"p95\",\n          \"range\": true\n        },\n        {\n          \"refId\": \"C\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(DurationInMs_Milliseconds_bucket{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[5m])))\",\n          \"legendFormat\": \"p99\",\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"none\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 18,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"id\": 12\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"p95 by part: backend, gateway, client\",\n      \"description\": \"Where the time goes: the backend calls (APIM counts every one: spend control's reserve and settle, and the model), the gateway's own share (its policies) and sending to the client. A request's trace splits the backend time into each call.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"promethe