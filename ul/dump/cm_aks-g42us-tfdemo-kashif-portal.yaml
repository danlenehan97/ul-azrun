\n// Configuration (set in the Cloudflare dashboard, see README.md)\n//   KEY_REGIONS           KV namespace binding: key -\u003e region map, written by the portal backend.\n//   ORIGIN_\u003cREGION\u003e       plain-text variable per region, upper case, a hyphen in the region id written as an\n//                         underscore, e.g.\n//                           ORIGIN_EASTUS        = https://api-us-1.g42us.net\n//                           ORIGIN_SWEDENCENTRAL = https://api-sweden-1.g42us.net\n//                           ORIGIN_UAE_NORTH     for the region id \"uae-north\"\n//\n// DECIDED (the KV writer, services/control-api/control_api/key_region_map.py, matches it; see README.md)\n//   A1. KV key   = lowercase hex SHA-256 of the API key exactly as the buyer sends it, trimmed (64 characters).\n//                  The raw key is never stored in KV, so anyone who can read the namespace cannot use the keys.\n//       KV value = the region id as plain text, the same id the instance uses (\"eastus\", \"swedencentral\").\n//\n// Answers the Worker itself gives\n//   401 (the gateway's shape)  no key in the request, or a key with no entry in the map\n//   500 worker_misconfigured   the KEY_REGIONS KV binding is missing\n//   502 region_not_routed      the map names a region that has no ORIGIN_\u003cREGION\u003e variable\n//   502 region_unreachable     the region's origin could not be reached (tunnel down, DNS, TLS); it carries the\n//                              x-tollgate-region header, as a forwarded answer does\n//   503 region_lookup_failed   the KV read itself failed (rather than answer a valid key with 401)\n//   The last four use JSON {\"error\": {\"code\": ...}}.\n//   204 (CORS preflight)       an OPTIONS with Origin and Access-Control-Request-Method, while PORTAL_ORIGIN is set\n//\n// CORS for the portal's Demo Application page (PORTAL_ORIGIN, plain-text variable, staging: https://g42us.net)\n//   The page, served from the portal, calls this host from the buyer's browser, so the browser first sends a keyless\n//   OPTIONS preflight. With PORTAL_ORIGIN set the Worker answers that preflight itself (it has no key, so no region:\n//   nothing is looked up or forwarded) and allows that one origin only: POST, the Authorization and Content-Type\n//   headers, never \"*\", never credentials. Every other answer to a request from that origin, the Worker's own and the\n//   region's, carries Access-Control-Allow-Origin for it. A request from any other origin, or with no Origin (curl,\n//   SDKs), is answered exactly as without the variable. Unset, nothing changes: a preflight gets the missing-key 401.\n\n// The APIM API's path on every region gateway (tools/stack/lib/common.sh API_PATH): the realm of its 401.\nconst API_PATH = \"/inference/v1\";\n\n// The region gateway's own 401 bodies (APIM's built-in subscription check), byte for byte.\nconst MISSING_KEY_BODY = '{ \"statusCode\": 401, \"message\": \"Access denied due to missing subscription key. ' +\n  'Make sure to include subscription key when making requests to an API.\" }';\nconst INVALID_KEY_BODY = '{ \"statusCode\": 401, \"message\": \"Access denied due to invalid subscription key. ' +\n  'Make sure to provide a valid key for an active subscription.\" }';\n\nexport default {\n  async fetch(request, env, ctx) {\n    const portal = portalOrigin(env);\n    if (portal \u0026\u0026 isPreflight(request)) return preflight(request, portal);\n    const response = await route(request, env);\n    // Only an answer to the portal's own origin is touched; any other caller gets it as it was.\n    if (portal \u0026\u0026 request.headers.get(\"Origin\") === portal) {\n      response.headers.set(\"Access-Control-Allow-Origin\", portal);\n      response.headers.append(\"Vary\", \"Origin\");\n    }\n    return response;\n  },\n};\n\nasync function route(request, env) {\n  if (!env.KEY_REGIONS) {\n    return errorResponse(500, \"worker_misconfigured\", \"The Worker needs the KEY_REGIONS KV binding.\");\n  }\n\n  // 1. Find the API key, in the three places the gateway accepts it. No key: 401, as the gateway would answer.\n  const found = findApiKey(request);\n  if (!found) return unauthorized(request, null);\n\n  // 2. Look up the key's region. No entry: the key is not valid anywhere; 401, as the gateway would answer.\n  let mapped;\n  try {\n    mapped = await env.KEY_REGIONS.get(await sha256Hex(found.key)); // A1\n  } catch (err) {\n    return errorResponse(503, \"region_lookup_failed\", \"The region lookup is unavailable; try again shortly.\");\n  }\n  const region = (mapped || \"\").trim().toLowerCase();\n  if (!region) return unauthorized(request, found.where);\n\n  // 3. Pick that region's origin.\n  const origin = originFor(env, region);\n  if (!origin) {\n    return errorResponse(502, \"region_not_routed\", `No origin is configured for region \"${region}\".`);\n  }\n\n  // 4. Forward the request as it came: same method, path, query, headers and body (streamed, not buffered).\n  //    The Host header becomes the origin's hostname, which is what the region's tunnel routes on.\n  //    The target starts from the origin and only its path and query are set: resolving the path against the\n  //    origin would read a path starting \"//\" as another host and forward the request (and its key) there.\n  const incoming = new URL(request.url);\n  const target = new URL(origin);\n  target.pathname = incoming.pathname;\n  target.search = incoming.search;\n  const forwarded = new Request(target, request);\n  forwarded.headers.set(\"X-Forwarded-Host\", incoming.host);\n  // An origin that cannot be reached (its tunnel down, DNS, TLS) makes fetch throw. Answer that in the Worker's\n  // own JSON shape rather than Cloudflare's error page. The error itself is neither logged nor returned: it is\n  // about the request, which carries the key.\n  let upstream;\n  try {\n    upstream = await fetch(forwarded, { redirect: \"manual\" });\n  } catch (err) {\n    const response = errorResponse(502, \"region_unreachable\", `Region \"${region}\" could not be reached; try again shortly.`);\n    response.headers.set(\"x-tollgate-region\", region);\n    return response;\n  }\n\n  // 5. Return the region's answer as it is (streams stay streams), tagged with the region that served it.\n  const response = new Response(upstream.body, upstream);\n  response.headers.set(\"x-tollgate-region\", region);\n  return response;\n}\n\n// The portal's origin, exactly as a browser sends it (scheme://host[:port], no path); null when unset or blank.\nfunction portalOrigin(env) {\n  const value = (env.PORTAL_ORIGIN || \"\").trim().replace(/\\/+$/, \"\");\n  return value || null;\n}\n\n// A browser's CORS preflight: OPTIONS naming the method it is about to send, from a page with an Origin.\nfunction isPreflight(request) {\n  return request.method === \"OPTIONS\" \u0026\u0026 request.headers.has(\"Origin\")\n    \u0026\u0026 request.headers.has(\"Access-Control-Request-Method\");\n}\n\n// Answered here, before any key or region: the portal's origin is allowed, any other gets no allow headers (the\n// browser then refuses the call). As Traefik's middleware answers it on a dev instance's data path.\nfunction preflight(request, portal) {\n  const headers = new Headers({ \"Vary\": \"Origin\" });\n  if (request.headers.get(\"Origin\") === portal) {\n    headers.set(\"Access-Control-Allow-Origin\", portal);\n    headers.set(\"Access-Control-Allow-Methods\", \"POST\");\n    headers.set(\"Access-Control-Allow-Headers\", \"Authorization, Content-Type\");\n    headers.set(\"Access-Control-Max-Age\", \"600\");\n  }\n  return new Response(null, { status: 204, headers });\n}\n\n// The gateway takes the key as the Ocp-Apim-Subscription-Key header, as \"Authorization: Bearer \u003ckey\u003e\"\n// (OpenAI-style SDKs), or as the subscription-key query parameter. Returns the key and where it was found.\nfunction findApiKey(request) {\n  const header = request.headers.get(\"Ocp-Apim-Subscription-Key\");\n  if (header \u0026\u0026 header.trim()) return { key: header.trim(), where: \"header\" };\n  const auth = request.headers.get(\"Authorization\") || \"\";\n  const bearer = auth.match(/^Bearer\\s+(.+)$/i);\n  if (bearer \u0026\u0026 bearer[1].trim()) return { key: bearer[1].trim(), where: \"bearer\" };\n  const query = new URL(request.url).searchParams.get(\"subscription-key\");\n  if (query \u0026\u0026 query.trim()) return { key: query.trim(), where: \"query\" };\n  return null;\n}\n\n// The region gateway's 401: the same status, body and headers. Its WWW-Authenticate names where the key was\n// expected: the header when none was sent or it came in the header, the query parameter when it came in the query\n// or as a bearer token (as observed on the gateway). The realm is this host's API path.\nfunction unauthorized(request, where) {\n  const keyIn = where === \"query\" || where === \"bearer\"\n    ? 'name=\"subscription-key\",type=\"query\"'\n    : 'name=\"Ocp-Apim-Subscription-Key\",type=\"header\"';\n  const realm = new URL(API_PATH, request.url).href;\n  return new Response(where ? INVALID_KEY_BODY : MISSING_KEY_BODY, {\n    status: 401,\n    headers: {\n      \"content-type\": \"application/json\",\n      \"www-authenticate\": `AzureApiManagementKey realm=\"${realm}\",${keyIn}`,\n    },\n  });\n}\n\n// \"eastus\" -\u003e env.ORIGIN_EASTUS, \"swedencentral\" -\u003e env.ORIGIN_SWEDENCENTRAL, \"uae-north\" -\u003e env.ORIGIN_UAE_NORTH.\n// A region id is what the database allows: lowercase letters and digits, in parts joined by single hyphens. A hyphen\n// cannot be part of a variable name, so it becomes an underscore.\nfunction originFor(env, region) {\n  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(region)) return null;\n  const value = env[\"ORIGIN_\" + region.toUpperCase().replaceAll(\"-\", \"_\")];\n  return value \u0026\u0026 value.trim() ? value.trim() : null;\n}\n\nasync function sha256Hex(text) {\n  const digest = await crypto.subtle.digest(\"SHA-256\", new TextEncoder().encode(text));\n  return [...new Uint8Array(digest)].map((b) =\u003e b.toString(16).padStart(2, \"0\")).join(\"\");\n}\n\nfunction errorResponse(status, code, message) {\n  return new Response(JSON.stringify({ error: { code, message } }), {\n    status,\n    headers: { \"content-type\": \"application/json\" },\n  });\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"workerd-config","namespace":"tollgate-front"}}
