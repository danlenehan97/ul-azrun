- apiVersion: v1
  data:
    prometheus.yaml: |
      # Prometheus 3.15, metrics only from the OpenTelemetry Collector over OTLP (/api/v1/otlp): workload
      # readiness and restarts (k8s_cluster), node conditions, and the collector's own pipeline counters. It
      # scrapes nothing itself. Resource attributes (k8s.namespace.name, k8s.deployment.name, ...) become labels.
      global:
        scrape_interval: 60s
      otlp:
        promote_all_resource_attributes: true
        translation_strategy: UnderscoreEscapingWithSuffixes
      storage:
        tsdb:
          # Points pushed a little late (a collector retry) are still accepted.
          out_of_order_time_window: 10m
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"prometheus.yaml":"# Prometheus 3.15, metrics only from the OpenTelemetry Collector over OTLP (/api/v1/otlp): workload\n# readiness and restarts (k8s_cluster), node conditions, and the collector's own pipeline counters. It\n# scrapes nothing itself. Resource attributes (k8s.namespace.name, k8s.deployment.name, ...) become labels.\nglobal:\n  scrape_interval: 60s\notlp:\n  promote_all_resource_attributes: true\n  translation_strategy: UnderscoreEscapingWithSuffixes\nstorage:\n  tsdb:\n    # Points pushed a little late (a collector retry) are still accepted.\n    out_of_order_time_window: 10m\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"prometheus-config-6d7gf55bdh","namespace":"observability"}}
