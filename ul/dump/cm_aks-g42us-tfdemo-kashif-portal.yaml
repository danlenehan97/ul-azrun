- apiVersion: v1
  data:
    tempo.yaml: |
      # Tempo 3.1, monolithic (-target=all, no Kafka): OTLP from the collector, blocks on the local volume,
      # kept 72 hours. Query API on 3200 (Grafana's datasource).
      stream_over_http_enabled: true
      server:
        http_listen_port: 3200
        log_level: warn
      distributor:
        receivers:
          otlp:
            protocols:
              grpc: { endpoint: "0.0.0.0:4317" }
      storage:
        trace:
          backend: local
          wal: { path: /var/tempo/wal }
          local: { path: /var/tempo/blocks }
      overrides:
        defaults:
          compaction:
            block_retention: 72h
      usage_report:
        reporting_enabled: false
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"tempo.yaml":"# Tempo 3.1, monolithic (-target=all, no Kafka): OTLP from the collector, blocks on the local volume,\n# kept 72 hours. Query API on 3200 (Grafana's datasource).\nstream_over_http_enabled: true\nserver:\n  http_listen_port: 3200\n  log_level: warn\ndistributor:\n  receivers:\n    otlp:\n      protocols:\n        grpc: { endpoint: \"0.0.0.0:4317\" }\nstorage:\n  trace:\n    backend: local\n    wal: { path: /var/tempo/wal }\n    local: { path: /var/tempo/blocks }\noverrides:\n  defaults:\n    compaction:\n      block_retention: 72h\nusage_report:\n  reporting_enabled: false\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"tempo-config-d82775td45","namespace":"observability"}}
