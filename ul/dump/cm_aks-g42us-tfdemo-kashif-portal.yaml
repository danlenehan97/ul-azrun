- apiVersion: v1
  data:
    loki.yaml: |
      # Loki 3.7, single binary: OTLP logs from the collector (/otlp), chunks and TSDB index on the local
      # volume, kept 72 hours. trace_id and span_id arrive as structured metadata, which Grafana links to Tempo.
      auth_enabled: false
      server:
        http_listen_port: 3100
        grpc_listen_port: 9095
        log_level: warn
      common:
        path_prefix: /var/loki
        replication_factor: 1
        ring: { kvstore: { store: inmemory } }
        storage:
          filesystem:
            chunks_directory: /var/loki/chunks
            rules_directory: /var/loki/rules
      schema_config:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index: { prefix: index_, period: 24h }
      limits_config:
        retention_period: 72h
        allow_structured_metadata: true
        volume_enabled: true
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: false
      ruler:
        enable_api: false
      analytics:
        reporting_enabled: false
