  kind: ConfigMap
  metadata:
    annotations:
      meta.helm.sh/release-name: cilium
      meta.helm.sh/release-namespace: kube-system
    creationTimestamp: "2026-11-02T04:22:57Z"
    labels:
      app.kubernetes.io/actually-managed-by: Eno
      app.kubernetes.io/managed-by: Helm
    name: cilium-config
    namespace: kube-system
    resourceVersion: "3962913"
    uid: 4224d62e-ca27-409c-9fe4-b7e69e3c93b8
- apiVersion: v1
  data:
    fluent-bit.conf: |
      [SERVICE]
          Daemon Off
          Flush 1
          Log_Level info
          Parsers_File /fluent-bit/etc/parsers.conf
          Plugins_File /fluent-bit/etc/conf/plugins.conf
          HTTP_Server Off
          Health_Check Off

      [INPUT]
          Name tail
          Exclude_path /var/log/containers/*fluent*.log
          Path /var/log/containers/cilium*_kube-system_cilium-*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On
          db fluent-bit-db
          read_from_head true

      [INPUT]
          Name tail
          Path /var/log/containers/clustermesh-apiserver*_kube-system_*.log
          multiline.parser docker, cri
          Tag clustermesh.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On
          db clustermesh-fluent-bit-db
          read_from_head true

      [FILTER]
          Name kubernetes
          Match kube.*
          Merge_Log Off
          Keep_Log On
          K8S-Logging.Parser On
          K8S-Logging.Exclude Off
          Buffer_Size 128KB
          Use_tag_for_meta On

      [FILTER]
          Name kubernetes
          Match clustermesh.*
          Kube_Tag_Prefix clustermesh.var.log.containers.
          Merge_Log Off
          Keep_Log On
          K8S-Logging.Parser On
          K8S-Logging.Exclude Off
          Buffer_Size 128KB
          Use_tag_for_meta On

      [OUTPUT]
          Name                        azure_app_insights
          debug                       true
          imds                        true
          instrumentation_key         0b069f84-690d-4290-9703-747af9a35cd8
          Match                       kube.*

      [OUTPUT]
          Name                        azure_app_insights
          debug                       true
          imds                        true
          instrumentation_key         99c62452-029a-4341-bc0f-e689b7473601
          Match                       clustermesh.*
    plugins.conf: |
      [PLUGINS]
          Path /out_azure_app_insights.so
