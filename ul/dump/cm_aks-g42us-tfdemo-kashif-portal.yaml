         \"w\": 12,\n            \"h\": 10\n          }\n        }\n      ]\n    }\n  ]\n}\n","request-lookup.json":"{\n  \"uid\": \"g42us-request\",\n  \"title\": \"ai-tollgate · Request lookup\",\n  \"description\": \"Everything recorded about one request: its trace and its log lines.\",\n  \"tags\": [\n    \"ai-tollgate\",\n    \"observability\"\n  ],\n  \"timezone\": \"browser\",\n  \"editable\": true,\n  \"graphTooltip\": 1,\n  \"refresh\": \"\",\n  \"schemaVersion\": 41,\n  \"version\": 1,\n  \"time\": {\n    \"from\": \"now-24h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"request_id\",\n        \"label\": \"request_id\",\n        \"type\": \"textbox\",\n        \"query\": \"00000000-0000-0000-0000-000000000000\",\n        \"current\": {\n          \"text\": \"00000000-0000-0000-0000-000000000000\",\n          \"value\": \"00000000-0000-0000-0000-000000000000\"\n        },\n        \"hide\": 0,\n        \"description\": \"X-G42US-Request-Id, with or without dashes\"\n      }\n    ]\n  },\n  \"annotations\": {\n    \"list\": []\n  },\n  \"links\": [\n    {\n      \"title\": \"Overview\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-overview\",\n      \"icon\": \"dashboard\"\n    },\n    {\n      \"title\": \"Metrics\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-metrics\",\n      \"icon\": \"graph\"\n    },\n    {\n      \"title\": \"Request failures\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-failures\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Gateway (APIM)\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-gateway\",\n      \"icon\": \"cloud\"\n    },\n    {\n      \"title\": \"Spend control\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-spend\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Health\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-health\",\n      \"icon\": \"heart\"\n    },\n    {\n      \"title\": \"Request lookup\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-request\",\n      \"icon\": \"search\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"type\": \"text\",\n      \"title\": \"How\",\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\": \"Paste a request id into **request_id** above, in place of the zeros, and press Enter: the `X-G42US-Request-Id` the gateway returned, with or without dashes (without dashes it is the trace id). Paste the id alone, no spaces. The zeros stand for no request, so nothing is listed until you paste one. You see the request's **trace** (click its id for the waterfall: the gateway on top, then spend control's reserve and its SQL, the model call, the settle) and its **log lines**: the gateway's (what it answered, the plan, whether the model answered, and the time spent in spend control and the model together) and, for a refusal but a 402 (out of funds, a metric), spend control's `billing_refused` with the reason (`billing_retryable` for a 503 to retry, `billing_slow` for a reserve or settle over 1 s). A served request writes no spend control line: its spend spans carry the amounts. Log lines appear at once; a trace about 30 s after the request ends. A request refused before the gateway's policy runs (no or wrong key, a model outside the plan, a plan limit) has log lines only.\"\n      },\n      \"id\": 1,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 24,\n        \"h\": 3\n      }\n    },\n    {\n      \"type\": \"table\",\n      \"title\": \"Traces of this request\",\n      \"description\": \"The trace whose spend spans carry this request id, or whose trace id it is. Click the trace id for the full waterfall.\",\n      \"datasource\": {\n        \"type\": \"tempo\",\n        \"uid\": \"tempo\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ span.g42us.request_id = \\\"$request_id\\\" } || { trace:id = \\\"$request_id\\\" }\",\n          \"tableType\": \"traces\",\n          \"limit\": 10\n        }\n      ],\n      \"options\": {\n        \"showHeader\": true\n      },\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n      },\n      \"id\": 2,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 3,\n        \"w\": 24,\n        \"h\": 7\n      }\n    },\n    {\n      \"type\": \"logs\",\n      \"title\": \"Log lines of this request\",\n      \"description\": \"Every log line that mentions the id, or that was written inside its trace, and the APIM gateway's line for it when it was answered 400 or up or took over 5 s (the code the client got, total and backend time, product and operation: open the line's details). A request that went well has no gateway line; its trace has its span.\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{service_name=~\\\".+\\\"} |= \\\"$request_id\\\"\",\n          \"queryType\": \"range\",\n          \"maxLines\": 200\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{service_name=~\\\".+\\\"} | trace_id = \\\"$request_id\\\"\",\n          \"queryType\": \"range\",\n          \"maxLines\": 200\n        },\n        {\n          \"refId\": \"C\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{service_name=\\\"apim-gateway\\\"} | correlationId = \\\"$request_id\\\"\",\n          \"queryType\": \"range\",\n          \"maxLines\": 200\n        }\n      ],\n      \"options\": {\n        \"showTime\": true,\n        \"wrapLogMessage\": true,\n        \"sortOrder\": \"Ascending\",\n        \"enableLogDetails\": true,\n        \"prettifyLogMessage\": false,\n        \"dedupStrategy\": \"none\"\n      },\n      \"id\": 3,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 10,\n        \"w\": 24,\n        \"h\": 12\n      }\n    }\n  ]\n}\n","spend.json":"{\n  \"uid\": \"g42us-spend\",\n  \"title\": \"ai-tollgate · Spend control\",\n  \"description\": \"Spend control: reserves, settles and voids, refusals and why, latency, from Tempo and Loki.\",\n  \"tags\": [\n    \"ai-tollgate\",\n    \"observability\"\n  ],\n  \"timezone\": \"browser\",\n  \"editable\": true,\n  \"graphTooltip\": 1,\n  \"refresh\": \"1m\",\n  \"schemaVersion\": 41,\n  \"version\": 1,\n  \"time\": {\n    \"from\": \"now-3h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": []\n  },\n  \"annotations\": {\n    \"list\": []\n  },\n  \"links\": [\n    {\n      \"title\": \"Overview\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-overview\",\n      \"icon\": \"dashboard\"\n    },\n    {\n      \"title\": \"Metrics\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-metrics\",\n      \"icon\": \"graph\"\n    },\n    {\n      \"title\": \"Request failures\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-failures\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Gateway (APIM)\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-gateway\",\n      \"icon\": \"cloud\"\n    },\n    {\n      \"title\": \"Spend control\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-spend\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Health\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-health\",\n      \"icon\": \"heart\"\n    },\n    {\n      \"title\": \"Request lookup\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-request\",\n      \"icon\": \"search\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"type\": \"text\",\n      \"title\": \"About\",\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\": \"**Spend control**: every reserve, settle and void the gateway asks for. A **reserve** holds the most a call can cost before the model is called; a **settle** charges what it actually cost and releases the rest; a **void** releases a hold whose call failed. A refusal (no funds, a model the plan does not include, ...) means the model is never called. Numbers from spend control's traces (Tempo) and its log lines (Loki): `billing_refused` for each refusal and why but a 402 (out of funds, counted as a metric), at most one line a code every 10 s. A decision made writes no line (`billing_committed` was PostgreSQL mode's). Click a row or a point to drill in.\"\n      },\n      \"id\": 1,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 24,\n        \"h\": 3\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"At a glance\",\n      \"id\": 2,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 3,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Reserves / s\",\n      \"description\": \"spend.authorization spans per second (every hold the gateway asked for).\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name = \\\"spend.authorization\\\" } | rate()\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"mean\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"id\": 3,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Refused (in range)\",\n      \"description\": \"Spend operations whose outcome was not ok: insufficient_funds, model_not_entitled, a 429 window, a validation error...\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name =~ \\\"spend\\\\\\\\..*\\\" \u0026\u0026 span.g42us.outcome != \\\"ok\\\" } | count_over_time()\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"sum\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"id\": 4,\n      \"gridPos\": {\n        \"x\": 6,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Reserve p95 (avg over range)\",\n      \"description\": \"95th percentile duration of spend.authorization (inside billing, database included).\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name = \\\"spend.authorization\\\" } | quantile_over_time(duration, .95)\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0.05\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.25\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"mean\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"id\": 5,\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Settle p95 (avg over range)\",\n      \"description\": \"95th percentile duration of spend.settlement.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name = \\\"spend.settlement\\\" } | quantile_over_time(duration, .95)\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0.05\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.25\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"mean\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"id\": 6,\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Decisions\",\n      \"id\": 7,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 9,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Spend operations / s by operation\",\n      \"description\": \"Rate of spend spans, by g42us.operation.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name =~ \\\"spend\\\\\\\\..*\\\" } | rate() by (span.g42us.operation)\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"normal\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 8,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 10,\n        \"w\": 8,\n        \"h\": 8\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Outcomes / s\",\n      \"description\": \"Every spend operation by outcome: ok, or the refusal's error code.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name =~ \\\"spend\\\\\\\\..*\\\" } | rate() by (span.g42us.outcome)\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"normal\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 9,\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 10,\n        \"w\": 8,\n        \"h\": 8\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Reserves / s by model\",\n      \"description\": \"Which models are being called (spend.authorization by g42us.model).\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name = \\\"spend.authorization\\\" } | rate() by (span.g42us.model)\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"normal\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 10,\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 10,\n        \"w\": 8,\n        \"h\": 8\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Latency\",\n      \"id\": 11,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 18,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Spend latency p50 / p95 / p99 by operation\",\n      \"description\": \"Duration of the spend spans (billing's own work, database round trips included).\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name =~ \\\"spend\\\\\\\\..*\\\" } | quantile_over_time(duration, .5, .95, .99) by (span.g42us.operation)\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"none\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 12,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 19,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"PostgreSQL p95 by statement\",\n      \"description\": \"Client spans to PostgreSQL from every service, by statement kind.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ kind = client \u0026\u0026 span.db.system =~ \\\"postgres.*\\\" } | quantile_over_time(duration, .95) by (name)\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"showPoints\": \"never\",\n            \"spanNulls\": true,\n            \"stacking\": {\n              \"mode\": \"none\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 13,\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 19,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Requests worth a look\",\n      \"id\": 14,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 27,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"type\": \"table\",\n      \"title\": \"Refused requests\",\n      \"description\": \"Reserves, settles and voids whose outcome was not ok, from their spans. Click a trace id for the whole request: gateway, spend control and model.\",\n      \"datasource\": {\n        \"type\": \"tempo\",\n        \"uid\": \"tempo\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name =~ \\\"spend\\\\\\\\..*\\\" \u0026\u0026 span.g42us.outcome != \\\"ok\\\" }\",\n          \"tableType\": \"traces\",\n          \"limit\": 20\n        }\n      ],\n      \"options\": {\n        \"showHeader\": true\n      },\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n      },\n      \"id\": 15,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 28,\n        \"w\": 12,\n        \"h\": 9\n      }\n    },\n    {\n      \"type\": \"logs\",\n      \"title\": \"Refusals and why (billing_refused)\",\n      \"description\": \"One line per refusal: the operation, the request id and the code (insufficient_funds, model_not_entitled, ...).\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{service_name=\\\"billing\\\"} |= \\\"billing_refused\\\"\",\n          \"queryType\": \"range\"\n        }\n      ],\n      \"options\": {\n        \"showTime\": true,\n        \"wrapLogMessage\": true,\n        \"sortOrder\": \"Descending\",\n        \"enableLogDetails\": true\n      },\n      \"id\": 16,\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 28,\n        \"w\": 12,\n        \"h\": 9\n      }\n    },\n    {\n      \"type\": \"logs\",\n      \"title\": \"Committed spend (billing_committed)\",\n      \"description\": \"One line per committed reserve, settle and void: its request_id, model, token counts, its currency and amounts (reserved_nano / reserved_amount, actual_cost_nano / actual_cost_amount, released_nano / released_amount) and duration. PostgreSQL mode only: in Redis mode (the default) the hot path logs refusals, not commits.\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{service_name=\\\"billing\\\"} |= \\\"billing_committed\\\"\",\n          \"queryType\": \"range\",\n          \"maxLines\": 200\n        }\n      ],\n      \"options\": {\n        \"showTime\": true,\n        \"wrapLogMessage\": true,\n        \"sortOrder\": \"Descending\",\n        \"enableLogDetails\": true,\n        \"prettifyLogMessage\": false,\n        \"dedupStrategy\": \"none\"\n      },\n      \"id\": 17,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 37,\n        \"w\": 24,\n        \"h\": 10\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Reconciliation (Goal RC)\",\n      \"collapsed\": false,\n      \"id\": 18,\n      \"panels\": [],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 47,\n        \"w\": 24,\n        \"h\": 1\n      }\n    },\n    {\n      \"type\": \"table\",\n      \"title\": \"Holds expired with no settle intent, by customer (RC-L)\",\n      \"description\": \"The gap the write rule leaves: a hold reserved and never closed, with no settle intent written (a crash between the reply and the first settle's answer, or during the model call). Counted by the reconciler (reconciler_expired_without_intent_total) and logged expired_without_intent; a background job's lost hold counts here too. Distinct holds: a restarted reconciler states a hold again.\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"id\": 19,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 48,\n        \"w\": 8,\n        \"h\": 9\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"queryType\": \"instant\",\n          \"expr\": \"count by (customer_id) (sum by (customer_id, authorization_id) (count_over_time({service_name=\\\"billing-reconciler\\\"} |= \\\"expired_without_intent\\\" | json [$__range])))\"\n        }\n      ],\n      \"options\": {\n        \"showHeader\": true\n      }\n    },\n    {\n      \"type\": \"logs\",\n      \"title\": \"Reconciler: charges, stated losses and cases (reconcile_closed)\",\n      \"description\": \"One line per settle intent closed: resolved (the reconciler charged it), settled (a later try landed), hold_gone (a stated loss), conflict, quarantined or voided (for an operator); and each configuration incident (401 or 403).\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"id\": 20,\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 48,\n        \"w\": 16,\n        \"h\": 9\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"queryType\": \"range\",\n          \"expr\": \"{service_name=\\\"billing-reconciler\\\"} |~ \\\"reconcile_closed|reconcile_configuration_incident|settle_intent_unreadable\\\"\"\n        }\n      ],\n      \"options\": {\n        \"showTime\": true,\n        \"wrapLogMessage\": true,\n        \"sortOrder\": \"Descending\",\n        \"enableLogDetails\": true\n      }\n    }\n  ]\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"grafana-dashboards-4hkgc4gtft","namespace":"observability"}}
