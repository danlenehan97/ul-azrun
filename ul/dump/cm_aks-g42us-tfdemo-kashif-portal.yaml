              "type": "tempo",
              "uid": "tempo"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "tempo",
                  "uid": "tempo"
                },
                "queryType": "traceql",
                "query": "{ span.g42us.request_id = \"$request_id\" } || { trace:id = \"$request_id\" }",
                "tableType": "traces",
                "limit": 10
              }
            ],
            "options": {
              "showHeader": true
            },
            "fieldConfig": {
