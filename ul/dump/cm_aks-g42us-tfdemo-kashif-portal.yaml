  data:
    config.alloy: "// The APIM self-hosted gateway's pod and the background-job poller's,
      from the Kubernetes API to the\n// collector (alloy.yaml). Only pods labelled
      app=apim-spend-gateway or app=background-job-poller in\n// the namespaces ALLOY_NAMESPACES
      names (comma separated: wallet-billing, plus each namespace labelled\n// ai-tollgate.io/telemetry=on,
      which deploy/scripts/observability.sh renders in; alloy.yaml's default\n// is
      wallet-billing alone). Alloy reads a namespace only where components/otel-export
      put its Role.\n// Each line goes out as an OTLP log record carrying its pod's
      uid, which the collector's\n// k8sattributes uses to name the pod, deployment
      and node, and its container's name. The service is\n// the container's: apim-gateway
      for the gateway, stream-filter for the filter (a sidecar in the\n// gateway's
      pod), background-job-poller for the poller; the collector parses each its own
      way\n// (collector-config.yaml, transform/apim-gateway and transform/stream-filter).\n//
      services/spend-control/tests/test_collector_redaction.py runs these statements
      in front of the\n// collector's.\n\ndiscovery.kubernetes \"gateway\" {\n\trole
      = \"pod\"\n\n\tnamespaces {\n\t\tnames = string.split(sys.env(\"ALLOY_NAMESPACES\"),
      \",\")\n\t}\n\n\tselectors {\n\t\trole  = \"pod\"\n\t\tlabel = \"app in (apim-spend-gateway,background-job-poller)\"\n\t}\n}\n\ndiscovery.relabel
      \"gateway\" {\n\ttargets = discovery.kubernetes.gateway.targets\n\n\trule {\n\t\tsource_labels
      = [\"__meta_kubernetes_pod_uid\"]\n\t\ttarget_label  = \"k8s_pod_uid\"\n\t}\n\n\trule
      {\n\t\tsource_labels = [\"__meta_kubernetes_pod_container_name\"]\n\t\ttarget_label
      \ = \"k8s_container_name\"\n\t}\n}\n\nloki.source.kubernetes \"gateway\" {\n\ttargets
      \   = discovery.relabel.gateway.output\n\tforward_to = [otelcol.receiver.loki.gateway.receiver]\n}\n\notelcol.receiver.loki
      \"gateway\" {\n\toutput {\n\t\tlogs = [otelcol.processor.transform.gateway.input]\n\t}\n}\n\notelcol.processor.transform
      \"gateway\" {\n\terror_mode = \"ignore\"\n\n\tlog_statements {\n\t\tcontext
      \   = \"log\"\n\t\tstatements = [\n\t\t\t`set(resource.attributes[\"service.name\"],
      \"apim-gateway\")`,\n\t\t\t`set(resource.attributes[\"service.name\"], \"stream-filter\")
      where attributes[\"k8s_container_name\"] == \"stream-filter\"`,\n\t\t\t`set(resource.attributes[\"service.name\"],
      \"background-job-poller\") where attributes[\"k8s_container_name\"] == \"poller\"`,\n\t\t\t`set(resource.attributes[\"k8s.pod.uid\"],
      attributes[\"k8s_pod_uid\"])`,\n\t\t\t`set(resource.attributes[\"k8s.container.name\"],
      attributes[\"k8s_container_name\"])`,\n\t\t\t`delete_key(attributes, \"k8s_pod_uid\")`,\n\t\t\t`delete_key(attributes,
      \"k8s_container_name\")`,\n\t\t\t`delete_key(attributes, \"job\")`,\n\t\t\t`delete_key(attributes,
      \"instance\")`,\n\t\t\t`delete_key(attributes, \"loki.attribute.labels\")`,\n\t\t]\n\t}\n\n\toutput
      {\n\t\tlogs = [otelcol.processor.batch.gateway.input]\n\t}\n}\n\n// One HTTP
      export per batch of lines, not one per line.\notelcol.processor.batch \"gateway\"
      {\n\toutput {\n\t\tlogs = [otelcol.exporter.otlphttp.collector.input]\n\t}\n}\n\notelcol.exporter.otlphttp
      \"collector\" {\n\tclient {\n\t\tendpoint = \"http://otel-collector:4318\"\n\n\t\ttls
      {\n\t\t\tinsecure = true\n\t\t}\n\t}\n}\n"
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"config.alloy":"// The APIM self-hosted gateway's pod and the background-job poller's, from the Kubernetes API to the\n// collector (alloy.yaml). Only pods labelled app=apim-spend-gateway or app=background-job-poller in\n// the namespaces ALLOY_NAMESPACES names (comma separated: wallet-billing, plus each namespace labelled\n// ai-tollgate.io/telemetry=on, which deploy/scripts/observability.sh renders in; alloy.yaml's default\n// is wallet-billing alone). Alloy reads a namespace only where components/otel-export put its Role.\n// Each line goes out as an OTLP log record carrying its pod's uid, which the collector's\n// k8sattributes uses to name the pod, deployment and node, and its container's name. The service is\n// the container's: apim-gateway for the gateway, stream-filter for the filter (a sidecar in the\n// gateway's pod), background-job-poller for the poller; the collector parses each its own way\n// (collector-config.yaml, transform/apim-gateway and transform/stream-filter).\n// services/spend-control/tests/test_collector_redaction.py runs these statements in front of the\n// collector's.\n\ndiscovery.kubernetes \"gateway\" {\n\trole = \"pod\"\n\n\tnamespaces {\n\t\tnames = string.split(sys.env(\"ALLOY_NAMESPACES\"), \",\")\n\t}\n\n\tselectors {\n\t\trole  = \"pod\"\n\t\tlabel = \"app in (apim-spend-gateway,background-job-poller)\"\n\t}\n}\n\ndiscovery.relabel \"gateway\" {\n\ttargets = discovery.kubernetes.gateway.targets\n\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_uid\"]\n\t\ttarget_label  = \"k8s_pod_uid\"\n\t}\n\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_container_name\"]\n\t\ttarget_label  = \"k8s_container_name\"\n\t}\n}\n\nloki.source.kubernetes \"gateway\" {\n\ttargets    = discovery.relabel.gateway.output\n\tforward_to = [otelcol.receiver.loki.gateway.receiver]\n}\n\notelcol.receiver.loki \"gateway\" {\n\toutput {\n\t\tlogs = [otelcol.processor.transform.gateway.input]\n\t}\n}\n\notelcol.processor.transform \"gateway\" {\n\terror_mode = \"ignore\"\n\n\tlog_statements {\n\t\tcontext    = \"log\"\n\t\tstatements = [\n\t\t\t`set(resource.attributes[\"service.name\"], \"apim-gateway\")`,\n\t\t\t`set(resource.attributes[\"service.name\"], \"stream-filter\") where attributes[\"k8s_container_name\"] == \"stream-filter\"`,\n\t\t\t`set(resource.attributes[\"service.name\"], \"background-job-poller\") where attributes[\"k8s_container_name\"] == \"poller\"`,\n\t\t\t`set(resource.attributes[\"k8s.pod.uid\"], attributes[\"k8s_pod_uid\"])`,\n\t\t\t`set(resource.attributes[\"k8s.container.name\"], attributes[\"k8s_container_name\"])`,\n\t\t\t`delete_key(attributes, \"k8s_pod_uid\")`,\n\t\t\t`delete_key(attributes, \"k8s_container_name\")`,\n\t\t\t`delete_key(attributes, \"job\")`,\n\t\t\t`delete_key(attributes, \"instance\")`,\n\t\t\t`delete_key(attributes, \"loki.attribute.labels\")`,\n\t\t]\n\t}\n\n\toutput {\n\t\tlogs = [otelcol.processor.batch.gateway.input]\n\t}\n}\n\n// One HTTP export per batch of lines, not one per line.\notelcol.processor.batch \"gateway\" {\n\toutput {\n\t\tlogs = [otelcol.exporter.otlphttp.collector.input]\n\t}\n}\n\notelcol.exporter.otlphttp \"collector\" {\n\tclient {\n\t\tendpoint = \"http://otel-collector:4318\"\n\n\t\ttls {\n\t\t\tinsecure = true\n\t\t}\n\t}\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"alloy-config-fh67h4dcg7","namespace":"observability"}}
