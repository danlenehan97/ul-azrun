service_name=\\\"apim-gateway\\\"}, k8s_namespace_name)\",\n        \"refresh\": 2,\n        \"sort\": 1,\n        \"multi\": true,\n        \"includeAll\": true,\n        \"allValue\": \".*\",\n        \"current\": {\n          \"selected\": true,\n          \"text\": [\n            \"All\"\n          ],\n          \"value\": [\n            \"$__all\"\n          ]\n        },\n        \"hide\": 0,\n        \"description\": \"The namespace whose gateway sent the metrics (a cluster switch's A and B). All: every one.\"\n      }\n    ]\n  },\n  \"annotations\": {\n    \"list\": []\n  },\n  \"links\": [\n    {\n      \"title\": \"Overview\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-overview\",\n      \"icon\": \"dashboard\"\n    },\n    {\n      \"title\": \"Metrics\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-metrics\",\n      \"icon\": \"graph\"\n    },\n    {\n      \"title\": \"Request failures\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-failures\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Gateway (APIM)\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-gateway\",\n      \"icon\": \"cloud\"\n    },\n    {\n      \"title\": \"Spend control\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-spend\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Health\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-health\",\n      \"icon\": \"heart\"\n    },\n    {\n      \"title\": \"Request lookup\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-request\",\n      \"icon\": \"search\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"type\": \"text\",\n      \"title\": \"About\",\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\": \"**ai-tollgate, live: one request end to end.** A request enters the **APIM gateway**, **spend control** reserves its cost, the **model** answers, spend control settles it. All of it is one trace whose id is the request's `X-G42US-Request-Id` (dashes removed): the gateway's own span on top, spend control's and the model call under it. Numbers from the gateway's metrics (Prometheus), spend control's traces (Tempo) and both request logs (Loki). Click a row or a point to drill in. One request: **Request lookup**; more on the gateway: **Gateway (APIM)**; components: **Health** (top right).\"\n      },\n      \"id\": 1,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 24,\n        \"h\": 3\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"At a glance\",\n      \"id\": 2,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 3,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Gateway requests\",\n      \"description\": \"Every request the gateway answered in the selected time range.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(increase(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[$__range]))\",\n          \"legendFormat\": \"\",\n          \"range\": false,\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"id\": 3\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Gateway succeeded\",\n      \"description\": \"Share of requests answered 2xx. Refusals by design (429 on a trial plan, 402 out of funds) count against it.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(increase(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\", ResponseCodeCategory=\\\"2xx\\\"}[$__range])) / sum(increase(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[$__range]))\",\n          \"legendFormat\": \"\",\n          \"range\": false,\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"gridPos\": {\n        \"x\": 6,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"id\": 4\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Gateway server errors\",\n      \"description\": \"Requests answered 5xx: the gateway, spend control or the model failed. Should be 0.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(increase(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\", ResponseCodeCategory=\\\"5xx\\\"}[$__range])) or vector(0)\",\n          \"legendFormat\": \"\",\n          \"range\": false,\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"id\": 5\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Gateway p95\",\n      \"description\": \"95th percentile of the whole request, client to client, over the selected range.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (increase(DurationInMs_Milliseconds_bucket{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[$__range])))\",\n          \"legendFormat\": \"\",\n          \"range\": false,\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 4,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"id\": 6\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Spend reserves / s\",\n      \"description\": \"spend.authorization spans per second (every hold the gateway asked for).\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name = \\\"spend.authorization\\\" } | rate()\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"mean\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"id\": 7,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 9,\n        \"w\": 6,\n        \"h\": 5\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Spend refused (in range)\",\n      \"description\": \"Spend operations whose outcome was not ok: insufficient_funds, model_not_entitled, a 429 window, a validation error...\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"tempo\",\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ name =~ \\\"spend\\\\\\\\..*\\\" \u0026\u0026 span.g42us.outcome != \\\"ok\\\" } | count_over_time()\",\n          \"metricsQueryType\": \"range\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"sum\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n