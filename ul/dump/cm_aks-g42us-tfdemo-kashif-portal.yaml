- apiVersion: v1
  data:
    failures.json: |
      {
        "uid": "g42us-failures",
        "title": "ai-tollgate · Request failures",
        "description": "Per region and model: request failures in five buckets (invalid API key, insufficient funds, rate limit, model inference server, other), with their total.",
        "tags": [
          "ai-tollgate",
          "observability",
          "metrics"
        ],
        "timezone": "browser",
        "editable": true,
        "graphTooltip": 1,
        "refresh": "1m",
        "schemaVersion": 41,
        "version": 1,
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "region",
              "label": "Region",
              "type": "query",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "query": {
                "query": "label_values(g42us_gateway_calls_total, cloud_region)",
                "refId": "region"
              },
              "definition": "label_values(g42us_gateway_calls_total, cloud_region)",
              "refresh": 2,
              "includeAll": true,
              "multi": true,
              "allValue": ".*",
              "current": {
                "text": [
                  "All"
                ],
                "value": [
                  "$__all"
                ]
              },
              "sort": 1,
              "hide": 0,
              "description": "The instance's Azure location (one region for now)."
            },
            {
              "name": "model",
              "label": "Model",
              "type": "custom",
              "query": "gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,text-embedding-3-large",
              "options": [
                {
                  "text": "All",
                  "value": "$__all",
                  "selected": true
                },
                {
                  "text": "gpt-5.6-sol",
                  "value": "gpt-5.6-sol",
                  "selected": false
                },
                {
                  "text": "gpt-5.6-terra",
                  "value": "gpt-5.6-terra",
                  "selected": false
                },
                {
                  "text": "gpt-5.6-luna",
                  "value": "gpt-5.6-luna",
                  "selected": false
                },
                {
                  "text": "text-embedding-3-large",
                  "value": "text-embedding-3-large",
                  "selected": false
                }
              ],
              "includeAll": true,
              "multi": true,
              "allValue": ".*",
              "current": {
                "text": [
                  "All"
                ],
                "value": [
                  "$__all"
                ]
              },
              "hide": 0,
              "description": "The models the catalogue sells. All also counts requests refused before a model was known (an invalid API key has no model)."
            },
            {
              "name": "interval",
              "label": "Per",
              "type": "custom",
              "query": "1m,5m,15m,1h,6h,1d",
              "options": [
                {
                  "text": "1m",
                  "value": "1m",
                  "selected": true
                },
                {
                  "text": "5m",
                  "value": "5m",
                  "selected": false
                },
                {
                  "text": "15m",
                  "value": "15m",
                  "selected": false
                },
                {
                  "text": "1h",
                  "value": "1h",
                  "selected": false
                },
                {
                  "text": "6h",
                  "value": "6h",
                  "selected": false
                },
                {
                  "text": "1d",
                  "value": "1d",
                  "selected": false
                }
              ],
              "current": {
                "text": "1m",
                "value": "1m"
              },
              "hide": 0,
              "description": "The width of each bar: how many failures in that interval."
            }
          ]
        },
        "annotations": {
          "list": []
        },
        "links": [
          {
            "title": "Overview",
            "type": "link",
            "url": "/d/g42us-overview",
            "icon": "dashboard"
          },
          {
            "title": "Metrics",
            "type": "link",
            "url": "/d/g42us-metrics",
            "icon": "graph"
          },
          {
            "title": "Request failures",
            "type": "link",
            "url": "/d/g42us-failures",
            "icon": "bolt"
          },
          {
            "title": "Gateway (APIM)",
            "type": "link",
            "url": "/d/g42us-gateway",
            "icon": "cloud"
          },
          {
            "title": "Spend control",
            "type": "link",
            "url": "/d/g42us-spend",
            "icon": "bolt"
          },
          {
            "title": "Health",
            "type": "link",
            "url": "/d/g42us-health",
            "icon": "heart"
          },
          {
            "title": "Request lookup",
            "type": "link",
            "url": "/d/g42us-request",
            "icon": "search"
          }
        ],
        "panels": [
          {
            "type": "stat",
            "title": "All failures",
            "description": "Every failed request: the sum of the five boxes to the right (with the plan 403s when Model = All). Total in the selected time range (top right).",
            "id": 8,
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "(sum (clamp_min(g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type!=\"\"} - g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type!=\"\"} offset $__range, 0) or (g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type!=\"\"} unless g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type!=\"\"} offset $__range)) or vector(0)) + ((sum (clamp_min(Requests_Count_total{ResponseCode=\"403\", Location=~\"$region\"} - Requests_Count_total{ResponseCode=\"403\", Location=~\"$region\"} offset $__range, 0) or (Requests_Count_total{ResponseCode=\"403\", Location=~\"$region\"} unless Requests_Count_total{ResponseCode=\"403\", Location=~\"$region\"} offset $__range)) and on() count(g42us_gateway_calls_total{g42us_model=~\"$model\", g42us_model=\"unknown\"})) or vector(0))",
                "legendFormat": "",
                "range": false,
                "instant": true
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "red"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "area",
              "textMode": "value"
            }
          },
          {
            "type": "stat",
            "title": "Invalid API key",
            "description": "401: no key, or a key the gateway does not know. Total in the selected time range (top right).",
            "id": 2,
            "gridPos": {
              "x": 4,
              "y": 0,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "sum (clamp_min(g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"invalid_api_key\"} - g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"invalid_api_key\"} offset $__range, 0) or (g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"invalid_api_key\"} unless g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"invalid_api_key\"} offset $__range)) or vector(0)",
                "legendFormat": "",
                "range": false,
                "instant": true
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "orange"
                }
              },
              "overrides": []
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "colorMode": "value",
              "graphMode": "area",
              "textMode": "value"
            }
          },
          {
            "type": "stat",
            "title": "Insufficient wallet funds",
            "description": "402: the wallet could not cover the call's hold. Total in the selected time range (top right).",
            "id": 3,
            "gridPos": {
              "x": 8,
              "y": 0,
              "w": 4,
              "h": 4
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "sum (clamp_min(g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"insufficient_funds\"} - g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"insufficient_funds\"} offset $__range, 0) or (g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"insufficient_funds\"} unless g42us_gateway_calls_total{cloud_region=~\"$region\", g42us_model=~\"$model\", error_type=\"insufficient_funds\"} offset $__range)) or vector(0)",
                "legendFormat": "",
                "range": false,
                "instant": true
              }
            ],
            "fieldConfig": {
