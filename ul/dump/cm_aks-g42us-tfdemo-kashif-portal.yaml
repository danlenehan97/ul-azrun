    namespace: observability
    resourceVersion: "10467242"
    uid: 22387f4f-562b-47cb-adf5-dcd5aa4cefbc
- apiVersion: v1
  data:
    config.yaml: |
      # OpenTelemetry Collector (otelcol-k8s): OTLP in from the workloads, traces to Tempo, logs to Loki.
      # It also reports what Kubernetes knows, so Grafana can say what is up: every workload's readiness,
      # restarts and pod phase and the node's conditions (k8s_cluster, metrics to Prometheus), and the
      # cluster's events (k8s_events: failed probes, BackOff, OOMKilled, scheduling; logs to Loki as
      # service k8s-events). Its own pipeline counters go to Prometheus too, and so do the APIM gateway's
      # metrics (OTLP over gRPC, tools/apim-spend/gateway-observability.yaml).
      # Redaction runs here as well as in the apps (transform/redact, below), and the APIM gateway's log keeps
      # only the fields listed in transform/apim-gateway. The filter's and the background-job poller's lines
      # (transform/stream-filter) keep their own fields.
      # The requests the metrics dashboard counts (per region, per model, failures by why) are counted here from
      # the gateway's own span, one per request (span_metrics/gateway); spend control counts the tokens it
      # settles itself (g42us.settled.tokens). Both get the instance's region (transform/metrics).
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
            http: { endpoint: 0.0.0.0:4318 }
        k8s_cluster:
          auth_type: serviceAccount
          collection_interval: 30s
          node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
          allocatable_types_to_report: [cpu, memory]
        k8s_events:
          auth_type: serviceAccount

      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 20
        k8sattributes:
          auth_type: serviceAccount
          passthrough: false
          # A record that names its pod (Alloy ships the gateway's log on its behalf) keeps that pod; the
          # rest come from the pod that sent them.
          pod_association:
            - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
            - sources: [{ from: connection }]
          extract:
            metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
        # The metrics the workloads push (the APIM gateway's, over OTLP) named by the namespace that sent them, from the
        # connection only, and nothing but k8s.namespace.name: Prometheus promotes resource attributes to labels, so each
        # gateway series gains k8s_namespace_name (a switch's two sides told apart) and no per-pod label. The k8s_cluster
        # receiver's metrics have no connection and already name their namespace: unchanged.
        k8sattributes/metrics:
          auth_type: serviceAccount
          passthrough: false
          pod_association:
            - sources: [{ from: connection }]
          extract:
            metadata: [k8s.namespace.name]
        # Redaction runs here as well as in the apps, on every service's log lines and spans: whatever a
        # future instrumentation records, no credential reaches storage. In order: attributes named like a
        # credential go (the whole name or its last dotted part, an array index after it allowed:
        # http.request.header.ocp_apim_subscription_key.0; g42us.authorization_id is an identifier and stays);
        # in every value, a URL's or a path's query string up to the next space (a "?" in prose stays, and so
        # does the rest of an exception's stack); everything after Authorization's ":" or "=" to the end of
        # the line or the closing quote; the value after a credential's name in any spelling (-, _, %2D,
        # camelCase), quoted, escaped or in an array; a token after a bare Bearer or SharedAccessSignature
        # (eight characters or more, so prose such as "Bearer of bad news" stays); a forwarded client
        # address; a URL's user:password@; a credential's name and value as a pair ({"name": ..., "value": ...},
        # ('name', 'value')); SQL password literals and Redis AUTH. A span's name loses its query string and its
        # status message gets the same rules. Each rule is written once (&anchor) and reused.
        # services/spend-control/tests/test_collector_redaction.py runs them in the pinned collector image.
        transform/redact:
          error_mode: ignore
          trace_statements:
            - context: span
              statements:
                - delete_key(attributes, "url.query")
                - replace_pattern(attributes["url.full"], "(?s)\\?.*", "")
                - replace_pattern(attributes["http.url"], "(?s)\\?.*", "")
                - replace_pattern(attributes["http.target"], "(?s)\\?.*", "")
                - &redact_sql_statement 'replace_pattern(attributes["db.statement"], "(?i)(PASSWORD|IDENTIFIED\\s+BY)\\s+E?''(?:[^'']|'''')*''", "$$1 ''***''")'
                - &redact_sql_query_text 'replace_pattern(attributes["db.query.text"], "(?i)(PASSWORD|IDENTIFIED\\s+BY)\\s+E?''(?:[^'']|'''')*''", "$$1 ''***''")'
                - 'replace_pattern(attributes["db.statement"], "(?i)^(AUTH)\\s.*$", "$$1 ***")'
                - &redact_keys 'delete_matching_keys(attributes, "(?i)^(.*[.])?(authorization|proxy[-_]authorization|cookie|set[-_]cookie|api[-_]?key|x[-_]api[-_]key|x[-_]functions[-_]key|subscription[-_]key|ocp[-_]apim[-_]subscription[-_]key|password|secret|client[-_]secret|token|access[-_]token|refresh[-_]token|id[-_]token)([.][0-9]+)?$")'
                - &redact_query 'replace_all_patterns(attributes, "value", "(?i)((?:[a-z][a-z0-9+.-]*://|/)[^\\s?\"'']*)\\?[^\\s\"'']*", "$$1?<query removed>")'
                - &redact_userinfo 'replace_all_patterns(attributes, "value", "(?i)([a-z][a-z0-9+.-]*://[^/\\s:@]*:)[^@\\s/]+@", "$$1<removed>@")'
                - &redact_authorization 'replace_all_patterns(attributes, "value", "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})((?:proxy[-_]?)?authorization)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*(?:(?:\\[\\s*)?\\\\?[\"''])?)[^\\r\\n\"''\\\\]*", "$$1$$2$$3<removed>")'
                - &redact_pair 'replace_all_patterns(attributes, "value", "(?i)([\"''](?:ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer|(?:proxy[-_]?)?authorization)[\"'']\\s*,\\s*(?:[\"'']value[\"'']\\s*:\\s*)?[\"''])[^\"'']*", "$$1<removed>")'
                - &redact_quoted 'replace_all_patterns(attributes, "value", "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*(?:\\[\\s*)?\\\\?[\"''])[^\"''\\\\]*", "$$1$$2$$3<removed>")'
                - &redact_bare 'replace_all_patterns(attributes, "value", "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*)[^\\s\"'',;&}\\[\\]\\\\]+", "$$1$$2$$3<removed>")'
                - &redact_scheme 'replace_all_patterns(attributes, "value", "(?i)(^|[^a-z0-9])(bearer|sharedaccesssignature)(\\s+|%20)[a-z0-9+/=._~&%-]{8,}", "$$1$$2$$3<removed>")'
                - &redact_forwarded 'replace_all_patterns(attributes, "value", "(?i)(x-forwarded-for|x-real-ip|forwarded)(\\s*[:=]\\s*)[^\\r\\n\"'']*", "$$1$$2<removed>")'
                - replace_pattern(name, "(?s)\\?.*", "")
                - 'replace_pattern(status.message, "(?i)((?:[a-z][a-z0-9+.-]*://|/)[^\\s?\"'']*)\\?[^\\s\"'']*", "$$1?<query removed>")'
                - 'replace_pattern(status.message, "(?i)([a-z][a-z0-9+.-]*://[^/\\s:@]*:)[^@\\s/]+@", "$$1<removed>@")'
                - 'replace_pattern(status.message, "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})((?:proxy[-_]?)?authorization)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*(?:(?:\\[\\s*)?\\\\?[\"''])?)[^\\r\\n\"''\\\\]*", "$$1$$2$$3<removed>")'
                - 'replace_pattern(status.message, "(?i)([\"''](?:ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer|(?:proxy[-_]?)?authorization)[\"'']\\s*,\\s*(?:[\"'']value[\"'']\\s*:\\s*)?[\"''])[^\"'']*", "$$1<removed>")'
                - 'replace_pattern(status.message, "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*(?:\\[\\s*)?\\\\?[\"''])[^\"''\\\\]*", "$$1$$2$$3<removed>")'
                - 'replace_pattern(status.message, "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*)[^\\s\"'',;&}\\[\\]\\\\]+", "$$1$$2$$3<removed>")'
                - 'replace_pattern(status.message, "(?i)(^|[^a-z0-9])(bearer|sharedaccesssignature)(\\s+|%20)[a-z0-9+/=._~&%-]{8,}", "$$1$$2$$3<removed>")'
                - 'replace_pattern(status.message, "(?i)(x-forwarded-for|x-real-ip|forwarded)(\\s*[:=]\\s*)[^\\r\\n\"'']*", "$$1$$2<removed>")'
            - context: spanevent
              statements:
                - *redact_keys
                - *redact_query
                - *redact_userinfo
                - *redact_authorization
                - *redact_pair
                - *redact_quoted
                - *redact_bare
                - *redact_scheme
                - *redact_forwarded
          log_statements:
            - context: log
              statements:
                - *redact_keys
                - *redact_query
                - *redact_userinfo
                - *redact_authorization
                - *redact_pair
                - *redact_quoted
                - *redact_bare
                - *redact_scheme
                - *redact_forwarded
                - 'replace_pattern(body, "(?i)((?:[a-z][a-z0-9+.-]*://|/)[^\\s?\"'']*)\\?[^\\s\"'']*", "$$1?<query removed>")'
                - 'replace_pattern(body, "(?i)([a-z][a-z0-9+.-]*://[^/\\s:@]*:)[^@\\s/]+@", "$$1<removed>@")'
                - 'replace_pattern(body, "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})((?:proxy[-_]?)?authorization)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*(?:(?:\\[\\s*)?\\\\?[\"''])?)[^\\r\\n\"''\\\\]*", "$$1$$2$$3<removed>")'
                - 'replace_pattern(body, "(?i)([\"''](?:ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer|(?:proxy[-_]?)?authorization)[\"'']\\s*,\\s*(?:[\"'']value[\"'']\\s*:\\s*)?[\"''])[^\"'']*", "$$1<removed>")'
                - 'replace_pattern(body, "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*(?:\\[\\s*)?\\\\?[\"''])[^\"''\\\\]*", "$$1$$2$$3<removed>")'
                - 'replace_pattern(body, "(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\?[\"''])?\\s*(?:[:=]|%3d)\\s*)[^\\s\"'',;&}\\[\\]\\\\]+", "$$1$$2$$3<removed>")'
                - 'replace_pattern(body, "(?i)(^|[^a-z0-9])(bearer|sharedaccesssignature)(\\s+|%20)[a-z0-9+/=._~&%-]{8,}", "$$1$$2$$3<removed>")'
                - 'replace_pattern(body, "(?i)(x-forwarded-for|x-real-ip|forwarded)(\\s*[:=]\\s*)[^\\r\\n\"'']*", "$$1$$2<removed>")'
        # The APIM gateway's log (JSON lines, shipped by Alloy): each field becomes an attribute (lastError's
        # as lastError.reason and so on), so Grafana can filter on responseCode or apiId; request lines get a
        # severity (ERROR for a 5xx, else INFO); the request's id (correlationId) is the trace id (the gateway's
        # policy makes the trace from context.RequestId, tools/apim-spend/policy.xml), so a request's gateway
        # line opens its trace in Tempo, and is also set as request_id, the field spend-control's lines use. The
        # caller's IP address is dropped, and no field keeps a query string (a subscription key can be sent as one).
        transform/apim-gateway:
          error_mode: ignore
          log_statements:
            - context: log
              conditions:
                - resource.attributes["service.name"] == "apim-gateway"
              statements:
                - merge_maps(attributes, ParseJSON(body), "upsert") where IsMatch(body, "^\\{")
                - set(trace_id.string, Concat(Split(attributes["correlationId"], "-"), "")) where attributes["correlationId"] != nil
                - set(attributes["request_id"], attributes["correlationId"]) where attributes["correlationId"] != nil
                - flatten(attributes)
                # Only the fields gateway 2.12 writes that identify no one are kept (read from a live gateway,
                # 2026-10-18). Dropped: callerIpAddress, apimSubscriptionId (our subscription names start with the
                # customer id: control_api/purchase.py), userAgent and connectionId, and any field a later gateway
                # adds until it is listed here. The values kept are redacted by transform/redact.
                - 'keep_matching_keys(attributes, "^(apiId|apiRevision|apiType|backendId|backendMethod|backendProtocol|backendResponseCode|backendTime|backendUrl|cache|category|clientProtocol|clientTime|correlationId|defaultBackendTime|eventType|exception|gatewayOverheadTimeInMs|isRequestSuccess|lastError[.](elapsed|message|reason|scope|section|source)|level|message|method|operationId|policyInitTime|productId|region|requestContentLength|requestContentType|requestSize|request_id|responseCode|responseContentLength|responseContentType|responseScope|responseSection|responseSize|responseSource|sendRequestTime|source|timeGenerated|timestamp|totalTime|url)$")'
                - replace_pattern(attributes["url"], "(?s)\\?.*", "")
                - replace_pattern(attributes["backendUrl"], "(?s)\\?.*", "")
                # A tenant's own product was named after its customer id (the old operator model, removed): keep the kind only.
                - 'replace_pattern(attributes["productId"], "(?i)^tenant-.*$", "tenant")'
                # The gateway's levels as OpenTelemetry's, so the dashboards' WARN/ERROR/FATAL filters see them.
                - set(severity_text, ConvertCase(attributes["level"], "upper")) where attributes["level"] != nil
                - set(severity_text, "WARN") where attributes["level"] == "Warning"
                - set(severity_text, "FATAL") where attributes["level"] == "Critical"
                - set(severity_text, "INFO") where attributes["category"] == "GatewayLogs"
                - set(severity_text, "ERROR") where attributes["category"] == "GatewayLogs" and Int(attributes["responseCode"]) >= 500
                - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
                - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
                - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
                - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "FATAL"
                # A request line reads as what happened: "POST /inference/v1/chat/completions 200 · plan economy ·
                # LLM sim-gpt-5-6-luna answered 200 · spend control + LLM 20 ms · total 23 ms" (the gateway's
                # backendTime counts every backend call it made: the reserve, the model call and the settle; the
                # request's trace has each one's time); a refusal "... 402 · plan economy · refused
                # before the LLM: spend control held nothing (no funds) · total 14 ms"; a model call that failed or timed
                # out (no backend response code) "... 502 · plan economy · LLM sim-gpt-5-6-luna gave no answer · reason
                # BackendConnectionFailure · total 30 ms". Every part is a field too.
                - set(cache["path"], attributes["url"]) where attributes["category"] == "GatewayLogs"
                - replace_pattern(cache["path"], "^[a-z]+://[^/]+", "")
                - set(cache["plan"], attributes["productId"]) where attributes["category"] == "GatewayLogs" and attributes["productId"] != nil
                - replace_pattern(cache["plan"], "^apim-spend-plan-", "")
                - 'set(body, Concat([attributes["method"], cache["path"], attributes["responseCode"]], " ")) where attributes["category"] == "GatewayLogs"'
                - 'set(body, Concat([body, Concat(["plan", cache["plan"]], " ")], " · ")) where attributes["category"] == "GatewayLogs" and cache["plan"] != nil'
                - 'set(body, Concat([body, Concat(["LLM", attributes["backendId"], "answered", attributes["backendResponseCode"]], " "), Concat(["spend control + LLM", attributes["backendTime"], "ms"], " ")], " · ")) where attributes["category"] == "GatewayLogs" and attributes["backendId"] != nil and attributes["backendTime"] != nil and Int(attributes["backendResponseCode"]) > 0'
                - 'set(body, Concat([body, "refused before the LLM"], " · ")) where attributes["category"] == "GatewayLogs" and Int(attributes["responseCode"]) >= 400 and (attributes["backendResponseCode"] == nil or Int(attributes["backendResponseCode"]) == 0) and attributes["lastError.source"] != "forward-request"'
                - 'set(body, Concat([body, Concat(["LLM", attributes["backendId"], "gave no answer"], " ")], " · ")) where attributes["category"] == "GatewayLogs" and attributes["lastError.source"] == "forward-request" and (attributes["backendResponseCode"] == nil or Int(attributes["backendResponseCode"]) == 0)'
                - 'set(body, Concat([body, "spend control held nothing (no funds)"], ": ")) where attributes["category"] == "GatewayLogs" and Int(attributes["responseCode"]) == 402'
                - 'set(body, Concat([body, Concat(["reason", attributes["lastError.reason"]], " ")], " · ")) where attributes["category"] == "GatewayLogs" and attributes["lastError.reason"] != nil'
                - 'set(body, Concat([body, Concat(["total", attributes["totalTime"], "ms"], " ")], " · ")) where attributes["category"] == "GatewayLogs" and attributes["totalTime"] != nil'
                - 'set(body, Concat([attributes["eventType"], attributes["message"]], ": ")) where attributes["eventType"] != nil and attributes["message"] != nil'
                - set(body, attributes["eventType"]) where attributes["eventType"] != nil and attributes["message"] == nil
                - set(body, attributes["category"]) where attributes["category"] != nil and attributes["category"] != "GatewayLogs" and attributes["eventType"] == nil
        # The filter's lines and the background-job poller's (Go slog JSON: time, level, msg and the event's own
        # fields, shipped by Alloy from the gateway's pod and the poller's): each field becomes an attribute (a
        # nested one as settle.status and so on), the event's name (msg) the body, the level the severity, and a
        # call's request_id (the gateway's context.RequestId, a GUID) the trace id, as the gateway's request line
        # does. Every field is kept: the filter writes ids, codes and counts, never a body; transform/redact
        # still runs on all of them. A line that is not JSON (a panic's stack) is kept as it is.
        transform/stream-filter:
          error_mode: ignore
          log_statements:
            - context: log
              conditions:
                - resource.attributes["service.name"] == "stream-filter" or resource.attributes["service.name"] == "background-job-poller"
              statements:
                - merge_maps(attributes, ParseJSON(body), "upsert") where IsMatch(body, "^\\{")
                - flatten(attributes)
                - set(body, attributes["msg"]) where attributes["msg"] != nil
                - set(severity_text, attributes["level"]) where attributes["level"] != nil
                - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "DEBUG"
                - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
                - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
                - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
                - set(trace_id.string, Concat(Split(attributes["request_id"], "-"), "")) where IsMatch(attributes["request_id"], "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$")
                - delete_key(attributes, "msg")
                - delete_key(attributes, "level")
                - delete_key(attributes, "time")
        # Of the gateway's other lines, its Informational events are dropped: they are configuration sync and
        # startup, and each refusal (401, 403, 429) already has its request line. Not kept either:
        # - OutgoingRequestCanBeStuckOnClientCertificateRenegotiation, a Warning 2.12 writes for every call
        #   made with a client certificate (each reserve, settle and void to billing), with no request id;
        # - lines that aren't JSON: the banner it prints when it starts (version, commit), and anything
        #   else written before its logger is up, which stays in `kubectl logs` only.
        filter/apim-gateway:
          error_mode: ignore
          logs:
            log_record:
              - resource.attributes["service.name"] == "apim-gateway" and attributes["level"] == "Informational"
              - resource.attributes["service.name"] == "apim-gateway" and attributes["eventType"] == "OutgoingRequestCanBeStuckOnClientCertificateRenegotiation"
              - resource.attributes["service.name"] == "apim-gateway" and attributes["category"] == nil and attributes["eventType"] == nil
              # A request that went well in 5 s or less (logging Plan A, step 6): at 1,400 calls/s its line is most of
              # what Loki would store, and the gateway's span (Tempo, the request-count metrics) and its own metrics
              # count it already; a slow success stays for the gateway dashboard's slow requests.
              - resource.attributes["service.name"] == "apim-gateway" and attributes["category"] == "GatewayLogs" and Int(attributes["responseCode"]) < 400 and Int(attributes["totalTime"]) <= 5000
        # Billing: psycopg's warning when it closes a pipeline whose statement failed. Every such failure is
        # already reported by billing itself: a wallet that cannot cover a reserve (sqlstate INSUFFICIENT,
        # the design) as a 402, which is a metric (billing writes no line for it), any other database
        # error as billing_database_failure. The line adds only the database host and user.
        filter/billing:
          error_mode: ignore
          logs:
            log_record:
              - 'resource.attributes["service.name"] == "billing" and instrumentation_scope.name == "psycopg" and IsMatch(body, "^error ignored terminating <psycopg\\.AsyncPipeline .*>: pipeline aborted$")'
        # Only the gateway's own span (one per request, tools/apim-spend/trace-span.xml) is counted: the
        # model call's child span and every service's spans are not requests.
        filter/gateway-requests:
          error_mode: ignore
          traces:
            span:
              - resource.attributes["service.name"] != "apim-gateway" or kind != SPAN_KIND_SERVER
        # The instance's region on every metric of ours (TOLLGATE_REGION, from deploy/scripts/observability.sh;
        # "unknown" on a cluster that names none). The gateway's own metrics carry theirs as Location. And two
        # labels span_metrics adds to each count come off: the collector's own id, new on every restart (each
        # would start a new set of series; one replica runs, so no two collectors write the same series), and
        # a copy of service.name, which Prometheus already makes a label of from the resource.
        transform/metrics:
          error_mode: ignore
          metric_statements:
            - context: datapoint
              conditions:
                - IsMatch(metric.name, "^g42us\\.")
              statements:
                - set(attributes["cloud.region"], "${env:TOLLGATE_REGION:-unknown}")
                - delete_key(attributes, "collector.instance.id")
                - delete_key(attributes, "service.name")
        resource/k8s-events:
          attributes:
            - { key: service.name, value: k8s-events, action: upsert }
        batch:
          send_batch_size: 1024
          timeout: 2s

      connectors:
        # One count per request, by model (g42us.model: a model the catalogue routes, or unknown), the status
        # the caller got and why it failed (error.type: invalid_api_key, insufficient_funds, model_backend or
        # other; none on a success). Few series on purpose: no duration histogram (the gateway's own metrics
        # have one) and none of the default span name, kind and status dimensions. In Prometheus:
        # g42us_gateway_calls_total{g42us_model, http_response_status_code, error_type, cloud_region}.
        span_metrics/gateway:
          namespace: g42us.gateway
          histogram:
            disable: true
          exclude_dimensions: [span.name, span.kind, status.code]
          dimensions:
            - { name: g42us.model, default: unknown }
            - { name: http.response.status_code }
            - { name: error.type }
          resource_metrics_key_attributes: [service.name]
          metrics_flush_interval: 15s

      # Each exporter queues on disk (file_storage/queue, the PVC otel-collector-queue), not in memory: while its store is
      # away (restarted, or moved to another node pool by stack migrate) the collector keeps what arrives and survives its
      # own restart with it. Retries go on for 30 minutes (the default is 5), longer than a store's move. The defaults were
      # 1,000 batches in memory, lost on a restart. Each queue is sized in bytes (sizer: bytes), 256 MiB, so the three fit
      # the 2Gi disk they share (collector.yaml): 768 MiB of queues, plus room for the compaction on start, which writes a
      # copy of one queue's database beside it, and bbolt's own overhead. Counted in batches (send_batch_size 1024, no max)
      # a queue had no bound in bytes: a long Loki or Tempo outage could fill the disk (ENOSPC), and the compaction on the
      # next start would then fail too, a crash loop. A full queue refuses what arrives (the collector's refused counters).
      exporters:
        otlp/tempo:
          endpoint: tempo:4317
          tls: { insecure: true }
          sending_queue: { enabled: true, storage: file_storage/queue, sizer: bytes, queue_size: 268435456 }
          retry_on_failure: { enabled: true, max_elapsed_time: 30m }
        otlphttp/loki:
          endpoint: http://loki:3100/otlp
          sending_queue: { enabled: true, storage: file_storage/queue, sizer: bytes, queue_size: 268435456 }
          retry_on_failure: { enabled: true, max_elapsed_time: 30m }
        otlphttp/prometheus:
          endpoint: http://prometheus:9090/api/v1/otlp
          sending_queue: { enabled: true, storage: file_storage/queue, sizer: bytes, queue_size: 268435456 }
          retry_on_failure: { enabled: true, max_elapsed_time: 30m }

      extensions:
        health_check: { endpoint: 0.0.0.0:13133 }
        # The root filesystem is read-only, so compaction works in the queue's own directory, not /tmp.
        file_storage/queue:
          directory: /var/lib/otelcol/queue
          compaction: { on_start: true, directory: /var/lib/otelcol/queue }

      service:
        extensions: [health_check, file_storage/queue]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, transform/redact, batch]
            exporters: [otlp/tempo]
          traces/gateway-requests:
            receivers: [otlp]
            processors: [memory_limiter, filter/gateway-requests]
            exporters: [span_metrics/gateway]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, transform/apim-gateway, transform/stream-filter, filter/apim-gateway, filter/billing, transform/redact, batch]
            exporters: [otlphttp/loki]
          logs/k8s-events:
            receivers: [k8s_events]
            processors: [memory_limiter, resource/k8s-events, transform/redact, batch]
            exporters: [otlphttp/loki]
          metrics:
            receivers: [k8s_cluster, otlp, span_metrics/gateway]
            processors: [memory_limiter, k8sattributes/metrics, transform/metrics, batch]
            exporters: [otlphttp/prometheus]
        telemetry:
          logs: { level: info }
          # The pipeline's own counters (accepted, refused, sent, failed per signal), pushed to Prometheus.
          metrics:
            level: normal
            readers:
              - periodic:
                  interval: 30000
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"config.yaml":"# OpenTelemetry Collector (otelcol-k8s): OTLP in from the workloads, traces to Tempo, logs to Loki.\n# It also reports what Kubernetes knows, so Grafana can say what is up: every workload's readiness,\n# restarts and pod phase and the node's conditions (k8s_cluster, metrics to Prometheus), and the\n# cluster's events (k8s_events: failed probes, BackOff, OOMKilled, scheduling; logs to Loki as\n# service k8s-events). Its own pipeline counters go to Prometheus too, and so do the APIM gateway's\n# metrics (OTLP over gRPC, tools/apim-spend/gateway-observability.yaml).\n# Redaction runs here as well as in the apps (transform/redact, below), and the APIM gateway's log keeps\n# only the fields listed in transform/apim-gateway. The filter's and the background-job poller's lines\n# (transform/stream-filter) keep their own fields.\n# The requests the metrics dashboard counts (per region, per model, failures by why) are counted here from\n# the gateway's own span, one per request (span_metrics/gateway); spend control counts the tokens it\n# settles itself (g42us.settled.tokens). Both get the instance's region (transform/metrics).\nreceivers:\n  otlp:\n    protocols:\n      grpc: { endpoint: 0.0.0.0:4317 }\n      http: { endpoint: 0.0.0.0:4318 }\n  k8s_cluster:\n    auth_type: serviceAccount\n    collection_interval: 30s\n    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]\n    allocatable_types_to_report: [cpu, memory]\n  k8s_events:\n    auth_type: serviceAccount\n\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_percentage: 80\n    spike_limit_percentage: 20\n  k8sattributes:\n    auth_type: serviceAccount\n    passthrough: false\n    # A record that names its pod (Alloy ships the gateway's log on its behalf) keeps that pod; the\n    # rest come from the pod that sent them.\n    pod_association:\n      - sources: [{ from: resource_attribute, name: k8s.pod.uid }]\n      - sources: [{ from: connection }]\n    extract:\n      metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]\n  # The metrics the workloads push (the APIM gateway's, over OTLP) named by the namespace that sent them, from the\n  # connection only, and nothing but k8s.namespace.name: Prometheus promotes resource attributes to labels, so each\n  # gateway series gains k8s_namespace_name (a switch's two sides told apart) and no per-pod label. The k8s_cluster\n  # receiver's metrics have no connection and already name their namespace: unchanged.\n  k8sattributes/metrics:\n    auth_type: serviceAccount\n    passthrough: false\n    pod_association:\n      - sources: [{ from: connection }]\n    extract:\n      metadata: [k8s.namespace.name]\n  # Redaction runs here as well as in the apps, on every service's log lines and spans: whatever a\n  # future instrumentation records, no credential reaches storage. In order: attributes named like a\n  # credential go (the whole name or its last dotted part, an array index after it allowed:\n  # http.request.header.ocp_apim_subscription_key.0; g42us.authorization_id is an identifier and stays);\n  # in every value, a URL's or a path's query string up to the next space (a \"?\" in prose stays, and so\n  # does the rest of an exception's stack); everything after Authorization's \":\" or \"=\" to the end of\n  # the line or the closing quote; the value after a credential's name in any spelling (-, _, %2D,\n  # camelCase), quoted, escaped or in an array; a token after a bare Bearer or SharedAccessSignature\n  # (eight characters or more, so prose such as \"Bearer of bad news\" stays); a forwarded client\n  # address; a URL's user:password@; a credential's name and value as a pair ({\"name\": ..., \"value\": ...},\n  # ('name', 'value')); SQL password literals and Redis AUTH. A span's name loses its query string and its\n  # status message gets the same rules. Each rule is written once (\u0026anchor) and reused.\n  # services/spend-control/tests/test_collector_redaction.py runs them in the pinned collector image.\n  transform/redact:\n    error_mode: ignore\n    trace_statements:\n      - context: span\n        statements:\n          - delete_key(attributes, \"url.query\")\n          - replace_pattern(attributes[\"url.full\"], \"(?s)\\\\?.*\", \"\")\n          - replace_pattern(attributes[\"http.url\"], \"(?s)\\\\?.*\", \"\")\n          - replace_pattern(attributes[\"http.target\"], \"(?s)\\\\?.*\", \"\")\n          - \u0026redact_sql_statement 'replace_pattern(attributes[\"db.statement\"], \"(?i)(PASSWORD|IDENTIFIED\\\\s+BY)\\\\s+E?''(?:[^'']|'''')*''\", \"$$1 ''***''\")'\n          - \u0026redact_sql_query_text 'replace_pattern(attributes[\"db.query.text\"], \"(?i)(PASSWORD|IDENTIFIED\\\\s+BY)\\\\s+E?''(?:[^'']|'''')*''\", \"$$1 ''***''\")'\n          - 'replace_pattern(attributes[\"db.statement\"], \"(?i)^(AUTH)\\\\s.*$\", \"$$1 ***\")'\n          - \u0026redact_keys 'delete_matching_keys(attributes, \"(?i)^(.*[.])?(authorization|proxy[-_]authorization|cookie|set[-_]cookie|api[-_]?key|x[-_]api[-_]key|x[-_]functions[-_]key|subscription[-_]key|ocp[-_]apim[-_]subscription[-_]key|password|secret|client[-_]secret|token|access[-_]token|refresh[-_]token|id[-_]token)([.][0-9]+)?$\")'\n          - \u0026redact_query 'replace_all_patterns(attributes, \"value\", \"(?i)((?:[a-z][a-z0-9+.-]*://|/)[^\\\\s?\\\"'']*)\\\\?[^\\\\s\\\"'']*\", \"$$1?\u003cquery removed\u003e\")'\n          - \u0026redact_userinfo 'replace_all_patterns(attributes, \"value\", \"(?i)([a-z][a-z0-9+.-]*://[^/\\\\s:@]*:)[^@\\\\s/]+@\", \"$$1\u003cremoved\u003e@\")'\n          - \u0026redact_authorization 'replace_all_patterns(attributes, \"value\", \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})((?:proxy[-_]?)?authorization)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*(?:(?:\\\\[\\\\s*)?\\\\\\\\?[\\\"''])?)[^\\\\r\\\\n\\\"''\\\\\\\\]*\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - \u0026redact_pair 'replace_all_patterns(attributes, \"value\", \"(?i)([\\\"''](?:ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer|(?:proxy[-_]?)?authorization)[\\\"'']\\\\s*,\\\\s*(?:[\\\"'']value[\\\"'']\\\\s*:\\\\s*)?[\\\"''])[^\\\"'']*\", \"$$1\u003cremoved\u003e\")'\n          - \u0026redact_quoted 'replace_all_patterns(attributes, \"value\", \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*(?:\\\\[\\\\s*)?\\\\\\\\?[\\\"''])[^\\\"''\\\\\\\\]*\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - \u0026redact_bare 'replace_all_patterns(attributes, \"value\", \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*)[^\\\\s\\\"'',;\u0026}\\\\[\\\\]\\\\\\\\]+\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - \u0026redact_scheme 'replace_all_patterns(attributes, \"value\", \"(?i)(^|[^a-z0-9])(bearer|sharedaccesssignature)(\\\\s+|%20)[a-z0-9+/=._~\u0026%-]{8,}\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - \u0026redact_forwarded 'replace_all_patterns(attributes, \"value\", \"(?i)(x-forwarded-for|x-real-ip|forwarded)(\\\\s*[:=]\\\\s*)[^\\\\r\\\\n\\\"'']*\", \"$$1$$2\u003cremoved\u003e\")'\n          - replace_pattern(name, \"(?s)\\\\?.*\", \"\")\n          - 'replace_pattern(status.message, \"(?i)((?:[a-z][a-z0-9+.-]*://|/)[^\\\\s?\\\"'']*)\\\\?[^\\\\s\\\"'']*\", \"$$1?\u003cquery removed\u003e\")'\n          - 'replace_pattern(status.message, \"(?i)([a-z][a-z0-9+.-]*://[^/\\\\s:@]*:)[^@\\\\s/]+@\", \"$$1\u003cremoved\u003e@\")'\n          - 'replace_pattern(status.message, \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})((?:proxy[-_]?)?authorization)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*(?:(?:\\\\[\\\\s*)?\\\\\\\\?[\\\"''])?)[^\\\\r\\\\n\\\"''\\\\\\\\]*\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(status.message, \"(?i)([\\\"''](?:ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer|(?:proxy[-_]?)?authorization)[\\\"'']\\\\s*,\\\\s*(?:[\\\"'']value[\\\"'']\\\\s*:\\\\s*)?[\\\"''])[^\\\"'']*\", \"$$1\u003cremoved\u003e\")'\n          - 'replace_pattern(status.message, \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*(?:\\\\[\\\\s*)?\\\\\\\\?[\\\"''])[^\\\"''\\\\\\\\]*\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(status.message, \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*)[^\\\\s\\\"'',;\u0026}\\\\[\\\\]\\\\\\\\]+\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(status.message, \"(?i)(^|[^a-z0-9])(bearer|sharedaccesssignature)(\\\\s+|%20)[a-z0-9+/=._~\u0026%-]{8,}\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(status.message, \"(?i)(x-forwarded-for|x-real-ip|forwarded)(\\\\s*[:=]\\\\s*)[^\\\\r\\\\n\\\"'']*\", \"$$1$$2\u003cremoved\u003e\")'\n      - context: spanevent\n        statements:\n          - *redact_keys\n          - *redact_query\n          - *redact_userinfo\n          - *redact_authorization\n          - *redact_pair\n          - *redact_quoted\n          - *redact_bare\n          - *redact_scheme\n          - *redact_forwarded\n    log_statements:\n      - context: log\n        statements:\n          - *redact_keys\n          - *redact_query\n          - *redact_userinfo\n          - *redact_authorization\n          - *redact_pair\n          - *redact_quoted\n          - *redact_bare\n          - *redact_scheme\n          - *redact_forwarded\n          - 'replace_pattern(body, \"(?i)((?:[a-z][a-z0-9+.-]*://|/)[^\\\\s?\\\"'']*)\\\\?[^\\\\s\\\"'']*\", \"$$1?\u003cquery removed\u003e\")'\n          - 'replace_pattern(body, \"(?i)([a-z][a-z0-9+.-]*://[^/\\\\s:@]*:)[^@\\\\s/]+@\", \"$$1\u003cremoved\u003e@\")'\n          - 'replace_pattern(body, \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})((?:proxy[-_]?)?authorization)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*(?:(?:\\\\[\\\\s*)?\\\\\\\\?[\\\"''])?)[^\\\\r\\\\n\\\"''\\\\\\\\]*\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(body, \"(?i)([\\\"''](?:ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer|(?:proxy[-_]?)?authorization)[\\\"'']\\\\s*,\\\\s*(?:[\\\"'']value[\\\"'']\\\\s*:\\\\s*)?[\\\"''])[^\\\"'']*\", \"$$1\u003cremoved\u003e\")'\n          - 'replace_pattern(body, \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*(?:\\\\[\\\\s*)?\\\\\\\\?[\\\"''])[^\\\"''\\\\\\\\]*\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(body, \"(?i)(^|[^a-z0-9]|%[0-9a-f]{2})(ocp(?:[-_]|%2d)?apim(?:[-_]|%2d)?subscription(?:[-_]|%2d)?key|subscription(?:[-_]|%2d)?key|x(?:[-_]|%2d)?api(?:[-_]|%2d)?key|api(?:[-_]|%2d)?key|x(?:[-_]|%2d)?functions(?:[-_]|%2d)?key|access(?:[-_]|%2d)?token|refresh(?:[-_]|%2d)?token|id(?:[-_]|%2d)?token|client(?:[-_]|%2d)?secret|account(?:[-_]|%2d)?key|shared(?:[-_]|%2d)?access(?:[-_]|%2d)?key|[a-z0-9]*pass(?:word|wd)|sig|bearer)((?:\\\\\\\\?[\\\"''])?\\\\s*(?:[:=]|%3d)\\\\s*)[^\\\\s\\\"'',;\u0026}\\\\[\\\\]\\\\\\\\]+\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(body, \"(?i)(^|[^a-z0-9])(bearer|sharedaccesssignature)(\\\\s+|%20)[a-z0-9+/=._~\u0026%-]{8,}\", \"$$1$$2$$3\u003cremoved\u003e\")'\n          - 'replace_pattern(body, \"(?i)(x-forwarded-for|x-real-ip|forwarded)(\\\\s*[:=]\\\\s*)[^\\\\r\\\\n\\\"'']*\", \"$$1$$2\u003cremoved\u003e\")'\n  # The APIM gateway's log (JSON lines, shipped by Alloy): each field becomes an attribute (lastError's\n  # as lastError.reason and so on), so Grafana can filter on responseCode or apiId; request lines get a\n  # severity (ERROR for a 5xx, else INFO); the request's id (correlationId) is the trace id (the gateway's\n  # policy makes the trace from context.RequestId, tools/apim-spend/policy.xml), so a request's gateway\n  # line opens its trace in Tempo, and is also set as request_id, the field spend-control's lines use. The\n  # caller's IP address is dropped, and no field keeps a query string (a subscription key can be sent as one).\n  transform/apim-gateway:\n    error_mode: ignore\n    log_statements:\n      - context: log\n        conditions:\n          - resource.attributes[\"service.name\"] == \"apim-gateway\"\n        statements:\n          - merge_maps(attributes, ParseJSON(body), \"upsert\") where IsMatch(body, \"^\\\\{\")\n          - set(trace_id.string, Concat(Split(attributes[\"correlationId\"], \"-\"), \"\")) where attributes[\"correlationId\"] != nil\n          - set(attributes[\"request_id\"], attributes[\"correlationId\"]) where attributes[\"correlationId\"] != nil\n          - flatten(attributes)\n          # Only the fields gateway 2.12 writes that identify no one are kept (read from a live gateway,\n          # 2026-10-18). Dropped: callerIpAddress, apimSubscriptionId (our subscription names start with the\n          # customer id: control_api/purchase.py), userAgent and connectionId, and any field a later gateway\n          # adds until it is listed here. The values kept are redacted by transform/redact.\n          - 'keep_matching_keys(attributes, \"^(apiId|apiRevision|apiType|backendId|backendMethod|backendProtocol|backendResponseCode|backendTime|backendUrl|cache|category|clientProtocol|clientTime|correlationId|defaultBackendTime|eventType|exception|gatewayOverheadTimeInMs|isRequestSuccess|lastError[.](elapsed|message|reason|scope|section|source)|level|message|method|operationId|policyInitTime|productId|region|requestContentLength|requestContentType|requestSize|request_id|responseCode|responseContentLength|responseContentType|responseScope|responseSection|responseSize|responseSource|sendRequestTime|source|timeGenerated|timestamp|totalTime|url)$\")'\n          - replace_pattern(attributes[\"url\"], \"(?s)\\\\?.*\", \"\")\n          - replace_pattern(attributes[\"backendUrl\"], \"(?s)\\\\?.*\", \"\")\n          # A tenant's own product was named after its customer id (the old operator model, removed): keep the kind only.\n          - 'replace_pattern(attributes[\"productId\"], \"(?i)^tenant-.*$\", \"tenant\")'\n          # The gateway's levels as OpenTelemetry's, so the dashboards' WARN/ERROR/FATAL filters see them.\n          - set(severity_text, ConvertCase(attributes[\"level\"], \"upper\")) where attributes[\"level\"] != nil\n          - set(severity_text, \"WARN\") where attributes[\"level\"] == \"Warning\"\n          - set(severity_text, \"FATAL\") where attributes[\"level\"] == \"Critical\"\n          - set(severity_text, \"INFO\") where attributes[\"category\"] == \"GatewayLogs\"\n          - set(severity_text, \"ERROR\") where attributes[\"category\"] == \"GatewayLogs\" and Int(attributes[\"responseCode\"]) \u003e= 500\n          - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == \"INFO\"\n          - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == \"WARN\"\n          - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == \"ERROR\"\n          - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == \"FATAL\"\n          # A request line reads as what happened: \"POST /inference/v1/chat/completions 200 · plan economy ·\n          # LLM sim-gpt-5-6-luna answered 200 · spend control + LLM 20 ms · total 23 ms\" (the gateway's\n          # backendTime counts every backend call it made: the reserve, the model call and the settle; the\n          # request's trace has each one's time); a refusal \"... 402 · plan economy · refused\n          # before the LLM: spend control held nothing (no funds) · total 14 ms\"; a model call that failed or timed\n          # out (no backend response code) \"... 502 · plan economy · LLM sim-gpt-5-6-luna gave no answer · reason\n          # BackendConnectionFailure · total 30 ms\". Every part is a field too.\n          - set(cache[\"path\"], attributes[\"url\"]) where attributes[\"category\"] == \"GatewayLogs\"\n          - replace_pattern(cache[\"path\"], \"^[a-z]+://[^/]+\", \"\")\n          - set(cache[\"plan\"], attributes[\"productId\"]) where attributes[\"category\"] == \"GatewayLogs\" and attributes[\"productId\"] != nil\n          - replace_pattern(cache[\"plan\"], \"^apim-spend-plan-\", \"\")\n          - 'set(body, Concat([attributes[\"method\"], cache[\"path\"], attributes[\"responseCode\"]], \" \")) where attributes[\"category\"] == \"GatewayLogs\"'\n          - 'set(body, Concat([body, Concat([\"plan\", cache[\"plan\"]], \" \")], \" · \")) where attributes[\"category\"] == \"GatewayLogs\" and cache[\"plan\"] != nil'\n          - 'set(body, Concat([body, Concat([\"LLM\", attributes[\"backendId\"], \"answered\", attributes[\"backendResponseCode\"]], \" \"), Concat([\"spend control + LLM\", attributes[\"backendTime\"], \"ms\"], \" \")], \" · \")) where attributes[\"category\"] == \"GatewayLogs\" and attributes[\"backendId\"] != nil and attributes[\"backendTime\"] != nil and Int(attributes[\"backendResponseCode\"]) \u003e 0'\n          - 'set(body, Concat([body, \"refused before the LLM\"], \" · \")) where attributes[\"category\"] == \"GatewayLogs\" and Int(attributes[\"responseCode\"]) \u003e= 400 and (attributes[\"backendResponseCode\"] == nil or Int(attributes[\"backendResponseCode\"]) == 0) and attributes[\"lastError.source\"] != \"forward-request\"'\n          - 'set(body, Concat([body, Concat([\"LLM\", attributes[\"backendId\"], \"gave no answer\"], \" \")], \" · \")) where attributes[\"category\"] == \"GatewayLogs\" and attributes[\"lastError.source\"] == \"forward-request\" and (attributes[\"backendResponseCode\"] == nil or Int(attributes[\"backendResponseCode\"]) == 0)'\n          - 'set(body, Concat([body, \"spend control held nothing (no funds)\"], \": \")) where attributes[\"category\"] == \"GatewayLogs\" and Int(attributes[\"responseCode\"]) == 402'\n          - 'set(body, Concat([body, Concat([\"reason\", attributes[\"lastError.reason\"]], \" \")], \" · \")) where attributes[\"category\"] == \"GatewayLogs\" and attributes[\"lastError.reason\"] != nil'\n          - 'set(body, Concat([body, Concat([\"total\", attributes[\"totalTime\"], \"ms\"], \" \")], \" · \")) where attributes[\"category\"] == \"GatewayLogs\" and attributes[\"totalTime\"] != nil'\n          - 'set(body, Concat([attributes[\"eventType\"], attributes[\"message\"]], \": \")) where attributes[\"eventType\"] != nil and attributes[\"message\"] != nil'\n          - set(body, attributes[\"eventType\"]) where attributes[\"eventType\"] != nil and attributes[\"message\"] == nil\n          - set(body, attributes[\"category\"]) where attributes[\"category\"] != nil and attributes[\"category\"] != \"GatewayLogs\" and attributes[\"eventType\"] == nil\n  # The filter's lines and the background-job poller's (Go slog JSON: time, level, msg and the event's own\n  # fields, shipped by Alloy from the gateway's pod and the poller's): each field becomes an attribute (a\n  # nested one as settle.status and so on), the event's name (msg) the body, the level the severity, and a\n  # call's request_id (the gateway's context.RequestId, a GUID) the trace id, as the gateway's request line\n  # does. Every field is kept: the filter writes ids, codes and counts, never a body; transform/redact\n  # still runs on all of them. A line that is not JSON (a panic's stack) is kept as it is.\n  transform/stream-filter:\n    error_mode: ignore\n    log_statements:\n      - context: log\n        conditions:\n          - resource.attributes[\"service.name\"] == \"stream-filter\" or resource.attributes[\"service.name\"] == \"background-job-poller\"\n        statements:\n          - merge_maps(attributes, ParseJSON(body), \"upsert\") where IsMatch(body, \"^\\\\{\")\n          - flatten(attributes)\n          - set(body, attributes[\"msg\"]) where attributes[\"msg\"] != nil\n          - set(severity_text, attributes[\"level\"]) where attributes[\"level\"] != nil\n          - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == \"DEBUG\"\n          - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == \"INFO\"\n          - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == \"WARN\"\n          - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == \"ERROR\"\n          - set(trace_id.string, Concat(Split(attributes[\"request_id\"], \"-\"), \"\")) where IsMatch(attributes[\"request_id\"], \"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$\")\n          - delete_key(attributes, \"msg\")\n          - delete_key(attributes, \"level\")\n          - delete_key(attributes, \"time\")\n  # Of the gateway's other lines, its Informational events are dropped: they are configuration sync and\n  # startup, and each refusal (401, 403, 429) already has its request line. Not kept either:\n  # - OutgoingRequestCanBeStuckOnClientCertificateRenegotiation, a Warning 2.12 writes for every call\n  #   made with a client certificate (each reserve, settle and void to billing), with no request id;\n  # - lines that aren't JSON: the banner it prints when it starts (version, commit), and anything\n  #   else written before its logger is up, which stays in `kubectl logs` only.\n  filter/apim-gateway:\n    error_mode: ignore\n    logs:\n      log_record:\n        - resource.attributes[\"service.name\"] == \"apim-gateway\" and attributes[\"level\"] == \"Informational\"\n        - resource.attributes[\"service.name\"] == \"apim-gateway\" and attributes[\"eventType\"] == \"OutgoingRequestCanBeStuckOnClientCertificateRenegotiation\"\n        - resource.attributes[\"service.name\"] == \"apim-gateway\" and attributes[\"category\"] == nil and attributes[\"eventType\"] == nil\n        # A request that went well in 5 s or less (logging Plan A, step 6): at 1,400 calls/s its line is most of\n        # what Loki would store, and the gateway's span (Tempo, the request-count metrics) and its own metrics\n        # count it already; a slow success stays for the gateway dashboard's slow requests.\n        - resource.attributes[\"service.name\"] == \"apim-gateway\" and attributes[\"category\"] == \"GatewayLogs\" and Int(attributes[\"responseCode\"]) \u003c 400 and Int(attributes[\"totalTime\"]) \u003c= 5000\n  # Billing: psycopg's warning when it closes a pipeline whose statement failed. Every such failure is\n  # already reported by billing itself: a wallet that cannot cover a reserve (sqlstate INSUFFICIENT,\n  # the design) as a 402, which is a metric (billing writes no line for it), any other database\n  # error as billing_database_failure. The line adds only the database host and user.\n  filter/billing:\n    error_mode: ignore\n    logs:\n      log_record:\n        - 'resource.attributes[\"service.name\"] == \"billing\" and instrumentation_scope.name == \"psycopg\" and IsMatch(body, \"^error ignored terminating \u003cpsycopg\\\\.AsyncPipeline .*\u003e: pipeline aborted$\")'\n  # Only the gateway's own span (one per request, tools/apim-spend/trace-span.xml) is counted: the\n  # model call's child span and every service's spans are not requests.\n  filter/gateway-requests:\n    error_mode: ignore\n    traces:\n      span:\n        - resource.attributes[\"service.name\"] != \"apim-gateway\" or kind != SPAN_KIND_SERVER\n  # The instance's region on every metric of ours (TOLLGATE_REGION, from deploy/scripts/observability.sh;\n  # \"unknown\" on a cluster that names none). The gateway's own metrics carry theirs as Location. And two\n  # labels span_metrics adds to each count come off: the collector's own id, new on every restart (each\n  # would start a new set of series; one replica runs, so no two collectors write the same series), and\n  # a copy of service.name, which Prometheus already makes a label of from the resource.\n  transform/metrics:\n    error_mode: ignore\n    metric_statements:\n      - context: datapoint\n        conditions:\n          - IsMatch(metric.name, \"^g42us\\\\.\")\n        statements:\n          - set(attributes[\"cloud.region\"], \"${env:TOLLGATE_REGION:-unknown}\")\n          - delete_key(attributes, \"collector.instance.id\")\n          - delete_key(attributes, \"service.name\")\n  resource/k8s-events:\n    attributes:\n      - { key: service.name, value: k8s-events, action: upsert }\n  batch:\n    send_batch_size: 1024\n    timeout: 2s\n\nconnectors:\n  # One count per request, by model (g42us.model: a model the catalogue routes, or unknown), the status\n  # the caller got and why it failed (error.type: invalid_api_key, insufficient_funds, model_backend or\n  # other; none on a success). Few series on purpose: no duration histogram (the gateway's own metrics\n  # have one) and none of the default span name, kind and status dimensions. In Prometheus:\n  # g42us_gateway_calls_total{g42us_model, http_response_status_code, error_type, cloud_region}.\n  span_metrics/gateway:\n    namespace: g42us.gateway\n    histogram:\n      disable: true\n    exclude_dimensions: [span.name, span.kind, status.code]\n    dimensions:\n      - { name: g42us.model, default: unknown }\n      - { name: http.response.status_code }\n      - { name: error.type }\n    resource_metrics_key_attributes: [service.name]\n    metrics_flush_interval: 15s\n\n# Each exporter queues on disk (file_storage/queue, the PVC otel-collector-queue), not in memory: while its store is\n# away (restarted, or moved to another node pool by stack migrate) the collector keeps what arrives and survives its\n# own restart with it. Retries go on for 30 minutes (the default is 5), longer than a store's move. The defaults were\n# 1,000 batches in memory, lost on a restart. Each queue is sized in bytes (sizer: bytes), 256 MiB, so the three fit\n# the 2Gi disk they share (collector.yaml): 768 MiB of queues, plus room for the compaction on start, which writes a\n# copy of one queue's database beside it, and bbolt's own overhead. Counted in batches (send_batch_size 1024, no max)\n# a queue had no bound in bytes: a long Loki or Tempo outage could fill the disk (ENOSPC), and the compaction on the\n# next start would then fail too, a crash loop. A full queue refuses what arrives (the collector's refused counters).\nexporters:\n  otlp/tempo:\n    endpoint: tempo:4317\n    tls: { insecure: true }\n    sending_queue: { enabled: true, storage: file_storage/queue, sizer: bytes, queue_size: 268435456 }\n    retry_on_failure: { enabled: true, max_elapsed_time: 30m }\n  otlphttp/loki:\n    endpoint: http://loki:3100/otlp\n    sending_queue: { enabled: true, storage: file_storage/queue, sizer: bytes, queue_size: 268435456 }\n    retry_on_failure: { enabled: true, max_elapsed_time: 30m }\n  otlphttp/prometheus:\n    endpoint: http://prometheus:9090/api/v1/otlp\n    sending_queue: { enabled: true, storage: file_storage/queue, sizer: bytes, queue_size: 268435456 }\n    retry_on_failure: { enabled: true, max_elapsed_time: 30m }\n\nextensions:\n  health_check: { endpoint: 0.0.0.0:13133 }\n  # The root filesystem is read-only, so compaction works in the queue's own directory, not /tmp.\n  file_storage/queue:\n    directory: /var/lib/otelcol/queue\n    compaction: { on_start: true, directory: /var/lib/otelcol/queue }\n\nservice:\n  extensions: [health_check, file_storage/queue]\n  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [memory_limiter, k8sattributes, transform/redact, batch]\n      exporters: [otlp/tempo]\n    traces/gateway-requests:\n      receivers: [otlp]\n      processors: [memory_limiter, filter/gateway-requests]\n      exporters: [span_metrics/gateway]\n    logs:\n      receivers: [otlp]\n      processors: [memory_limiter, k8sattributes, transform/apim-gateway, transform/stream-filter, filter/apim-gateway, filter/billing, transform/redact, batch]\n      exporters: [otlphttp/loki]\n    logs/k8s-events:\n      receivers: [k8s_events]\n      processors: [memory_limiter, resource/k8s-events, transform/redact, batch]\n      exporters: [otlphttp/loki]\n    metrics:\n      receivers: [k8s_cluster, otlp, span_metrics/gateway]\n      processors: [memory_limiter, k8sattributes/metrics, transform/metrics, batch]\n      exporters: [otlphttp/prometheus]\n  telemetry:\n    logs: { level: info }\n    # The pipeline's own counters (accepted, refused, sent, failed per signal), pushed to Prometheus.\n    metrics:\n      level: normal\n      readers:\n        - periodic:\n            interval: 30000\n            exporter:\n              otlp:\n                protocol: http/protobuf\n                endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"otel-collector-config-678b69g5hf","namespace":"observability"}}
