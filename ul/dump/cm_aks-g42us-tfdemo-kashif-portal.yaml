d/g42us-overview\",\n      \"icon\": \"dashboard\"\n    },\n    {\n      \"title\": \"Metrics\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-metrics\",\n      \"icon\": \"graph\"\n    },\n    {\n      \"title\": \"Request failures\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-failures\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Gateway (APIM)\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-gateway\",\n      \"icon\": \"cloud\"\n    },\n    {\n      \"title\": \"Spend control\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-spend\",\n      \"icon\": \"bolt\"\n    },\n    {\n      \"title\": \"Health\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-health\",\n      \"icon\": \"heart\"\n    },\n    {\n      \"title\": \"Request lookup\",\n      \"type\": \"link\",\n      \"url\": \"/d/g42us-request\",\n      \"icon\": \"search\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"type\": \"text\",\n      \"title\": \"About\",\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\": \"**The APIM self-hosted gateway**: every request the clients send, including the ones it refuses before spend control sees them (401 no or wrong key, a plan's 403 or 429; the policy's own 400/403, and spend control's 402). Charts from the gateway's own **metrics** (pushed once a minute, so the last minute fills in late) and its **request log** in Loki: one line per request with its code, times, product and operation. A line's `trace_id` is the request's `X-G42US-Request-Id` without dashes: expand it and open the trace. One request: **Request lookup**. How it's collected: `architecture/observability.md`, *The APIM gateway*.\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 24,\n        \"h\": 3\n      },\n      \"id\": 1\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Gateway up\",\n      \"description\": \"Ready replicas of the gateway Deployment (apim-spend-gateway). 0 means no request gets through.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(k8s_deployment_available{k8s_deployment_name=\\\"apim-spend-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"})\",\n          \"legendFormat\": \"\",\n          \"range\": false,\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 1\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 3,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"id\": 2\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Requests (in range)\",\n      \"description\": \"Every request the gateway answered in the selected time range.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(increase(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[$__range]))\",\n          \"legendFormat\": \"\",\n          \"range\": false,\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value\"\n      },\n      \"gridPos\": {\n        \"x\": 4,\n        \"y\": 3,\n        \"w\": 5,\n        \"h\": 5\n      },\n      \"id\": 3\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Succeeded (in range)\",\n      \"description\": \"Share of requests answered 2xx. Refusals by design (429 on a trial plan, 402 out of funds) count against it.\",\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(increase(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\", ResponseCodeCategory=\\\"2xx\\\"}[$__range])) / sum(increase(Requests_Count_total{service_name=\\\"apim-gateway\\\", k8s_namespace_name=~\\\"$namespace\\\"}[$__range]))\",\n          \"legendFormat\": \"\",\n          \"range\": false,\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"