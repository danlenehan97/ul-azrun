- apiVersion: v1
  data:
    datasources.yaml: |
      # Provisioned, not hand-made: Tempo and Loki, linked both ways by trace_id, and Prometheus (workload
      # health and the collector's own counters).
      apiVersion: 1
      datasources:
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          isDefault: true
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              filterByTraceID: true
              customQuery: true
              query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__span.traceId}"'
            serviceMap: { datasourceUid: "" }
            nodeGraph: { enabled: true }
            search: { hide: false }
            lokiSearch: { datasourceUid: loki }
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki:3100
          jsonData:
            derivedFields:
              - name: trace_id
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: tempo
                url: "$${__value.raw}"
                urlDisplayLabel: Open trace in Tempo
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          jsonData:
            timeInterval: 30s
