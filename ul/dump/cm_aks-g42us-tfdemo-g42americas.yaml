    name: openmeter-clickhouse-config-4hht28h2mf
    namespace: wallet-billing
    resourceVersion: "10012367"
    uid: 76b3193d-afbb-4e7b-b29e-df2cfb27d01c
- apiVersion: v1
  data:
    config.yaml: |
      # OpenMeter's configuration, read by the API and the sink worker (components/openmeter).
      # No secret is in this file: POSTGRES_URL and AGGREGATION_CLICKHOUSE_PASSWORD come from the
      # Secret openmeter-secrets as environment variables, which override the empty values here.
      address: 0.0.0.0:8888

      telemetry:
        address: 0.0.0.0:10000
        log:
          level: info

      ingest:
        kafka:
          broker: openmeter-kafka:9092

      aggregation:
        clickhouse:
          address: openmeter-clickhouse:9000
          username: openmeter
          password: ""

      # De-duplication is off by default and a repeated event would be counted twice. It is set on the sink
      # worker only: with a top-level `dedupe` block as well, no event reached ClickHouse (observed on
      # v1.0.0-beta.235 with Redis), so do not copy that block in. Redis keeps its state on a volume, so a
      # restart does not forget what it has seen.
      sink:
        kafka:
          brokers: openmeter-kafka:9092
        dedupe:
          enabled: true
          driver: redis
          config:
            address: openmeter-redis:6379
            database: 0
            expiration: 768h # 32 days

      postgres:
        url: ""
        autoMigrate: migration

      # The forwarder aggregates usage.ledger per type, Resource, model, price version, plan and minute,
      # and durably seals exact CloudEvents before sending to OpenMeter.
      # One event stands for many calls: every meter SUMs request_count/tokens, never counts events.
      # subject = customer_id.
      #
      # A meter's value is a float64 in OpenMeter, exact for whole numbers below 2^53. The token meters feed
      # invoices (with the pinned price version); cost_nano is for display only (contract C9).
      meters:
        - slug: requests
          description: Settled calls
          eventType: inference.settled
          aggregation: SUM
          valueProperty: $.request_count
          groupBy:
            resource_id: $.resource_id
            model: $.model
            price_version_id: $.price_version_id
            plan_id: $.plan_id
            currency: $.currency
        - slug: prompt_tokens
          description: Prompt tokens settled
          eventType: inference.settled
          aggregation: SUM
          valueProperty: $.prompt_tokens
          groupBy:
            resource_id: $.resource_id
            model: $.model
            price_version_id: $.price_version_id
            plan_id: $.plan_id
            currency: $.currency
        - slug: completion_tokens
          description: Completion tokens settled
          eventType: inference.settled
          aggregation: SUM
          valueProperty: $.completion_tokens
          groupBy:
            resource_id: $.resource_id
            model: $.model
            price_version_id: $.price_version_id
            plan_id: $.plan_id
            currency: $.currency
        # Display only: float64, never invoiced from. Invoices are the token meters times the price version.
        - slug: cost_nano
          description: Cost settled in nano-units (display only)
          eventType: inference.settled
          aggregation: SUM
          valueProperty: $.cost_nano
          groupBy:
            resource_id: $.resource_id
            model: $.model
            price_version_id: $.price_version_id
            plan_id: $.plan_id
            currency: $.currency
        # Settles of a hold the sweeper had already expired: the cost is still charged (contract: late_count).
        - slug: late_requests
          description: Settled calls whose hold had already expired
          eventType: inference.settled
          aggregation: SUM
          valueProperty: $.late_count
          groupBy:
            resource_id: $.resource_id
            model: $.model
            price_version_id: $.price_version_id
            plan_id: $.plan_id
            currency: $.currency
        - slug: voided_requests
          description: Calls voided before settling
          eventType: inference.voided
          aggregation: SUM
          valueProperty: $.request_count
          groupBy:
            resource_id: $.resource_id
            model: $.model
            reason: $.reason
            plan_id: $.plan_id
            currency: $.currency
        # What the voids gave back to the wallets, in nano-units (display only, like cost_nano).
        - slug: voided_released_nano
          description: Nano-units released by voided calls (display only)
          eventType: inference.voided
          aggregation: SUM
          valueProperty: $.released_nano
          groupBy:
            resource_id: $.resource_id
            model: $.model
            reason: $.reason
            plan_id: $.plan_id
            currency: $.currency
        # Expiry should not happen: a count above 0 is an alert.
        - slug: expired_requests
          description: Holds that expired unsettled
          eventType: inference.expired
          aggregation: SUM
          valueProperty: $.request_count
          groupBy:
            resource_id: $.resource_id
            model: $.model
            price_version_id: $.price_version_id
            plan_id: $.plan_id
            currency: $.currency
        # Should be 0 as well (contract: released_nano of an expiry): above 0 is an alert.
        - slug: expired_released_nano
          description: Nano-units released by expired holds (display only; should be 0)
          eventType: inference.expired
          aggregation: SUM
          valueProperty: $.released_nano
          groupBy:
            resource_id: $.resource_id
            model: $.model
            price_version_id: $.price_version_id
            plan_id: $.plan_id
            currency: $.currency
