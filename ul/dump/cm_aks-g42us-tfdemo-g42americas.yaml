  data:
    filter: |
      -A INPUT -p udp --dport 68 -j ACCEPT
      -A FORWARD -d 168.63.129.16/32 -p tcp -m tcp --dport 32526 -j DROP
      -A FORWARD -d 168.63.129.16/32 -p tcp -m tcp --dport 80 -j DROP
    global: "^-N .*\n^-P .*\n^-A (KUBE-FIREWALL) .*\n\n^-A .* -j (KUBE-FIREWALL)\n^-A
      IP-MASQ-AGENT\n^-A .* -j IP-MASQ-AGENT\n\n^.*--comment.*cilium:\n^.*--comment.*cilium-feeder:\n^.*--comment.*AKS
      managed: added by AgentBaker\n^-A CILIUM_\\S+ \n"
    mangle: |
      -A FORWARD -d 168.63.129.16/32 -p tcp -m tcp --dport 80 -j DROP
      -A FORWARD -d 168.63.129.16/32 -p tcp -m tcp --dport 32526 -j DROP
    nat: |
      -A POSTROUTING -j SWIFT
      -A SWIFT -s
      -A POSTROUTING -j SWIFT-POSTROUTING
      -A SWIFT-POSTROUTING -s
      -A .* -j ISTIO_POSTRT
      -A ISTIO_POSTRT .* -j SNAT .*
      -A OUTPUT -p tcp -d .* -j DNAT --to-destination .*
    raw: |
      ^-A (PREROUTING|OUTPUT) -d 169\.254\.10\.(10|11)\/32 -p (tcp|udp) -m comment --comment "localdns: skip conntrack" -m (tcp|udp) --dport 53 -j NOTRACK$
      ^-A OUTPUT -s 169\.254\.10\.(10|11)\/32 -p (tcp|udp) -m comment --comment "localdns: skip conntrack" -m (tcp|udp) --sport 53 -j NOTRACK$
    security: |
      -A OUTPUT -d 168.63.129.16/32 -p tcp -m tcp --dport 53 -j ACCEPT
      -A OUTPUT -d 168.63.129.16/32 -p tcp -m owner --uid-owner 0 -j ACCEPT
      -A OUTPUT -d 168.63.129.16/32 -p tcp -m conntrack --ctstate INVALID,NEW -j DROP
