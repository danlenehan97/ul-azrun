        {"apiVersion":"v1","data":{"drain_probe.py":"\"\"\"READ ONLY probe of the drain path, for the drain monitor (monitor.py), which starts it beside\nitself in the monitor's pod:\n\n    python drain_probe.py [KAFKA_BOOTSTRAP [KEEP]]\n\nIt prints one JSON object per line, until its stdin or its stdout closes:\n\n    entry      a decision as a Lua script appended it to x:{bucket}, read with XREAD (no\n               consumer group, so nothing is acknowledged, claimed or trimmed by reading it).\n               Only the buckets of customers that have a wallet are followed, every\n               MONITOR_TAIL_MS (250 ms), a few entries of each: a sample, since the drainer\n               trims an entry once Kafka has it, and so that watching costs Redis little\n    redis      every 2 s, per primary: the stream backlog, the age of the oldest entry, what\n               each consumer group has pending, open holds, ops/s, memory, replicas; and the\n               settled and reserved of the wallets it knows by name: PostgreSQL's, which the\n               monitor names, and those of the entries seen (MOST_WALLETS at most)\n    kafka      a committed record of usage.checkpoints or, decoded from\n               Protobuf, usage.ledger (read_committed)\n    kafka_ends every 2 s: each partition's low and high watermark\n    hold       a hold read while still open (between its reserve and its settle), found in\n               the open-holds set e:{bucket} by the same poll; a few a second at most\n    bucket     every INSPECT_SECONDS, for the one bucket the page asks to inspect, and only\n               while someone has the page open: the keys of its slot, MOST_KEYS at most\n               (wallets v:, holds h:, idempotency records i:, the open-holds set e:, the stream\n               x:) with their type, TTL, size and whole value\n    error      a source that could not be read; it is retried\n\nIt cannot write. Every Redis command goes through READS below and anything else is refused\nbefore it is sent. SCAN and KEYS are not among them: the probe runs in every Redis-mode\ndeployment, watched or not, and never walks a node's keyspace. The Kafka consumer is assigned its partitions (it joins no group) and commits\nno offset.\n\"\"\"\n\nimport json\nimport os\nimport sys\nimport threading\nimport time\nfrom collections import defaultdict\n\nfrom redis import Redis\nfrom redis.cluster import ClusterNode, RedisCluster\nfrom redis.crc import key_slot\nfrom redis.exceptions import RedisError\nfrom spend_control.redis_service import BUCKETS, bucket_of_customer, tag\nfrom spend_control.worker import recovery_topic\n\nREADS = frozenset({\n    \"XREAD\", \"XLEN\", \"XRANGE\", \"XINFO\", \"XPENDING\", \"ZCARD\", \"HGETALL\", \"GET\", \"INFO\",\n    \"TIME\", \"TYPE\", \"PTTL\", \"EXISTS\", \"READONLY\", \"PING\", \"AUTH\", \"HELLO\", \"CLIENT\", \"SELECT\",\n    \"CLUSTER\", \"COMMAND\", \"ZRANGE\", \"MEMORY\", \"XREVRANGE\",\n})\nTOPICS = (recovery_topic(os.environ),\n          os.environ.get(\"DRAINER_CHECKPOINTS_TOPIC\", \"usage.checkpoints\"))\n# The mandatory usage ledger topic (contracts/usage/ledger.md), encoded as Protobuf.\nLEDGER = os.environ.get(\"DRAINER_LEDGER_TOPIC\") or \"usage.ledger\"\nBOOTSTRAP = sys.argv[1] if len(sys.argv) \u003e 1 else os.environ.get(\"KAFKA_BOOTSTRAP_SERVERS\", \"\")\n# What watching may cost Redis: how often the followed streams are read, how many entries of\n# each a read takes, and how many open holds a read looks into. At 1,200 req/s there are\n# thousands of open holds; reading each would be a load of its own.\nTAIL_SECONDS = max(20, int(os.environ.get(\"MONITOR_TAIL_MS\", \"250\"))) / 1000\nTAIL_COUNT = 20\nHOLDS_A_POLL = 2\n# Records of each Kafka partition replayed at start: what the monitor remembers (--keep).\nTAIL = int(sys.argv[2]) if len(sys.argv) \u003e 2 and sys.argv[2].isdigit() else 200\nOUT = threading.Lock()\nSTOP = threading.Event()\n\n\ndef emit(kind, **body):\n    line = json.dumps({\"kind\": kind, \"at\": time.time(), **body}, default=str)\n    with OUT:\n        try:\n            sys.stdout.write(line + \"\\n\")\n            sys.stdout.flush()\n        except (BrokenPipeError, ValueError):\n            STOP.set()\n\n\nclass WriteRefused(Exception):\n    pass\n\n\n# Commands whose name alone does not say whether they read: only these forms of them are sent.\nREAD_FORMS = {\n    \"CLUSTER\": frozenset({\"SLOTS\", \"SHARDS\", \"NODES\", \"INFO\", \"MYID\", \"KEYSLOT\",\n                          \"COUNTKEYSINSLOT\", \"GETKEYSINSLOT\"}),\n    \"CLIENT\": frozenset({\"SETNAME\", \"SETINFO\", \"GETNAME\", \"ID\", \"INFO\"}),\n    \"MEMORY\": frozenset({\"USAGE\", \"STATS\"}),\n}\n\n\ndef read_only(name, *arguments):\n    words = str(name).upper().split() + [str(a).upper() for a in arguments[:1]]\n    if not words or words[0] not in READS or (\n            words[0] in READ_FORMS and (len(words) \u003c 2 or words[1] not in READ_FORMS[words[0]])):\n        raise WriteRefused(f\"{name} is not a read: the probe does not send it\")\n\n\nclass ReadOnlyRedis(Redis):\n    \"\"\"A Redis client that refuses any command outside READS before it is sent.\"\"\"\n\n    def execute_command(self, *args, **options):\n        read_only(*args)\n        return super().execute_command(*args, **options)\n\n    def pipeline(self, transaction=False, shard_hint=None):\n        pipe = super().pipeline(transaction=False, shard_hint=shard_hint)\n        send = pipe.execute_command\n\n        def checked(*args, **options):\n            read_only(*args)\n            return send(*args, **options)\n\n        pipe.execute_command = checked\n        return pipe\n\n\ndef primaries():\n    \"\"\"{node name: (client, [buckets it owns])}, from the cluster's own slot map.\"\"\"\n    hosts = os.environ[\"REDIS_URL\"].split(\"://\", 1)[1].split(\",\")\n    password = os.environ.get(\"REDIS_PASSWORD\") or None\n    username = os.environ.get(\"REDIS_USERNAME\") or None\n    rc = RedisCluster(startup_nodes=[ClusterNode(h.rsplit(\":\", 1)[0], int(h.rsplit(\":\", 1)[1]))\n                                     for h in hosts], password=password, username=username)\n    try:\n        owned = defaultdict(list)\n        for bucket in range(BUCKETS):\n            node = rc.get_node_from_key(f\"x:{tag(bucket)}\")\n            owned[(node.host, node.port)].append(bucket)\n    finally:\n        rc.close()\n    return {f\"{host}:{port}\": (ReadOnlyRedis(host=host, port=port, password=password,\n                                             username=username, decode_responses=True,\n                                             socket_timeout=10), buckets)\n            for (host, port), buckets in owned.items()}\n\n\nWATCHED = set()  # buckets whose streams are tailed: those of the customers the monitor names\nWATCH_LOCK = threading.Lock()\nMOST = 300  # buckets tailed at most; each costs one XREAD per node poll\n\n\ndef watch(buckets):\n    with WATCH_LOCK:\n        WATCHED.update(buckets)\n\n\n# The wallets whose settled and reserved are read: asked for by key, never looked for.\nNAMED = []  # PostgreSQL's wallets, as the monitor last named them\nSEEN = {}  # those of the entries seen: a wallet PostgreSQL does not have still shows\nMOST_WALLETS = 500\n\n\ndef is_wallet(key):\n    return isinstance(key, str) and key.startswith(\"v:{b\") and key[4:8].isdigit() and len(key) \u003c= 512\n\n\ndef name_wallets(rows, bucket_of=bucket_of_customer):\n    \"\"\"rows: [customer id, api key id, currency] each, as wallet_accounts has them.\"\"\"\n    keys = [f\"v:{tag(bucket_of(str(customer)))}:{resource}:{currency}\"\n            for customer, resource, currency in rows[:MOST_WALLETS]]\n    with WATCH_LOCK:\n        NAMED[:] = [key for key in keys if is_wallet(key)]\n\n\ndef saw_wallet(key):\n    if is_wallet(key):\n        with WATCH_LOCK:\n            if len(SEEN) \u003e= MOST_WALLETS:\n                SEEN.clear()\n            SEEN[key] = None\n\n\ndef wallets_of(buckets):\n    \"\"\"The known wallets of these buckets, the named ones first.\"\"\"\n    mine = set(buckets)\n    with WATCH_LOCK:\n        known = list(dict.fromkeys([*NAMED, *SEEN]))\n    return [key for key in known if int(key[4:8]) in mine][:MOST_WALLETS]\n\n\ndef tail(name, client, buckets, every=TAIL_SECONDS):\n    \"\"\"The entries of the watched streams on this node, as they are appended.\n\n    A cluster node refuses one XREAD over streams of different buckets (they hash to\n    different slots), so a blocking read of them all is not possible: each watched stream is\n    read with its own XREAD, all in one pipeline, every `every` seconds, TAIL_COUNT entries\n    at most. The drainer trims an entry once Kafka has it, usually within 250 ms, so this is\n    a sample: an entry appended and trimmed between two polls is not seen.\"\"\"\n    mine, last, open_seen = set(buckets), {}, set()\n    while not STOP.is_set():\n        with WATCH_LOCK:\n            wanted = sorted(WATCHED \u0026 mine)[:MOST]\n        if not wanted:\n            STOP.wait(0.5)\n            continue\n        try:\n            pipe = client.pipeline()\n            for bucket in wanted:\n                stream = f\"x:{tag(bucket)}\"\n                pipe.xread({stream: last.get(stream, \"0-0\")}, count=TAIL_COUNT)\n                pipe.zrange(f\"e:{tag(bucket)}\", 0, 9)  # holds still open, by expiry\n            replies = pipe.execute(raise_on_error=False)\n            for reply in replies:\n                if isinstance(reply, Exception):\n                    raise reply\n            looked = 0\n            for bucket, reply, still_open in zip(wanted, replies[0::2], replies[1::2], strict=True):\n                for stream, entries in reply or []:\n                    for entry_id, fields in entries:\n                        last[stream] = entry_id\n                        saw_wallet(fields.get(\"vk\"))\n                        emit(\"entry\", node=name, stream=stream, id=entry_id, fields=fields)\n                # A hold seen open for the first time: read it now, before its settle closes it.\n                for authorization in still_open:\n                    key = f\"h:{tag(bucket)}:{authorization}\"\n                    if key in open_seen or looked \u003e= HOLDS_A_POLL:\n                        continue\n                    looked += 1\n                    open_seen.add(key)\n                    hold = client.hgetall(key)\n                    if hold:\n                        emit(\"hold\", node=name, key=key, pttl_ms=client.pttl(key),\n                             bytes=client.memory_usage(key), value=hold)\n            if len(open_seen) \u003e 5000:\n                open_seen.clear()\n        except (RedisError, OSError, ValueError) as error:  # a failover, a restart: read on\n            emit(\"error\", where=f\"redis {name} streams\", error=f\"{type(error).__name__}: {error}\"[:300])\n            STOP.wait(2)\n        STOP.wait(every)\n\n\ndef node_summary(name, client, buckets):\n    streams = [f\"x:{tag(b)}\" for b in buckets]\n    pipe = client.pipeline()\n    for stream in streams:\n        pipe.xlen(stream)\n    for b in buckets:\n        pipe.zcard(f\"e:{tag(b)}\")\n    pipe.time()\n    replies = pipe.execute(raise_on_error=False)\n    lengths = [n if isinstance(n, int) else 0 for n in replies[:len(streams)]]\n    holds = sum(n for n in replies[len(streams):2 * len(streams)] if isinstance(n, int))\n    seconds, micros = replies[-1]\n    now_ms = int(seconds) * 1000 + int(micros) // 1000\n    waiting, oldest = {}, None\n    for stream, length in zip(streams, lengths, strict=True):\n        if not length:\n            continue\n        first = client.xrange(stream, count=1)\n        groups = [{\"name\": g[\"name\"], \"pending\": g[\"pending\"], \"lag\": g.get(\"lag\"),\n                   \"last_delivered\": g[\"last-delivered-id\"]} for g in client.xinfo_groups(stream)]\n        age = now_ms - int(first[0][0].split(\"-\")[0]) if first else None\n        waiting[stream] = {\"length\": length, \"first_id\": first[0][0] if first else None,\n                           \"age_ms\": age, \"groups\": groups}\n        if age is not None and (oldest is None or age \u003e oldest):\n            oldest = age\n    info = client.info()\n    replicas = [{\"address\": f\"{v.get('ip')}:{v.get('port')}\", \"state\": v.get(\"state\"),\n                 \"lag_s\": v.get(\"lag\"), \"offset\": v.get(\"offset\")}\n                for k, v in info.items() if k.startswith(\"slave\") and isinstance(v, dict)]\n    keys = wallets_of(buckets)\n    pipe = client.pipeline()\n    for key in keys:\n        pipe.hgetall(key)\n    wallets = {key: value for key, value in zip(keys, pipe.execute(raise_on_error=False), strict=True)\n               if value and isinstance(value, dict)}\n    watch({int(key[4:8]) for key in wallets})  # v:{bNNNN}:...\n    return {\"name\": name, \"buckets\": len(buckets), \"stream_entries\": sum(lengths),\n            \"oldest_age_ms\": oldest, \"waiting\": waiting, \"open_holds\": holds,\n            \"ops_per_sec\": info.get(\"instantaneous_ops_per_sec\"),\n            \"used_memory\": info.get(\"used_memory\"), \"maxmemory\": info.get(\"maxmemory\"),\n            \"master_repl_offset\": info.get(\"master_repl_offset\"), \"replicas\": replicas,\n            \"run_id\": info.get(\"run_id\")}, wallets\n\n\ndef summaries(nodes):\n    while not STOP.is_set():\n        found, wallets = [], {}\n        for name, (client, buckets) in nodes.items():\n            try:\n                summary, held = node_summary(name, client, buckets)\n                found.append(summary)\n                wallets |= held\n            except (RedisError, OSError, ValueError, KeyError) as error:\n                emit(\"error\", where=f\"redis {name}\", error=f\"{type(error).__name__}: {error}\"[:300])\n        emit(\"redis\", nodes=found, wallets=wallets)\n        STOP.wait(2)\n\n\nINSPECT = {\"bucket\": None}  # the bucket whose keys are shown in full, or None\nMOST_KEYS = 400\nINSPECT_SECONDS = 2  # each key shown costs four commands or more: not twice a second\n\n\ndef bucket_keys(client, bucket):\n    \"\"\"The bucket's keys, MOST_KEYS at most, and whether there are more: read from its slot,\n    which holds this bucket's keys and no other's. Never a scan of the node.\"\"\"\n    slot = key_slot(f\"x:{tag(bucket)}\".encode())\n    total = client.execute_command(\"CLUSTER COUNTKEYSINSLOT\", slot)\n    keys = client.execute_command(\"CLUSTER GETKEYSINSLOT\", slot, MOST_KEYS)\n    return keys, int(total) \u003e len(keys)\n\n\ndef key_value(client, key):\n    kind = client.type(key)\n    item = {\"type\": kind, \"pttl_ms\": client.pttl(key), \"bytes\": client.memory_usage(key)}\n    if kind == \"hash\":\n        item[\"value\"] = client.hgetall(key)\n    elif kind == \"string\":\n        item[\"value\"] = client.get(key)\n    elif kind == \"zset\":\n        item[\"value\"] = client.zrange(key, 0, 199, withscores=True)\n    elif kind == \"stream\":\n        item[\"value\"] = {\n            \"length\": client.xlen(key),\n            \"groups\": [{\"name\": g[\"name\"], \"consumers\": g[\"consumers\"], \"pending\": g[\"pending\"],\n                        \"last_delivered\": g[\"last-delivered-id\"], \"lag\": g.get(\"lag\")}\n                       for g in client.xinfo_groups(key)],\n            \"entries\": [{\"id\": i, \"fields\": f} for i, f in client.xrange(key, count=50)]}\n    return item\n\n\ndef inspector(nodes, every=INSPECT_SECONDS):\n    \"\"\"Every key of the inspected bucket, on the primary that owns it.\"\"\"\n    owner = {bucket: name for name, (_, buckets) in nodes.items() for bucket in buckets}\n    while not STOP.is_set():\n        bucket = INSPECT[\"bucket\"]\n        if bucket is None or bucket not in owner:\n            STOP.wait(every)\n            continue\n        name = owner[bucket]\n        client = nodes[name][0]\n        try:\n            keys, truncated = bucket_keys(client, bucket)\n            values = {}\n            for key in sorted(keys):\n                try:\n                    values[key] = key_value(client, key)\n                except (RedisError, OSError, KeyError):  # gone between the listing and the read\n                    continue\n            emit(\"bucket\", bucket=f\"b{bucket:04d}\", node=name, keys=values, truncated=truncated)\n        except (RedisError, OSError, ValueError) as error:\n            emit(\"error\", where=f\"redis {name} bucket b{bucket:04d}\",\n                 error=f\"{type(error).__name__}: {error}\"[:300])\n        STOP.wait(every)\n\n\ndef ledger_record(raw):\n    \"\"\"A usage.ledger value as the fields it sets, by their names in ledger.proto. A 64-bit\n    number comes out as text (Protobuf's JSON form), so no amount passes through a float.\"\"\"\n    from google.protobuf.json_format import MessageToDict\n    from spend_control.usage_ledger_pb2 import LedgerRecord\n    return MessageToDict(LedgerRecord.FromString(raw), preserving_proto_field_name=True)\n\n\ndef decoded(topic, raw):\n    from google.protobuf.message import DecodeError\n    try:\n        return ledger_record(raw) if topic == LEDGER else json.loads(raw)\n    except (ValueError, DecodeError):  # shown as unreadable, never a reason to stop reading\n        return {\"unreadable\": raw.decode(errors=\"replace\")[:500]}\n\n\ndef kafka():\n    from confluent_kafka import Consumer, KafkaError, KafkaException, TopicPartition\n    from spend_control.drainer import kafka_settings\n    while not STOP.is_set():\n        consumer = meter = None\n        try:\n            settings = {**kafka_settings({**os.environ, \"KAFKA_BOOTSTRAP_SERVERS\": BOOTSTRAP}),\n                        \"group.id\": \"drain-probe\",\n                        \"isolation.level\": \"read_committed\", \"enable.auto.commit\": False,\n                        \"enable.auto.offset.store\": False, \"enable.partition.eof\": False,\n                        \"socket.timeout.ms\": 10000, \"allow.auto.create.topics\": False}\n            consumer = Consumer(settings)\n            # The watermarks are asked on a client of their own: asked on the reading one, each\n            # question held its fetches back and a replay crawled at a message every two seconds.\n            meter = Consumer({**settings, \"isolation.level\": \"read_uncommitted\"})\n            assigned = []\n            for topic in dict.fromkeys((*TOPICS, LEDGER)):\n                meta = consumer.list_topics(topic, timeout=10).topics[topic]\n                if meta.error is not None:\n                    raise RuntimeError(f\"{topic}: {meta.error}\")\n                # The usage ledger has many partitions: a few records of each are replayed. Never\n                # fewer than four offsets: a partition's last one is a transaction's commit marker.\n                replay = TAIL if topic != LEDGER else max(4, TAIL // len(meta.partitions))\n                for partition in meta.partitions:\n                    low, high = meter.get_watermark_offsets(\n                        TopicPartition(topic, partition), timeout=10)\n                    assigned.append(TopicPartition(topic, partition, max(low, high - replay)))\n            consumer.assign(assigned)\n            checked = 0.0\n            while not STOP.is_set():\n                message = consumer.poll(0.5)\n                if message is not None and not message.error():\n                    value = decoded(message.topic(), message.value())\n                    emit(\"kafka\", topic=message.topic(), partition=message.partition(),\n                         offset=message.offset(), broker_ms=message.timestamp()[1],\n                         key=(message.key() or b\"\").decode(errors=\"replace\"),\n                         headers=[[k, v.decode(errors=\"replace\")] for k, v in message.headers() or []],\n                         bytes=len(message.value()), value=value)\n                elif message is not None and message.error().code() != KafkaError._PARTITION_EOF:\n                    raise RuntimeError(str(message.error()))\n                if time.monotonic() - checked \u003e= 2:\n                    checked = time.monotonic()\n                    ends = defaultdict(dict)\n                    for tp in assigned:\n                        low, high = meter.get_watermark_offsets(\n                            TopicPartition(tp.topic, tp.partition), timeout=5)\n                        ends[tp.topic][str(tp.partition)] = {\"low\": low, \"high\": high}\n                    emit(\"kafka_ends\", bootstrap=BOOTSTRAP, topics=ends)\n        except (KafkaException, RuntimeError, OSError, KeyError, ValueError) as error:\n            emit(\"error\", where=f\"kafka {BOOTSTRAP}\", error=f\"{type(error).__name__}: {error}\"[:300])\n            STOP.wait(5)\n        finally:\n            for client in (consumer, meter):\n                if client is not None:\n                    client.close()\n\n\ndef main():\n    nodes = primaries()\n    workers = [threading.Thread(target=tail, args=(name, client, buckets), daemon=True)\n               for name, (client, buckets) in nodes.items()]\n    # The summary has clients of its own: a blocked XREAD holds its connection.\n    workers.append(threading.Thread(target=summaries, args=(primaries(),), daemon=True))\n    workers.append(threading.Thread(target=inspector, args=(primaries(),), daemon=True))\n    workers.append(threading.Thread(target=kafka, daemon=True))\n    for worker in workers:\n        worker.start()\n    # The monitor names the customers to follow, their wallets and the bucket to inspect, one\n    # JSON line at a time ({\"customers\": [...], \"wallets\": [[customer, api key, currency], ...],\n    # \"inspect\": \"b0363\" or null: nobody is looking), and ends the probe by closing this stdin.\n    try:\n        while not STOP.is_set():\n            line = sys.stdin.readline()\n            if not line:\n                break\n            try:\n                asked = json.loads(line)\n                watch({bucket_of_customer(c) for c in asked.get(\"customers\", [])})\n                if \"wallets\" in asked:\n                    name_wallets(asked[\"wallets\"])\n                name = asked.get(\"inspect\")\n                if isinstance(name, str) and name[1:].isdigit() and int(name[1:]) \u003c BUCKETS:\n                    INSPECT[\"bucket\"] = int(name[1:])\n                    watch({int(name[1:])})\n                elif \"inspect\" in asked:\n                    INSPECT[\"bucket\"] = None\n            except (ValueError, AttributeError, TypeError):\n                pass\n    except (OSError, ValueError):\n        pass\n    STOP.set()\n\n\nif __name__ == \"__main__\":\n    main()\n","explore.js":"// The explorer's pages (kafka.html, redis.html): a page of records, keys or stream entries per\n// request to explore.py. No markup is ever built from data: every value is set as text.\n\"use strict\";\n\nconst CHOICES = [10, 25, 50, 100, 200, 500];\nconst byId = (id) =\u003e document.getElementById(id);\n\nfunction el(tag, attrs, children) {\n  const node = document.createElement(tag);\n  for (const [name, value] of Object.entries(attrs || {})) {\n    if (value === undefined || value === null || value === \"\") continue;\n    if (name === \"text\") node.textContent = value;\n    else if (name === \"class\") node.className = value;\n    else node.setAttribute(name, value);\n  }\n  for (const child of children || []) node.append(child);\n  return node;\n}\n\nconst text = (value) =\u003e (value === null || value === undefined || value === \"\" ? \"–\" : String(value));\nconst number = (value) =\u003e (value === null || value === undefined ? \"–\" : Number(value).toLocaleString(\"en-US\"));\nconst stamp = (iso) =\u003e (iso ? String(iso).slice(0, 23).replace(\"T\", \" \") : \"–\");\nconst brief = (value) =\u003e {\n  const line = typeof value === \"string\" ? value : JSON.stringify(value);\n  return line === undefined ? \"–\" : line.length \u003e 400 ? `${line.slice(0, 400)}…` : line;\n};\n\nfunction status(message, tone) {\n  byId(\"status\").textContent = message;\n  byId(\"status\").className = tone || \"\";\n}\n\nasync function ask(path, params) {\n  const query = new URLSearchParams();\n  for (const [name, value] of Object.entries(params || {})) {\n    if (value !== undefined \u0026\u0026 value !== null \u0026\u0026 value !== \"\") query.set(name, value);\n  }\n  status(\"reading…\");\n  const reply = await fetch(`${path}?${query}`);\n  if (reply.status === 404) throw new Error(\"the explorer is not switched on in this deployment\");\n  const body = await reply.json();\n  if (!reply.ok) throw new Error(body.error || `HTTP ${reply.status}`);\n  status(`read ${stamp(body.at || new Date().toISOString())} UTC`);\n  return body;\n}\n\nconst failed = (error) =\u003e status(error.message, \"bad\");\n\nfunction choices(select, values, chosen, label) {\n  select.replaceChildren(...values.map((v) =\u003e el(\"option\", { value: String(v), text: label ? label(v) : String(v) })));\n  if (values.map(String).includes(String(chosen))) select.value = String(chosen);\n}\n\nfunction table(columns, rows, emptyText) {\n  if (!rows.length) return el(\"p\", { class: \"empty\", text: emptyText });\n  const head = el(\"tr\", {}, columns.map((c) =\u003e el(\"th\", { class: c.num ? \"num\" : \"\", text: c.title })));\n  const body = rows.map((row) =\u003e el(\"tr\", {}, columns.map((c) =\u003e {\n    const value = c.value(row);\n    const cell = el(\"td\", { class: (c.num ? \"num \" : \"\") + (c.mono ? \"mono\" : \"\") });\n    if (value instanceof Node) cell.append(value); else cell.textContent = text(value);\n    return cell;\n  })));\n  return el(\"table\", {}, [el(\"thead\", {}, [head]), el(\"tbody\", {}, body)]);\n}\n\n// Rows that open to show the whole item as JSON.\nfunction foldable(kind, titles, items, cells, emptyText) {\n  if (!items.length) return el(\"p\", { class: \"empty\", text: emptyText });\n  const head = el(\"div\", { class: `head ${kind}` }, [el(\"span\")].concat(titles.map((t) =\u003e el(\"span\", { text: t }))));\n  const rows = items.map((item) =\u003e el(\"details\", {}, [\n    el(\"summary\", {}, cells(item).map((c) =\u003e el(\"span\", { class: \"mono\", text: text(c) }))),\n    el(\"pre\", { text: JSON.stringify(item, null, 2) })]));\n  return el(\"div\", { class: \"scroll\" }, [head, el(\"div\", { class: `rows ${kind}` }, rows)]);\n}\n\n// \"2026-10-11T16:20:00\" (UTC) as milliseconds; null if it is not a time.\nfunction millis(value) {\n  const typed = value.trim();\n  if (!typed) return null;\n  const parsed = Date.parse(/[zZ]|[+-]\\d\\d:?\\d\\d$/.test(typed) ? typed : `${typed.replace(\" \", \"T\")}Z`);\n  return Number.isNaN(parsed) ? null : parsed;\n}\n\nfunction remembered(name, fallback) {\n  try { return JSON.parse(localStorage.getItem(name)) ?? fallback; } catch (error) { return fallback; }\n}\n\nfunction remember(name, value) {\n  try { localStorage.setItem(name, JSON.stringify(value)); } catch (error) { /* not kept */ }\n}\n\n// ---------------------------------------------------------------- Kafka\n\nfunction kafkaPage() {\n  let topics = {};\n  let page = null;\n  const limit = byId(\"limit\");\n  choices(limit, CHOICES, remembered(\"explorer-kafka-limit\", 50));\n\n  const partitionsOf = (topic) =\u003e Object.entries((topics[topic] || {}).partitions || {})\n    .map(([partition, ends]) =\u003e ({ partition: Number(partition), ...ends }));\n\n  function fillPartitions(chosen) {\n    const all = partitionsOf(byId(\"topic\").value);\n    const holding = all.filter((p) =\u003e p.high \u003e p.low);\n    choices(byId(\"partition\"), (holding.length ? holding : all).map((p) =\u003e p.partition), chosen,\n      (p) =\u003e { const ends = all.find((x) =\u003e x.partition === p); return `${p} (${number(ends.high - ends.low)})`; });\n  }\n\n  async function loadTopics(first) {\n    const found = await ask(\"/explore/kafka/topics\");\n    topics = found.topics;\n    const names = Object.keys(topics);\n    choices(byId(\"topic\"), names, first ? \"usage.ledger\" : byId(\"topic\").value);\n    fillPartitions(first ? undefined : byId(\"partition\").value);\n    byId(\"topics\").replaceChildren(table([\n      { title: \"Topic\", mono: true, value: (name) =\u003e name },\n      { title: \"Partitions\", num: true, value: (name) =\u003e Object.keys(topics[name].partitions).length },\n      { title: \"Offsets\", num: true, value: (name) =\u003e number(topics[name].offsets) },\n      { title: \"Partitions that hold something (offsets)\", value: (name) =\u003e el(\"div\", { class: \"chips\" },\n        partitionsOf(name).filter((p) =\u003e p.high \u003e p.low).map((p) =\u003e {\n          const pick = el(\"button\", { class: \"pick mono\", type: \"button\", text: `${p.partition} (${number(p.high - p.low)})` });\n          pick.addEventListener(\"click\", () =\u003e {\n            byId(\"topic\").value = name;\n            fillPartitions(p.partition);\n            read({}).catch(failed);\n          });\n          return pick;\n        })) },\n    ], names, \"The broker has no topic.\"));\n  }\n\n  async function read(where) {\n    const topic = byId(\"topic\").value;\n    const partition = byId(\"partition\").value;\n    if (!topic || partition === \"\") return;\n    page = await ask(\"/explore/kafka/records\", { topic, partition, limit: limit.value, ...where });\n    const shown = page.records.slice().reverse(); // newest first, as the live page\n    byId(\"where\").textContent = `${page.topic} partition ${page.partition} · offsets ${number(page.from)} to ` +\n      `${number(Math.max(page.from, page.to - 1))} of ${number(page.low)} to ${number(Math.max(page.low, page.high - 1))} · ` +\n      `${shown.length} records` + (page.complete ? \"\" : \" · the read ran out of time: the page is not whole\");\n    byId(\"older\").disabled = byId(\"oldest\").disabled = page.from \u003c= page.low;\n    byId(\"newer\").disabled = byId(\"newest\").disabled = page.to \u003e= page.high;\n    byId(\"offset\").value = page.from;\n    byId(\"records\").replaceChildren(foldable(\"records\", [\"Offset\", \"Committed (UTC)\", \"Key\", \"Bytes\", \"Value\"], shown,\n      (r) =\u003e [number(r.offset), stamp(r.committed_at), r.key, number(r.bytes), brief(r.value)],\n      \"No record on this page.\"));\n  }\n\n  byId(\"refresh\").addEventListener(\"click\", () =\u003e loadTopics(false).catch(failed));\n  byId(\"topic\").addEventListener(\"change\", () =\u003e { fillPartitions(); read({}).catch(failed); });\n  byId(\"partition\").addEventListener(\"change\", () =\u003e read({}).catch(failed));\n  limit.addEventListener(\"change\", () =\u003e {\n    remember(\"explorer-kafka-limit\", Number(limit.value));\n    read(page ? { offset: page.from } : {}).catch(failed);\n  });\n  byId(\"oldest\").addEventListener(\"click\", () =\u003e read({ offset: 0 }).catch(failed));\n  byId(\"older\").addEventListener(\"click\", () =\u003e read({ before: page.from }).catch(failed));\n  byId(\"newer\").addEventListener(\"click\", () =\u003e read({ offset: page.to }).catch(failed));\n  byId(\"newest\").addEventListener(\"click\", () =\u003e read({}).catch(failed));\n  byId(\"go-offset\").addEventListener(\"click\", () =\u003e read({ offset: byId(\"offset\").value.trim() }).catch(failed));\n  byId(\"go-time\").addEventListener(\"click\", () =\u003e {\n    const at = millis(byId(\"time\").value);\n    if (at === null) return status(\"a time looks like 2026-10-11T16:20:00 (UTC)\", \"bad\");\n    return read({ at_ms: at }).catch(failed);\n  });\n  loadTopics(true).then(() =\u003e read({})).catch(failed);\n}\n\n// ---------------------------------------------------------------- Redis\n\nfunction redisPage() {\n  let keys = null;\n  let chosen = null; // { bucket, key, type }\n  let entries = null;\n  const limit = byId(\"limit\");\n  choices(limit, CHOICES, remembered(\"explorer-redis-limit\", 50));\n\n  async function loadNodes(first) {\n    const found = await ask(\"/explore/redis/nodes\");\n    byId(\"nodes\").replaceChildren(table([\n      { title: \"Primary\", mono: true, value: (n) =\u003e n.name },\n      { title: \"Role\", value: (n) =\u003e n.role },\n      { title: \"Redis\", value: (n) =\u003e n.version },\n      { title: \"Buckets\", num: true, value: (n) =\u003e number(n.buckets) },\n      { title: \"Holding keys\", num: true, value: (n) =\u003e number(n.holding.length) },\n      { title: \"Keys\", num: true, value: (n) =\u003e number(n.keys) },\n      { title: \"Ops/s\", num: true, value: (n) =\u003e number(n.ops_per_sec) },\n      { title: \"Memory\", num: true, value: (n) =\u003e `${number(Math.round(n.used_memory / 1048576))} MB` },\n      { title: \"Limit\", num: true, value: (n) =\u003e (n.maxmemory ? `${number(Math.round(n.maxmemory / 1048576))} MB` : \"none\") },\n      { title: \"Replicas\", num: true, value: (n) =\u003e number(n.replicas) },\n      { title: \"Up\", num: true, value: (n) =\u003e `${number(Math.round(n.uptime_s / 60))} min` },\n    ], found.nodes, \"No primary answered.\"));\n    // Every bucket holds its stream, so the ones that hold a wallet (the live page knows them) come first.\n    let wallets = new Set();\n    try {\n      const live = await (await fetch(\"/state.json\")).json();\n      wallets = new Set(((live.inspect || {}).buckets || []).map((b) =\u003e b.bucket));\n    } catch (error) { /* the list is then by name only */ }\n    const holding = found.nodes.flatMap((n) =\u003e n.holding.map((b) =\u003e ({ ...b, node: n.name })))\n      .sort((a, b) =\u003e (wallets.has(b.bucket) - wallets.has(a.bucket)) || a.bucket.localeCompare(b.bucket));\n    const before = byId(\"bucket\").value;\n    choices(byId(\"bucket\"), holding.map((b) =\u003e b.bucket), before, (name) =\u003e {\n      const b = holding.find((x) =\u003e x.bucket === name);\n      return `${name}${wallets.has(name) ? \" · wallet\" : \"\"} (${number(b.keys)} keys)`;\n    });\n    if (first \u0026\u0026 holding.length) await readKeys(0);\n  }\n\n  async function readKeys(start, bucket) {\n    const name = bucket || byId(\"bucket\").value;\n    if (!name) return;\n    keys = await ask(\"/explore/redis/keys\", { bucket: name, prefix: byId(\"prefix\").value, start, limit: limit.value });\n    const kinds = Object.keys(keys.prefixes);\n    choices(byId(\"prefix\"), [\"\"].concat(kinds), keys.prefix,\n      (kind) =\u003e (kind ? `${kind} (${number(keys.prefixes[kind])})` : `all (${number(keys.listed)})`));\n    byId(\"where\").textContent = `${keys.bucket} on ${keys.node} · slot ${keys.slot} · ${number(keys.keys_in_bucket)} keys` +\n      (keys.truncated ? ` · only the first ${number(keys.listed)} are listed` : \"\") +\n      ` · showing ${keys.rows.length ? keys.start + 1 : 0} to ${keys.start + keys.rows.length} of ${number(keys.matching)}`;\n    byId(\"first\").disabled = byId(\"previous\").disabled = keys.start \u003c= 0;\n    byId(\"next\").disabled = keys.start + keys.rows.length \u003e= keys.matching;\n    byId(\"keys\").replaceChildren(table([\n      { title: \"Key\", mono: true, value: (row) =\u003e {\n        const pick = el(\"button\", { class: \"pick mono\", type: \"button\", text: row.key });\n        pick.addEventListener(\"click\", () =\u003e readKey(keys.bucket, row.key).catch(failed));\n        return pick;\n      } },\n      { title: \"Type\", value: (row) =\u003e row.type },\n      { title: \"TTL\", num: true, value: (row) =\u003e (row.pttl_ms === null || row.pttl_ms \u003c 0 ? \"none\" : `${number(Math.round(row.pttl_ms / 1000))} s`) },\n      { title: \"Bytes\", num: true, value: (row) =\u003e number(row.bytes) },\n    ], keys.rows, \"No key of this kind in the bucket.\"));\n  }\n\n  async function readKey(bucket, key) {\n    const found = await ask(\"/explore/redis/key\", { bucket, key });\n    chosen = { bucket, key, type: found.type };\n    byId(\"key-name\").textContent = `${key} · ${found.type}` + (found.type === \"none\" ? \" (gone since it was listed)\" : \"\");\n    byId(\"key\").replaceChildren(el(\"pre\", { text: JSON.stringify(found, null, 2) }));\n    byId(\"stream-controls\").hidden = found.type !== \"stream\";\n    byId(\"stream\").replaceChildren();\n    if (found.type === \"stream\") await readStream({});\n  }\n\n  async function readStream(where) {\n    entries = await ask(\"/explore/redis/stream\", { bucket: chosen.bucket, key: chosen.key, limit: limit.value, ...where });\n    byId(\"stream-note\").textContent = `${number(entries.length)} entries in the stream · ${entries.entries.length} shown, newest first`;\n    byId(\"stream-older\").disabled = byId(\"stream-newer\").disabled = !entries.entries.length;\n    byId(\"stream\").replaceChildren(foldable(\"stream\", [\"Id\", \"Time (UTC)\", \"Fields\"], entries.entries,\n      (e) =\u003e [e.id, stamp(e.time), brief(e.fields)],\n      \"No entry here. The drainer trims an entry once Kafka has it, so an idle stream is empty.\"));\n  }\n\n  byId(\"refresh\").addEventListener(\"click\", () =\u003e loadNodes(false).catch(failed));\n  byId(\"bucket\").addEventListener(\"change\", () =\u003e { byId(\"prefix\").value = \"\"; readKeys(0).catch(failed); });\n  byId(\"go-bucket\").addEventListener(\"click\", () =\u003e {\n    byId(\"prefix\").value = \"\";\n    readKeys(0, byId(\"bucket-text\").value.trim()).catch(failed);\n  });\n  byId(\"prefix\").addEventListener(\"change\", () =\u003e readKeys(0, keys \u0026\u0026 keys.bucket).catch(failed));\n  limit.addEventListener(\"change\", () =\u003e {\n    remember(\"explorer-redis-limit\", Number(limit.value));\n    readKeys(0, keys \u0026\u0026 keys.bucket).catch(failed);\n  });\n  byId(\"first\").addEventListener(\"click\", () =\u003e readKeys(0, keys.bucket).catch(failed));\n  byId(\"previous\").addEventListener(\"click\", () =\u003e readKeys(Math.max(0, keys.start - Number(limit.value)), keys.bucket).catch(failed));\n  byId(\"next\").addEventListener(\"click\", () =\u003e readKeys(keys.start + keys.rows.length, keys.bucket).catch(failed));\n  byId(\"stream-newest\").addEventListener(\"click\", () =\u003e readStream({}).catch(failed));\n  byId(\"stream-older\").addEventListener(\"click\", () =\u003e readStream({ before: entries.entries[entries.entries.length - 1].id }).catch(failed));\n  byId(\"stream-newer\").addEventListener(\"click\", () =\u003e readStream({ after: entries.entries[0].id }).catch(failed));\n  byId(\"stream-go-time\").addEventListener(\"click\", () =\u003e {\n    const at = millis(byId(\"stream-time\").value);\n    if (at === null) return status(\"a time looks like 2026-10-11T16:20:00 (UTC)\", \"bad\");\n    return readStream({ at_ms: at }).catch(failed);\n  });\n  loadNodes(true).catch(failed);\n}\n\nif (document.body.dataset.page === \"kafka\") kafkaPage(); else redisPage();\n","explore.py":"\"\"\"The drain monitor's explorer: Kafka topics and Redis keys, a page at a time. A developer's\nand tester's tool: it is served only where a deployment switches it on (DRAIN_EXPLORER=on,\ncomponents/drain-explorer), which a production deployment does not.\n\nRead-only, as the monitor is, and on request only: nothing here runs until a reader asks for\na page, and a page is one bounded read.\n\n    Kafka   a consumer assigned one partition at one offset, read_committed, for at most LIMIT\n            records; it joins no group and commits no offset\n    Redis   the probe's read-only client (drain_probe.ReadOnlyRedis): any command that is not a\n            read is refused before it is sent. A bucket's keys come from its slot (CLUSTER\n            GETKEYSINSLOT), never from a scan of the node\n\"\"\"\nimport threading\nimport time\n\nfrom redis.crc import key_slot\nfrom redis.exceptions import RedisError\n\nfrom spend_control.redis_service import BUCKETS, tag\n\nLIMIT = 500  # records, keys or stream entries on one page, at most\nMOST_KEYS = 5000  # of one bucket's keys that are listed; the count beside them is the slot's own\nREAD_SECONDS = 8  # a page that takes longer is returned as far as it got, and says so\nPATIENCE = 10  # seconds the broker has to answer a question\n\n\nclass BadRequest(ValueError):\n    \"\"\"What the reader asked for cannot be read: the page says why, nothing is asked of a store.\"\"\"\n\n\ndef whole(value, name, least=0, most=None):\n    \"\"\"A request's number: an integer in range, or the request is refused.\"\"\"\n    try:\n        number = int(value)\n    except (TypeError, ValueError):\n        raise BadRequest(f\"{name} must be a whole number\") from None\n    if number \u003c least or (most is not None and number \u003e most):\n        raise BadRequest(f\"{name} must be from {least}\" + (f\" to {most}\" if most is not None else \"\"))\n    return number\n\n\ndef bucket_number(name):\n    if not (isinstance(name, str) and len(name) == 5 and name[0] == \"b\" and name[1:].isdigit()\n            and int(name[1:]) \u003c BUCKETS):\n        raise BadRequest(f\"bucket must be b0000 to b{BUCKETS - 1:04d}\")\n    return int(name[1:])\n\n\ndef window(low, high, limit, offset=None, before=None):\n    \"\"\"The offsets a page reads, [start, end), and whether it keeps the last `limit` records\n    of them (a page that ends at `before`) or the first.\n\n    An offset is not always a record: each transaction ends in a commit marker that takes one.\n    A transaction holds at least one record, so 2 x limit + 2 offsets before `before` hold at\n    least `limit` records.\"\"\"\n    if before is not None:\n        end = min(max(before, low), high)\n        return max(low, end - 2 * limit - 2), end, True\n    return min(max(low if offset is None else offset, low), high), high, False\n\n\nclass KafkaExplorer:\n    def __init__(self, bootstrap, decode, consumer=None, iso=None):\n        self.bootstrap = bootstrap\n        self.decode = decode  # (topic, raw value) -\u003e what the page shows\n        self.consumer = consumer or self._consumer\n        self.iso = iso or (lambda seconds: seconds)\n        # One read of the broker at a time, however many pages are open.\n        self.one = threading.Lock()\n\n    def _consumer(self):\n        from confluent_kafka import Consumer\n        return Consumer({\"bootstrap.servers\": self.bootstrap, \"group.id\": \"drain-explorer\",\n                         \"isolation.level\": \"read_committed\", \"enable.auto.commit\": False,\n                         \"enable.auto.offset.store\": False, \"enable.partition.eof\": True,\n                         \"socket.timeout.ms\": PATIENCE * 1000})\n\n    def topics(self):\n        \"\"\"Every topic of the broker but its own (__consumer_offsets, __transaction_state),\n        with each partition's first offset and the offset after its last.\"\"\"\n        from confluent_kafka import TopicPartition\n        with self.one:\n            consumer = self.consumer()\n            try:\n                found = {}\n                for name, meta in sorted(consumer.list_topics(timeout=PATIENCE).topics.items()):\n                    if name.startswith(\"__\") or meta.error is not None:\n                        continue\n                    partitions = {}\n                    for partition in sorted(meta.partitions):\n                        low, high = consumer.get_watermark_offsets(\n                            TopicPartition(name, partition), timeout=PATIENCE)\n                        partitions[str(partition)] = {\"low\": low, \"high\": high}\n                    found[name] = {\"partitions\": partitions,\n                                   \"offsets\": sum(p[\"high\"] - p[\"low\"] for p in partitions.values())}\n                return {\"at\": self.iso(time.time()), \"bootstrap\": self.bootstrap, \"topics\": found}\n            finally:\n                consumer.close()\n\n    def page(self, topic, partition, limit, offset=None, before=None, at_ms=None):\n        \"\"\"`limit` records of one partition: from `offset` on, or the last ones before\n        `before`, or from the first record at or after the time `at_ms`. With none of the three,\n        the partition's newest.\"\"\"\n        from confluent_kafka import KafkaError, TopicPartition\n        with self.one:\n            consumer = self.consumer()\n            try:\n                meta = consumer.list_topics(topic, timeout=PATIENCE).topics[topic]\n                if meta.error is not None or partition not in meta.partitions:\n                    raise BadRequest(f\"no partition {partition} of a topic {topic}\")\n                low, high = consumer.get_watermark_offsets(\n                    TopicPartition(topic, partition), timeout=PATIENCE)\n                if at_ms is not None:\n                    found = consumer.offsets_for_times(\n                        [TopicPartition(topic, partition, at_ms)], timeout=PATIENCE)[0].offset\n                    offset, before = (high if found \u003c 0 else found), None  # none that late: the end\n                elif offset is None and before is None:\n                    before = high\n                start, end, keep_last = window(low, high, limit, offset, before)\n                records, complete = [], True\n                if start \u003c end:\n                    consumer.assign([TopicPartition(topic, partition, start)])\n                    deadline = time.monotonic() + READ_SECONDS\n                    while True:\n                        if time.monotonic() \u003e= deadline:\n                            complete = False\n                            break\n                        message = consumer.poll(0.5)\n                        if message is None:\n                            continue\n                        if message.error():\n                            if message.error().code() == KafkaError._PARTITION_EOF:\n                                break\n                            raise RuntimeError(str(message.error()))\n                        if message.offset() \u003e= end:\n                            break\n                        records.append(self._record(message))\n                        if (not keep_last and len(records) \u003e= limit) or message.offset() == end - 1:\n                            break\n                if keep_last:\n                    records = records[-limit:]\n                # Where the neighbouring pages start, also when this one held no record (a run\n                # of commit markers): the reader can always move on.\n                return {\"topic\": topic, \"partition\": partition, \"low\": low, \"high\": high,\n                        \"from\": records[0][\"offset\"] if records else start,\n                        \"to\": records[-1][\"offset\"] + 1 if records else end,\n                        \"complete\": complete, \"records\": records}\n            finally:\n                consumer.close()\n\n    def _record(self, message):\n        raw = message.value() or b\"\"\n        return {\"topic\": message.topic(), \"partition\": message.partition(),\n                \"offset\": message.offset(),\n                \"key\": (message.key() or b\"\").decode(errors=\"replace\"),\n                \"headers\": [[k, (v or b\"\").decode(errors=\"replace\")] for k, v in message.headers() or []],\n                \"bytes\": len(raw), \"committed_at\": self.iso(message.timestamp()[1] / 1000),\n                \"value\": self.decode(message.topic(), raw)}\n\n\nclass RedisExplorer:\n    def __init__(self, connect, key_value, parsed=lambda text: text, iso=None):\n        self.connect = connect  # () -\u003e {node name: (read-only client, [buckets it owns])}\n        self.key_value = key_value  # (client, key) -\u003e its type, TTL, size and value\n        self.parsed = parsed\n        self.iso = iso or (lambda seconds: seconds)\n        self.lock = threading.Lock()\n        self.found = None\n\n    def nodes(self):\n        with self.lock:\n            if self.found is None:\n                self.found = self.connect()\n            return self.found\n\n    def forget(self):\n        \"\"\"After an error: a failover or a restart moves the buckets, so the map is read again.\"\"\"\n        with self.lock:\n            self.found = None\n\n    def _owner(self, bucket):\n        for name, (client, buckets) in self.nodes().items():\n            if bucket in buckets:\n                return name, client\n        raise BadRequest(f\"no primary owns b{bucket:04d}\")\n\n    def _asked(self, call):\n        try:\n            return call()\n        except (RedisError, OSError):\n            self.forget()\n            raise\n\n    def overview(self):\n        \"\"\"Each primary, and which of its buckets hold a key: one count per bucket, O(1) each.\"\"\"\n        def read():\n            found = []\n            for name, (client, buckets) in sorted(self.nodes().items()):\n                pipe = client.pipeline()\n                for bucket in buckets:\n                    pipe.execute_command(\"CLUSTER COUNTKEYSINSLOT\", slot_of(bucket))\n                counts = pipe.execute()\n                info = client.info()\n                found.append({\n                    \"name\": name, \"buckets\": len(buckets),\n                    \"holding\": [{\"bucket\": f\"b{bucket:04d}\", \"keys\": count}\n                                for bucket, count in zip(buckets, counts, strict=True) if count],\n                    \"keys\": sum(counts), \"role\": info.get(\"role\"),\n                    \"version\": info.get(\"redis_version\"), \"uptime_s\": info.get(\"uptime_in_seconds\"),\n                    \"ops_per_sec\": info.get(\"instantaneous_ops_per_sec\"),\n                    \"used_memory\": info.get(\"used_memory\"), \"maxmemory\": info.get(\"maxmemory\"),\n                    \"replicas\": info.get(\"connected_slaves\"), \"run_id\": info.get(\"run_id\")})\n            return {\"at\": self.iso(time.time()), \"nodes\": found}\n        return self._asked(read)\n\n    def keys(self, bucket, prefix=\"\", start=0, limit=50):\n        \"\"\"A page of one bucket's keys, sorted by name, with each one's type, TTL and size.\"\"\"\n        def read():\n            name, client = self._owner(bucket)\n            slot = slot_of(bucket)\n            total = client.execute_command(\"CLUSTER COUNTKEYSINSLOT\", slot)\n            listed = sorted(client.execute_command(\"CLUSTER GETKEYSINSLOT\", slot, MOST_KEYS))\n            kinds = {}\n            for key in listed:\n                kinds[kind_of(key)] = kinds.get(kind_of(key), 0) + 1\n            wanted = [key for key in listed if not prefix or kind_of(key) == prefix]\n            page = wanted[start:start + limit]\n            pipe = client.pipeline()\n            for key in page:\n                pipe.type(key)\n                pipe.pttl(key)\n                pipe.memory_usage(key)\n            facts = pipe.execute(raise_on_error=False)\n            rows = [{\"key\": key, \"type\": text_of(facts[3 * i]), \"pttl_ms\": number_of(facts[3 * i + 1]),\n                     \"bytes\": number_of(facts[3 * i + 2])} for i, key in enumerate(page)]\n            return {\"at\": self.iso(time.time()), \"bucket\": f\"b{bucket:04d}\", \"node\": name,\n                    \"slot\": slot, \"keys_in_bucket\": total, \"listed\": len(listed),\n                    \"truncated\": total \u003e len(listed), \"prefixes\": dict(sorted(kinds.items())),\n                    \"prefix\": prefix, \"matching\": len(wanted), \"start\": start, \"rows\": rows}\n        return self._asked(read)\n\n    def key(self, bucket, key):\n        \"\"\"One key, whole: its type, TTL, size and value (a stream: its groups and length; its\n        entries are paged by stream()).\"\"\"\n        def read():\n            name, client = self._owner(bucket)\n            self._in_bucket(bucket, key)\n            item = self.key_value(client, key)\n            if item[\"type\"] == \"none\":\n                return {\"key\": key, \"node\": name, \"type\": \"none\"}\n            value = item.get(\"value\")\n            if item[\"type\"] == \"hash\" and isinstance(value, dict):\n                item[\"value\"] = {field: self.parsed(text) for field, text in value.items()}\n            elif item[\"type\"] == \"stream\":\n                value.pop(\"entries\", None)\n            return {\"at\": self.iso(time.time()), \"key\": key, \"node\": name, **item}\n        return self._asked(read)\n\n    def stream(self, bucket, key, limit, before=None, after=None, at_ms=None):\n        \"\"\"`limit` entries of a stream, newest first: the newest, or those older than the id\n        `before`, or newer than `after`, or from the time `at_ms` on.\"\"\"\n        for entry_id in (before, after):\n            if entry_id is not None and not is_entry_id(entry_id):\n                raise BadRequest(\"a stream id is \u003cmilliseconds\u003e-\u003csequence\u003e\")\n\n        def read():\n            name, client = self._owner(bucket)\n            self._in_bucket(bucket, key)\n            if client.type(key) != \"stream\":\n                raise BadRequest(f\"{key} is not a stream\")\n            if at_ms is not None:\n                entries = client.xrange(key, min=str(at_ms), max=\"+\", count=limit)[::-1]\n            elif after is not None:\n                entries = client.xrange(key, min=f\"({after}\", max=\"+\", count=limit)[::-1]\n            else:\n                entries = client.xrevrange(key, max=f\"({before}\" if before else \"+\", min=\"-\", count=limit)\n            return {\"at\": self.iso(time.time()), \"key\": key, \"node\": name, \"length\": client.xlen(key),\n                    \"entries\": [{\"id\": entry_id, \"time\": self.iso(int(entry_id.split(\"-\")[0]) / 1000),\n                                 \"fields\": {field: self.parsed(text) for field, text in fields.items()}}\n                                for entry_id, fields in entries]}\n        return self._asked(read)\n\n    @staticmethod\n    def _in_bucket(bucket, key):\n        # A key outside the bucket lives on a slot this primary may not own: it is never asked.\n        if not isinstance(key, str) or tag(bucket) not in key or len(key) \u003e 512:\n            raise BadRequest(f\"the key is not one of b{bucket:04d}\")\n\n\ndef slot_of(bucket):\n    return key_slot(f\"x:{tag(bucket)}\".encode())\n\n\ndef kind_of(key):\n    \"\"\"A key's prefix, as the Lua scripts name them: v: wallet, h: hold, i: idempotency record,\n    e: open holds, x: stream.\"\"\"\n    return key.split(\":\", 1)[0] + \":\" if \":\" in key else \"(other)\"\n\n\ndef is_entry_id(text):\n    head, dash, tail = str(text).partition(\"-\")\n    return bool(dash) and head.isdigit() and tail.isdigit() and len(text) \u003c= 40\n\n\ndef text_of(reply):\n    return None if isinstance(reply, Exception) else reply\n\n\ndef number_of(reply):\n    return reply if isinstance(reply, int) and not isinstance(reply, bool) else None\n","index.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n  \u003ctitle\u003eai-tollgate drain monitor\u003c/title\u003e\n  \u003clink rel=\"stylesheet\" href=\"/monitor.css\"\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cheader\u003e\n    \u003ch1\u003eDrain monitor \u003cspan class=\"sub\" id=\"where\"\u003eread-only\u003c/span\u003e\u003c/h1\u003e\n    \u003cnav id=\"explorer\" hidden\u003e\u003ca href=\"/\" class=\"here\"\u003eLive\u003c/a\u003e \u003ca href=\"/kafka\"\u003eKafka\u003c/a\u003e \u003ca href=\"/redis\"\u003eRedis\u003c/a\u003e\u003c/nav\u003e\n    \u003cp id=\"status\"\u003econnecting…\u003c/p\u003e\n  \u003c/header\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003ePipeline\u003c/h2\u003e\n    \u003cdiv id=\"pipeline\" class=\"pipeline\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eRedis streams: last decisions seen \u003clabel class=\"limit\"\u003eshow last \u003cselect data-list=\"entries\" aria-label=\"How many to show\"\u003e\u003c/select\u003e\u003c/label\u003e \u003cspan class=\"sub\" id=\"entries-note\"\u003e\u003c/span\u003e\u003c/h2\u003e\n    \u003cp class=\"hint\"\u003eHover a column title for what it means. Each row is one entry a Lua script appended to \u003ccode\u003ex:{bucket}\u003c/code\u003e, read with XREAD a few times a second, a few entries of each stream at a time.\n      The drainer trims an entry once Kafka has it, so this is a sample. Open a row for the whole entry.\u003c/p\u003e\n    \u003cdiv id=\"entries\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eRedis keys of bucket\n      \u003cselect id=\"bucket-choice\" aria-label=\"Bucket to inspect\"\u003e\u003c/select\u003e\n      \u003clabel class=\"limit\"\u003eshow last \u003cselect data-list=\"keys\" aria-label=\"How many to show\"\u003e\u003c/select\u003e\u003c/label\u003e \u003cspan class=\"sub\"\u003eof each kind\u003c/span\u003e\n      \u003cspan class=\"sub\" id=\"bucket-note\"\u003e\u003c/span\u003e\u003c/h2\u003e\n    \u003cp class=\"hint\"\u003eThe keys of one bucket (the first 400 of its slot), read every 2 s from its primary while this page is open: wallets \u003ccode\u003ev:\u003c/code\u003e, holds \u003ccode\u003eh:\u003c/code\u003e,\n      idempotency records \u003ccode\u003ei:\u003c/code\u003e, the open-holds set \u003ccode\u003ee:\u003c/code\u003e and the stream \u003ccode\u003ex:\u003c/code\u003e. Open a row for the whole value.\n      A finished hold and its records stay 600 s.\u003c/p\u003e\n    \u003cdiv id=\"bucket\"\u003e\u003c/div\u003e\n    \u003ch3\u003eHolds caught while open \u003clabel class=\"limit\"\u003eshow last \u003cselect data-list=\"holds\" aria-label=\"How many to show\"\u003e\u003c/select\u003e\u003c/label\u003e \u003cspan class=\"sub\"\u003e(between reserve and settle; sampled, so a fast call may be missed)\u003c/span\u003e\u003c/h3\u003e\n    \u003cdiv id=\"open-holds\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eKafka \u003ccode id=\"ledger-topic\"\u003eusage.ledger\u003c/code\u003e: last records \u003clabel class=\"limit\"\u003eshow last \u003cselect data-list=\"ledger\" aria-label=\"How many to show\"\u003e\u003c/select\u003e\u003c/label\u003e \u003cspan class=\"sub\" id=\"ledger-note\"\u003e\u003c/span\u003e\u003c/h2\u003e\n    \u003cp class=\"hint\"\u003eThe mandatory usage ledger: one record per settle, void and expiry, written atomically with its covering checkpoint.\n      Committed records only (\u003ccode\u003eread_committed\u003c/code\u003e), decoded from Protobuf. Open a row for the whole record.\u003c/p\u003e\n    \u003cdiv id=\"ledger\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection class=\"two\"\u003e\n    \u003cdiv\u003e\n      \u003ch2\u003eKafka \u003ccode id=\"checkpoints-topic\"\u003eusage.checkpoints\u003c/code\u003e \u003clabel class=\"limit\"\u003eshow last \u003cselect data-list=\"checkpoints\" aria-label=\"How many to show\"\u003e\u003c/select\u003e\u003c/label\u003e\u003c/h2\u003e\n      \u003cdiv id=\"checkpoints\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003ch2\u003eWallet updater: offsets\u003c/h2\u003e\n      \u003cdiv id=\"lag\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eWallets: Redis beside PostgreSQL \u003cspan class=\"sub\" id=\"wallets-note\"\u003e\u003c/span\u003e\u003c/h2\u003e\n    \u003cp class=\"hint\"\u003e“Not yet in PostgreSQL” is Redis \u003ccode\u003esettled\u003c/code\u003e minus \u003ccode\u003esettled_nano\u003c/code\u003e: above zero only while a partial is on its way.\u003c/p\u003e\n    \u003cdiv id=\"wallets\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eRedis primaries\u003c/h2\u003e\n    \u003cdiv id=\"redis\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection class=\"two\"\u003e\n    \u003cdiv\u003e\n      \u003ch2\u003ePods \u003cspan class=\"sub\" id=\"pods-note\"\u003e\u003c/span\u003e\u003c/h2\u003e\n      \u003cdiv id=\"pods\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003ch2\u003eRedis primaries the rebuilder marked ready\u003c/h2\u003e\n      \u003cdiv id=\"ready\"\u003e\u003c/div\u003e\n      \u003ch2\u003eErrors reading a source\u003c/h2\u003e\n      \u003cdiv id=\"errors\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003cscript src=\"/monitor.js\"\u003e\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","kafka.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n  \u003ctitle\u003eai-tollgate explorer: Kafka\u003c/title\u003e\n  \u003clink rel=\"stylesheet\" href=\"/monitor.css\"\u003e\n\u003c/head\u003e\n\u003cbody data-page=\"kafka\"\u003e\n  \u003cheader\u003e\n    \u003ch1\u003eExplorer: Kafka \u003cspan class=\"sub\"\u003eread-only · dev, test and perf only\u003c/span\u003e\u003c/h1\u003e\n    \u003cnav\u003e\u003ca href=\"/\"\u003eLive\u003c/a\u003e \u003ca href=\"/kafka\" class=\"here\"\u003eKafka\u003c/a\u003e \u003ca href=\"/redis\"\u003eRedis\u003c/a\u003e\u003c/nav\u003e\n    \u003cp id=\"status\"\u003eloading…\u003c/p\u003e\n  \u003c/header\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eTopics \u003cbutton id=\"refresh\" type=\"button\"\u003erefresh\u003c/button\u003e\u003c/h2\u003e\n    \u003cp class=\"hint\"\u003eEach topic's partitions that hold something. An offset is not always a record: every\n      transaction ends in a commit marker that takes one. Click a partition to browse it.\u003c/p\u003e\n    \u003cdiv id=\"topics\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eRecords \u003cspan class=\"sub\" id=\"where\"\u003e\u003c/span\u003e\u003c/h2\u003e\n    \u003cdiv class=\"controls\"\u003e\n      \u003clabel\u003etopic \u003cselect id=\"topic\"\u003e\u003c/select\u003e\u003c/label\u003e\n      \u003clabel\u003epartition \u003cselect id=\"partition\"\u003e\u003c/select\u003e\u003c/label\u003e\n      \u003clabel\u003eshow \u003cselect id=\"limit\"\u003e\u003c/select\u003e\u003c/label\u003e\n      \u003cbutton id=\"oldest\" type=\"button\"\u003e« oldest\u003c/button\u003e\n      \u003cbutton id=\"older\" type=\"button\"\u003e‹ older\u003c/button\u003e\n      \u003cbutton id=\"newer\" type=\"button\"\u003enewer ›\u003c/button\u003e\n      \u003cbutton id=\"newest\" type=\"button\"\u003enewest »\u003c/button\u003e\n      \u003clabel\u003efrom offset \u003cinput id=\"offset\" inputmode=\"numeric\" size=\"10\"\u003e\u003c/label\u003e\n      \u003cbutton id=\"go-offset\" type=\"button\"\u003ego\u003c/button\u003e\n      \u003clabel\u003efrom time (UTC) \u003cinput id=\"time\" size=\"22\" placeholder=\"2026-10-11T16:20:00\"\u003e\u003c/label\u003e\n      \u003cbutton id=\"go-time\" type=\"button\"\u003ego\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"records\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n  \u003cscript src=\"/explore.js\"\u003e\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","monitor.css":":root {\n  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #dfe3ea;\n  --good: #0f7b4f; --warn: #a15c00; --bad: #b42318; --accent: #2456c8; --code: #eef1f6;\n}\n@media (prefers-color-scheme: dark) {\n  :root { --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c3340;\n          --good: #4ccb93; --warn: #f0b24a; --bad: #ff7a70; --accent: #8fb0ff; --code: #242a35; }\n}\n* { box-sizing: border-box; }\nbody { margin: 0; padding: 16px; background: var(--bg); color: var(--ink);\n       font: 14px/1.45 system-ui, -apple-system, \"Segoe UI\", sans-serif; }\nheader { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; margin-bottom: 8px; }\nh1 { font-size: 20px; margin: 0; }\nh2 { font-size: 15px; margin: 0 0 6px; }\n.sub { font-weight: 400; color: var(--muted); font-size: 13px; }\n#status { margin: 0; color: var(--muted); }\nsection { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;\n          padding: 12px 14px; margin: 12px 0; overflow-x: auto; }\nsection.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px 24px; }\nsection.two h2 + div + h2 { margin-top: 14px; }\n.hint { margin: 0 0 8px; color: var(--muted); font-size: 13px; }\ncode, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }\ncode { background: var(--code); padding: 1px 4px; border-radius: 4px; }\ntable { border-collapse: collapse; width: 100%; }\nth, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line);\n         vertical-align: top; white-space: nowrap; }\nth { color: var(--muted); font-weight: 600; font-size: 12.5px; }\ntd.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }\n.empty { color: var(--muted); }\n.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }\n.tag { display: inline-block; padding: 0 6px; border-radius: 10px; border: 1px solid currentColor; font-size: 12px; }\n.pipeline { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }\n.stage { flex: 1 1 150px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 150px; }\n.stage .name { color: var(--muted); font-size: 12.5px; }\n.stage .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }\n.stage .more { color: var(--muted); font-size: 12.5px; }\n.arrow { align-self: center; color: var(--muted); }\ndetails { border-bottom: 1px solid var(--line); }\ndetails \u003e summary { cursor: pointer; padding: 4px 0; display: grid; gap: 0 12px; align-items: baseline;\n                    list-style: none; white-space: nowrap; }\ndetails \u003e summary::-webkit-details-marker { display: none; }\ndetails \u003e summary::before { content: \"▸\"; color: var(--muted); }\ndetails[open] \u003e summary::before { content: \"▾\"; }\n.rows.entries summary, .head.entries { grid-template-columns: 14px 96px 62px 62px 90px 150px 84px 84px 84px 96px 1fr; }\n.rows.ledger summary, .head.ledger { grid-template-columns: 14px 96px 56px 150px 90px 150px 96px 70px 110px 110px 1fr; }\n.head { display: grid; gap: 0 12px; color: var(--muted); font-weight: 600; font-size: 12.5px;\n        padding: 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }\n.r { text-align: right; font-variant-numeric: tabular-nums; }\npre { margin: 4px 0 10px 26px; padding: 8px 10px; background: var(--code); border-radius: 6px;\n      overflow-x: auto; white-space: pre-wrap; word-break: break-word; }\n.scroll { min-width: 1080px; }\nh3 { font-size: 13.5px; margin: 12px 0 4px; }\nselect { font: inherit; padding: 1px 4px; border: 1px solid var(--line); border-radius: 6px;\n         background: var(--panel); color: var(--ink); }\n.rows.keys summary, .head.keys { grid-template-columns: 14px 150px 640px 60px 76px 64px 1fr; }\ndetails \u003e summary \u003e span { overflow: hidden; text-overflow: ellipsis; }\n.group { margin: 8px 0 2px; color: var(--muted); font-weight: 600; font-size: 12.5px; }\nth[title], .head span[title], .stage[title] .name { cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }\nlabel.limit { font-weight: 400; font-size: 12.5px; color: var(--muted); margin-left: 6px; }\nlabel.limit select { font-size: 12.5px; }\nnav { display: flex; gap: 4px; }\nnav[hidden] { display: none; }\nnav a { padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--accent); text-decoration: none; }\nnav a.here { background: var(--accent); color: var(--panel); border-color: var(--accent); }\n.controls { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0 0 8px; color: var(--muted); font-size: 13px; }\n.controls[hidden] { display: none; }\nbutton, input { font: inherit; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px;\n                background: var(--panel); color: var(--ink); }\nbutton { cursor: pointer; color: var(--accent); }\nbutton:disabled { color: var(--muted); cursor: default; }\nh2 button { font-size: 12.5px; font-weight: 400; margin-left: 6px; }\n.rows.records summary, .head.records { grid-template-columns: 14px 90px 180px 300px 60px 1fr; }\n.rows.stream summary, .head.stream { grid-template-columns: 14px 170px 180px 1fr; }\n.pick { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; }\n.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; white-space: normal; }\n","monitor.js":"// The drain monitor's page: draws what monitor.py streams on /events. No markup is ever built\n// from data: every value is set as text.\n\"use strict\";\n\nconst open = new Set(); // rows the reader opened: kept open across redraws\n\n// How many of each list to show; the monitor remembers more (monitor.py --keep N).\nconst CHOICES = [5, 10, 25, 50, 100, 200, 500, 1000, 5000];\nconst limits = { entries: 25, ledger: 25, checkpoints: 10, holds: 10, keys: 25 };\ntry {\n  Object.assign(limits, JSON.parse(localStorage.getItem(\"drain-monitor-limits\") || \"{}\"));\n} catch (error) { /* a private window: the defaults stand */ }\nlet latest = null;\n\nfunction el(tag, attrs, children) {\n  const node = document.createElement(tag);\n  for (const [name, value] of Object.entries(attrs || {})) {\n    if (value === undefined || value === null || value === \"\") continue;\n    if (name === \"text\") node.textContent = value;\n    else if (name === \"class\") node.className = value;\n    else node.setAttribute(name, value);\n  }\n  for (const child of children || []) node.append(child);\n  return node;\n}\n\nconst text = (value) =\u003e (value === null || value === undefined || value === \"\" ? \"–\" : String(value));\nconst number = (value) =\u003e (value === null || value === undefined ? \"–\" : Number(value).toLocaleString(\"en-US\"));\nconst clock = (iso) =\u003e (iso ? String(iso).slice(11, 23) : \"–\");\nconst short = (id) =\u003e (id ? String(id).slice(0, 8) : \"–\");\nconst shown = (name, list) =\u003e list.slice(0, limits[name]);\nconst count = (name, list, what) =\u003e `showing ${Math.min(limits[name], list.length)} of ${number(list.length)} ${what}`;\n\nfunction replace(id, node) {\n  document.getElementById(id).replaceChildren(node);\n}\n\n// columns: { title, tip, value(row), num, mono, tone(row) }\nfunction table(columns, rows, emptyText) {\n  if (!rows.length) return el(\"p\", { class: \"empty\", text: emptyText });\n  const head = el(\"tr\", {}, columns.map((c) =\u003e el(\"th\", { class: c.num ? \"num\" : \"\", text: c.title, title: c.tip })));\n  const body = rows.map((row) =\u003e el(\"tr\", {}, columns.map((c) =\u003e {\n    const value = c.value(row);\n    const cell = el(\"td\", { class: (c.num ? \"num \" : \"\") + (c.mono ? \"mono \" : \"\") + ((c.tone \u0026\u0026 c.tone(row)) || \"\") });\n    if (value instanceof Node) cell.append(value); else cell.textContent = text(value);\n    return cell;\n  })));\n  return el(\"table\", {}, [el(\"thead\", {}, [head]), el(\"tbody\", {}, body)]);\n}\n\n// Rows that open to show the whole message: a grid line as the summary, the JSON below.\nfunction foldable(kind, titles, items, key, cells, whole, emptyText) {\n  if (!items.length) return el(\"p\", { class: \"empty\", text: emptyText });\n  const head = el(\"div\", { class: `head ${kind}` }, [el(\"span\")].concat(\n    titles.map((t) =\u003e el(\"span\", { class: t.num ? \"r\" : \"\", text: t.title, title: t.tip }))));\n  const rows = items.map((item) =\u003e {\n    const id = key(item);\n    const summary = el(\"summary\", {}, cells(item).map((c, i) =\u003e {\n      const toned = c !== null \u0026\u0026 typeof c === \"object\";\n      const span = el(\"span\", { class: (titles[i].num ? \"r \" : \"\") + (titles[i].mono ? \"mono \" : \"\") + ((toned \u0026\u0026 c.tone) || \"\") });\n      span.textContent = text(toned ? c.text : c);\n      return span;\n    }));\n    const details = el(\"details\", {}, [summary, el(\"pre\", { text: JSON.stringify(whole(item), null, 2) })]);\n    if (open.has(id)) details.setAttribute(\"open\", \"\");\n    details.addEventListener(\"toggle\", () =\u003e (details.open ? open.add(id) : open.delete(id)));\n    return details;\n  });\n  return el(\"div\", { class: \"scroll\" }, [head, el(\"div\", { class: `rows ${kind}` }, rows)]);\n}\n\nfunction resourceOf(walletKey) {\n  // v:{bNNNN}:\u003capi key id\u003e:\u003ccurrency\u003e\n  if (!walletKey) return null;\n  const rest = walletKey.split(\":\").slice(2);\n  rest.pop();\n  return rest.join(\":\");\n}\n\nfunction stage(name, tip, value, more, tone) {\n  return el(\"div\", { class: \"stage\", title: tip }, [\n    el(\"div\", { class: \"name\", text: name }),\n    el(\"div\", { class: `value ${tone || \"\"}`, text: value }),\n    el(\"div\", { class: \"more\", text: more || \"\" }),\n  ]);\n}\n\nfunction pipeline(state) {\n  const nodes = (state.redis \u0026\u0026 state.redis.nodes) || [];\n  const waiting = nodes.reduce((sum, n) =\u003e sum + n.stream_entries, 0);\n  const oldest = nodes.reduce((max, n) =\u003e Math.max(max, n.oldest_age_ms || 0), 0);\n  const holds = nodes.reduce((sum, n) =\u003e sum + n.open_holds, 0);\n  const pending = {};\n  for (const n of nodes) for (const s of Object.values(n.waiting || {})) for (const g of s.groups) {\n    pending[g.name] = (pending[g.name] || 0) + g.pending;\n  }\n  const ends = (state.kafka_ends \u0026\u0026 state.kafka_ends.topics) || {};\n  const total = (topic) =\u003e Object.values(ends[topic] || {}).reduce((sum, p) =\u003e sum + p.high, 0);\n  const topics = state.topics;\n  const lag = state.lag.reduce((sum, p) =\u003e sum + (p.lag || 0), 0);\n  const noOffsets = state.lag.length \u003e 0 \u0026\u0026 state.lag.every((p) =\u003e p.stored === null);\n  const behind = state.wallets.reduce((sum, w) =\u003e sum + Math.abs(w.behind_nano || 0), 0);\n  const pods = (state.cluster \u0026\u0026 state.cluster.pods) || [];\n  const running = (part) =\u003e pods.filter((p) =\u003e p.name.includes(part) \u0026\u0026 p.ready).length;\n  const deployment = state.deployment || {};\n  const fence = deployment.lag_limit_ms || 30000;\n  const arrow = () =\u003e el(\"div\", { class: \"arrow\", text: \"→\" });\n  return el(\"div\", { class: \"pipeline\" }, [\n    stage(\"Usage ledger\",\n      \"The drainer writes every settle, void and expiry to the mandatory usage ledger, atomically with its covering checkpoint.\",\n      deployment.usage_ledger_topic || topics.ledger, `drainer pods ${running(\"billing-drainer\")}`),\n    arrow(),\n    stage(\"Redis: entries waiting\",\n      \"Stream entries (reserve, settle, void, expire) appended by the Lua scripts and not yet trimmed, over all 1,024 buckets. 'Oldest' is the age of the oldest one: past the lag fence (LEDGER_LAG_LIMIT_MS, 1,000 ms here) new reserves are refused with 503. 'Open holds' are calls between reserve and settle.\",\n      number(waiting), `oldest ${oldest ? number(oldest) + \" ms\" : \"–\"} · open holds ${number(holds)}`,\n      oldest \u003e fence ? \"bad\" : waiting ? \"warn\" : \"good\"),\n    arrow(),\n    stage(\"Drainer: read, not yet in Kafka\",\n      \"Entries the drainer has read (XREADGROUP) but not yet acknowledged: its Kafka transaction is not committed. They stay in Redis until it is.\",\n      number(pending.drainer || 0), \"\", (pending.drainer || 0) ? \"warn\" : \"good\"),\n    arrow(),\n    stage(\"Kafka: log ends\",\n      \"Physical end offsets of the configured topics, summed over their partitions. These include transaction markers and records still waiting for a transaction to finish.\",\n      `${number(total(topics.checkpoints))} / ${number(total(topics.ledger))}`, \"checkpoints / usage ledger, commit markers included\"),\n    arrow(),\n    stage(\"Wallet updater: lag\",\n      `Offsets of ${state.usage_topic} the wallet updater has not yet applied to PostgreSQL: the end of each partition minus the next_offset it stored in wallet_updater_offsets. 0 means caught up.`,\n      noOffsets ? \"no offsets\" : number(lag), `updater pods ${running(\"billing-wallet-updater\")}`, noOffsets ? \"warn\" : lag ? \"warn\" : \"good\"),\n    arrow(),\n    stage(\"PostgreSQL behind Redis\",\n      \"Over all wallets: Redis 'settled' minus wallet_accounts.settled_nano, in nano-dollars. Above 0 only while usage is on its way through Kafka and the updater.\",\n      number(behind), \"nano, all wallets\", behind ? \"warn\" : \"good\"),\n  ]);\n}\n\nconst NANO = \"In nano-dollars (billionths of a dollar): 1,000,000 nano = $0.001.\";\n\nfunction entries(state) {\n  const titles = [\n    { title: \"Decided\", tip: \"When Redis recorded the decision (UTC): the time in the stream entry's id.\" },\n    { title: \"Bucket\", mono: true, tip: \"The customer's bucket: crc32(customer_id) % 1024. All of a customer's keys carry this tag, so one Lua script changes them atomically on one Redis primary.\" },\n    { title: \"Type\", tip: \"reserve: a hold was taken before the model call. settle: the call finished and was charged. void: the hold was released with no charge. expire: the sweeper released a hold nobody settled.\" },\n    { title: \"Resource\", mono: true, tip: \"The Resource that pays (first 8 characters): the APIM subscription and its wallet.\" },\n    { title: \"Model\", tip: \"The model the call was priced for.\" },\n    { title: \"Reserved\", num: true, tip: `The hold: the most the call could cost = estimated prompt tokens × input price + maximum output tokens × output price, at the prices pinned on the hold. The gateway estimates the prompt as characters ÷ 4 + 16. ${NANO}` },\n    { title: \"Actual\", num: true, tip: `What the call really cost = prompt tokens × input price + completion tokens × output price, from the model's own token counts. Added to the wallet's 'settled'. ${NANO}` },\n    { title: \"Released\", num: true, tip: `The unused part of the hold, given back to the wallet = Reserved − Actual (the whole hold for a void). ${NANO}` },\n    { title: \"Plan\", tip: \"The plan the Resource was bought on, from the wallet's credit. Empty on a reserve entry: the plan is not a field there.\" },\n    { title: \"Reached Kafka\", tip: \"yes: the drainer's committed checkpoint for this bucket is at or past this entry, so its decision is in the committed ledger. not yet: still only in Redis. Reserve entries are never published: nothing downstream needs them.\" },\n  ];\n  return foldable(\"entries\", titles, shown(\"entries\", state.entries), (e) =\u003e `${e.stream} ${e.id}`, (e) =\u003e {\n    const f = e.fields, j = (f.j \u0026\u0026 typeof f.j === \"object\") ? f.j : {};\n    return [\n      clock(e.time), e.bucket, f.t,\n      short(resourceOf(f.vk) || resourceOf(j.wallet_key) || j.credential_id),\n      f.model || j.model,\n      number(f.reserved !== undefined ? f.reserved : j.reserved),\n      f.t === \"reserve\" ? \"–\" : number(f.actual), f.t === \"reserve\" ? \"–\" : number(f.released),\n      f.plan_id,\n      f.t === \"reserve\" ? { text: \"not published\", tone: \"empty\" }\n        : e.in_kafka ? { text: \"yes (checkpoint)\", tone: \"good\" } : { text: \"not yet\", tone: \"warn\" },\n    ];\n  }, (e) =\u003e ({ stream: e.stream, id: e.id, node: e.node, seen_at: e.seen_at, fields: e.fields }),\n  \"No entry seen yet. Make a call through the gateway.\");\n}\n\nfunction ledger(state) {\n  const titles = [\n    { title: \"Decided\", tip: \"When Redis decided: the time in the record's entry_id (UTC).\" },\n    { title: \"P·offset\", mono: true, tip: \"Kafka partition and offset in usage.ledger. The key is the resource id, so one Resource's records stay in order on one partition.\" },\n    { title: \"Type\", tip: \"SETTLED: the call was charged. VOIDED: the hold was released with no charge. EXPIRED: the sweeper released a hold nobody settled.\" },\n    { title: \"Bucket·gen\", mono: true, tip: \"The record's identity is (bucket, generation, entry_id): the stream it came from, the bucket's generation when it was read, and the stream entry's id.\" },\n    { title: \"Resource\", mono: true, tip: \"resource_id (first 8 characters): the wallet that pays.\" },\n    { title: \"Model\", tip: \"The model the call was priced for.\" },\n    { title: \"Tokens in / out\", num: true, tip: \"prompt_tokens / completion_tokens of a settle; unset on a void or an expiry.\" },\n    { title: \"Reserved\", num: true, tip: `reserved_nano: the hold. ${NANO}` },\n    { title: \"Cost\", num: true, tip: `cost_nano: what a settle charged; unset on a void or an expiry, which release the whole hold. ${NANO}` },\n    { title: \"Committed\", tip: \"When the drainer's Kafka transaction committed (the broker's timestamp, UTC).\" },\n  ];\n  return foldable(\"ledger\", titles, shown(\"ledger\", state.ledger), (r) =\u003e `${r.topic} ${r.partition} ${r.offset}`, (r) =\u003e {\n    const v = r.value || {};\n    const decided = v.entry_id ? new Date(Number(String(v.entry_id).split(\"-\")[0])).toISOString() : null;\n    return [\n      clock(decided), `${r.partition}·${r.offset}`, v.type, `${text(v.bucket)}·${text(v.generation || 0)}`,\n      short(v.resource_id), v.model,\n      v.prompt_tokens === undefined ? \"–\" : `${number(v.prompt_tokens)} / ${number(v.completion_tokens)}`,\n      number(v.reserved_nano), v.cost_nano === undefined ? \"–\" : number(v.cost_nano), clock(r.committed_at),\n    ];\n  }, (r) =\u003e ({ topic: r.topic, partition: r.partition, offset: r.offset, key: r.key, headers: r.headers,\n    bytes: r.bytes, committed_at: r.committed_at, value: r.value }),\n  \"No record on usage.ledger: the usage ledger is off here, or no call has finished since it was switched on.\");\n}\n\nconst KINDS = [\n  [\"v:\", \"Wallets (v:)\"], [\"h:\", \"Holds (h:)\"], [\"i:\", \"Idempotency records (i:)\"],\n  [\"e:\", \"Open holds by expiry (e:)\"], [\"x:\", \"Stream (x:)\"], [\"\", \"Other\"],\n];\n\nfunction ttl(ms) {\n  if (ms === -1) return \"none\";\n  if (ms === null || ms === undefined || ms \u003c 0) return \"–\";\n  return ms \u003e= 100000 ? `${number(Math.round(ms / 1000))} s` : `${(ms / 1000).toFixed(1)} s`;\n}\n\n// What a key holds, in a few words: the whole value is one click away.\nfunction gist(key, item) {\n  const v = item.value;\n  if (key.startsWith(\"v:\") \u0026\u0026 v) return `settled ${number(v.settled || 0)} · reserved ${number(v.reserved || 0)}`;\n  if (key.startsWith(\"h:\") \u0026\u0026 v) {\n    const done = v.tb \u0026\u0026 typeof v.tb === \"object\" ? v.tb : {};\n    const cost = done.actual_cost_nano !== undefined ? ` · cost ${number(done.actual_cost_nano)}` : \"\";\n    return `${v.status} · ${text(v.model)} · reserved ${number(v.reserved)}${cost} · plan ${text(v.plan_id)}`;\n  }\n  if (key.startsWith(\"i:\") \u0026\u0026 v) {\n    const body = v.b \u0026\u0026 typeof v.b === \"object\" ? v.b : {};\n    return `HTTP ${text(v.s)} · ${text(body.status)}`;\n  }\n  if (key.startsWith(\"e:\") \u0026\u0026 Array.isArray(v)) return `${v.length} open`;\n  if (key.startsWith(\"x:\") \u0026\u0026 v) {\n    return `${number(v.length)} waiting · ` + v.groups.map((g) =\u003e `${g.name}: pending ${g.pending}`).join(\" · \");\n  }\n  return typeof v === \"string\" ? v : \"\";\n}\n\nconst KEY_TITLES = [\n  { title: \"Kind\", tip: \"Wallets v: one per Resource, no TTL: 'settled' is all it has spent, 'reserved' is held by open calls; available = balance − settled − reserved. Holds h: one per call. Idempotency records i: the stored answer of each reserve, settle or void, replayed if the gateway retries. e: the open holds, by expiry time. x: the decision stream the drainer reads.\" },\n  { title: \"Key\", mono: true, tip: \"The Redis key. {bNNNN} is the bucket tag; a hold's key ends in its authorization id, an idempotency record's in the gateway's request id plus -reserve or -settle.\" },\n  { title: \"Type\", tip: \"The Redis data type.\" },\n  { title: \"TTL\", num: true, tip: \"Time until Redis deletes the key. An open hold lives about a day beyond its 15-minute expiry (the sweeper expires it first); once settled or voided, it and its records stay 600 s (TERMINAL_RETENTION_SECONDS) so a gateway retry gets the same answer. Wallets and streams have none.\" },\n  { title: \"Bytes\", num: true, tip: \"Memory the key uses in Redis (MEMORY USAGE).\" },\n  { title: \"Holds\", tip: \"The value in brief: amounts are nano-dollars. Open the row for every field.\" },\n];\n\nfunction keyRows(keys, emptyText, limit) {\n  const all = Object.entries(keys);\n  if (!all.length) return el(\"p\", { class: \"empty\", text: emptyText });\n  const taken = new Set();\n  const groups = [];\n  for (const [prefix, title] of KINDS) {\n    const mine = all.filter(([key]) =\u003e !taken.has(key) \u0026\u0026 key.startsWith(prefix));\n    mine.forEach(([key]) =\u003e taken.add(key));\n    if (!mine.length) continue;\n    // Hold ids rise with time, so the last of them are the newest: show those first.\n    const some = mine.slice().reverse().slice(0, limit);\n    groups.push(el(\"div\", { class: \"group\",\n      text: `${title}: ${mine.length}` + (mine.length \u003e some.length ? `, showing ${some.length}` : \"\") }));\n    groups.push(foldable(\"keys\", KEY_TITLES, some.map(([key, item]) =\u003e ({ key, item, title })),\n      (row) =\u003e `key ${row.key}`,\n      (row) =\u003e [row.title.split(\" (\")[0], row.key, row.item.type, ttl(row.item.pttl_ms),\n        number(row.item.bytes), gist(row.key, row.item)],\n      (row) =\u003e ({ key: row.key, type: row.item.type, pttl_ms: row.item.pttl_ms, bytes: row.item.bytes,\n        value: row.item.value }), \"\"));\n  }\n  return el(\"div\", {}, groups);\n}\n\nlet offered = \"\";\nfunction bucketChoice(state) {\n  const select = document.getElementById(\"bucket-choice\");\n  const options = [[\"auto\", \"auto (the newest entry's)\"]].concat(\n    state.inspect.buckets.map((b) =\u003e [b.bucket, `${b.bucket} · ${b.users.join(\", \")}`]));\n  const signature = JSON.stringify(options);\n  if (signature !== offered) {\n    offered = signature;\n    select.replaceChildren(...options.map(([value, label]) =\u003e el(\"option\", { value, text: label })));\n  }\n  if (document.activeElement !== select) select.value = state.inspect.chosen;\n}\ndocument.getElementById(\"bucket-choice\").addEventListener(\"change\", (event) =\u003e {\n  fetch(`/inspect?bucket=${encodeURIComponent(event.target.value)}`);\n});\n\nfunction bucket(state) {\n  bucketChoice(state);\n  const seen = state.bucket;\n  document.getElementById(\"bucket-note\").textContent = seen\n    ? `${seen.bucket} on ${seen.node.split(\".\")[0]} · ${Object.keys(seen.keys).length} keys · read ${clock(seen.at)}` +\n      (seen.truncated ? \" · more keys than read\" : \"\")\n    : (state.inspect.showing ? `reading ${state.inspect.showing}…` : \"no bucket with a wallet yet\");\n  replace(\"bucket\", keyRows(seen ? seen.keys : {}, \"Nothing read yet.\", limits.keys));\n  const holds = {};\n  for (const hold of shown(\"holds\", state.open_holds)) holds[`${hold.key}  (seen ${clock(hold.seen_at)})`] = hold;\n  replace(\"open-holds\", keyRows(holds, \"None caught yet.\", limits.holds));\n}\n\nfunction draw(state) {\n  latest = state;\n  const redis = state.redis;\n  const deployment = state.deployment || {};\n  document.getElementById(\"where\").textContent = `${text(deployment.namespace)} · Kafka ${text(deployment.kafka)} · read-only`;\n  document.getElementById(\"explorer\").hidden = !deployment.explorer;\n  document.getElementById(\"wallets-note\").textContent = `${number(state.wallets.length)} wallets`;\n  document.getElementById(\"pods-note\").textContent = `${number(((state.cluster || {}).pods || []).length)} pods`;\n  document.getElementById(\"ledger-note\").textContent =\n    `${count(\"ledger\", state.ledger, \"kept\")} · ${number(state.seen.ledger)} read`;\n  replace(\"ledger\", ledger(state));\n  replace(\"ready\", table([\n    { title: \"Primary\", mono: true, tip: \"The address the node was at when the rebuilder marked it ready.\", value: (r) =\u003e String(r.address).split(\".\")[0] },\n    { title: \"run_id\", mono: true, tip: \"The Redis process's own id (first 8 characters). A restarted or promoted node has a new one, and is refused until the rebuilder trusts or rebuilds it.\", value: (r) =\u003e short(r.run_id) },\n    { title: \"Ready at\", tip: \"When the rebuilder last confirmed it (UTC).\", value: (r) =\u003e clock(r.ready_at \u0026\u0026 String(r.ready_at).replace(\" \", \"T\")) },\n  ], (state.database \u0026\u0026 state.database.ready) || [], \"None read yet.\"));\n  document.getElementById(\"status\").textContent =\n    `updated ${clock(state.at)} UTC · probe ${state.probe} · Redis read ${clock(redis \u0026\u0026 redis.at)} · ` +\n    `PostgreSQL read ${clock(state.database \u0026\u0026 state.database.at)} · remembers the last ${number(state.keep)} of each list`;\n  document.getElementById(\"entries-note\").textContent =\n    `${count(\"entries\", state.entries, \"kept\")} · ${number(state.seen.entries)} seen since the monitor started`;\n  for (const [kind, topic] of Object.entries(state.topics)) {\n    document.getElementById(`${kind}-topic`).textContent = topic;\n  }\n  replace(\"pipeline\", pipeline(state));\n  replace(\"entries\", entries(state));\n  bucket(state);\n\n  replace(\"checkpoints\", table([\n    { title: \"Committed\", tip: \"When the drainer's transaction committed (UTC). The checkpoint is written in the same transaction as the ledger records it covers.\", value: (c) =\u003e clock(c.committed_at) },\n    { title: \"P·offset\", mono: true, tip: \"Kafka partition and offset in usage.checkpoints. The topic is compacted: only the newest checkpoint of a bucket is kept for good.\", value: (c) =\u003e `${c.partition}·${c.offset}` },\n    { title: \"Bucket\", mono: true, tip: \"The message key: one checkpoint per bucket the transaction touched.\", value: (c) =\u003e c.key },\n    { title: \"Generation\", num: true, tip: \"The bucket's generation (Redis key g:{bucket}), which a rebuild of a lost Redis node raises. 0 on a bucket never rebuilt.\", value: (c) =\u003e c.value.generation },\n    { title: \"Last entry id\", mono: true, tip: \"The last stream entry of the bucket that is in Kafka. After a crash the drainer skips everything at or below it, so nothing is published twice.\", value: (c) =\u003e c.value.last_entry_id },\n  ], shown(\"checkpoints\", state.checkpoints), \"No checkpoint yet.\"));\n\n  replace(\"lag\", table([\n    { title: \"Partition\", num: true, tip: `A partition of ${state.usage_topic}.`, value: (p) =\u003e p.partition },\n    { title: \"End of log\", num: true, tip: \"The partition's high watermark: the next offset Kafka will write, commit markers included.\", value: (p) =\u003e number(p.end) },\n    { title: \"Stored next_offset\", num: true, tip: \"wallet_updater_offsets.next_offset: the next record the wallet updater will apply. It moves in the same PostgreSQL transaction as the wallet totals, by compare-and-set.\", value: (p) =\u003e number(p.stored) },\n    { title: \"Lag\", num: true, tip: \"End of log − stored next_offset: offsets not yet applied to PostgreSQL. 0 = caught up.\", value: (p) =\u003e number(p.lag), tone: (p) =\u003e (p.lag ? \"warn\" : \"good\") },\n    { title: \"Stored at\", tip: \"When the updater last moved this offset (UTC).\", value: (p) =\u003e clock(p.stored_at \u0026\u0026 String(p.stored_at).replace(\" \", \"T\")) },\n  ], state.lag, `${state.usage_topic} not read yet.`));\n\n  replace(\"wallets\", table([\n    { title: \"Customer\", mono: true, tip: \"wallet_accounts.customer_id (first 8 characters): the customer the Resource belongs to. Its name is the control plane's and is not read here.\", value: (w) =\u003e short(w.customer_id) },\n    { title: \"Resource\", mono: true, tip: \"The Resource id (first 8 characters): wallet_accounts.api_key_id, the APIM subscription.\", value: (w) =\u003e short(w.api_key_id) },\n    { title: \"Bucket\", mono: true, tip: \"The Redis bucket of the Resource's customer. Empty until the Resource's first call: the wallet key is created then.\", value: (w) =\u003e (w.redis_key ? w.redis_key.slice(3, 8) : \"–\") },\n    { title: \"Balance\", num: true, tip: \"wallet_accounts.balance_nano as dollars: everything ever credited to the wallet (the purchase). It does not go down; spend is counted separately.\", value: (w) =\u003e w.balance },\n    { title: \"Redis settled (nano)\", num: true, tip: `The wallet's 'settled' in Redis: the sum of every call's actual cost, updated on each settle. This is what spend control decides on. ${NANO}`, value: (w) =\u003e number(w.redis_settled_nano) },\n    { title: \"Redis reserved (nano)\", num: true, tip: `The wallet's 'reserved' in Redis: the holds of calls still running. 0 when nothing is in flight. ${NANO}`, value: (w) =\u003e number(w.redis_reserved_nano) },\n    { title: \"PostgreSQL settled_nano\", num: true, tip: `wallet_accounts.settled_nano: the wallet updater adds each settled partial's cost_nano to it. The durable copy of the spend. ${NANO}`, value: (w) =\u003e number(w.settled_nano) },\n    { title: \"Not yet in PostgreSQL\", num: true, tip: \"Redis settled − PostgreSQL settled_nano. Above 0 only for the moment a partial is on its way; if it stays above 0, the drainer or the wallet updater is behind or stopped.\", value: (w) =\u003e number(w.behind_nano),\n      tone: (w) =\u003e (w.behind_nano ? \"warn\" : w.behind_nano === 0 ? \"good\" : \"\") },\n    { title: \"Available\", num: true, tip: \"What the wallet can still spend, as spend control computes it: balance − Redis settled − Redis reserved.\", value: (w) =\u003e w.available },\n  ], state.wallets, \"No wallet yet.\"));\n\n  replace(\"redis\", table([\n    { title: \"Primary\", mono: true, tip: \"A Redis primary of the cluster. Each has one replica.\", value: (n) =\u003e n.name.split(\".\")[0] },\n    { title: \"Buckets\", num: true, tip: \"How many of the 1,024 buckets this primary owns.\", value: (n) =\u003e n.buckets },\n    { title: \"Entries waiting\", num: true, tip: \"Stream entries on this primary not yet trimmed by the drainer.\", value: (n) =\u003e number(n.stream_entries), tone: (n) =\u003e (n.stream_entries ? \"warn\" : \"good\") },\n    { title: \"Oldest (ms)\", num: true, tip: \"Age of the oldest waiting entry. Past the lag fence (LEDGER_LAG_LIMIT_MS, 30 s in the Redis component) reserves for its bucket are refused with 503 ledger_lagging.\", value: (n) =\u003e number(n.oldest_age_ms), tone: (n) =\u003e (n.oldest_age_ms \u003e 1000 ? \"bad\" : \"\") },\n    { title: \"Open holds\", num: true, tip: \"Calls between reserve and settle on this primary (the e: sets).\", value: (n) =\u003e number(n.open_holds) },\n    { title: \"Ops/s\", num: true, tip: \"Commands per second this primary is serving. Mostly the drainer polling its buckets every 250 ms, plus this monitor.\", value: (n) =\u003e number(n.ops_per_sec) },\n    { title: \"Memory\", num: true, tip: \"Memory Redis is using on this primary.\", value: (n) =\u003e `${(n.used_memory / 1048576).toFixed(1)} MB` },\n    { title: \"Replica\", tip: \"The replica's state and how many seconds since it last acknowledged. Every decision waits for the replica (WAIT 1) before it is answered.\", value: (n) =\u003e (n.replicas.length ? n.replicas.map((r) =\u003e `${r.state}, lag ${r.lag_s} s`).join(\"; \") : \"none\"),\n      tone: (n) =\u003e (n.replicas.length \u0026\u0026 n.replicas.every((r) =\u003e r.state === \"online\") ? \"good\" : \"bad\") },\n  ], (redis \u0026\u0026 redis.nodes) || [], \"Redis not read yet.\"));\n\n  replace(\"pods\", table([\n    { title: \"Pod\", mono: true, value: (p) =\u003e p.name },\n    { title: \"State\", value: (p) =\u003e (p.ready ? \"ready\" : p.phase), tone: (p) =\u003e (p.ready ? \"good\" : \"bad\") },\n    { title: \"Restarts\", num: true, value: (p) =\u003e p.restarts },\n    { title: \"Node\", mono: true, tip: \"The machine the pod runs on (its last characters).\", value: (p) =\u003e (p.node ? String(p.node).slice(-10) : \"–\") },\n    { title: \"Image\", mono: true, value: (p) =\u003e p.image.split(\"/\").pop() },\n  ], (state.cluster \u0026\u0026 state.cluster.pods) || [], \"Pods not read yet.\"));\n\n  replace(\"errors\", table([\n    { title: \"At\", value: (e) =\u003e clock(e.at) },\n    { title: \"Source\", value: (e) =\u003e e.where },\n    { title: \"Error\", value: (e) =\u003e e.error },\n  ], state.errors, \"None.\"));\n}\n\n// The \"show last N\" choices: kept in this browser, applied at once to what is already here.\nfor (const select of document.querySelectorAll(\"select[data-list]\")) {\n  const name = select.dataset.list;\n  select.replaceChildren(...CHOICES.map((n) =\u003e el(\"option\", { value: String(n), text: String(n) })));\n  if (!CHOICES.includes(Number(limits[name]))) limits[name] = 25;\n  select.value = String(limits[name]);\n  select.addEventListener(\"change\", () =\u003e {\n    limits[name] = Number(select.value);\n    try { localStorage.setItem(\"drain-monitor-limits\", JSON.stringify(limits)); } catch (error) { /* not kept */ }\n    if (latest) draw(latest);\n  });\n}\n\nconst events = new EventSource(\"/events\");\nevents.onmessage = (event) =\u003e draw(JSON.parse(event.data));\nevents.onerror = () =\u003e { document.getElementById(\"status\").textContent = \"connection to the monitor lost; retrying…\"; };\n","monitor.py":"\"\"\"The drain monitor: the drain path of a deployment on one page, for watching and debugging.\n\n    Redis (streams, wallets, holds)  -\u003e  drainer  -\u003e  Kafka (checkpoints, usage ledger)\n                                                  -\u003e  wallet updater  -\u003e  PostgreSQL\n\nIt shows the last decisions seen in the Redis streams and the last messages on the Kafka\ntopics in full, the backlog and lag between the stages, each wallet's spend in Redis beside\nPostgreSQL's, and the namespace's pods. It runs as a pod of its own (this directory's\ndrain-monitor.yaml): its code is mounted from a ConfigMap into the spend-control image, so the\nmoney services' image carries no web server.\n\nRead-only by construction. Redis and Kafka are read by drain_probe.py, started beside this\nprocess, which refuses every Redis command that is not a read and commits no Kafka offset;\nPostgreSQL through the login billing_monitor (migration 023: SELECT on three tables) on a\nconnection whose every transaction is read-only; the Kubernetes API with a service account that\nmay only list the namespace's pods.\n\nThe page is served on 127.0.0.1 inside the pod and nowhere else: it is reached with\n`kubectl port-forward` (`stack forward monitor \u003cinstance\u003e`), so opening it takes the cluster\ncredentials that would show the same data anyway. It carries no key, password or token: a stream\nentry and a partial hold ids, token counts and amounts. Money stays integer nano-units and is\nturned into dollars by integer arithmetic, never a float. DATABASE_URL and REDIS_PASSWORD come\nfrom the environment, never from the command line.\n\"\"\"\nimport argparse\nimport http.server\nimport json\nimport os\nimport pathlib\nimport ssl\nimport subprocess\nimport sys\nimport threading\nimport time\nimport urllib.parse\nimport urllib.request\nfrom collections import deque\nfrom datetime import UTC, datetime\nfrom decimal import Decimal\n\nimport psycopg\nfrom psycopg.rows import dict_row\nfrom spend_control.worker import recovery_topic\n\nHOST = \"127.0.0.1\"\nHERE = pathlib.Path(__file__).resolve().parent\nPROBE = HERE / \"drain_probe.py\"\n# Only this origin's own script, style and fetches (the portal UI's policy).\nSECURITY_HEADERS = {\n    \"Content-Security-Policy\": (\"default-src 'self'; script-src 'self'; style-src 'self'; \"\n                                \"img-src 'self'; connect-src 'self'; object-src 'none'; \"\n                                \"base-uri 'none'; form-action 'none'; frame-ancestors 'none'\"),\n    \"X-Content-Type-Options\": \"nosniff\", \"Referrer-Policy\": \"no-referrer\",\n    \"Cache-Control\": \"no-store\"}\nFILES = {\"/\": (\"index.html\", \"text/html; charset=utf-8\"),\n         \"/monitor.css\": (\"monitor.css\", \"text/css; charset=utf-8\"),\n         \"/monitor.js\": (\"monitor.js\", \"text/javascript; charset=utf-8\")}\n# The explorer's pages (explore.py): served only where the deployment switches it on.\nEXPLORER_FILES = {\"/kafka\": (\"kafka.html\", \"text/html; charset=utf-8\"),\n                  \"/redis\": (\"redis.html\", \"text/html; charset=utf-8\"),\n                  \"/explore.js\": (\"explore.js\", \"text/javascript; charset=utf-8\")}\n# The page is being looked at if it was given a picture this recently (/events gives one at\n# least every 15 s while it is open). Only then is a bucket's every key read.\nLOOKING_SECONDS = 30\nKEEP = 200  # of each list (stream entries, checkpoints, ledger records) unless --keep says otherwise\nREAD_ONLY = \"-c default_transaction_read_only=on\"\nNANO_PER_DOLLAR = 10**9\n# Where a pod finds the cluster's API and its own identity.\nACCOUNT = pathlib.Path(\"/var/run/secrets/kubernetes.io/serviceaccount\")\nAPI = \"https://kubernetes.default.svc\"\nUSAGE_TOPIC = recovery_topic(os.environ)\nCHECKPOINTS = os.environ.get(\"DRAINER_CHECKPOINTS_TOPIC\", \"usage.checkpoints\")\nLEDGER = os.environ.get(\"DRAINER_LEDGER_TOPIC\") or \"usage.ledger\"\n\n\ndef dollars(nano):\n    \"\"\"Integer nano-units as dollars, exactly: 13200 -\u003e $0.0000132, 10**11 -\u003e $100.00.\n    A whole-number Decimal (what PostgreSQL's sum() returns) is taken exactly; a float\n    is refused, since it could not have held the amount exactly.\"\"\"\n    if nano is None:\n        return \"-\"\n    if isinstance(nano, Decimal) and nano == nano.to_integral_value():\n        nano = int(nano)\n    if not isinstance(nano, int) or isinstance(nano, bool):\n        raise TypeError(f\"money must be integer nano-units, not {type(nano).__name__}\")\n    sign = \"-\" if nano \u003c 0 else \"\"\n    whole, fraction = divmod(abs(nano), NANO_PER_DOLLAR)\n    digits = f\"{fraction:09d}\".rstrip(\"0\")\n    return f\"{sign}${whole:,}.{digits.ljust(2, '0')}\"\n\n\ndef connect(url):\n    return psycopg.connect(url, options=READ_ONLY, row_factory=dict_row, connect_timeout=5)\n\n\ndef iso(seconds):\n    return datetime.fromtimestamp(seconds, UTC).isoformat(timespec=\"milliseconds\")\n\n\ndef id_order(entry_id):\n    return tuple(int(part) for part in entry_id.split(\"-\"))\n\n\ndef parsed(text):\n    \"\"\"A stream field that holds JSON, as an object; anything else as it is.\"\"\"\n    try:\n        value = json.loads(text)\n    except (TypeError, ValueError):\n        return text\n    return value if isinstance(value, (dict, list)) else text\n\n\ndef newest_first(records):\n    \"\"\"Kafka records by when they were committed, newest first. They arrive partition by\n    partition when the probe replays a topic, so the order of arrival is not the order in time.\"\"\"\n    return sorted(records, key=lambda r: (r[\"committed_at\"], r[\"partition\"], r[\"offset\"]), reverse=True)\n\n\nclass Board:\n    \"\"\"What the page shows, and a version that moves whenever it changes.\"\"\"\n\n    def __init__(self, keep=KEEP, deployment=None):\n        self.condition = threading.Condition()\n        # What this deployment is set to, read once from the monitor's own environment (the\n        # config maps the drainer reads): the namespace, the usage ledger's topic or none.\n        self.deployment = deployment or {}\n        self.version = 0\n        self.closed = False\n        self.keep = keep\n        self.entries = deque(maxlen=keep)\n        self.checkpoints = deque(maxlen=keep)\n        self.ledger = deque(maxlen=keep)\n        self.errors = deque(maxlen=20)\n        self.latest_checkpoint = {}  # bucket name -\u003e (generation, last_entry_id)\n        self.redis = None\n        self.kafka_ends = None\n        self.database = None\n        self.cluster = None\n        self.probe = \"starting\"\n        self.bucket = None  # the inspected bucket's keys, as the probe last read them\n        self.inspect = \"auto\"  # a bucket name, or \"auto\": the bucket of the newest entry\n        self.looked = None  # when the page was last given a picture (time.monotonic)\n        self.open_holds = deque(maxlen=min(keep, 50))  # the last holds caught while still authorized\n        self.seen = {\"entries\": 0, \"checkpoints\": 0, \"ledger\": 0}\n\n    def _changed(self):\n        self.version += 1\n        self.condition.notify_all()\n\n    def probe_line(self, message):\n        kind = message.get(\"kind\")\n        with self.condition:\n            self.probe = \"running\"\n            if kind == \"entry\":\n                fields = dict(message[\"fields\"])\n                for name in (\"j\", \"response\"):\n                    if name in fields:\n                        fields[name] = parsed(fields[name])\n                self.seen[\"entries\"] += 1\n                self.entries.appendleft({\n                    \"seen_at\": iso(message[\"at\"]), \"node\": message[\"node\"],\n                    \"stream\": message[\"stream\"], \"id\": message[\"id\"],\n                    \"time\": iso(int(message[\"id\"].split(\"-\")[0]) / 1000), \"fields\": fields})\n            elif kind == \"kafka\":\n                record = {k: message[k] for k in (\"topic\", \"partition\", \"offset\", \"key\",\n                                                  \"headers\", \"bytes\", \"value\")}\n                record[\"committed_at\"] = iso(message[\"broker_ms\"] / 1000)\n                if message[\"topic\"] == CHECKPOINTS:\n                    self.seen[\"checkpoints\"] += 1\n                    self.checkpoints.appendleft(record)\n                    value = message[\"value\"]\n                    if isinstance(value.get(\"last_entry_id\"), str):\n                        self.latest_checkpoint[message[\"key\"]] = (\n                            value.get(\"generation\", 0), value[\"last_entry_id\"])\n                elif message[\"topic\"] == LEDGER:\n                    self.seen[\"ledger\"] += 1\n                    self.ledger.appendleft(record)\n                else:\n                    return\n            elif kind == \"redis\":\n                self.redis = {\"at\": iso(message[\"at\"]),\n                              \"nodes\": message[\"nodes\"], \"wallets\": message[\"wallets\"]}\n            elif kind == \"kafka_ends\":\n                self.kafka_ends = {\"at\": iso(message[\"at\"]), \"bootstrap\": message[\"bootstrap\"],\n                                   \"topics\": message[\"topics\"]}\n            elif kind == \"hold\":\n                if all(seen[\"key\"] != message[\"key\"] for seen in self.open_holds):\n                    self.open_holds.appendleft({\n                        \"key\": message[\"key\"], \"seen_at\": iso(message[\"at\"]), \"type\": \"hash\",\n                        \"pttl_ms\": message[\"pttl_ms\"], \"bytes\": message[\"bytes\"],\n                        \"value\": message[\"value\"]})\n            elif kind == \"bucket\":\n                keys = {}\n                for key, item in message[\"keys\"].items():\n                    value = item.get(\"value\")\n                    if isinstance(value, dict) and item[\"type\"] == \"hash\":\n                        value = {name: parsed(field) if name in (\"b\", \"tb\") else field\n                                 for name, field in value.items()}\n                    elif item[\"type\"] == \"stream\":\n                        for entry in value[\"entries\"]:\n                            entry[\"fields\"] = {name: parsed(field) if name in (\"j\", \"response\") else field\n                                               for name, field in entry[\"fields\"].items()}\n                    keys[key] = {**item, \"value\": value}\n                    still_open = (key.startswith(\"h:\") and isinstance(value, dict)\n                                  and value.get(\"status\") == \"authorized\")\n                    if still_open and all(seen[\"key\"] != key for seen in self.open_holds):\n                        self.open_holds.appendleft({\"key\": key, \"seen_at\": iso(message[\"at\"]),\n                                                    **keys[key]})\n                self.bucket = {\"at\": iso(message[\"at\"]), \"bucket\": message[\"bucket\"],\n                               \"node\": message[\"node\"], \"truncated\": message[\"truncated\"],\n                               \"keys\": keys}\n            elif kind == \"error\":\n                self.errors.appendleft({\"at\": iso(message[\"at\"]), \"where\": message[\"where\"],\n                                        \"error\": message[\"error\"]})\n            else:\n                return\n            self._changed()\n\n    def set(self, name, value):\n        with self.condition:\n            setattr(self, name, value)\n            self._changed()\n\n    def error(self, where, error):\n        with self.condition:\n            self.errors.appendleft({\"at\": iso(time.time()), \"where\": where, \"error\": str(error)[:300]})\n            self._changed()\n\n    def close(self):\n        with self.condition:\n            self.closed = True\n            self.condition.notify_all()\n\n    def wait(self, version, timeout):\n        with self.condition:\n            self.condition.wait_for(lambda: self.closed or self.version != version, timeout)\n\n    def snapshot(self):\n        with self.condition:\n            self.looked = time.monotonic()\n            return self.version, json.dumps(self.view(), default=str)\n\n    def inspected(self):\n        \"\"\"The bucket the probe is asked to show: the one chosen, or the newest entry's.\"\"\"\n        if self.inspect != \"auto\":\n            return self.inspect\n        if self.entries:\n            return \"b\" + self.entries[0][\"stream\"][4:8]\n        for key in sorted((self.redis or {}).get(\"wallets\") or {}):\n            return \"b\" + key[4:8]\n        return None\n\n    def asked_of_probe(self):\n        \"\"\"The bucket the probe reads in full, and none while nobody has the page open: that\n        read is the dearest thing the probe does, and the probe is always there.\"\"\"\n        if self.looked is None or time.monotonic() - self.looked \u003e LOOKING_SECONDS:\n            return None\n        return self.inspected()\n\n    def choose(self, bucket):\n        with self.condition:\n            self.inspect = bucket\n            self._changed()\n\n    def buckets(self):\n        \"\"\"Buckets that hold a wallet, with whose: what the page offers to inspect.\"\"\"\n        owners = {w[\"api_key_id\"]: w[\"customer_id\"]\n                  for w in (self.database or {}).get(\"wallets\") or []}\n        found = {}\n        for key in ((self.redis or {}).get(\"wallets\") or {}):\n            resource = key.split(\":\", 2)[2].rpartition(\":\")[0] if key.count(\":\") \u003e= 3 else key\n            found.setdefault(\"b\" + key[4:8], set()).add(str(owners.get(resource, \"?\")))\n        return [{\"bucket\": bucket, \"users\": sorted(users)} for bucket, users in sorted(found.items())]\n\n    def view(self):\n        entries = []\n        for entry in self.entries:\n            bucket = \"b\" + entry[\"stream\"][4:8]  # x:{bNNNN}\n            checkpoint = self.latest_checkpoint.get(bucket)\n            published = checkpoint is not None and id_order(entry[\"id\"]) \u003c= id_order(checkpoint[1])\n            entries.append({**entry, \"bucket\": bucket, \"in_kafka\": published})\n        return {\n            \"at\": iso(time.time()), \"probe\": self.probe, \"seen\": dict(self.seen), \"keep\": self.keep,\n            \"deployment\": self.deployment,\n            \"usage_topic\": USAGE_TOPIC,\n            \"topics\": {\"checkpoints\": CHECKPOINTS, \"ledger\": LEDGER},\n            \"cluster\": self.cluster, \"redis\": self.redis, \"kafka_ends\": self.kafka_ends,\n            \"database\": self.database, \"wallets\": self.wallets(), \"lag\": self.lag(),\n            \"entries\": entries,\n            \"checkpoints\": newest_first(self.checkpoints), \"ledger\": newest_first(self.ledger),\n            \"errors\": list(self.errors),\n            \"inspect\": {\"chosen\": self.inspect, \"showing\": self.inspected(), \"buckets\": self.buckets()},\n            \"bucket\": self.bucket if self.bucket and self.bucket[\"bucket\"] == self.inspected() else None,\n            \"open_holds\": list(self.open_holds)}\n\n    def wallets(self):\n        \"\"\"Each wallet's spend in Redis beside PostgreSQL's: they differ only while a partial\n        is on its way.\"\"\"\n        in_redis = {}\n        for key, value in ((self.redis or {}).get(\"wallets\") or {}).items():\n            # v:{bNNNN}:\u003capi key id\u003e:\u003ccurrency\u003e; the id may itself hold colons.\n            resource = key.split(\":\", 2)[2].rpartition(\":\")[0] if key.count(\":\") \u003e= 3 else key\n            in_redis[resource] = (key, value)\n        rows = []\n        for row in (self.database or {}).get(\"wallets\") or []:\n            key, value = in_redis.pop(row[\"api_key_id\"], (None, None))\n            settled = int(value.get(\"settled\", 0)) if value else None\n            reserved = int(value.get(\"reserved\", 0)) if value else None\n            behind = None if settled is None else settled - row[\"settled_nano\"]\n            rows.append({\n                **row, \"redis_key\": key, \"redis_settled_nano\": settled,\n                \"redis_reserved_nano\": reserved, \"behind_nano\": behind,\n                \"balance\": dollars(row[\"balance_nano\"]), \"settled\": dollars(row[\"settled_nano\"]),\n                \"redis_settled\": dollars(settled), \"redis_reserved\": dollars(reserved),\n                \"behind\": dollars(behind),\n                \"available\": dollars(None if settled is None\n                                     else row[\"balance_nano\"] - settled - reserved)})\n        for resource, (key, value) in in_redis.items():\n            rows.append({\"api_key_id\": resource, \"redis_key\": key, \"no_row_in_postgresql\": True,\n                         \"redis_settled_nano\": int(value.get(\"settled\", 0)),\n                         \"redis_reserved_nano\": int(value.get(\"reserved\", 0)),\n                         \"redis_settled\": dollars(int(value.get(\"settled\", 0))),\n                         \"redis_reserved\": dollars(int(value.get(\"reserved\", 0)))})\n        return rows\n\n    def lag(self):\n        \"\"\"Per partition of the selected feed: the log end, the offset the wallet updater\n        has stored in PostgreSQL, and the difference.\"\"\"\n        ends = ((self.kafka_ends or {}).get(\"topics\") or {}).get(USAGE_TOPIC) or {}\n        stored = {str(o[\"partition\"]): o for o in (self.database or {}).get(\"offsets\") or []}\n        rows = []\n        for partition in sorted(ends, key=int):\n            offset = stored.get(partition)\n            high = ends[partition][\"high\"]\n            rows.append({\"partition\": int(partition), \"end\": high,\n                         \"stored\": offset[\"next_offset\"] if offset else None,\n                         # The two are read moments apart: an offset ahead of the end seen is no lag.\n                         \"lag\": max(0, high - offset[\"next_offset\"]) if offset else None,\n                         \"stored_at\": offset[\"updated_at\"] if offset else None})\n        return rows\n\n\ndef named_wallets(board):\n    \"\"\"PostgreSQL's wallets, for the probe to read in Redis by key: it never looks for one.\"\"\"\n    return [[str(w[\"customer_id\"]), str(w[\"api_key_id\"]), str(w[\"currency\"])]\n            for w in (board.database or {}).get(\"wallets\") or []]\n\n\ndef run_probe(board, kafka, customers, inspect, wallets=list):\n    \"\"\"drain_probe.py beside this process, its lines onto the board; started again if it ends.\"\"\"\n    while not board.closed:\n        try:\n            process = subprocess.Popen(\n                [sys.executable, str(PROBE), kafka, str(board.keep)],\n                stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)\n        except OSError as error:\n            board.error(\"probe\", error)\n            time.sleep(5)\n            continue\n        sent = None\n\n        def feed(process=process):\n            # Names the customers whose buckets the probe follows, and their wallets; keeps\n            # its stdin open.\n            nonlocal sent\n            while process.poll() is None and not board.closed:\n                wanted = {\"customers\": sorted(customers()), \"wallets\": wallets(),\n                          \"inspect\": inspect()}\n                if wanted != sent:\n                    try:\n                        process.stdin.write(json.dumps(wanted) + \"\\n\")\n                        process.stdin.flush()\n                        sent = wanted\n                    except (BrokenPipeError, OSError, ValueError):\n                        return\n                time.sleep(0.3)\n\n        # What the probe says when it fails (a traceback's last lines): shown, not dropped.\n        said = deque(maxlen=5)\n        threading.Thread(target=lambda process=process, said=said: said.extend(process.stderr),\n                         daemon=True).start()\n        threading.Thread(target=feed, daemon=True).start()\n        for line in process.stdout:\n            try:\n                board.probe_line(json.loads(line))\n            except ValueError:\n                continue\n        process.wait()\n        if not board.closed:\n            board.set(\"probe\", f\"stopped (exit {process.returncode}); starting again\")\n            time.sleep(0.2)  # its last words, if still on their way\n            board.error(\"probe\", \" | \".join(line.strip() for line in said if line.strip()) or\n                        f\"exit {process.returncode}, nothing said\")\n            time.sleep(3)\n\n\ndef read_database(url):\n    with connect(url) as conn:\n        wallets = conn.execute(\"\"\"SELECT api_key_id, customer_id, currency, balance_nano,\n                settled_nano, updated_at\n            FROM wallet_accounts ORDER BY updated_at DESC LIMIT 200\"\"\").fetchall()\n        offsets = conn.execute(\"\"\"SELECT topic, partition, next_offset, updated_at\n            FROM wallet_updater_offsets WHERE topic = %s ORDER BY partition\"\"\",\n            (USAGE_TOPIC,)).fetchall()\n        ready = conn.execute(\"\"\"SELECT address, run_id, ready_at FROM redis_node_readiness\n            ORDER BY ready_at DESC LIMIT 20\"\"\").fetchall()\n    return {\"at\": iso(time.time()), \"wallets\": wallets, \"offsets\": offsets, \"ready\": ready}\n\n\ndef run_database(board, url, every):\n    while not board.closed:\n        try:\n            board.set(\"database\", read_database(url))\n        except psycopg.Error as error:\n            board.error(\"postgresql\", type(error).__name__)\n        time.sleep(every)\n\n\ndef read_cluster(namespace, account=ACCOUNT, api=API):\n    \"\"\"The namespace's pods, from the cluster's API with the pod's own service account, which\n    may list them and nothing else (drain-monitor.yaml).\"\"\"\n    request = urllib.request.Request(\n        f\"{api}/api/v1/namespaces/{namespace}/pods\",\n        headers={\"Authorization\": \"Bearer \" + (account / \"token\").read_text().strip(),\n                 \"Accept\": \"application/json\"})\n    context = ssl.create_default_context(cafile=str(account / \"ca.crt\"))\n    with urllib.request.urlopen(request, timeout=10, context=context) as reply:\n        listed = json.load(reply)\n    pods = []\n    for pod in listed[\"items\"]:\n        if pod[\"status\"].get(\"phase\") == \"Succeeded\":\n            continue\n        statuses = pod[\"status\"].get(\"containerStatuses\", [])\n        pods.append({\"name\": pod[\"metadata\"][\"name\"], \"phase\": pod[\"status\"].get(\"phase\"),\n                     \"node\": pod[\"spec\"].get(\"nodeName\"),\n                     \"ready\": bool(statuses) and all(c.get(\"ready\") for c in statuses),\n                     \"restarts\": sum(c.get(\"restartCount\", 0) for c in statuses),\n                     \"image\": (pod[\"spec\"][\"containers\"][0][\"image\"].split(\"@\")[0])})\n    return {\"at\": iso(time.time()), \"pods\": sorted(pods, key=lambda p: p[\"name\"])}\n\n\ndef run_cluster(board, namespace, every):\n    while not board.closed:\n        try:\n            board.set(\"cluster\", read_cluster(namespace))\n        except (OSError, ValueError, KeyError) as error:\n            board.error(\"kubernetes api\", type(error).__name__)\n        time.sleep(every)\n\n\ndef explorer_for(kafka):\n    \"\"\"The explorer's readers, built from the probe's own read-only pieces. Imported here, not\n    at the top: a deployment without the explorer loads none of it.\"\"\"\n    import importlib.util\n    loaded = {}\n    for name in (\"drain_probe\", \"explore\"):\n        spec = importlib.util.spec_from_file_location(name, HERE / f\"{name}.py\")\n        loaded[name] = importlib.util.module_from_spec(spec)\n        spec.loader.exec_module(loaded[name])\n    probe, explore = loaded[\"drain_probe\"], loaded[\"explore\"]\n    return {\"module\": explore,\n            \"kafka\": explore.KafkaExplorer(kafka, probe.decoded, iso=iso),\n            \"redis\": explore.RedisExplorer(probe.primaries, probe.key_value, parsed, iso=iso)}\n\n\ndef explored(explorer, path, query):\n    \"\"\"What an explorer request reads: (status, body). Every parameter is checked before a\n    store is asked anything.\"\"\"\n    explore = explorer[\"module\"]\n\n    def one(name, default=None):\n        return query.get(name, [default])[0]\n\n    def number(name, least=0, most=None):\n        return None if one(name) is None else explore.whole(one(name), name, least, most)\n\n    if path not in (\"/explore/kafka/topics\", \"/explore/kafka/records\", \"/explore/redis/nodes\",\n                    \"/explore/redis/keys\", \"/explore/redis/key\", \"/explore/redis/stream\"):\n        return 404, {\"error\": \"no such page\"}\n    try:\n        limit = explore.whole(one(\"limit\", \"50\"), \"limit\", 1, explore.LIMIT)\n        if path == \"/explore/kafka/topics\":\n            return 200, explorer[\"kafka\"].topics()\n        if path == \"/explore/kafka/records\":\n            topic = one(\"topic\", \"\")\n            if not (0 \u003c len(topic) \u003c= 249 and all(c.isalnum() or c in \"._-\" for c in topic)):\n                raise explore.BadRequest(\"topic is not a topic's name\")\n            return 200, explorer[\"kafka\"].page(\n                topic, explore.whole(one(\"partition\"), \"partition\", 0, 100000), limit,\n                offset=number(\"offset\"), before=number(\"before\"), at_ms=number(\"at_ms\"))\n        if path == \"/explore/redis/nodes\":\n            return 200, explorer[\"redis\"].overview()\n        bucket = explore.bucket_number(one(\"bucket\"))\n        if path == \"/explore/redis/keys\":\n            prefix = one(\"prefix\", \"\")\n            if len(prefix) \u003e 16:\n                raise explore.BadRequest(\"prefix is a key's first letters and its colon\")\n            return 200, explorer[\"redis\"].keys(bucket, prefix, number(\"start\") or 0, limit)\n        if path == \"/explore/redis/key\":\n            return 200, explorer[\"redis\"].key(bucket, one(\"key\"))\n        return 200, explorer[\"redis\"].stream(bucket, one(\"key\"), limit, before=one(\"before\"),\n                                             after=one(\"after\"), at_ms=number(\"at_ms\"))\n    except explore.BadRequest as error:\n        return 400, {\"error\": str(error)}\n    except Exception as error:  # noqa: BLE001 a store that cannot be read: the page says so\n        return 502, {\"error\": f\"{type(error).__name__}: {error}\"[:300]}\n\n\ndef handler_for(board, explorer=None):\n    class Handler(http.server.BaseHTTPRequestHandler):\n        server_version = \"drain-monitor\"\n        sys_version = \"\"\n\n        def log_message(self, *args):\n            pass\n\n        def _headers(self, status, media_type):\n            self.send_response(status)\n            self.send_header(\"Content-Type\", media_type)\n            for name, value in SECURITY_HEADERS.items():\n                self.send_header(name, value)\n\n        def _refuse(self, status):\n            self._headers(status, \"text/plain; charset=utf-8\")\n            self.send_header(\"Content-Length\", \"0\")\n            self.end_headers()\n\n        def do_GET(self):\n            # A page on 127.0.0.1 can still be reached by a name that resolves there (DNS\n            # rebinding); answer only the names it is served under. Any port: the reader's end\n            # of a port-forward need not be the pod's.\n            name = (self.headers.get(\"Host\") or \"\").rpartition(\":\")[0]\n            if name not in (HOST, \"localhost\"):\n                return self._refuse(421)\n            path = urllib.parse.urlsplit(self.path).path\n            if path == \"/events\":\n                return self._events()\n            if path == \"/inspect\":\n                # Which bucket's keys to show: bNNNN, or auto. It changes what is read, nothing else.\n                asked = urllib.parse.parse_qs(urllib.parse.urlsplit(self.path).query).get(\"bucket\", [\"\"])[0]\n                if asked != \"auto\" and not (len(asked) == 5 and asked[0] == \"b\" and asked[1:].isdigit()\n                                            and int(asked[1:]) \u003c 1024):\n                    return self._refuse(400)\n                board.choose(asked)\n                body = json.dumps({\"inspect\": asked}).encode()\n                self._headers(200, \"application/json; charset=utf-8\")\n                self.send_header(\"Content-Length\", str(len(body)))\n                self.end_headers()\n                return self.wfile.write(body)\n            if path == \"/state.json\":\n                body = board.snapshot()[1].encode()\n                self._headers(200, \"application/json; charset=utf-8\")\n                self.send_header(\"Content-Length\", str(len(body)))\n                self.end_headers()\n                return self.wfile.write(body)\n            if path.startswith(\"/explore/\"):\n                if explorer is None:\n                    return self._refuse(404)\n                status, answer = explored(explorer, path, urllib.parse.parse_qs(\n                    urllib.parse.urlsplit(self.path).query))\n                body = json.dumps(answer, default=str).encode()\n                self._headers(status, \"application/json; charset=utf-8\")\n                self.send_header(\"Content-Length\", str(len(body)))\n                self.end_headers()\n                return self.wfile.write(body)\n            files = FILES if explorer is None else FILES | EXPLORER_FILES\n            if path not in files:\n                return self._refuse(404)\n            name, media_type = files[path]\n            body = (HERE / name).read_bytes()\n            self._headers(200, media_type)\n            self.send_header(\"Content-Length\", str(len(body)))\n            self.end_headers()\n            self.wfile.write(body)\n\n        def _events(self):\n            self._headers(200, \"text/event-stream; charset=utf-8\")\n            self.end_headers()\n            version = None\n            try:\n                while not board.closed:\n                    current, data = board.snapshot()\n                    if current != version:\n                        self.wfile.write(f\"data: {data}\\n\\n\".encode())\n                        version = current\n                    else:\n                        self.wfile.write(b\": still here\\n\\n\")\n                    self.wfile.flush()\n                    time.sleep(0.5)  # at most two pictures a second, however fast it changes\n                    board.wait(version, 15)\n            except (BrokenPipeError, ConnectionResetError):\n                pass\n\n    return Handler\n\n\ndef serve(board, port, explorer=None):\n    \"\"\"The page's server, bound to the loopback address only.\"\"\"\n    server = http.server.ThreadingHTTPServer((HOST, port), handler_for(board, explorer))\n    server.daemon_threads = True\n    threading.Thread(target=server.serve_forever, daemon=True).start()\n    return server\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description=__doc__,\n                                     formatter_class=argparse.RawDescriptionHelpFormatter)\n    parser.add_argument(\"--port\", type=int, default=18235)\n    parser.add_argument(\"--every\", type=float, default=2, help=\"Seconds between PostgreSQL reads.\")\n    parser.add_argument(\"--keep\", type=int, default=KEEP, help=(\n        \"How many stream entries, checkpoints and ledger records the monitor \"\n        \"remembers (each). The page chooses how many of them to show.\"))\n    args = parser.parse_args(argv)\n    url = os.environ[\"DATABASE_URL\"]\n    kafka = os.environ[\"KAFKA_BOOTSTRAP_SERVERS\"]\n    if not 1 \u003c= args.keep \u003c= 5000:\n        parser.error(\"--keep must be from 1 to 5000\")\n    namespace = os.environ.get(\"POD_NAMESPACE\") or (ACCOUNT / \"namespace\").read_text().strip()\n    # The explorer (explore.py) is a developer's tool: on only where the deployment says so, and\n    # anything but \"on\" is off.\n    explorer = explorer_for(kafka) if os.environ.get(\"MONITOR_EXPLORER\") == \"on\" else None\n    board = Board(args.keep, {\n        \"namespace\": namespace, \"kafka\": kafka, \"explorer\": explorer is not None,\n        \"usage_ledger_topic\": LEDGER,\n        \"lag_limit_ms\": int(os.environ.get(\"LEDGER_LAG_LIMIT_MS\") or 0) or None})\n\n    def customers():\n        return {w[\"customer_id\"] for w in (board.database or {}).get(\"wallets\") or []}\n\n    for target, arguments in (\n            (run_database, (board, url, max(1, args.every))),\n            (run_cluster, (board, namespace, 5)),\n            (run_probe, (board, kafka, customers, board.asked_of_probe,\n                         lambda: named_wallets(board)))):\n        threading.Thread(target=target, args=arguments, daemon=True).start()\n    server = serve(board, args.port, explorer)\n    print(f\"Drain monitor on http://{HOST}:{server.server_address[1]}/ in this pod; \"\n          \"reach it with kubectl port-forward\", file=sys.stderr, flush=True)\n    try:\n        while True:\n            time.sleep(3600)\n    except KeyboardInterrupt:\n        return 0\n    finally:\n        board.close()\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n","redis.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n  \u003ctitle\u003eai-tollgate explorer: Redis\u003c/title\u003e\n  \u003clink rel=\"stylesheet\" href=\"/monitor.css\"\u003e\n\u003c/head\u003e\n\u003cbody data-page=\"redis\"\u003e\n  \u003cheader\u003e\n    \u003ch1\u003eExplorer: Redis \u003cspan class=\"sub\"\u003eread-only · dev, test and perf only\u003c/span\u003e\u003c/h1\u003e\n    \u003cnav\u003e\u003ca href=\"/\"\u003eLive\u003c/a\u003e \u003ca href=\"/kafka\"\u003eKafka\u003c/a\u003e \u003ca href=\"/redis\" class=\"here\"\u003eRedis\u003c/a\u003e\u003c/nav\u003e\n    \u003cp id=\"status\"\u003eloading…\u003c/p\u003e\n  \u003c/header\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003ePrimaries \u003cbutton id=\"refresh\" type=\"button\"\u003erefresh\u003c/button\u003e\u003c/h2\u003e\n    \u003cdiv id=\"nodes\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eKeys of a bucket \u003cspan class=\"sub\" id=\"where\"\u003e\u003c/span\u003e\u003c/h2\u003e\n    \u003cp class=\"hint\"\u003eWallets \u003ccode\u003ev:\u003c/code\u003e, holds \u003ccode\u003eh:\u003c/code\u003e, idempotency records \u003ccode\u003ei:\u003c/code\u003e, the open-holds\n      set \u003ccode\u003ee:\u003c/code\u003e, the stream \u003ccode\u003ex:\u003c/code\u003e, and any other the services keep. A bucket's keys are read from its slot, never by scanning the node.\n      Click a key for its whole value.\u003c/p\u003e\n    \u003cdiv class=\"controls\"\u003e\n      \u003clabel\u003ebucket \u003cselect id=\"bucket\"\u003e\u003c/select\u003e\u003c/label\u003e\n      \u003clabel\u003eor \u003cinput id=\"bucket-text\" size=\"6\" placeholder=\"b0048\"\u003e\u003c/label\u003e\n      \u003cbutton id=\"go-bucket\" type=\"button\"\u003ego\u003c/button\u003e\n      \u003clabel\u003ekind \u003cselect id=\"prefix\"\u003e\u003c/select\u003e\u003c/label\u003e\n      \u003clabel\u003eshow \u003cselect id=\"limit\"\u003e\u003c/select\u003e\u003c/label\u003e\n      \u003cbutton id=\"first\" type=\"button\"\u003e« first\u003c/button\u003e\n      \u003cbutton id=\"previous\" type=\"button\"\u003e‹ previous\u003c/button\u003e\n      \u003cbutton id=\"next\" type=\"button\"\u003enext ›\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"keys\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003csection\u003e\n    \u003ch2\u003eKey \u003cspan class=\"sub\" id=\"key-name\"\u003enone chosen\u003c/span\u003e\u003c/h2\u003e\n    \u003cdiv id=\"key\"\u003e\u003c/div\u003e\n    \u003cdiv id=\"stream-controls\" class=\"controls\" hidden\u003e\n      \u003cbutton id=\"stream-newest\" type=\"button\"\u003enewest »\u003c/button\u003e\n      \u003cbutton id=\"stream-older\" type=\"button\"\u003e‹ older\u003c/button\u003e\n      \u003cbutton id=\"stream-newer\" type=\"button\"\u003enewer ›\u003c/button\u003e\n      \u003clabel\u003efrom time (UTC) \u003cinput id=\"stream-time\" size=\"22\" placeholder=\"2026-10-11T16:20:00\"\u003e\u003c/label\u003e\n      \u003cbutton id=\"stream-go-time\" type=\"button\"\u003ego\u003c/button\u003e\n      \u003cspan class=\"sub\" id=\"stream-note\"\u003e\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"stream\"\u003e\u003c/div\u003e\n  \u003c/section\u003e\n  \u003cscript src=\"/explore.js\"\u003e\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"drain-monitor-app-286dmf7k56","namespace":"wallet-billing"}}
